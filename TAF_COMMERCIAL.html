// FIREBASE REALTIME DATABASE — SERVICE
// ═══════════════════════════════════════
class FirebaseService {
  constructor() {
    this.dbUrl = "";
    this.authToken = "";
    this.connected = false;
    this.lastSync = null;
    this.listeners = [];
  }

  configure(url, token = "") {
    this.dbUrl = url?.replace(/\/$/, "") || "";
    this.authToken = token;
    this.connected = !!this.dbUrl;
  }

  _url(path) {
    let url = `${this.dbUrl}/${path}.json`;
    if (this.authToken) url += `?auth=${this.authToken}`;
    return url;
  }

  async get(path) {
    if (!this.connected) return null;
    try {
      const r = await fetch(this._url(path));
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      this.lastSync = new Date();
      return data;
    } catch (e) {
      console.error("Firebase GET error:", e);
      return null;
    }
  }

  async set(path, data) {
    if (!this.connected) return false;
    try {
      const r = await fetch(this._url(path), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      this.lastSync = new Date();
      return true;
    } catch (e) {
      console.error("Firebase SET error:", e);
      return false;
    }
  }

  async patch(path, data) {
    if (!this.connected) return false;
    try {
      const r = await fetch(this._url(path), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      this.lastSync = new Date();
      return true;
    } catch (e) {
      console.error("Firebase PATCH error:", e);
      return false;
    }
  }

  async delete(path) {
    if (!this.connected) return false;
    try {
      const r = await fetch(this._url(path), { method: "DELETE" });
      return r.ok;
    } catch (e) { return false; }
  }

  async testConnection() {
    if (!this.dbUrl) return { ok: false, error: "URL non configurée" };
    try {
      const r = await fetch(this._url("_ping"), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ts: Date.now(), app: "taf_commercial", version: APP_VERSION }) });
      if (!r.ok) return { ok: false, error: `HTTP ${r.status} — vérifier les règles Firebase` };
      this.connected = true;
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }
}

const firebase = new FirebaseService();

// GOOGLE DRIVE AUTO-BACKUP SERVICE
// Utilise le proxy Apps Script configuré par Christophe
// ═══════════════════════════════════════
class DriveService {
  constructor() {
    this.proxyUrl = "";
    this.folderId = "";
    this.lastBackup = null;
    this.enabled = false;
  }
  configure(proxyUrl, folderId, enabled) {
    this.proxyUrl = proxyUrl || "";
    this.folderId = folderId || "";
    this.enabled = !!(enabled && proxyUrl);
  }
  // Sauvegarde silencieuse (fire-and-forget) à chaque save
  async backup(data, label = "autosave") {
    if (!this.enabled || !this.proxyUrl) return { ok: false, reason: "disabled" };
    try {
      const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      const filename = `TAF_COMMERCIAL_${label}_${ts}.json`;
      const payload = {
        action: "upload",
        filename,
        folderId: this.folderId,
        mimeType: "application/json",
        content: JSON.stringify(data, null, 2),
      };
      const r = await fetch(this.proxyUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      this.lastBackup = new Date();
      return { ok: r.ok };
    } catch (e) {
      console.error("Drive backup error:", e);
      return { ok: false, error: e.message };
    }
  }
  // Upload d'un fichier (document, EML, PDF)
  async uploadFile(base64Content, filename, mimeType = "application/octet-stream") {
    if (!this.enabled || !this.proxyUrl) return { ok: false };
    try {
      const payload = {
        action: "upload",
        filename,
        folderId: this.folderId,
        mimeType,
        content: base64Content,
        encoding: "base64",
      };
      const r = await fetch(this.proxyUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const result = await r.json().catch(() => ({}));
      return { ok: r.ok, url: result.url || null, id: result.id || null };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }
}

// EML PARSER — extraction infos d'un mail
// Gère headers + body text/html + décodage MIME
// ═══════════════════════════════════════
const decodeMimeHeader = (str) => {
  if (!str) return "";
  // Décode =?UTF-8?B?...?= et =?UTF-8?Q?...?=
  return str.replace(/=\?([^?]+)\?([BQ])\?([^?]+)\?=/gi, (_, charset, enc, text) => {
    try {
      if (enc.toUpperCase() === "B") {
        return decodeURIComponent(escape(atob(text)));
      } else {
        // Quoted-printable
        const decoded = text.replace(/_/g, " ").replace(/=([0-9A-F]{2})/gi, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
        return decodeURIComponent(escape(decoded));
      }
    } catch (e) { return text; }
  });
};

const decodeQuotedPrintable = (str) => {
  if (!str) return "";
  return str
    .replace(/=\r?\n/g, "")
    .replace(/=([0-9A-F]{2})/gi, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
};

const parseEML = (rawEml) => {
  const result = {
    from: "", fromEmail: "", fromName: "",
    to: "", subject: "", date: "", messageId: "",
    bodyText: "", bodyHtml: "", attachments: [],
  };
  try {
    // Séparer headers et body
    const headerEnd = rawEml.search(/\r?\n\r?\n/);
    if (headerEnd === -1) { result.bodyText = rawEml; return result; }
    const headersRaw = rawEml.slice(0, headerEnd);
    const bodyRaw = rawEml.slice(headerEnd).replace(/^\r?\n\r?\n/, "");

    // Unfold headers (lignes de continuation)
    const headers = headersRaw.replace(/\r?\n[ \t]+/g, " ");
    const getHeader = (name) => {
      const m = headers.match(new RegExp(`^${name}:\\s*(.+)$`, "im"));
      return m ? decodeMimeHeader(m[1].trim()) : "";
    };

    result.from = getHeader("From");
    result.to = getHeader("To");
    result.subject = getHeader("Subject");
    result.date = getHeader("Date");
    result.messageId = getHeader("Message-ID");

    // Extraire email et nom de From
    const emailMatch = result.from.match(/<([^>]+)>/) || result.from.match(/([\w.+-]+@[\w.-]+)/);
    result.fromEmail = emailMatch ? emailMatch[1] : "";
    result.fromName = result.from.replace(/<[^>]+>/, "").replace(/"/g, "").trim();

    // Content-Type pour détecter multipart
    const ctMatch = headers.match(/^Content-Type:\s*(.+)$/im);
    const contentType = ctMatch ? ctMatch[1] : "text/plain";
    const boundaryMatch = contentType.match(/boundary=["']?([^"';\s]+)/i);

    if (boundaryMatch) {
      // Multipart — parser chaque partie
      const boundary = boundaryMatch[1];
      const parts = bodyRaw.split(new RegExp(`--${boundary.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?:--)?`)).slice(1, -1);
      parts.forEach(part => {
        const partHeaderEnd = part.search(/\r?\n\r?\n/);
        if (partHeaderEnd === -1) return;
        const partHeaders = part.slice(0, partHeaderEnd).replace(/\r?\n[ \t]+/g, " ");
        let partBody = part.slice(partHeaderEnd).replace(/^\r?\n\r?\n/, "");
        const partCT = (partHeaders.match(/Content-Type:\s*([^;\r\n]+)/i) || [])[1] || "";
        const partEnc = (partHeaders.match(/Content-Transfer-Encoding:\s*([^\r\n]+)/i) || [])[1] || "";
        const disposition = (partHeaders.match(/Content-Disposition:\s*([^\r\n]+)/i) || [])[1] || "";
        const filename = (partHeaders.match(/filename="?([^";\r\n]+)"?/i) || [])[1] || "";

        // Décoder le body selon l'encoding
        if (/base64/i.test(partEnc)) {
          partBody = partBody.replace(/\s/g, "");
        } else if (/quoted-printable/i.test(partEnc)) {
          partBody = decodeQuotedPrintable(partBody);
        }

        if (/attachment|inline/i.test(disposition) && filename) {
          result.attachments.push({
            filename: decodeMimeHeader(filename),
            contentType: partCT,
            size: partBody.length,
            encoded: /base64/i.test(partEnc),
          });
        } else if (/text\/plain/i.test(partCT)) {
          try {
            result.bodyText = /base64/i.test(partEnc) ? decodeURIComponent(escape(atob(partBody))) : partBody;
          } catch (e) { result.bodyText = partBody; }
        } else if (/text\/html/i.test(partCT)) {
          try {
            result.bodyHtml = /base64/i.test(partEnc) ? decodeURIComponent(escape(atob(partBody))) : partBody;
          } catch (e) { result.bodyHtml = partBody; }
        }
      });
    } else {
      // Single part
      const enc = (headers.match(/Content-Transfer-Encoding:\s*([^\r\n]+)/i) || [])[1] || "";
      if (/base64/i.test(enc)) {
        try { result.bodyText = decodeURIComponent(escape(atob(bodyRaw.replace(/\s/g, "")))); } catch (e) { result.bodyText = bodyRaw; }
      } else if (/quoted-printable/i.test(enc)) {
        result.bodyText = decodeQuotedPrintable(bodyRaw);
      } else {
        result.bodyText = bodyRaw;
      }
    }

    // Fallback : si bodyHtml présent mais bodyText vide, on strip le HTML
    if (!result.bodyText && result.bodyHtml) {
      result.bodyText = result.bodyHtml.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    }
  } catch (e) {
    console.error("EML parse error:", e);
  }
  return result;
};

// ═══════════════════════════════════════
// CALCULATEUR DE TARIFS (moteur)
// ═══════════════════════════════════════
const calculateTarif = (produit, poids, opts, grilles) => {
  const lignes = [];
  let total = 0;
  opts = opts || {};
  const P = parseFloat(poids) || 0;

  // Frais d'arrivée (applicable à tous sauf SF spécial)
  const arr = grilles.fraisArrivee.find(f => P <= f.poidsMax);
  if (arr && produit !== "sf") {
    lignes.push({ label: `Frais d'arrivée (≤${arr.poidsMax} kg)`, montant: arr.prix });
    total += arr.prix;
  }

  if (produit === "sf") {
    const t = grilles.sf;
    lignes.push({ label: "Intervention TAF CAPMARIN", montant: t.intervention });
    total += t.intervention;
    if (opts.handler === "AF" || !opts.handler) {
      const m = t.manutentionAF.fixe + t.manutentionAF.parKg * P;
      lignes.push({ label: `Manutention AF Cargo (${t.manutentionAF.fixe}€ + ${t.manutentionAF.parKg}€/kg × ${P}kg)`, montant: Math.round(m * 100) / 100 });
      total += m;
    } else if (opts.handler === "WFS") {
      const m = t.manutentionWFS.fixe + t.manutentionWFS.parKg * P;
      lignes.push({ label: `Manutention WFS (${t.manutentionWFS.fixe}€ + ${t.manutentionWFS.parKg}€/kg × ${P}kg)`, montant: Math.round(m * 100) / 100 });
      total += m;
    } else if (opts.handler === "QR_GF") {
      lignes.push({ label: "Manutention Qatar/Gulfair", montant: t.qatarGulfair });
      total += t.qatarGulfair;
    }
    const md = t.miseDispo.find(x => P <= x.poidsMax);
    if (md) {
      const m = md.unite === "tonne" ? (md.prix * P) / 1000 : md.prix;
      lignes.push({ label: `Mise à disposition (${md.unite === "tonne" ? md.prix + "€/T" : md.prix + "€ forfait"})`, montant: Math.round(m * 100) / 100 });
      total += m;
    }
    if (opts.vacation) {
      lignes.push({ label: "Vacation (hors horaires)", montant: t.vacation });
      total += t.vacation;
    }
  } else if (produit === "avi") {
    const t = grilles.avi;
    lignes.push({ label: "Intervention TAF AVI", montant: t.intervention });
    total += t.intervention;
    const uc = Math.max(1, Math.ceil(P / t.stationAnimaliere.uc));
    const stationCost = t.stationAnimaliere.prise + t.stationAnimaliere.forfait + uc * t.stationAnimaliere.parUC;
    lignes.push({ label: `Station animalière (prise ${t.stationAnimaliere.prise}€ + forfait ${t.stationAnimaliere.forfait}€ + ${uc} UC × ${t.stationAnimaliere.parUC}€)`, montant: stationCost });
    total += stationCost;
    const transfertRaw = P * t.transfert.parKg;
    const transfert = Math.max(transfertRaw, t.transfert.mini);
    lignes.push({ label: `Transfert (${t.transfert.parKg}€/kg mini ${t.transfert.mini}€)`, montant: Math.round(transfert * 100) / 100 });
    total += transfert;
    lignes.push({ label: "Sortie compagnie", montant: t.sortieCompagnie });
    total += t.sortieCompagnie;
  } else if (produit === "fl") {
    const t = grilles.fl;
    lignes.push({ label: "Intervention TAF F/L", montant: t.intervention });
    total += t.intervention;
    const m = t.manutention.fixe + t.manutention.parKg * P;
    lignes.push({ label: `Manutention (${t.manutention.fixe}€ + ${t.manutention.parKg}€/kg × ${P}kg)`, montant: Math.round(m * 100) / 100 });
    total += m;
    if (opts.controlePV) { lignes.push({ label: "Contrôle phytosanitaire (PPV)", montant: t.controlePV }); total += t.controlePV; }
    if (opts.sortieFroid) { lignes.push({ label: "Sortie entrepôt frigorifique", montant: t.sortieFroid }); total += t.sortieFroid; }
  } else if (produit === "cargo") {
    const t = grilles.cargo;
    lignes.push({ label: "Intervention TAF Cargo", montant: t.intervention });
    total += t.intervention;
    const m = t.manutention.fixe + t.manutention.parKg * P;
    lignes.push({ label: `Manutention (${t.manutention.fixe}€ + ${t.manutention.parKg}€/kg × ${P}kg)`, montant: Math.round(m * 100) / 100 });
    total += m;
    lignes.push({ label: "Sortie compagnie", montant: t.sortieCompagnie });
    total += t.sortieCompagnie;
    if (opts.vacation) { lignes.push({ label: "Vacation", montant: t.vacation }); total += t.vacation; }
  }

  // TMD supplément
  if (opts.tmd && opts.tmdClasse) {
    const t = grilles.tmd;
    const supp = t.supplementClasses[opts.tmdClasse] || 0;
    lignes.push({ label: `Supplément TMD classe ${opts.tmdClasse}`, montant: supp });
    total += supp;
    lignes.push({ label: "Déclaration IMO/DGR", montant: t.declarationIMO });
    total += t.declarationIMO;
    lignes.push({ label: "Documentation TMD", montant: t.documentation });
    total += t.documentation;
  }

  return { lignes, total: Math.round(total * 100) / 100 };
};

function App() {
  const [db, setDb] = useState(defaultDB);

  const [aiResults, setAiResults] = useState([]);
  const [searchQ, setSearchQ] = useState("");
  const [filterType, setFilterType] = useState("all");
  const [syncStatus, setSyncStatus] = useState("offline"); // offline | syncing | synced | error
  const [firebaseSetup, setFirebaseSetup] = useState(false);
  const saveTimer = useRef(null);
  const [machineParams, setMP] = useState({ type: "importateur", spec: "", zone: "France", ape: "", extra: "", count: 20 });
  const [intelQ, setIntelQ] = useState("");
  const [rescueQ, setRescueQ] = useState("");
  const [rescueResults, setRescueResults] = useState([]);
  const [emailBody, setEmailBody] = useState("");
  const [emailSubject, setEmailSubject] = useState("");
  const [selTpl, setSelTpl] = useState("");

  // ═══ INIT: Load from localStorage, then Firebase ═══
  useEffect(() => {
    (async () => {
      // 1. Load from localStorage (instant)
      try {
        const local = localStorage.getItem(LOCAL_KEY);
        if (local) {
          const parsed = JSON.parse(local);
          setDb(prev => ({ ...defaultDB(), ...parsed }));
          // Configure Firebase si URL existe
          if (parsed.config?.firebaseUrl) {
            firebase.configure(parsed.config.firebaseUrl, parsed.config.firebaseToken || "");
          }
          // Configure Drive auto-backup
          if (parsed.config?.proxyDrive) {
            drive.configure(parsed.config.proxyDrive, parsed.config.driveFolder || "", parsed.config.autoBackupDrive !== false);
          }
        }
      } catch (e) {}

      // 2. Load from Firebase (async)
      if (firebase.connected) {
        setSyncStatus("syncing");
        const remote = await firebase.get("taf_commercial");
        if (remote) {
          setDb(prev => {
            const merged = { ...defaultDB(), ...remote };
            localStorage.setItem(LOCAL_KEY, JSON.stringify(merged));
            return merged;
          });
          setSyncStatus("synced");
        } else {
          setSyncStatus("offline");
        }
      }
    })();
  }, []);

  // ═══ SAVE: localStorage + Firebase + Drive auto-backup ═══
  const driveTimer = useRef(null);
  const [driveStatus, setDriveStatus] = useState("idle"); // idle | backing | ok | err
  const save = useCallback((newDb) => {
    setDb(newDb);
    // Immédiat localStorage
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(newDb)); } catch (e) {}
    // Debounced Firebase
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      if (firebase.connected) {
        setSyncStatus("syncing");
        const ok = await firebase.set("taf_commercial", newDb);
        setSyncStatus(ok ? "synced" : "error");
      }
    }, 800);
    // Debounced Drive backup (plus long pour éviter le spam)
    clearTimeout(driveTimer.current);
    driveTimer.current = setTimeout(async () => {
      if (drive.enabled) {
        setDriveStatus("backing");
        const r = await drive.backup(newDb, "autosave");
        setDriveStatus(r.ok ? "ok" : "err");
        setTimeout(() => setDriveStatus("idle"), 2500);
      }
    }, 3000);
  }, []);

  // ═══ FORCE SYNC ═══
  const forceSync = async () => {
    if (!firebase.connected) { showToast("Firebase non configuré", "err"); return; }
    setSyncStatus("syncing");
    const ok = await firebase.set("taf_commercial", db);
    setSyncStatus(ok ? "synced" : "error");
    showToast(ok ? "Synchronisé Firebase ✅" : "Erreur sync Firebase", ok ? "ok" : "err");
  };

  const forcePull = async () => {
    if (!firebase.connected) { showToast("Firebase non configuré", "err"); return; }
    setSyncStatus("syncing");
    const remote = await firebase.get("taf_commercial");
    if (remote) {
      const merged = { ...defaultDB(), ...remote };
      setDb(merged);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(merged));
      setSyncStatus("synced");
      showToast("Données Firebase chargées ✅", "ok");
    } else {
      setSyncStatus("error");
      showToast("Erreur chargement Firebase", "err");
    }
  };

  const showToast = (msg, type = "ok") => {
    setToast({ msg, type });

      incoterm: data.incoterm || "",
      compagnie: data.compagnie || "",
      awb: data.awb || "",
      notes: data.notes || "",
      eml: data.eml || null,
      statut: "nouvelle", // nouvelle | cotation_envoyee | acceptee | refusee | relance_1 | relance_2 | perdue
      dateEnvoiCotation: null,
      dateReponseClient: null,
      cotation: null, // {lignes, total, dateCalcul, options}
      relances: [],
      documents: [],
    };
    save({ ...db, demandesTarif: [d, ...db.demandesTarif] });
    showToast("Demande créée ✅");
    return d;
  };

  // Import EML
  const importEML = async (file) => {
    const text = await file.text();
    const parsed = parseEML(text);
    // Pré-remplir une fiche avec les infos extraites
    // Détection heuristique du produit depuis le body/subject
    const content = (parsed.subject + " " + parsed.bodyText).toLowerCase();
    let produit = "cargo";
    if (/poisson|seafood|fish|marine|crustac|homard|saumon|thon/i.test(content)) produit = "sf";
    else if (/animaux|live\s*animal|chien|chat|cheval|oiseau|zoo|avi\b/i.test(content)) produit = "avi";
    else if (/fruit|l[ée]gume|fresh\s*produce|mangue|ananas|avocat/i.test(content)) produit = "fl";

    // Extraire poids approximatif
    const poidsMatch = parsed.bodyText.match(/(\d+(?:[,.]\d+)?)\s*(?:kg|kilos?)/i);
    // Extraire origine (code IATA 3 lettres en majuscules fréquent)
    const origineMatch = parsed.bodyText.match(/(?:from|depuis|origin|origine|de)\s*:?\s*([A-Z]{3})\b/i) || parsed.bodyText.match(/\b([A-Z]{3})\s*[\/\-→]\s*(?:CDG|PAR)/i);

    const d = {
      societe: parsed.fromName || parsed.fromEmail,
      contact: parsed.fromName,
      email: parsed.fromEmail,
      produit,
      origine: origineMatch ? origineMatch[1] : "",
      poids: poidsMatch ? poidsMatch[1].replace(",", ".") : "",
      notes: `Email reçu le ${parsed.date}\nObjet : ${parsed.subject}\n\n${parsed.bodyText.slice(0, 800)}${parsed.bodyText.length > 800 ? "..." : ""}`,
      source: "eml",
      eml: {
        filename: file.name,
        from: parsed.from,
        subject: parsed.subject,
        date: parsed.date,
        attachments: parsed.attachments,
      },
    };
    return createDemande(d);
  };

    y += 6;

    doc.setTextColor(80, 80, 80);
    const infos = [
      ["Origine", demande.origine || "—"],

    infos.forEach((row, i) => {

      doc.setFont("helvetica", "normal");

    y += Math.ceil(infos.length / 2) * 5 + 4;

    // TABLEAU DES LIGNES TARIFAIRES
    doc.autoTable({

      "• Opérations soumises aux conditions générales de TAF disponibles sur demande.",
      "• Les opérations sont couvertes par une assurance RC professionnelle.",
    ];
    conditions.forEach(c => { doc.text(c, MARGE, y); y += 4.5; });

    // FOOTER
    y = 275;
    doc.setDrawColor(...GOLD); doc.setLineWidth(0.3);
    doc.line(MARGE, y, W - MARGE, y);
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    doc.setTextColor(...DARK);
    doc.text("TRANS AIR FREIGHT", MARGE, y + 5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7);
    doc.setTextColor(80, 80, 80);
    doc.text("Aéroport Charles de Gaulle — Roissy", MARGE, y + 9);

    doc.setTextColor(...GOLD);

    doc.setTextColor(80, 80, 80);
    doc.text("Responsable Commercial", W - MARGE, y + 9, { align: "right" });
    doc.text("40 ans d'expertise fret aérien CDG", W - MARGE, y + 13, { align: "right" });

    const filename = `Devis_TAF_${(demande.societe || "client").replace(/\s+/g, "_")}_${today()}.pdf`;

  const sendRelanceMake = async (demande) => {
    if (!db.config.webhookMake) { showToast("Webhook Make non configuré", "err"); return; }
    const payload = {
      type: "relance_cotation",
      to: db.config.emailRelanceTeam || "import@taftrans.fr",
      demande: {
        id: demande.id,
        societe: demande.societe,
        contact: demande.contact,
        email: demande.email,
        tel: demande.tel,
        produit: demande.produit,
        origine: demande.origine,
        poids: demande.poids,
        dateEnvoiCotation: demande.dateEnvoiCotation,
        total: demande.cotation?.total,
        joursDepuisEnvoi: demande.dateEnvoiCotation ? Math.floor((new Date() - new Date(demande.dateEnvoiCotation)) / 86400000) : null,
      },
      message: `Relance client à effectuer pour la cotation ${demande.id.slice(-8)} envoyée à ${demande.societe} (${demande.email}) — sans réponse depuis ${demande.dateEnvoiCotation ? Math.floor((new Date() - new Date(demande.dateEnvoiCotation)) / 86400000) : "?"} jours.`,
    };
    try {
      await fetch(db.config.webhookMake, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      updateDemande(demande.id, {
        relances: [...(demande.relances || []), { date: now(), canal: "make_equipe", destinataire: db.config.emailRelanceTeam }],
      });
      showToast("Relance équipe envoyée via Make ✅");

        </Card>
      </div>
    );

  // ═══ RELANCE ═══
  const renderRelance = () => {
    const pp = db.prospects.filter(p => !["gagne", "perdu"].includes(p.statut));
    const late = pp.filter(p => p.relance && daysUntil(p.relance) < 0);
    const todayR = pp.filter(p => p.relance && daysUntil(p.relance) === 0);
    const week = pp.filter(p => p.relance && daysUntil(p.relance) > 0 && daysUntil(p.relance) <= 7);
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}><Btn onClick={() => setScreen("dash")}>← Retour</Btn><h1 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>⚡ RELANCE ULTRA</h1></div>
        <Card title="📋 SÉQUENCE INTELLIGENTE" style={{ marginBottom: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
            {[{ j: "J+1", l: "Contact", c: C.green }, { j: "J+3", l: "Douce", c: C.teal }, { j: "J+7", l: "Valeur", c: C.gold }, { j: "J+14", l: "Dernière", c: C.orange }, { j: "J+30", l: "Réactiv.", c: C.red }].map((s, i) => (
              <div key={i} style={{ padding: 8, background: C.bg3, borderRadius: 8, borderTop: `2px solid ${s.c}`, textAlign: "center" }}><div style={{ fontSize: 18, fontWeight: 800, color: s.c }}>{s.j}</div><div style={{ fontSize: 9, fontWeight: 700 }}>{s.l}</div></div>

          <Card title={`🟡 AUJOURD'HUI + SEMAINE (${todayR.length + week.length})`}>{[...todayR, ...week].map(p => <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: `1px solid ${C.border}` }}><div style={{ width: 3, height: 24, background: C.gold, borderRadius: 2 }} /><div style={{ flex: 1, fontWeight: 700, fontSize: 12 }}>{p.nom}</div><span style={{ fontSize: 10, color: C.gold }}>J+{daysUntil(p.relance)}</span><Btn s="sm" v="teal" onClick={() => { setSelectedId(p.id); setModal("email"); }}>⚡</Btn></div>)}{todayR.length + week.length === 0 && <div style={{ padding: 12, textAlign: "center", color: C.text3, fontSize: 11 }}>RAS</div>}</Card>
        </div>
        <Btn v="gold" onClick={() => { let n = 0; const up = db.prospects.map(p => { if (!p.relance && p.dernier_contact && !["gagne", "perdu"].includes(p.statut)) { const d = Math.floor((new Date() - new Date(p.dernier_contact)) / 86400000); const next = d <= 1 ? 1 : d <= 3 ? 3 : d <= 7 ? 7 : 14; const nr = new Date(); nr.setDate(nr.getDate() + next); n++; return { ...p, relance: nr.toISOString().slice(0, 10) }; } return p; }); save({ ...db, prospects: up }); showToast(`${n} relances planifiées`); }} style={{ marginTop: 14 }}>⚡ Auto-planifier les séquences</Btn>

      {Object.entries(HUMAN_TEMPLATES).map(([cat, tpls]) => (

          {tpls.map(t => (

            <div style={{ padding: "10px 12px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", borderTop: `2px solid ${s.c}`, borderRadius: "14px 14px 0 0" }}><span style={{ fontSize: 11, fontWeight: 700 }}>{s.l}</span><span style={{ background: C.bg3, borderRadius: 20, fontSize: 9, fontWeight: 800, padding: "1px 6px" }}>{cards.length}</span></div>

                <div style={{ fontWeight: 700, fontSize: 11 }}>{p.nom}</div><div style={{ fontSize: 9, color: C.text3 }}>{p.contact}</div>

              </div>
            ))}</div>
          </div>
        ); })}
      </div>
    </div>

      <div>

          <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
            <div style={{ width: 50, height: 50, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 800, color: "#000", background: `linear-gradient(135deg, ${C.gold}, ${C.gold2})`, flexShrink: 0 }}>{p.nom.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase()}</div>

          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 14 }}>
            {[["Contact", p.contact], ["Poste", p.poste], ["Email", p.email], ["Tél", p.tel], ["Pays", p.pays], ["Ville", p.ville], ["Source", p.source], ["Website", p.website], ["APE", p.ape], ["Relance", p.relance ? fmt(p.relance) : "—"], ["Dernier contact", fmt(p.dernier_contact)]].map(([l, v]) => <div key={l}><div style={{ fontSize: 9, fontWeight: 700, color: C.text3, textTransform: "uppercase" }}>{l}</div><div style={{ fontSize: 12, marginTop: 2 }}>{v || "—"}</div></div>)}

        </Card>
      </div>
    );
  };

  // ═══ EMAIL MODAL ═══
  const renderEmailModal = () => {
    const p = db.prospects.find(x => x.id === selectedId);
    if (!p) return null;
    const allTpls = [...HUMAN_TEMPLATES.prospection, ...HUMAN_TEMPLATES.relance, ...HUMAN_TEMPLATES.rescue, ...HUMAN_TEMPLATES.cotation, ...HUMAN_TEMPLATES.fidelisation];
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.8)", backdropFilter: "blur(8px)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setModal(null)}>
        <div style={{ background: C.bg2, border: `1px solid ${C.border}`, borderRadius: 14, width: "100%", maxWidth: 600, maxHeight: "90vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
          <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between" }}><span style={{ fontSize: 17, fontWeight: 700 }}>⚡ {p.nom}</span><button onClick={() => setModal(null)} style={{ background: "none", border: "none", color: C.text3, cursor: "pointer", fontSize: 16 }}>✕</button></div>
          <div style={{ padding: "18px 20px" }}>
            <Sel label="Template" value={selTpl} onChange={e => { const t = allTpls.find(x => x.id === e.target.value); if (t) { setEmailBody(applyTpl(t, p)); setEmailSubject(t.subject ? applyTpl({ body: t.subject }, p) : ""); } setSelTpl(e.target.value); }}>
              <option value="">— Template —</option>
              <optgroup label="🎯 Prospection">{HUMAN_TEMPLATES.prospection.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
              <optgroup label="⚡ Relance">{HUMAN_TEMPLATES.relance.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
              <optgroup label="🚨 Rescue">{HUMAN_TEMPLATES.rescue.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
              <optgroup label="📋 Cotation">{HUMAN_TEMPLATES.cotation.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
              <optgroup label="❤️ Fidélisation">{HUMAN_TEMPLATES.fidelisation.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
            </Sel>
            <Inp label="Objet" value={emailSubject} onChange={e => setEmailSubject(e.target.value)} />

  // ═══════════════════════════════════════════════════════
  const [demandeId, setDemandeId] = useState(null);
  const [newDemande, setNewDemande] = useState(null);
  const [emlUploading, setEmlUploading] = useState(false);

  const renderDemandes = () => {
    const list = db.demandesTarif || [];
    const nouvelles = list.filter(d => d.statut === "nouvelle").length;
    const enCours = list.filter(d => d.statut === "cotation_envoyee").length;
    const acceptees = list.filter(d => d.statut === "acceptee").length;
    const statutBadge = (s) => {
      const m = {
        nouvelle: [C.gold, "🆕 Nouvelle"],
        cotation_envoyee: [C.blue, "📤 Envoyée"],
        acceptee: [C.green, "✅ Acceptée"],
        refusee: [C.red, "❌ Refusée"],
        relance_1: [C.orange, "⏰ Relance 1"],
        relance_2: [C.red, "⏰ Relance 2"],
        perdue: [C.text3, "🔒 Perdue"],
      };
      const [c, l] = m[s] || [C.text3, s];
      return <Badge color={c}>{l}</Badge>;
    };
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
          <Btn onClick={() => setScreen("dash")}>← Retour</Btn>
          <h1 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>📨 DEMANDES TARIFAIRES</h1>
        </div>

        {/* KPIs */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 14 }}>
          <KpiCard label="Total" value={list.length} color={C.text} />
          <KpiCard label="Nouvelles" value={nouvelles} color={C.gold} />
          <KpiCard label="En attente" value={enCours} color={C.blue} />
          <KpiCard label="Acceptées" value={acceptees} color={C.green} />
        </div>

        {/* Drop zone EML */}
        <Card title="📥 IMPORT EMAIL (.EML)" style={{ marginBottom: 14 }}>
          <div
            onClick={() => document.getElementById("eml-input").click()}
            onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor = C.gold; }}
            onDragLeave={e => { e.currentTarget.style.borderColor = C.border2; }}
            onDrop={async e => {
              e.preventDefault();
              e.currentTarget.style.borderColor = C.border2;
              setEmlUploading(true);
              for (const file of e.dataTransfer.files) {
                if (file.name.toLowerCase().endsWith(".eml")) {
                  await importEML(file);
                }
              }
              setEmlUploading(false);
            }}
            style={{ border: `2px dashed ${C.border2}`, borderRadius: 10, padding: 30, textAlign: "center", cursor: "pointer", transition: "all .15s", background: C.bg3 }}
          >
            <div style={{ fontSize: 32, marginBottom: 8 }}>{emlUploading ? "⏳" : "📩"}</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{emlUploading ? "Analyse en cours..." : "Glissez-déposez un ou plusieurs fichiers .EML"}</div>
            <div style={{ fontSize: 10, color: C.text3, marginTop: 4 }}>Ou cliquez pour sélectionner — les infos seront extraites automatiquement</div>
            <input
              id="eml-input"
              type="file"
              accept=".eml,message/rfc822"
              multiple
              style={{ display: "none" }}
              onChange={async e => {
                setEmlUploading(true);
                for (const file of e.target.files) await importEML(file);
                setEmlUploading(false);
                e.target.value = "";
              }}
            />
          </div>
          <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
            <Btn v="gold" onClick={() => setNewDemande({ produit: "cargo", destination: "CDG Paris" })}>➕ Créer manuellement</Btn>
          </div>
        </Card>

        {/* Liste des demandes */}
        <Card title={`📋 DEMANDES (${list.length})`}>
          {list.length === 0 ? (
            <div style={{ padding: 30, textAlign: "center", color: C.text3, fontSize: 12 }}>Aucune demande pour l'instant. Uploadez un EML ou créez-en une manuellement.</div>
          ) : (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
              <thead><tr>{["DATE", "CLIENT", "PRODUIT", "ORIGINE", "POIDS", "STATUT", "TOTAL", ""].map(h => <th key={h} style={{ textAlign: "left", padding: "8px 10px", fontSize: 9, fontWeight: 700, textTransform: "uppercase", color: C.text3, borderBottom: `1px solid ${C.border}`, background: C.bg2 }}>{h}</th>)}</tr></thead>
              <tbody>{list.map(d => (
                <tr key={d.id} style={{ cursor: "pointer" }} onClick={() => { setDemandeId(d.id); setScreen("demande-detail"); }}>
                  <td style={{ padding: "8px 10px", fontSize: 10, color: C.text3 }}>{fmt(d.dateCreation)}</td>
                  <td style={{ padding: "8px 10px" }}><div style={{ fontWeight: 700, fontSize: 12, color: C.gold }}>{d.societe || "—"}</div><div style={{ fontSize: 9, color: C.text3 }}>{d.contact || d.email}</div></td>
                  <td style={{ padding: "8px 10px" }}>{specB(d.produit)}</td>
                  <td style={{ padding: "8px 10px", fontSize: 11 }}>{d.origine || "—"}</td>
                  <td style={{ padding: "8px 10px", fontSize: 11 }}>{d.poids ? d.poids + " kg" : "—"}</td>
                  <td style={{ padding: "8px 10px" }}>{statutBadge(d.statut)}</td>
                  <td style={{ padding: "8px 10px", fontSize: 11, fontWeight: 700, color: C.gold }}>{d.cotation?.total ? d.cotation.total.toFixed(2) + " €" : "—"}</td>
                  <td style={{ padding: "8px 10px" }}><Btn s="sm" v="red" onClick={e => { e.stopPropagation(); deleteDemande(d.id); }}>🗑</Btn></td>
                </tr>
              ))}</tbody>
            </table>
          )}
        </Card>

        {/* Modal création manuelle */}
        {newDemande && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.8)", backdropFilter: "blur(8px)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setNewDemande(null)}>
            <div style={{ background: C.bg2, border: `1px solid ${C.border}`, borderRadius: 14, width: "100%", maxWidth: 600, maxHeight: "90vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
              <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontSize: 17, fontWeight: 700 }}>➕ Nouvelle demande tarifaire</span>
                <button onClick={() => setNewDemande(null)} style={{ background: "none", border: "none", color: C.text3, cursor: "pointer", fontSize: 16 }}>✕</button>
              </div>
              <div style={{ padding: "18px 20px" }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <Inp label="Société" value={newDemande.societe || ""} onChange={e => setNewDemande({ ...newDemande, societe: e.target.value })} />
                  <Inp label="Contact" value={newDemande.contact || ""} onChange={e => setNewDemande({ ...newDemande, contact: e.target.value })} />
                  <Inp label="Email" value={newDemande.email || ""} onChange={e => setNewDemande({ ...newDemande, email: e.target.value })} />
                  <Inp label="Téléphone" value={newDemande.tel || ""} onChange={e => setNewDemande({ ...newDemande, tel: e.target.value })} />
                  <Sel label="Type produit" value={newDemande.produit} onChange={e => setNewDemande({ ...newDemande, produit: e.target.value })}>
                    <option value="sf">🐟 Poissons frais</option>
                    <option value="avi">🐦 Animaux vivants</option>
                    <option value="fl">🌿 Fruits & légumes</option>
                    <option value="cargo">📦 Cargo général</option>
                  </Sel>
                  <Inp label="Origine (code IATA)" value={newDemande.origine || ""} onChange={e => setNewDemande({ ...newDemande, origine: e.target.value.toUpperCase() })} placeholder="Ex: NBO, HKG, LOS" />
                  <Inp label="Destination" value={newDemande.destination || "CDG Paris"} onChange={e => setNewDemande({ ...newDemande, destination: e.target.value })} />
                  <Inp label="Compagnie" value={newDemande.compagnie || ""} onChange={e => setNewDemande({ ...newDemande, compagnie: e.target.value })} placeholder="AF, QR, EK..." />
                  <Inp label="Poids (kg)" value={newDemande.poids || ""} onChange={e => setNewDemande({ ...newDemande, poids: e.target.value })} />
                  <Inp label="Colis" value={newDemande.colis || ""} onChange={e => setNewDemande({ ...newDemande, colis: e.target.value })} />
                  <Inp label="N° AWB" value={newDemande.awb || ""} onChange={e => setNewDemande({ ...newDemande, awb: e.target.value })} />
                  <Inp label="Valeur marchandise (€)" value={newDemande.valeur || ""} onChange={e => setNewDemande({ ...newDemande, valeur: e.target.value })} />
                </div>
                <Txt label="Notes" value={newDemande.notes || ""} onChange={e => setNewDemande({ ...newDemande, notes: e.target.value })} style={{ minHeight: 60 }} />
                <div style={{ display: "flex", gap: 7, marginTop: 10 }}>
                  <Btn onClick={() => setNewDemande(null)}>Annuler</Btn>
                  <Btn v="gold" onClick={() => { const d = createDemande(newDemande); setNewDemande(null); setDemandeId(d.id); setScreen("demande-detail"); }}>✅ Créer</Btn>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  // ═══ DÉTAIL D'UNE DEMANDE ═══
  const [cotOpts, setCotOpts] = useState({ handler: "AF", vacation: false, controlePV: false, sortieFroid: false, tmd: false, tmdClasse: "" });
  const [cotEmailBody, setCotEmailBody] = useState("");
  const [cotEmailSubject, setCotEmailSubject] = useState("");
  const [showAcceptFlow, setShowAcceptFlow] = useState(false);
  const [selectedDocs, setSelectedDocs] = useState([]);

  const renderDemandeDetail = () => {
    const d = db.demandesTarif.find(x => x.id === demandeId);
    if (!d) return <div style={{ padding: 30 }}><Btn onClick={() => setScreen("demandes")}>← Retour</Btn><div style={{ marginTop: 14, color: C.text3 }}>Demande introuvable</div></div>;

    const calcNow = () => {
      const c = calculateTarif(d.produit, d.poids, cotOpts, db.tarifs);
      updateDemande(d.id, { cotation: { ...c, dateCalcul: now(), options: { ...cotOpts } } });
      showToast("Cotation calculée ✅");
    };

    const prepareEmailCotation = () => {
      const tpl = db.cotationTemplates[d.produit] || db.cotationTemplates.cargo;
      const apply = (str) => str
        .replace(/\{contact\}/g, d.contact || "Madame, Monsieur")
        .replace(/\{origine\}/g, d.origine || "origine")
        .replace(/\{destination\}/g, d.destination || "CDG Paris")
        .replace(/\{societe\}/g, d.societe || "");
      setCotEmailSubject(apply(tpl.subject));
      setCotEmailBody(apply(tpl.body));
      setModal("cotation-email");
    };

    const envoyerCotation = async () => {
      if (!d.email) { showToast("Email destinataire manquant", "err"); return; }
      if (db.config.webhookMake) {
        try {
          await fetch(db.config.webhookMake, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              type: "envoi_cotation",
              to: d.email,
              from: db.config.emailFrom,
              subject: cotEmailSubject,
              body: cotEmailBody,
              demandeId: d.id,
            }),
          });
        } catch (e) {}
      }
      updateDemande(d.id, { statut: "cotation_envoyee", dateEnvoiCotation: now() });
      setModal(null);
      showToast("Cotation envoyée ✅");
    };

    const accepter = () => {
      updateDemande(d.id, { statut: "acceptee", dateReponseClient: now() });
      setShowAcceptFlow(true);
    };

    const envoyerAcceptation = async () => {
      if (!d.email) { showToast("Email destinataire manquant", "err"); return; }
      const docList = selectedDocs.map(id => db.documents.find(x => x.id === id)).filter(Boolean);
      const docsText = docList.map(x => `— ${x.label || x.filename}`).join("\n") || "— Mandat de représentation\n— Contrat commercial";
      const body = db.acceptationTemplate.body
        .replace(/\{contact\}/g, d.contact || "Madame, Monsieur")
        .replace(/\{documents\}/g, docsText);
      if (db.config.webhookMake) {
        try {
          await fetch(db.config.webhookMake, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              type: "email_acceptation",
              to: d.email,
              from: db.config.emailFrom,
              subject: db.acceptationTemplate.subject,
              body,
              documents: docList.map(x => ({ filename: x.filename, url: x.driveUrl })),
              demandeId: d.id,
            }),
          });
        } catch (e) {}
      }
      showToast("Email acceptation envoyé ✅");
      setShowAcceptFlow(false);
    };

    const genererProcuration = () => {
      const content = db.procurationTemplate
        .replace(/\{societe\}/g, d.societe || "")
        .replace(/\{adresse\}/g, d.adresse || "...........................")
        .replace(/\{contact\}/g, d.contact || "...........................")
        .replace(/\{fonction\}/g, d.fonction || "...........................");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      doc.setFont("helvetica", "bold"); doc.setFontSize(14);
      doc.setTextColor(20, 32, 53);
      doc.text("PROCURATION", 105, 20, { align: "center" });
      doc.setFontSize(10); doc.setTextColor(245, 166, 35);
      doc.text("Trans Air Freight — CDG", 105, 26, { align: "center" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(40, 40, 40);
      const lines = doc.splitTextToSize(content, 180);
      doc.text(lines, 15, 40);
      const filename = `Procuration_TAF_${(d.societe || "client").replace(/\s+/g, "_")}.pdf`;
      doc.save(filename);
      showToast("Procuration générée ✅");
    };

    const joursDepuisEnvoi = d.dateEnvoiCotation ? Math.floor((new Date() - new Date(d.dateEnvoiCotation)) / 86400000) : null;
    const delaiRelance = db.config.delaiRelanceJours || 5;
    const relanceAFaire = d.statut === "cotation_envoyee" && joursDepuisEnvoi !== null && joursDepuisEnvoi >= delaiRelance;

    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
          <Btn onClick={() => setScreen("demandes")}>← Retour</Btn>
          <h1 style={{ fontSize: 22, fontWeight: 800, margin: 0 }}>📨 {d.societe || "Demande"}</h1>
          {d.cotation && <Badge color={C.green}>{d.cotation.total.toFixed(2)} €</Badge>}
        </div>

        {relanceAFaire && (
          <div style={{ padding: 14, background: `${C.orange}15`, border: `1px solid ${C.orange}40`, borderRadius: 10, marginBottom: 14, display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontSize: 24 }}>⏰</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, color: C.orange }}>Relance à faire — sans réponse depuis {joursDepuisEnvoi} jours</div>
              <div style={{ fontSize: 11, color: C.text2 }}>Envoyer une alerte à l'équipe ({db.config.emailRelanceTeam}) via Make</div>
            </div>
            <Btn v="gold" onClick={() => sendRelanceMake(d)}>📤 Relance équipe</Btn>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          {/* INFOS DEMANDE */}
          <Card title="📋 INFORMATIONS DEMANDE">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Inp label="Société" value={d.societe || ""} onChange={e => updateDemande(d.id, { societe: e.target.value })} />
              <Inp label="Contact" value={d.contact || ""} onChange={e => updateDemande(d.id, { contact: e.target.value })} />
              <Inp label="Email" value={d.email || ""} onChange={e => updateDemande(d.id, { email: e.target.value })} />
              <Inp label="Téléphone" value={d.tel || ""} onChange={e => updateDemande(d.id, { tel: e.target.value })} />
              <Sel label="Type produit" value={d.produit} onChange={e => updateDemande(d.id, { produit: e.target.value })}>
                <option value="sf">🐟 Poissons frais</option>
                <option value="avi">🐦 Animaux vivants</option>
                <option value="fl">🌿 Fruits & légumes</option>
                <option value="cargo">📦 Cargo général</option>
              </Sel>
              <Inp label="Origine" value={d.origine || ""} onChange={e => updateDemande(d.id, { origine: e.target.value })} />
              <Inp label="Destination" value={d.destination || ""} onChange={e => updateDemande(d.id, { destination: e.target.value })} />
              <Inp label="Compagnie" value={d.compagnie || ""} onChange={e => updateDemande(d.id, { compagnie: e.target.value })} />
              <Inp label="Poids (kg)" value={d.poids || ""} onChange={e => updateDemande(d.id, { poids: e.target.value })} />
              <Inp label="Colis" value={d.colis || ""} onChange={e => updateDemande(d.id, { colis: e.target.value })} />
              <Inp label="N° AWB" value={d.awb || ""} onChange={e => updateDemande(d.id, { awb: e.target.value })} />
              <Inp label="Valeur (€)" value={d.valeur || ""} onChange={e => updateDemande(d.id, { valeur: e.target.value })} />
            </div>
            <Txt label="Notes" value={d.notes || ""} onChange={e => updateDemande(d.id, { notes: e.target.value })} />
            {d.eml && (
              <div style={{ marginTop: 8, padding: 10, background: C.bg3, borderRadius: 7, fontSize: 11 }}>
                <div style={{ fontSize: 9, color: C.text3, marginBottom: 4 }}>📧 EMAIL SOURCE</div>
                <div style={{ color: C.text2 }}>De : {d.eml.from}</div>
                <div style={{ color: C.text2 }}>Objet : {d.eml.subject}</div>
                {d.eml.attachments?.length > 0 && <div style={{ color: C.gold, fontSize: 10, marginTop: 4 }}>📎 {d.eml.attachments.length} pièce(s) jointe(s) : {d.eml.attachments.map(a => a.filename).join(", ")}</div>}
              </div>
            )}
          </Card>

          {/* COTATION */}
          <Card title="💰 CALCUL TARIF">
            <Sel label="Handler (pour SF)" value={cotOpts.handler} onChange={e => setCotOpts({ ...cotOpts, handler: e.target.value })}>
              <option value="AF">AF Cargo</option>
              <option value="WFS">WFS</option>
              <option value="QR_GF">Qatar / Gulfair</option>
            </Sel>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
              <label style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 6 }}>
                <input type="checkbox" checked={cotOpts.vacation} onChange={e => setCotOpts({ ...cotOpts, vacation: e.target.checked })} /> Vacation (hors horaires)
              </label>
              {d.produit === "fl" && (<>
                <label style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 6 }}>
                  <input type="checkbox" checked={cotOpts.controlePV} onChange={e => setCotOpts({ ...cotOpts, controlePV: e.target.checked })} /> Contrôle PV
                </label>
                <label style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 6 }}>
                  <input type="checkbox" checked={cotOpts.sortieFroid} onChange={e => setCotOpts({ ...cotOpts, sortieFroid: e.target.checked })} /> Sortie frigo
                </label>
              </>)}
              <label style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 6 }}>
                <input type="checkbox" checked={cotOpts.tmd} onChange={e => setCotOpts({ ...cotOpts, tmd: e.target.checked })} /> TMD
              </label>
              {cotOpts.tmd && (
                <Sel value={cotOpts.tmdClasse} onChange={e => setCotOpts({ ...cotOpts, tmdClasse: e.target.value })} style={{ width: 100, marginBottom: 0, padding: "4px" }}>
                  <option value="">Classe...</option>
                  {["1", "2", "3", "4", "5", "6", "7", "8", "9"].map(c => <option key={c} value={c}>Classe {c}</option>)}
                </Sel>
              )}
            </div>
            <Btn v="gold" onClick={calcNow}>🧮 Calculer le tarif</Btn>

            {d.cotation && (
              <div style={{ marginTop: 14, padding: 10, background: C.bg3, borderRadius: 8 }}>
                <div style={{ fontSize: 10, color: C.text3, marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>📊 Détail</div>
                {d.cotation.lignes.map((l, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: `1px dashed ${C.border}`, fontSize: 11 }}>
                    <span style={{ color: C.text2 }}>{l.label}</span>
                    <span style={{ fontWeight: 700, color: C.text }}>{l.montant.toFixed(2)} €</span>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0 2px", marginTop: 6, borderTop: `2px solid ${C.gold}`, fontSize: 13 }}>
                  <span style={{ fontWeight: 700 }}>TOTAL HT</span>
                  <span style={{ fontWeight: 800, color: C.gold }}>{d.cotation.total.toFixed(2)} €</span>
                </div>
                <div style={{ display: "flex", gap: 7, marginTop: 10, flexWrap: "wrap" }}>
                  <Btn v="gold" onClick={() => generatePDFDevis(d)}>📄 Générer PDF</Btn>
                  <Btn v="teal" onClick={prepareEmailCotation}>✉️ Préparer email</Btn>
                </div>
              </div>
            )}
          </Card>
        </div>

        {/* ACTIONS APRÈS ENVOI */}
        {d.statut === "cotation_envoyee" && !showAcceptFlow && (
          <Card title="🎯 RÉPONSE CLIENT" style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11, color: C.text2, marginBottom: 10 }}>Cotation envoyée le {fmt(d.dateEnvoiCotation)}{joursDepuisEnvoi !== null && ` — il y a ${joursDepuisEnvoi} jour(s)`}</div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              <Btn v="teal" onClick={accepter}>✅ Client accepte</Btn>
              <Btn v="red" onClick={() => updateDemande(d.id, { statut: "refusee", dateReponseClient: now() })}>❌ Client refuse</Btn>
              <Btn v="gold" onClick={() => sendRelanceMake(d)}>⏰ Relancer via équipe</Btn>
            </div>
          </Card>
        )}

        {/* WORKFLOW ACCEPTATION */}
        {showAcceptFlow && (
          <Card title="✅ OUVERTURE DE COMPTE — DOCUMENTS À ENVOYER" style={{ marginTop: 14, borderColor: `${C.green}40` }}>
            <div style={{ fontSize: 11, color: C.text2, marginBottom: 10 }}>Sélectionnez les documents à joindre à l'email de remerciement :</div>
            {db.documents.length === 0 ? (
              <div style={{ padding: 14, background: C.bg3, borderRadius: 8, fontSize: 11, color: C.text3, textAlign: "center" }}>
                Aucun document modèle uploadé. Rendez-vous dans <strong style={{ color: C.gold }}>Documents</strong> pour uploader le mandat, le contrat, etc.
              </div>
            ) : (
              <div style={{ display: "grid", gap: 6 }}>
                {db.documents.map(doc => (

  const renderDocuments = () => {
    const uploadDoc = async (file, type, label) => {
      if (!drive.enabled) { showToast("Configurer d'abord le proxy Drive", "err"); return; }
      showToast("Upload en cours...", "warn");
      // Convertir en base64
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const result = await drive.uploadFile(base64, file.name, file.type);
      const doc = {
        id: uid(),
        type,
        label,
        filename: file.name,
        size: file.size,
        mimeType: file.type,
        driveUrl: result.url,
        driveId: result.id,
        dateUpload: now(),
      };
      save({ ...db, documents: [...db.documents, doc] });
      showToast("Document uploadé ✅");
    };

    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
          <Btn onClick={() => setScreen("dash")}>← Retour</Btn>

              { type: "cgv", label: "Conditions générales", icon: "⚖️" },
              { type: "rc", label: "Attestation RC pro", icon: "🛡️" },
              { type: "autre", label: "Autre document", icon: "📎" },
            ].map(dt => (
              <div key={dt.type} style={{ padding: 14, background: C.bg3, borderRadius: 10, textAlign: "center" }}>
                <div style={{ fontSize: 28 }}>{dt.icon}</div>
                <div style={{ fontWeight: 700, fontSize: 12, margin: "6px 0" }}>{dt.label}</div>
                <input
                  type="file"
                  id={`file-${dt.type}`}

              </div>
            ))}
          </div>
        </Card>

          {db.documents.length === 0 ? (

    { id: "config", icon: "⚙️", label: "Config" },
  ];

  // ═══ RENDER ═══
  return (
    <div style={{ background: C.bg, color: C.text, fontFamily: '"IBM Plex Sans", sans-serif', fontSize: 13, minHeight: "100vh" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:${C.bg2}}::-webkit-scrollbar-thumb{background:${C.border2};border-radius:2px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}`}</style>

      <nav style={{ position: "fixed", top: 0, left: 0, right: 0, height: 52, zIndex: 100, background: "rgba(6,9,15,.97)", backdropFilter: "blur(24px)", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", padding: "0 14px", gap: 2, overflowX: "auto" }}>
        <div onClick={() => setScreen("dash")} style={{ fontWeight: 800, fontSize: 15, letterSpacing: 3, background: `linear-gradient(135deg, ${C.gold}, ${C.teal})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", marginRight: 14, cursor: "pointer", whiteSpace: "nowrap" }}>TAF</div>
        {navItems.map(n => (
          <button key={n.id} onClick={() => setScreen(n.id)} style={{ padding: "4px 10px", borderRadius: 6, border: screen === n.id ? `1px solid ${n.r ? `${C.red}30` : `${C.blue}30`}` : "1px solid transparent", cursor: "pointer", fontSize: 10, fontWeight: 600, fontFamily: "inherit", background: screen === n.id ? (n.r ? `${C.red}18` : `${C.blue}18`) : n.r ? `${C.red}08` : n.a ? `${C.gold}08` : "transparent", color: screen === n.id ? (n.r ? C.red : C.blue) : n.r ? C.red : n.a ? C.gold : C.text3, whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: 3, transition: "all .15s" }}>
            {n.icon} {n.label}
            {n.id === "relance" && kpis.relDues > 0 && <span style={{ background: C.red, color: "#fff", borderRadius: 10, fontSize: 8, padding: "1px 4px", fontWeight: 800 }}>{kpis.relDues}</span>}
          </button>
        ))}
        <div style={{ flex: 1 }} />
        {/* Drive dot in nav */}
        {drive.enabled && (
          <div style={{ display: "flex", alignItems: "center", gap: 4, padding: "3px 8px", borderRadius: 12, background: C.card, border: `1px solid ${C.border}`, fontSize: 9, marginRight: 4 }} title="Drive auto-backup">
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: driveStatus === "ok" ? C.green : driveStatus === "backing" ? C.gold : driveStatus === "err" ? C.red : C.text3 }} />
            <span style={{ color: driveStatus === "ok" ? C.green : driveStatus === "backing" ? C.gold : driveStatus === "err" ? C.red : C.text3 }}>💾</span>
          </div>
        )}
        {/* Sync dot in nav */}
        <div style={{ display: "flex", alignItems: "center", gap: 4, padding: "3px 8px", borderRadius: 12, background: C.card, border: `1px solid ${C.border}`, fontSize: 9, marginRight: 6 }}>
          <span style={{ width: 6, height: 6, borderRadius: "50%", background: syncDot[syncStatus] }} />
          <span style={{ color: syncDot[syncStatus] }}>{syncStatus === "synced" ? "🔥" : syncStatus === "syncing" ? "⏳" : ""}</span>
        </div>
        <Btn s="sm" v="gold" onClick={() => setScreen("machine")}>➕</Btn>
      </nav>

      <div style={{ paddingTop: 52 }}>
        <div style={{ padding: 18, animation: "fadeIn .2s ease" }}>
          {screen === "dash" && renderDash()}
          {screen === "intel" && renderIntel()}
          {screen === "machine" && renderMachine()}
          {screen === "pipe" && renderPipe()}
          {screen === "pros" && renderPros()}
          {screen === "rescue" && renderRescue()}
          {screen === "relance" && renderRelance()}
          {screen === "templates" && renderTemplates()}
          {screen === "config" && renderConfig()}
          {screen === "firebase-setup" && renderFirebaseSetup()}
          {screen === "detail" && renderDetail()}
          {screen === "demandes" && renderDemandes()}
          {screen === "demande-detail" && renderDemandeDetail()}
          {screen === "tarifs" && renderTarifs()}
          {screen === "documents" && renderDocuments()}
        </div>
      </div>

      {modal === "email" && renderEmailModal()}

      {toast && <div style={{ position: "fixed", top: 60, right: 14, zIndex: 300, background: C.bg2, border: `1px solid ${toast.type === "ok" ? `${C.green}30` : toast.type === "err" ? `${C.red}30` : `${C.gold}30`}`, borderRadius: 8, padding: "9px 13px", display: "flex", alignItems: "center", gap: 7, boxShadow: "0 12px 48px rgba(0,0,0,.7)", fontSize: 11, animation: "fadeIn .2s ease" }}>{toast.type === "ok" ? "✅" : toast.type === "err" ? "❌" : "⚠️"} {toast.msg}</div>}

      <div style={{ position: "fixed", bottom: 12, right: 12, zIndex: 150, padding: "4px 10px", borderRadius: 20, border: `1px solid ${C.border}`, background: C.card, fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", gap: 5 }}>
        <span style={{ width: 7, height: 7, borderRadius: "50%", background: syncDot[syncStatus], boxShadow: syncStatus === "synced" ? `0 0 6px ${C.green}60` : "none" }} />
        v{APP_VERSION}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
