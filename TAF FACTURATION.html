/* ═══════════════════════════════════════════════════════════════
   📧 COMPOSANT EMAIL INPUT AVEC VALIDATION TEMPS RÉEL
   
   À INTÉGRER DANS TAF_FACTURATION.html
   ═══════════════════════════════════════════════════════════════ */

/**
 * Validation stricte d'email
 */
function isValidEmail(email) {
  if (!email || typeof email !== 'string') return false;
  const emailRegex = /^[a-zA-Z0-9.!#$%&'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
  
  if (!emailRegex.test(email)) return false;
  if (email.length > 254) return false;
  if (email.split('@').length !== 2) return false;
  
  const [local, domain] = email.split('@');
  if (local.length > 64) return false;
  if (domain.length > 253) return false;
  if (!domain.includes('.')) return false;
  
  return true;
}

/**
 * Composant de champ email avec validation en temps réel
 */
function EmailInput({ 
  value, 
  onChange, 
  placeholder = "email@client.com",
  label = "Email",
  required = false,
  autoFocus = false,
  className = ""
}) {
  const [touched, setTouched] = useState(false);
  const trimmedValue = (value || '').trim();
  const isValid = trimmedValue ? isValidEmail(trimmedValue) : !required;
  const showValidation = touched && trimmedValue;
  
  return (
    <div className={className}>
      {label && (
        <div style={{
          fontSize: '11px',
          fontWeight: '700',
          color: '#94a3b8',
          marginBottom: '6px',
          textTransform: 'uppercase',
          letterSpacing: '0.5px'
        }}>
          {label} {required && <span style={{ color: '#ef4444' }}>*</span>}
        </div>
      )}
      
      <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
        <input
          type="email"
          value={value || ''}
          onChange={(e) => onChange(e.target.value)}
          onBlur={() => setTouched(true)}
          placeholder={placeholder}
          autoFocus={autoFocus}
          style={{
            flex: 1,
            padding: '10px 40px 10px 14px',
            background: showValidation 
              ? (isValid ? 'rgba(34,197,94,.08)' : 'rgba(239,68,68,.08)')
              : 'rgba(255,255,255,.04)',
            border: showValidation
              ? (isValid ? '2px solid rgba(34,197,94,.4)' : '2px solid rgba(239,68,68,.4)')
              : '1px solid rgba(255,255,255,.12)',
            borderRadius: '8px',
            color: '#e8f0f8',
            fontSize: '13px',
            fontWeight: '600',
            transition: 'all 0.3s'
          }}
        />
        
        {/* Indicateur de validation en temps réel */}
        {showValidation && (
          <div style={{
            position: 'absolute',
            right: '12px',
            fontSize: '16px',
            animation: 'fadeIn 0.3s'
          }}>
            {isValid ? '✅' : '❌'}
          </div>
        )}
      </div>
      
      {/* Message d'erreur */}
      {showValidation && !isValid && (
        <div style={{
          marginTop: '4px',
          fontSize: '11px',
          color: '#fca5a5',
          fontWeight: '600',
          animation: 'fadeIn 0.3s'
        }}>
          ⚠️ Format d'email invalide
        </div>
      )}
      
      <style>{`
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(-4px); }
          to { opacity: 1; transform: translateY(0); }
        }
      `}</style>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   ✅ NOTIFICATION DE SUCCÈS/ÉCHEC
   ═══════════════════════════════════════════════════════════════ */

function EmailResultNotification({ show, success, message, details, onClose }) {
  const [isExiting, setIsExiting] = useState(false);
  
  useEffect(() => {
    if (show && success) {
      const timer = setTimeout(() => {
        setIsExiting(true);
        setTimeout(onClose, 300);
      }, 5000);
      return () => clearTimeout(timer);
    }
  }, [show, success, onClose]);
  
  if (!show) return null;
  
  const handleClose = () => {
    setIsExiting(true);
    setTimeout(onClose, 300);
  };
  
  return (
    <div style={{
      position: 'fixed',
      top: '20px',
      right: '20px',
      zIndex: 10001,
      animation: isExiting ? 'slideOut 0.3s ease-out' : 'slideIn 0.3s ease-out'
    }}>
      <div style={{
        background: success 
          ? 'linear-gradient(135deg, #064e3b, #065f46)'
          : 'linear-gradient(135deg, #7f1d1d, #991b1b)',
        border: success 
          ? '1px solid #10b981'
          : '1px solid #ef4444',
        borderRadius: '16px',
        padding: '20px 24px',
        minWidth: '380px',
        maxWidth: '480px',
        boxShadow: '0 20px 60px rgba(0,0,0,.6)',
        display: 'flex',
        alignItems: 'flex-start',
        gap: '16px'
      }}>
        {/* Icône */}
        <div style={{
          fontSize: '32px',
          flexShrink: 0
        }}>
          {success ? '✅' : '❌'}
        </div>
        
        {/* Contenu */}
        <div style={{ flex: 1 }}>
          <div style={{
            fontSize: '16px',
            fontWeight: '900',
            color: success ? '#86efac' : '#fca5a5',
            marginBottom: '6px'
          }}>
            {success ? 'Email envoyé avec succès !' : 'Échec de l\'envoi'}
          </div>
          
          <div style={{
            fontSize: '13px',
            color: success ? '#d1fae5' : '#fecaca',
            marginBottom: details ? '10px' : 0,
            lineHeight: '1.5'
          }}>
            {message}
          </div>
          
          {details && (
            <div style={{
              background: 'rgba(0,0,0,.3)',
              borderRadius: '8px',
              padding: '10px 12px',
              fontSize: '11px',
              fontFamily: 'monospace',
              color: success ? '#d1fae5' : '#fecaca',
              opacity: 0.9
            }}>
              {details}
            </div>
          )}
        </div>
        
        {/* Bouton fermer */}
        <button
          onClick={handleClose}
          style={{
            background: 'transparent',
            border: 'none',
            color: success ? '#86efac' : '#fca5a5',
            fontSize: '20px',
            cursor: 'pointer',
            padding: 0,
            opacity: 0.7,
            flexShrink: 0
          }}
        >
          ✕
        </button>
      </div>
      
      <style>{`
        @keyframes slideIn {
          from { transform: translateX(400px); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
          from { transform: translateX(0); opacity: 1; }
          to { transform: translateX(400px); opacity: 0; }
        }
      `}</style>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   🎨 DÉMO INTÉGRÉE
   ═══════════════════════════════════════════════════════════════ */

function DemoTAFFacturation() {
  // États pour les emails
  const [emailClient, setEmailClient] = useState('');
  const [emailCC1, setEmailCC1] = useState('');
  const [emailCC2, setEmailCC2] = useState('');
  
  // États pour la confirmation
  const [showConfirmation, setShowConfirmation] = useState(false);
  const [isSending, setIsSending] = useState(false);
  
  // États pour la notification de résultat
  const [showResult, setShowResult] = useState(false);
  const [sendSuccess, setSendSuccess] = useState(false);
  const [sendMessage, setSendMessage] = useState('');
  const [sendDetails, setSendDetails] = useState('');
  
  // Données du dossier (exemple)
  const dossier = {
    client: 'FRESH IMPORT SARL',
    compagnie: 'AIR FRANCE',
    lta: 'FR240419-0123',
    num_dec: '24FR123456789012',
    numMalta: 'MT-2024-04-19-001',
    droits: 450.50
  };
  
  const handleSendClick = () => {
    // Vérifier que l'email principal est valide
    if (!emailClient.trim()) {
      alert('❌ Veuillez saisir l\'email du client');
      return;
    }
    
    if (!isValidEmail(emailClient.trim())) {
      alert('❌ L\'email du client est invalide');
      return;
    }
    
    // Vérifier les CC si remplis
    const ccEmails = [emailCC1, emailCC2].filter(e => e.trim());
    for (const email of ccEmails) {
      if (!isValidEmail(email.trim())) {
        alert(`❌ L'email "${email}" est invalide`);
        return;
      }
    }
    
    // Afficher la modale de confirmation
    setShowConfirmation(true);
  };
  
  const handleConfirmSend = async () => {
    setIsSending(true);
    
    // Simuler l'envoi
    try {
      // Ici tu appelleras ta vraie fonction sendEmailRobust
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      // Simuler succès (tu peux tester échec en décommentant la ligne suivante)
      // throw new Error('Scénario Make inactif (403)');
      
      // Fermer la modale
      setShowConfirmation(false);
      setIsSending(false);
      
      // Afficher la notification de succès
      setSendSuccess(true);
      setSendMessage(`Email envoyé à ${emailClient}`);
      setSendDetails(`Client: ${dossier.client} • N° Malta: ${dossier.numMalta}`);
      setShowResult(true);
      
    } catch (error) {
      // Fermer la modale
      setShowConfirmation(false);
      setIsSending(false);
      
      // Afficher la notification d'échec
      setSendSuccess(false);
      setSendMessage(error.message || 'Une erreur est survenue');
      setSendDetails('Vérifiez que le scénario Make est actif');
      setShowResult(true);
    }
  };
  
  return (
    <div style={{
      minHeight: '100vh',
      background: 'linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%)',
      padding: '40px 20px'
    }}>

          marginBottom: '40px'

            fontSize: '32px',
            fontWeight: '900',
            color: '#e8f0f8',
            marginBottom: '8px'
          }}>
            📧 TAF FACTURATION v2.2
          </h1>

            fontSize: '14px',
            color: '#e8601a',
            fontWeight: '700',
            letterSpacing: '1px'
          }}>
            VALIDATION TEMPS RÉEL + CONFIRMATION D'ENVOI

        </div>
        
        {/* Card principale */}
        <div style={{

            <EmailInput

            <li>🎨 <strong>Interface élégante</strong> : Design cohérent avec TAF</li>
          </ul>
        </div>
      </div>
      
      {/* Modale de confirmation */}
      <EmailConfirmationModal
        show={showConfirmation}
        onClose={() => !isSending && setShowConfirmation(false)}
        onConfirm={handleConfirmSend}
        isSending={isSending}
        emailData={{
          to: emailClient,
          cc: [emailCC1, emailCC2].filter(e => e),
          subject: `TAF CDG — ${dossier.numMalta} — ${dossier.client}`,
          client: dossier.client,
          details: {
            'Compagnie': dossier.compagnie,
            'N° LTA': dossier.lta,
            'N° Malta': dossier.numMalta,
            'Droits': dossier.droits.toFixed(2) + ' €'
          }
        }}
      />
      
      {/* Notification de résultat */}
      <EmailResultNotification
        show={showResult}
        success={sendSuccess}
        message={sendMessage}
        details={sendDetails}
        onClose={() => setShowResult(false)}
      />
    </div>
  );
}

ReactDOM.render(<DemoTAFFacturation />, document.getElementById('root'));
</script>

</body>
</html>
