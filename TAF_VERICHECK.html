<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF VERICHECK v4.2 — Rapprochement Facture / Malta + Drive Sync Complète</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e17;--surface:#111420;--surface2:#181c2e;--surface3:#1e2238;
  --border:#1f2440;--border2:#2a304f;--border3:#353d66;
  --amber:#f59e0b;--amber2:#fbbf24;--amber-bg:rgba(245,158,11,.08);
  --green:#10b981;--green-bg:rgba(16,185,129,.08);
  --red:#ef4444;--red-bg:rgba(239,68,68,.08);
  --orange:#f97316;--orange-bg:rgba(249,115,22,.08);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.08);
  --purple:#a855f7;--purple-bg:rgba(168,85,247,.08);
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:56px;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0}
.nav-logo-badge{background:var(--amber);color:#000;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1.5px}
.nav-title{font-size:15px;font-weight:800;letter-spacing:2px}
.nav-sub{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:1.5px;margin-top:1px}
.nav-links{display:flex;gap:2px;flex:1}
.nbtn{background:none;border:none;color:var(--muted2);cursor:pointer;padding:8px 16px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.5px;transition:all .15s;display:flex;align-items:center;gap:7px}
.nbtn:hover{background:var(--surface2);color:var(--text)}
.nbtn.active{background:var(--surface2);color:var(--amber)}
.nav-right{display:flex;align-items:center;gap:12px}
.version-tag{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amber-bg);padding:3px 9px;border-radius:4px;border:1px solid rgba(245,158,11,.3);font-weight:700;letter-spacing:.5px}
.drive-sync{display:flex;align-items:center;gap:7px;font-size:10px;font-family:var(--mono);color:var(--muted2);padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;letter-spacing:.5px;cursor:pointer;transition:all .15s}
.drive-sync:hover{border-color:var(--border3)}
.drive-sync.ok{color:var(--green);border-color:rgba(16,185,129,.3)}
.drive-sync.saving{color:var(--amber);border-color:rgba(245,158,11,.35)}
.drive-sync.error{color:var(--red);border-color:rgba(239,68,68,.3)}
.drive-sync.dirty{color:var(--orange);border-color:rgba(249,115,22,.4);background:rgba(249,115,22,.08)}
.drive-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.drive-sync.saving .drive-dot{animation:pulse 1s infinite}
.drive-sync.dirty .drive-dot{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-save{background:var(--green);color:#000;padding:7px 14px;font-size:12px;border:none;border-radius:6px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;font-family:var(--sans);letter-spacing:.5px}
.btn-save:hover{background:#0f9d72;transform:translateY(-1px)}
.btn-save:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed;transform:none}
.btn-exit{background:var(--surface2);color:var(--text);padding:7px 14px;font-size:12px;border:1px solid var(--border2);border-radius:6px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;font-family:var(--sans);letter-spacing:.5px}
.btn-exit:hover{border-color:var(--red);color:var(--red)}
.btn-exit:disabled{opacity:.5;cursor:not-allowed}

/* LAYOUT */
.page{padding:24px 32px;max-width:1500px;margin:0 auto}
.page-hdr{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.page-title{font-size:22px;font-weight:800;letter-spacing:1px}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* BUTTONS */
.btn{border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);font-weight:700;letter-spacing:.5px;transition:all .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary{background:var(--amber);color:#000;padding:11px 22px;font-size:13px}
.btn-primary:hover{background:var(--amber2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,.3)}
.btn-primary:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none}
.btn-sec{background:var(--surface2);color:var(--text);padding:9px 18px;font-size:13px;border:1px solid var(--border2)}
.btn-sec:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--red-bg);color:var(--red);padding:6px 12px;font-size:12px;border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-ghost{background:none;color:var(--muted2);padding:7px 12px;font-size:12px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-green{background:var(--green-bg);color:var(--green);padding:9px 18px;font-size:13px;border:1px solid rgba(16,185,129,.35)}
.btn-green:hover{background:rgba(16,185,129,.2)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.card-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* STEPS */
.steps{display:flex;gap:6px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;overflow-x:auto}
.step{flex:1;min-width:150px;padding:12px 16px;border-radius:7px;display:flex;align-items:center;gap:10px;transition:all .15s;cursor:default}
.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;flex-shrink:0}
.step-lbl{font-size:12px;font-weight:700;letter-spacing:.5px}
.step-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.step.pending .step-num{background:var(--surface3);color:var(--muted)}
.step.pending .step-lbl{color:var(--muted2)}
.step.active{background:var(--amber-bg);border:1px solid rgba(245,158,11,.4)}
.step.active .step-num{background:var(--amber);color:#000}
.step.active .step-lbl{color:var(--amber)}
.step.done{background:var(--green-bg);border:1px solid rgba(16,185,129,.4)}
.step.done .step-num{background:var(--green);color:#000}
.step.done .step-lbl{color:var(--green)}

/* UPLOAD */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:28px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);position:relative;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.upload-zone:hover,.upload-zone.drag{border-color:var(--amber);background:var(--amber-bg)}
.upload-zone.loaded{border-color:var(--green);border-style:solid;background:var(--green-bg)}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-title{font-size:14px;font-weight:700;margin-bottom:4px}
.upload-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.upload-fname{font-family:var(--mono);font-size:11px;color:var(--green);margin-top:10px;background:rgba(16,185,129,.12);padding:4px 11px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-clear{position:absolute;top:10px;right:10px;background:var(--red-bg);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:var(--mono)}

/* HANDLER SELECT */
.handler-select-wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.handler-pill{padding:10px 20px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.handler-pill:hover{border-color:var(--border3)}
.handler-pill.active{background:var(--amber);color:#000;border-color:var(--amber)}
.handler-pill-prefix{font-family:var(--mono);font-size:10px;opacity:.7;padding:2px 6px;background:rgba(0,0,0,.15);border-radius:3px}
.handler-pill.active .handler-pill-prefix{background:rgba(0,0,0,.2)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-val{font-size:22px;font-weight:800;font-family:var(--mono);line-height:1}
.stat-sub{font-size:10px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.c-green{color:var(--green)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-orange{color:var(--orange)}.c-blue{color:var(--blue)}.c-muted{color:var(--muted2)}.c-purple{color:var(--purple)}

/* TABLE */
.rec-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:auto;margin-bottom:14px}
.rec-table{width:100%;border-collapse:collapse;min-width:1200px}
.rec-table th{background:var(--surface2);color:var(--muted);font-size:10px;letter-spacing:1.5px;font-weight:700;padding:11px 10px;text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;position:sticky;top:0;z-index:2}
.rec-table td{padding:10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.rec-table tr:hover td{background:var(--surface2)}
.rec-table tr.ok-row{background:rgba(16,185,129,.04)}
.rec-table tr.ko-row{background:rgba(239,68,68,.04)}
.rec-table tr.miss-row{background:rgba(249,115,22,.04)}
.td-lta{font-family:var(--mono);font-weight:700;color:var(--amber)}
.td-mono{font-family:var(--mono);font-size:11px}
.td-client{font-weight:600;font-size:12px}
.td-right{text-align:right;font-family:var(--mono);font-weight:600}
.td-center{text-align:center}
.verdict{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:var(--mono)}
.verdict-ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.verdict-ko{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.verdict-miss{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.verdict-notarif{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(168,85,247,.3)}

.inp-inline{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 9px;border-radius:5px;font-family:var(--mono);font-size:12px;width:90px;text-align:right}
.inp-inline:focus{outline:none;border-color:var(--amber)}
.sel-inline{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 8px;border-radius:5px;font-size:11px;font-family:var(--sans)}
.sel-inline:focus{outline:none;border-color:var(--amber)}

.prod-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:.3px}
.prod-cargo{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.3)}
.prod-seafood{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.prod-avi{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3)}
.prod-fl{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}

/* FORM INPUTS */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.inp{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:9px 13px;border-radius:7px;font-family:var(--sans);font-size:13px;width:100%}
.inp:focus{outline:none;border-color:var(--amber)}
.inp-mono{font-family:var(--mono);font-size:12px}

/* TABS (handlers/clients pages) */
.subtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:5px;border-radius:9px;margin-bottom:16px;flex-wrap:wrap}
.subtab{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted2);transition:all .15s;border:none;background:none;font-family:var(--sans);display:flex;align-items:center;gap:7px}
.subtab:hover{color:var(--text);background:var(--surface2)}
.subtab.active{background:var(--amber);color:#000}
.subtab-badge{font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,.15);font-family:var(--mono)}
.subtab.active .subtab-badge{background:rgba(0,0,0,.25)}

/* HANDLERS PAGE */
.handler-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.handler-hdr{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:14px;flex-wrap:wrap}
.handler-hdr-info{flex:1;min-width:200px}
.handler-name{font-size:15px;font-weight:800;margin-bottom:4px}
.handler-prefix-list{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.prefix-chip{font-family:var(--mono);font-size:10px;padding:2px 7px;background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,.3);border-radius:3px;font-weight:700}
.handler-hdr-actions{display:flex;gap:6px}
.handler-body{padding:16px 20px}
.mod-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px}
.mod-tab{padding:6px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted2);background:none;border:1px solid transparent;font-family:var(--sans)}
.mod-tab:hover{background:var(--surface2)}
.mod-tab.active{background:var(--surface3);color:var(--amber);border-color:rgba(245,158,11,.4)}
.mod-tab-count{font-family:var(--mono);font-size:9px;margin-left:5px;opacity:.7}

.ligne-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.ligne-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.ligne-lbl{font-weight:700;font-size:13px}
.ligne-type{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface3);padding:2px 7px;border-radius:3px;margin-left:8px}
.grille-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
.grille-table th{background:var(--surface3);color:var(--muted);padding:5px 8px;text-align:left;font-size:10px;letter-spacing:1px;font-weight:700}
.grille-table td{padding:5px 8px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.grille-table input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:3px 7px;border-radius:4px;font-family:var(--mono);font-size:11px;width:90px}
.grille-table input:focus{outline:none;border-color:var(--amber)}

/* CLIENTS PAGE */
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.client-hdr{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--surface2)}
.client-hdr-left{display:flex;align-items:center;gap:12px}
.client-hdr-icon{font-size:20px}
.client-hdr-title{font-size:14px;font-weight:800}
.client-hdr-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.client-list{padding:12px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.client-row{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
.client-row input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 8px;border-radius:4px;font-family:var(--mono);font-size:11px;width:100%}
.client-row input.client-name-inp{font-family:var(--sans);font-size:12px}
.client-row input:focus{outline:none;border-color:var(--amber)}

/* ALERTS */
.alert{border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px;font-size:12px}
.alert-err{background:var(--red-bg);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.alert-warn{background:var(--orange-bg);border:1px solid rgba(249,115,22,.3);color:var(--orange)}
.alert-info{background:var(--blue-bg);border:1px solid rgba(59,130,246,.3);color:var(--blue)}
.alert-icon{font-size:16px;flex-shrink:0}
.alert-body{flex:1;line-height:1.5}
.alert-title{font-weight:700;margin-bottom:3px;font-size:12px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;max-width:600px;width:100%;max-height:85vh;overflow:auto}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:14px;font-weight:800;letter-spacing:1px}
.modal-body{padding:20px}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;padding:0;line-height:1}
.modal-close:hover{color:var(--red)}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-txt{font-size:14px;font-weight:700;margin-bottom:4px}
.empty-sub{font-size:12px;font-family:var(--mono)}

/* LOADER */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* DEBUG */
.debug-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;color:var(--muted2)}

/* RESPONSIVE */
@media (max-width: 900px){
  .page{padding:16px}
  .upload-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════
// PDF.js WORKER
// ═══════════════════════════════════════════════════════════════════
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// MIGRATION : s'assurer que la structure chargée est complète
// ═══════════════════════════════════════════════════════════════════
function migrateParams(raw) {
  const p = JSON.parse(JSON.stringify(raw || {}));
  // productTypes
  if (!p.productTypes) p.productTypes = DEF_PARAMS.productTypes;
  ['cargo','seafood','avi','fl'].forEach(k => {
    if (!p.productTypes[k]) p.productTypes[k] = DEF_PARAMS.productTypes[k];
    if (!Array.isArray(p.productTypes[k].clients)) p.productTypes[k].clients = [];
    // normalize clients : { code, nom }
    p.productTypes[k].clients = p.productTypes[k].clients
      .filter(c => c && (c.code || c.codeMalta || c.nom))
      .map(c => ({
        code: String(c.code ?? c.codeMalta ?? '').trim().toUpperCase(),
        nom:  String(c.nom ?? '').trim()
      }))
      .filter(c => c.code || c.nom);
  });
  // handlers
  if (!Array.isArray(p.handlers) || !p.handlers.length) p.handlers = DEF_PARAMS.handlers;
  p.handlers = p.handlers.map(h => {
    const nh = { ...h };
    if (!nh.modules) nh.modules = { cargo: [], seafood: [], avi: [], fl: [] };
    ['cargo','seafood','avi','fl'].forEach(k => {
      if (!Array.isArray(nh.modules[k])) nh.modules[k] = [];
    });
    // si ancienne structure lignesT, on la glisse dans cargo
    if (Array.isArray(nh.lignesT) && !nh.modules.cargo.length) {
      nh.modules.cargo = nh.lignesT;
    }
    if (!Array.isArray(nh.prefixesAWB)) nh.prefixesAWB = [];
    if (nh.toleranceEcart == null) nh.toleranceEcart = 2;
    return nh;
  });
  return p;
}

// UTILS
// ═══════════════════════════════════════════════════════════════════
const fmtEur = v => v == null || isNaN(Number(v)) ? '—'
  : new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', minimumFractionDigits:2 }).format(v);
const fmtKg  = v => v == null || isNaN(Number(v)) ? '—' : `${Number(v).toLocaleString('fr-FR')} kg`;
const escHTML = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/**
 * Normalise une LTA en 11 chiffres.
 * Malta : "xxx xxxx xxxx" (11 chiffres avec espaces)
 * Facture : "xxx-xxxxxxx" (3+7=10) ou "xxx-xxxxxxxx" (3+8=11)
 * On retire tout sauf les chiffres. Si 11 chiffres → tel quel. Si 10 → on essaiera avec ou sans check digit.
 */
function normalizeLTA(raw) {
  if (raw == null) return '';
  const digits = String(raw).replace(/\D/g, '');
  return digits;
}

/**
 * Clé de matching : 10 chiffres (préfixe 3 + serial 7 SANS check digit)
 * Malta 11 chiffres → on retire le dernier (check digit)
 * Facture 10 chiffres → tel quel
 * Facture 11 chiffres → on retire le dernier
 */
function ltaKey(raw) {
  const d = normalizeLTA(raw);
  if (d.length === 11) return d.slice(0, 10);
  if (d.length === 10) return d;
  if (d.length >= 10)  return d.slice(0, 10); // au cas où
  return d;
}

/**
 * Affichage LTA standard : xxx-xxxxxxxx (préfixe-serial 8 digits)
 */
function fmtLTA(raw) {
  const d = normalizeLTA(raw);
  if (d.length === 11) return `${d.slice(0,3)}-${d.slice(3)}`;
  if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3)}`;
  return raw;
}

function parseNumber(s) {
  if (s == null) return null;
  if (typeof s === 'number') return isNaN(s) ? null : s;
  let str = String(s).trim();
  if (!str) return null;
  // Retire les espaces et le symbole €
  str = str.replace(/[€\s]/g, '');
  // Remplace virgule décimale par point
  if (str.includes(',') && !str.includes('.')) {
    str = str.replace(',', '.');
  } else if (str.includes(',') && str.includes('.')) {
    // Format "1,234.56" → on retire les virgules
    str = str.replace(/,/g, '');
  }
  const n = Number(str);
  return isNaN(n) ? null : n;
}

// ═══════════════════════════════════════════════════════════════════
// CALCUL TARIF (un handler + un module + un poids)
// ═══════════════════════════════════════════════════════════════════
function calcLigneMontant(lt, poids) {
  if (!lt?.actif || !lt.params || poids == null) return null;
  const p = lt.params;
  switch (lt.type) {
    case 'fixe': return p.montant != null ? Number(p.montant) : null;
    case 'kg_brut': {
      if (p.taux == null) return null;
      const v = Number(p.taux) * poids;
      return p.mini ? Math.max(v, Number(p.mini)) : v;
    }
    case 'mise_dispo': {
      const g = (p.grille || []).find(g => poids >= g.min && poids <= g.max);
      return g ? Number(g.montant) : null;
    }
    case 'uc_tranche': {
      if (p.taux_uc == null) return null;
      const tr = Number(p.tranche) || 150;
      return Math.ceil(poids / tr) * Number(p.taux_uc);
    }
    case 'uc_tranche_fixe': {
      const tr = Number(p.tranche) || 150;
      const uc = p.taux_uc != null ? Math.ceil(poids / tr) * Number(p.taux_uc) : 0;
      const fixe = p.montant != null ? Number(p.montant) : 0;
      return uc + fixe;
    }
    default: return p.montant != null ? Number(p.montant) : null;
  }
}

function calcTarifAttendu(handler, productType, poids) {
  if (!handler || !productType || poids == null) return { total: null, detail: [], diag: 'params_incomplets' };
  const lignes = handler.modules?.[productType] || [];
  if (!lignes.length) return { total: null, detail: [], diag: 'aucun_tarif_configure' };
  let total = 0, someOk = false;
  const detail = [];
  for (const lt of lignes) {
    if (!lt.actif) continue;
    const m = calcLigneMontant(lt, poids);
    if (m != null) { total += m; someOk = true; detail.push({ libelle: lt.libelle, montant: m }); }
    else detail.push({ libelle: lt.libelle, montant: null, err: 'incomplet' });
  }
  return someOk
    ? { total, detail, diag: 'ok' }
    : { total: null, detail, diag: 'calcul_impossible' };
}

// ═══════════════════════════════════════════════════════════════════
// PARSING MALTA (XLS/XLSX)
// Colonnes FIXES :
//   A : date création
//   B : n° dossier
//   C : LTA (format "xxx xxxx xxxx")
//   H : code Malta client
//   K : poids
// Lignes 1-3 ignorées (skiprows = 3) → data à partir de ligne 4
// ═══════════════════════════════════════════════════════════════════
async function parseMalta(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
  // skiprows = 3 → data à partir de l'index 3 (lignes 1-3 ignorées)
  const dataRows = rows.slice(3);
  const dossiers = [];
  for (const r of dataRows) {
    if (!r || !r.length) continue;
    const dateStr    = r[0];  // A
    const numDossier = r[1];  // B
    const ltaRaw     = r[2];  // C
    const codeClient = r[7];  // H
    const poidsRaw   = r[10]; // K
    if (!ltaRaw && !numDossier) continue;
    const ltaNorm = normalizeLTA(ltaRaw);
    if (ltaNorm.length < 10) continue; // on skip les lignes sans LTA valide
    dossiers.push({
      date: String(dateStr || '').trim(),
      numDossier: String(numDossier || '').trim(),
      ltaRaw: String(ltaRaw || '').trim(),
      ltaKey: ltaKey(ltaRaw),
      codeClient: String(codeClient || '').trim().toUpperCase(),
      poids: parseNumber(poidsRaw) || 0
    });
  }
  // Index par ltaKey
  const indexLTA = new Map();
  for (const d of dossiers) {
    if (!indexLTA.has(d.ltaKey)) indexLTA.set(d.ltaKey, d);
  }
  return { dossiers, indexLTA, nbTotal: dataRows.length };
}

// ═══════════════════════════════════════════════════════════════════
// PARSING FACTURE PDF
// Objectif : pour chaque LTA de la facture, collecter tous les
// montants HT associés (une LTA peut avoir plusieurs lignes).
//
// Stratégie :
//   1. Extraire tout le texte avec positions (x, y, str)
//   2. Grouper par ligne (tolérance Y)
//   3. Trier les lignes par page puis par y décroissant
//   4. Scanner : dès qu'on trouve une LTA (préfixe + 7 ou 8 chiffres),
//      c'est le "currentLTA". Sur cette ligne ET les lignes suivantes
//      (jusqu'à la prochaine LTA), on extrait les montants numériques.
//   5. Par ligne : la DERNIÈRE valeur numérique est la TVA (à ignorer).
//      Les autres montants de la ligne sont du HT.
//      Heuristique : on prend TOUS les montants sauf le dernier.
//      Si 1 seul montant sur la ligne → c'est du HT (pas de TVA dans cette colonne).
// ═══════════════════════════════════════════════════════════════════
async function parseFacturePDF(file, handler) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  // Préfixes du handler pour repérer les LTA
  const prefixes = handler?.prefixesAWB || [];
  if (!prefixes.length) {
    return { lignesParLTA: new Map(), rawText: '', debug: 'Aucun préfixe configuré pour ce handler.' };
  }
  // Regex LTA : préfixe puis tiret/espace puis 7 ou 8 chiffres
  // ex: 074-12345678, 125 12345678, 057-1234567
  const prefixAlt = prefixes.map(p => p.replace(/\D/g,'')).join('|');
  const rxLTA = new RegExp(`\\b(${prefixAlt})[\\s\\-]*([0-9]{7,8})\\b`, 'g');
  // Regex montant : ex 1 234,56 / 1234.56 / 1,234.56 / 123,45 / 123.45
  // On veut des nombres à décimales de préférence (pour éviter faux positifs : poids entier, etc.)
  const rxMontant = /(?:^|\s)(-?\d{1,3}(?:[\s.]\d{3})*(?:[.,]\d{2})|-?\d+[.,]\d{2})(?=\s|$|€)/g;

  const allLines = [];
  let rawText = '';

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    // Regroupe les items par ligne (y arrondi à 2 pixels près)
    const linesMap = new Map();
    for (const item of content.items) {
      const y = Math.round(item.transform[5] / 2) * 2;
      const x = item.transform[4];
      if (!linesMap.has(y)) linesMap.set(y, []);
      linesMap.get(y).push({ x, str: item.str });
    }
    // Tri par y décroissant (haut → bas)
    const ys = [...linesMap.keys()].sort((a,b) => b - a);
    for (const y of ys) {
      const items = linesMap.get(y).sort((a,b) => a.x - b.x);
      const text = items.map(i => i.str).join(' ').replace(/\s+/g,' ').trim();
      if (text) {
        allLines.push({ page: p, y, text });
        rawText += text + '\n';
      }
    }
    rawText += '\n----- PAGE ' + p + ' -----\n\n';
  }

  // Scan : on attribue chaque ligne à la "currentLTA"
  const lignesParLTA = new Map();
  let currentLTA = null;

  for (const ln of allLines) {
    const txt = ln.text;
    // Cherche une LTA dans cette ligne
    rxLTA.lastIndex = 0;
    const matches = [...txt.matchAll(rxLTA)];
    if (matches.length > 0) {
      // Une nouvelle LTA commence sur cette ligne
      // Si plusieurs LTA dans la même ligne, on prend la première (cas rare)
      const mm = matches[0];
      const pref = mm[1];
      const serial = mm[2];
      const ltaRaw = `${pref}-${serial}`;
      currentLTA = ltaKey(ltaRaw);
      if (!lignesParLTA.has(currentLTA)) {
        lignesParLTA.set(currentLTA, {
          ltaKey: currentLTA,
          ltaAffiche: fmtLTA(ltaRaw),
          lignes: [],
          totalHT: 0
        });
      }
    }
    if (!currentLTA) continue;
    // Extraire les montants de la ligne
    rxMontant.lastIndex = 0;
    const montants = [];
    let m;
    while ((m = rxMontant.exec(txt)) !== null) {
      const n = parseNumber(m[1]);
      if (n != null) montants.push(n);
    }
    // Heuristique : la dernière colonne = TVA → on retire le dernier montant
    // SAUF si un seul montant sur la ligne (souvent = HT ou total)
    // SAUF si la ligne contient "TOTAL" / "TTC" / "NET" : on prend rien (c'est récap)
    const upper = txt.toUpperCase();
    const isRecap = /\b(TOTAL|TTC|NET[\s\-]?À[\s\-]?PAYER|NET A PAYER|GRAND TOTAL|SOUS[\s\-]?TOTAL)\b/.test(upper);
    if (isRecap || montants.length === 0) {
      lignesParLTA.get(currentLTA).lignes.push({ text: txt, montants, htDetecte: 0, isRecap });
      continue;
    }
    // Détermine les HT : tous sauf le dernier si >= 2 montants, sinon tous
    const htList = montants.length >= 2 ? montants.slice(0, -1) : montants.slice();
    const htSum = htList.reduce((a,b) => a + b, 0);
    lignesParLTA.get(currentLTA).lignes.push({ text: txt, montants, htDetecte: htSum, isRecap: false });
    lignesParLTA.get(currentLTA).totalHT += htSum;
  }

  return { lignesParLTA, rawText, debug: `${allLines.length} lignes lues, ${lignesParLTA.size} LTA détectées` };
}

// ═══════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [params, setParams] = useState(() => loadParams());
  const [page, setPage] = useState('verif'); // verif | handlers | clients
  // Drive sync state
  const [driveStatus, setDriveStatus] = useState('idle'); // idle | loading | saving | ok | error | dirty
  const [lastSyncAt, setLastSyncAt] = useState(null);
  const [bootLoaded, setBootLoaded] = useState(false);
  const [isDirty, setIsDirty] = useState(false);
  const [exitingState, setExitingState] = useState(null); // null | 'saving' | 'done' | 'error'
  const saveTimerRef = useRef(null);
  const paramsRef = useRef(params); // ref pour accès dans saveNow
  useEffect(() => { paramsRef.current = params; }, [params]);

  // ── Fonction de save Drive bas niveau ──
  const pushToDrive = useCallback(async (payload) => {
    setDriveStatus('saving');
    const ok = await driveUpload(DRIVE_PARAMS_FILE, payload);
    if (ok) {
      setDriveStatus('ok');
      setLastSyncAt(Date.now());
      setIsDirty(false);
    } else {
      setDriveStatus('error');
    }
    return ok;
  }, []);

  // ── Save immédiat (sans debounce) ──
  const saveNow = useCallback(async () => {
    if (saveTimerRef.current) {
      clearTimeout(saveTimerRef.current);
      saveTimerRef.current = null;
    }
    return await pushToDrive(paramsRef.current);
  }, [pushToDrive]);

  // ── BOOT : essayer de charger depuis Drive ──
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setDriveStatus('loading');
      try {
        const remote = await driveRead(DRIVE_PARAMS_FILE);
        if (cancelled) return;
        if (remote && typeof remote === 'object' && remote.handlers) {
          const local = loadParams();
          const localTs  = Number(local?._updatedAt)  || 0;
          const remoteTs = Number(remote?._updatedAt) || 0;
          if (remoteTs >= localTs) {
            const migrated = migrateParams(remote);
            setParams(migrated);
            saveParamsLocal(migrated);
            console.log('[VC4] Params chargés depuis Drive (' + new Date(remoteTs).toLocaleString('fr-FR') + ')');
          } else {
            console.log('[VC4] localStorage plus récent → on garde local');
          }
          setDriveStatus('ok');
          setLastSyncAt(Date.now());
        } else {
          console.log('[VC4] Pas de fichier Drive existant');
          setDriveStatus('idle');
        }
      } catch (e) {
        console.warn('[VC4] Boot load failed:', e);
        setDriveStatus('error');
      } finally {
        setBootLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // ── BEFOREUNLOAD : avertir si modifs pending ──
  useEffect(() => {
    const handler = (e) => {
      if (isDirty) {
        e.preventDefault();
        e.returnValue = 'Modifications non sauvegardées. Quitter quand même ?';
        return e.returnValue;
      }
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [isDirty]);

  // ── SAVE : localStorage immédiat + Drive debounced (1s) ──
  const persistParams = useCallback((updater) => {
    setParams(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      const stamped = saveParamsLocal(next);
      setIsDirty(true);
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      if (bootLoaded) {
        setDriveStatus('dirty');
        saveTimerRef.current = setTimeout(() => {
          pushToDrive(stamped);
        }, 1000);
      }
      return stamped;
    });
  }, [bootLoaded, pushToDrive]);

  // ── BOUTON QUITTER & SAUVEGARDER ──
  const saveAndExit = useCallback(async () => {
    setExitingState('saving');
    const ok = await saveNow();
    if (ok) {
      setExitingState('done');
      // Attendre 600ms pour montrer le "Sauvegardé ✓" puis quitter
      setTimeout(() => {
        // Tente window.close (ne marche que pour onglets ouverts par JS)
        try { window.close(); } catch {}
        // Fallback : redirige vers la page d'accueil TAF (GitHub Pages)
        setTimeout(() => {
          window.location.href = 'https://taf-roissy.github.io/AI/';
        }, 300);
      }, 600);
    } else {
      setExitingState('error');
      setTimeout(() => setExitingState(null), 3000);
    }
  }, [saveNow]);

  // ── Archive un rapprochement ──
  const archiveRapprochement = async (handler, rows, stats) => {
    const ts = new Date();
    const tsFile = ts.toISOString().replace(/[:.]/g,'-').slice(0,19);
    const filename = `vericheck_v4_archive_${handler.id}_${tsFile}.json`;
    const payload = {
      version: 'v4.1',
      date: ts.toISOString(),
      handlerId: handler.id,
      handlerNom: handler.nom,
      stats,
      rows: rows.map(r => ({
        lta: r.ltaAffiche,
        dossier: r.dossierNum,
        codeClient: r.codeClient,
        client: r.client,
        productType: r.productType,
        poids: r.poids,
        htFacture: r.htFacture,
        tarifAttendu: r.tarifAttendu,
        ecart: r.ecart,
        verdict: r.verdict
      }))
    };
    const ok = await driveUpload(filename, payload);
    return { ok, filename };
  };

  // ── Label du badge Drive ──
  const driveLabel =
    driveStatus === 'loading' ? 'Drive · chargement...'
  : driveStatus === 'saving'  ? 'Sauvegarde...'
  : driveStatus === 'dirty'   ? 'Modifs non sauvées*'
  : driveStatus === 'ok'      ? (lastSyncAt ? 'Sauvé · ' + new Date(lastSyncAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : 'Sauvé ✓')
  : driveStatus === 'error'   ? 'Erreur Drive'
  :                              'Local uniquement';

  return React.createElement('div', null, [
    // NAV
    React.createElement('nav', { key:'nav', className:'nav' }, [
      React.createElement('div', { key:'logo', className:'nav-logo' }, [
        React.createElement('span', { key:'b', className:'nav-logo-badge' }, 'TAF'),
        React.createElement('div', { key:'t' }, [
          React.createElement('div', { key:'1', className:'nav-title' }, 'VERICHECK'),
          React.createElement('div', { key:'2', className:'nav-sub' }, 'CONTRÔLE FACTURES HANDLERS')
        ])
      ]),
      React.createElement('div', { key:'links', className:'nav-links' }, [
        React.createElement('button', {
          key:'v', className: 'nbtn' + (page==='verif'?' active':''),
          onClick: () => setPage('verif')
        }, '🔍 Vérification'),
        React.createElement('button', {
          key:'h', className: 'nbtn' + (page==='handlers'?' active':''),
          onClick: () => setPage('handlers')
        }, '⚙️ Handlers & Tarifs'),
        React.createElement('button', {
          key:'c', className: 'nbtn' + (page==='clients'?' active':''),
          onClick: () => setPage('clients')
        }, '👥 Clients & Produits')
      ]),
      React.createElement('div', { key:'right', className:'nav-right' }, [
        React.createElement('div', {
          key:'drv',
          className: 'drive-sync ' + (isDirty ? 'dirty' : (['ok','saving','error'].includes(driveStatus) ? driveStatus : '')),
          title: 'État de la sauvegarde Drive'
        }, [
          React.createElement('span', { key:'d', className:'drive-dot' }),
          React.createElement('span', { key:'l' }, driveLabel)
        ]),
        React.createElement('button', {
          key:'save',
          className: 'btn-save',
          disabled: driveStatus === 'saving' || exitingState === 'saving',
          onClick: saveNow,
          title: 'Forcer la sauvegarde sur Drive maintenant'
        }, [
          React.createElement('span', { key:'i' }, '💾'),
          React.createElement('span', { key:'l' }, 'Sauvegarder')
        ]),
        React.createElement('button', {
          key:'exit',
          className: 'btn-exit',
          disabled: exitingState === 'saving',
          onClick: saveAndExit,
          title: 'Sauvegarder puis quitter l\'application'
        }, [
          React.createElement('span', { key:'i' },
            exitingState === 'saving' ? '⏳'
          : exitingState === 'done'   ? '✓'
          : exitingState === 'error'  ? '⚠'
          : '🚪'
          ),
          React.createElement('span', { key:'l' },
            exitingState === 'saving' ? 'Sauvegarde...'
          : exitingState === 'done'   ? 'Quitter...'
          : exitingState === 'error'  ? 'Erreur save'
          : 'Quitter & sauvegarder'
          )
        ]),
        React.createElement('span', { key:'v', className:'version-tag' }, 'v4.2')
      ])
    ]),
    // PAGE
    page === 'verif'
      ? React.createElement(PageVerif, { key:'pv', params, setParams: persistParams, archiveRapprochement })
    : page === 'handlers'
      ? React.createElement(PageHandlers, { key:'ph', params, setParams: persistParams })
    : React.createElement(PageClients, { key:'pc', params, setParams: persistParams })
  ]);
}

// ═══════════════════════════════════════════════════════════════════
// PAGE VÉRIFICATION (workflow principal)
// ═══════════════════════════════════════════════════════════════════
function PageVerif({ params, setParams, archiveRapprochement }) {
  const [handlerId, setHandlerId] = useState(() => params.handlers[0]?.id || '');
  const [facture, setFacture] = useState(null);    // File
  const [factureParsed, setFactureParsed] = useState(null); // { lignesParLTA, rawText, debug }
  const [malta, setMalta] = useState(null);        // File
  const [maltaParsed, setMaltaParsed] = useState(null); // { dossiers, indexLTA, nbTotal }
  const [loading, setLoading] = useState(null); // 'facture' | 'malta' | null
  const [erreur, setErreur] = useState('');
  const [rows, setRows] = useState([]);         // rapprochement
  const [showDebug, setShowDebug] = useState(false);
  const [archiving, setArchiving] = useState(false);
  const [archiveMsg, setArchiveMsg] = useState('');

  const handler = useMemo(
    () => params.handlers.find(h => h.id === handlerId) || null,
    [params.handlers, handlerId]
  );

  // ── INDEX CLIENTS : code Malta → { nom, productType } ──
  const clientIndex = useMemo(() => {
    const idx = new Map();
    for (const [pt, pd] of Object.entries(params.productTypes || {})) {
      for (const c of pd.clients || []) {
        if (c.code) idx.set(String(c.code).toUpperCase(), { nom: c.nom, productType: pt });
      }
    }
    return idx;
  }, [params.productTypes]);

  // ── Upload facture ──
  const onUploadFacture = async (file) => {
    if (!file) return;
    if (!handler) { setErreur('Sélectionne un handler avant d\'uploader la facture.'); return; }
    if (!handler.prefixesAWB?.length) {
      setErreur(`Le handler "${handler.nom}" n'a aucun préfixe LTA configuré. Renseigne-le dans l'onglet Handlers & Tarifs.`);
      return;
    }
    setErreur('');
    setFacture(file);
    setLoading('facture');
    try {
      const parsed = await parseFacturePDF(file, handler);
      setFactureParsed(parsed);
    } catch (e) {
      setErreur(`Erreur parsing facture : ${e.message}`);
      setFactureParsed(null);
    } finally { setLoading(null); }
  };

  // ── Upload Malta ──
  const onUploadMalta = async (file) => {
    if (!file) return;
    setErreur('');
    setMalta(file);
    setLoading('malta');
    try {
      const parsed = await parseMalta(file);
      setMaltaParsed(parsed);
    } catch (e) {
      setErreur(`Erreur parsing Malta : ${e.message}`);
      setMaltaParsed(null);
    } finally { setLoading(null); }
  };

  // ── LANCEMENT RAPPROCHEMENT ──
  const canRapprocher = factureParsed && maltaParsed && handler;

  const lancerRapprochement = () => {
    if (!canRapprocher) return;
    const newRows = [];
    for (const [ltaK, data] of factureParsed.lignesParLTA.entries()) {
      const dossier = maltaParsed.indexLTA.get(ltaK) || null;
      let client = null, productType = null;
      if (dossier?.codeClient) {
        const info = clientIndex.get(String(dossier.codeClient).toUpperCase());
        if (info) { client = info.nom; productType = info.productType; }
      }
      const poids = dossier?.poids ?? null;
      const calc = (productType && poids != null)
        ? calcTarifAttendu(handler, productType, poids)
        : { total: null, detail: [], diag: dossier ? (productType ? 'pas_de_poids' : 'client_inconnu') : 'dossier_introuvable' };
      const htFacture = data.totalHT || 0;
      const tarifAtt = calc.total;
      let ecart = null, verdict = null;
      if (!dossier) verdict = 'miss';
      else if (tarifAtt == null) verdict = 'notarif';
      else {
        ecart = Math.round((htFacture - tarifAtt) * 100) / 100;
        const tol = Number(handler.toleranceEcart || 0);
        verdict = Math.abs(ecart) <= tol ? 'ok' : 'ko';
      }
      newRows.push({
        ltaKey: ltaK,
        ltaAffiche: data.ltaAffiche,
        dossierNum: dossier?.numDossier || null,
        codeClient: dossier?.codeClient || null,
        client,
        productType,
        poids,
        htFacture: Math.round(htFacture * 100) / 100,
        tarifAttendu: tarifAtt != null ? Math.round(tarifAtt * 100) / 100 : null,
        ecart,
        verdict,
        diag: calc.diag,
        detailCalc: calc.detail,
        rawLignes: data.lignes
      });
    }
    // Tri : KO d'abord, puis miss, puis notarif, puis OK
    const order = { ko:0, miss:1, notarif:2, ok:3 };
    newRows.sort((a,b) => (order[a.verdict] ?? 9) - (order[b.verdict] ?? 9));
    setRows(newRows);
  };

  // ── STATS ──
  const stats = useMemo(() => {
    const s = { total: rows.length, ok: 0, ko: 0, miss: 0, notarif: 0, htFact: 0, htAtt: 0, ecart: 0 };
    for (const r of rows) {
      s[r.verdict] = (s[r.verdict] || 0) + 1;
      s.htFact += r.htFacture || 0;
      if (r.tarifAttendu != null) s.htAtt += r.tarifAttendu;
      if (r.ecart != null) s.ecart += r.ecart;
    }
    s.htFact = Math.round(s.htFact * 100) / 100;
    s.htAtt = Math.round(s.htAtt * 100) / 100;
    s.ecart = Math.round(s.ecart * 100) / 100;
    return s;
  }, [rows]);

  // Édition ligne
  const updateRow = (i, patch) => {
    setRows(prev => {
      const next = [...prev];
      next[i] = { ...next[i], ...patch };
      // Recalcul verdict après édition
      if (patch.htFacture !== undefined || patch.productType !== undefined || patch.poids !== undefined) {
        const r = next[i];
        if (r.productType && r.poids != null) {
          const calc = calcTarifAttendu(handler, r.productType, r.poids);
          r.tarifAttendu = calc.total != null ? Math.round(calc.total*100)/100 : null;
          r.diag = calc.diag;
          r.detailCalc = calc.detail;
        }
        if (r.tarifAttendu != null) {
          r.ecart = Math.round((r.htFacture - r.tarifAttendu) * 100) / 100;
          const tol = Number(handler.toleranceEcart || 0);
          r.verdict = Math.abs(r.ecart) <= tol ? 'ok' : 'ko';
        } else {
          r.verdict = 'notarif';
          r.ecart = null;
        }
      }
      return next;
    });
  };

  // Export CSV
  const exportCSV = () => {
    const header = ['LTA','Dossier','Code Client','Client','Produit','Poids (kg)','HT Facturé (€)','Tarif Attendu (€)','Écart (€)','Verdict'];
    const lines = rows.map(r => [
      r.ltaAffiche, r.dossierNum || '', r.codeClient || '', r.client || '',
      r.productType ? (params.productTypes[r.productType]?.label || r.productType) : '',
      r.poids ?? '',
      (r.htFacture ?? '').toString().replace('.',','),
      (r.tarifAttendu ?? '').toString().replace('.',','),
      (r.ecart ?? '').toString().replace('.',','),
      r.verdict?.toUpperCase() || ''
    ].map(s => `"${String(s).replace(/"/g,'""')}"`).join(';'));
    const csv = [header.join(';'), ...lines].join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `verification_${handler?.id || 'handler'}_${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // STEP status
  const stepStatus = {
    s1: handler ? 'done' : 'active',
    s2: !handler ? 'pending' : (facture ? 'done' : 'active'),
    s3: !facture ? 'pending' : (malta ? 'done' : 'active'),
    s4: (!facture || !malta) ? 'pending' : (rows.length ? 'done' : 'active')
  };

  return React.createElement('div', { className: 'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Vérification de facture handler'),
        React.createElement('div', { key:'s', className:'page-sub' }, 'Choix handler → Facture → Malta → Rapprochement')
      ]),
      React.createElement('div', { key:'r', style:{display:'flex',gap:8} }, [
        rows.length ? React.createElement('button', { key:'exp', className:'btn btn-green', onClick: exportCSV }, '📥 Export CSV') : null,
        rows.length ? React.createElement('button', {
          key:'arc',
          className:'btn btn-sec',
          disabled: archiving,
          onClick: async () => {
            setArchiving(true);
            setArchiveMsg('');
            try {
              const res = await archiveRapprochement(handler, rows, stats);
              setArchiveMsg(res.ok ? `✓ Archivé sur Drive : ${res.filename}` : '⚠ Échec archivage Drive');
            } catch(e) { setArchiveMsg('⚠ Erreur : ' + e.message); }
            setArchiving(false);
            setTimeout(() => setArchiveMsg(''), 6000);
          }
        }, archiving ? '⏳ Archivage...' : '📦 Archiver sur Drive') : null
      ])
    ]),

    // STEPS
    React.createElement('div', { key:'steps', className:'steps' }, [
      React.createElement('div', { key:'1', className:'step ' + stepStatus.s1 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '1'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Handler'),
          React.createElement('div', { key:'b', className:'step-sub' }, handler ? handler.id.toUpperCase() : 'À choisir')
        ])
      ]),
      React.createElement('div', { key:'2', className:'step ' + stepStatus.s2 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '2'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Facture PDF'),
          React.createElement('div', { key:'b', className:'step-sub' }, factureParsed ? `${factureParsed.lignesParLTA.size} LTA` : 'En attente')
        ])
      ]),
      React.createElement('div', { key:'3', className:'step ' + stepStatus.s3 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '3'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Fichier Malta'),
          React.createElement('div', { key:'b', className:'step-sub' }, maltaParsed ? `${maltaParsed.dossiers.length} dossiers` : 'En attente')
        ])
      ]),
      React.createElement('div', { key:'4', className:'step ' + stepStatus.s4 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '4'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Rapprochement'),
          React.createElement('div', { key:'b', className:'step-sub' }, rows.length ? `${stats.ok} OK / ${stats.ko} KO` : 'En attente')
        ])
      ])
    ]),

    erreur ? React.createElement('div', { key:'err', className:'alert alert-err' }, [
      React.createElement('span', { key:'i', className:'alert-icon' }, '⚠️'),
      React.createElement('div', { key:'b', className:'alert-body' }, erreur)
    ]) : null,

    // STEP 1 : HANDLER
    React.createElement('div', { key:'s1', className:'card' }, [
      React.createElement('div', { key:'t', className:'card-title' }, '1 — Choisis le handler à contrôler'),
      React.createElement('div', { key:'pills', className:'handler-select-wrap' },
        params.handlers.map(h =>
          React.createElement('button', {
            key: h.id,
            className: 'handler-pill' + (h.id === handlerId ? ' active' : ''),
            onClick: () => setHandlerId(h.id)
          }, [
            React.createElement('span', { key:'n' }, h.nom),
            (h.prefixesAWB?.length
              ? React.createElement('span', { key:'p', className:'handler-pill-prefix' }, h.prefixesAWB.join(' · '))
              : React.createElement('span', { key:'p', className:'handler-pill-prefix' }, '⚠ pas de préfixe')
            )
          ])
        )
      )
    ]),

    // STEPS 2+3 : UPLOADS
    React.createElement('div', { key:'ups', className:'upload-grid' }, [
      React.createElement(UploadZone, {
        key:'fact',
        title: '2 — Facture handler (PDF)',
        subtitle: handler ? `Préfixes ${handler.prefixesAWB.join(' · ')}` : 'Sélectionne un handler d\'abord',
        icon: '📄',
        file: facture,
        loading: loading === 'facture',
        accept: '.pdf',
        disabled: !handler,
        onFile: onUploadFacture,
        onClear: () => { setFacture(null); setFactureParsed(null); setRows([]); },
        statusMsg: factureParsed ? `${factureParsed.lignesParLTA.size} LTA détectées` : null
      }),
      React.createElement(UploadZone, {
        key:'malta',
        title: '3 — Fichier Malta (XLS)',
        subtitle: 'Cols A(date), B(dossier), C(LTA), H(client), K(poids) — 3 lignes d\'en-tête',
        icon: '📊',
        file: malta,
        loading: loading === 'malta',
        accept: '.xls,.xlsx',
        onFile: onUploadMalta,
        onClear: () => { setMalta(null); setMaltaParsed(null); setRows([]); },
        statusMsg: maltaParsed ? `${maltaParsed.dossiers.length} dossiers` : null
      })
    ]),

    // BOUTON RAPPROCHEMENT
    canRapprocher ? React.createElement('div', { key:'run', style:{textAlign:'center',marginBottom:18} },
      React.createElement('button', {
        className:'btn btn-primary',
        style:{padding:'14px 32px',fontSize:14},
        onClick: lancerRapprochement
      }, rows.length ? '🔄 Relancer le rapprochement' : '▶ Lancer le rapprochement')
    ) : null,

    // RÉSULTATS
    rows.length ? React.createElement('div', { key:'res-wrap' }, [
      archiveMsg ? React.createElement('div', {
        key:'arcmsg',
        className: 'alert ' + (archiveMsg.startsWith('✓') ? 'alert-info' : 'alert-warn'),
        style: { marginBottom: 12 }
      }, [
        React.createElement('span', { key:'i', className:'alert-icon' }, archiveMsg.startsWith('✓') ? '✓' : '⚠'),
        React.createElement('div', { key:'b', className:'alert-body' }, archiveMsg)
      ]) : null,
      React.createElement(ResultsSection, {
        key:'res',
        rows, stats, params, handler,
        onUpdateRow: updateRow,
        showDebug, setShowDebug,
        factureParsed
      })
    ]) : null
  ]);
}

// ═══════════════════════════════════════════════════════════════════
// COMPOSANT UPLOAD ZONE
// ═══════════════════════════════════════════════════════════════════
function UploadZone({ title, subtitle, icon, file, loading, accept, disabled, onFile, onClear, statusMsg }) {
  const inpRef = useRef(null);
  const [drag, setDrag] = useState(false);

  const onDrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    setDrag(false);
    if (disabled) return;
    const f = e.dataTransfer.files?.[0];
    if (f) onFile(f);
  };

  return React.createElement('div', {
    className: 'upload-zone' + (drag ? ' drag' : '') + (file ? ' loaded' : ''),
    style: disabled ? { opacity: .5, cursor: 'not-allowed' } : null,
    onClick: () => !disabled && !loading && inpRef.current?.click(),
    onDragOver: (e) => { e.preventDefault(); setDrag(true); },
    onDragLeave: (e) => { e.preventDefault(); setDrag(false); },
    onDrop
  }, [
    file && !loading ? React.createElement('button', {
      key:'clr', className:'upload-clear',
      onClick: (e) => { e.stopPropagation(); onClear(); }
    }, '✕') : null,
    loading
      ? React.createElement('div', { key:'ld', className:'spinner' })
      : React.createElement('div', { key:'ic', className:'upload-icon' }, file ? '✓' : icon),
    React.createElement('div', { key:'t', className:'upload-title' }, title),
    React.createElement('div', { key:'s', className:'upload-sub' }, subtitle),
    file ? React.createElement('div', { key:'f', className:'upload-fname' }, file.name) : null,
    statusMsg ? React.createElement('div', { key:'st', style:{fontSize:11,color:'var(--green)',marginTop:6,fontFamily:'var(--mono)'} }, statusMsg) : null,
    React.createElement('input', {
      key:'inp', ref: inpRef, type:'file', accept,
      style: { display:'none' },
      onChange: (e) => { const f = e.target.files?.[0]; if (f) onFile(f); e.target.value=''; }
    })
  ]);
}

// ═══════════════════════════════════════════════════════════════════
// COMPOSANT RÉSULTATS
// ═══════════════════════════════════════════════════════════════════
function ResultsSection({ rows, stats, params, handler, onUpdateRow, showDebug, setShowDebug, factureParsed }) {
  const [expandedRow, setExpandedRow] = useState(null);

  return React.createElement('div', null, [
    // Stats
    React.createElement('div', { key:'stats', className:'stats-grid' }, [
      React.createElement(Stat, { key:'tot', label:'LTA TOTAL', value: stats.total, cls:'c-amber' }),
      React.createElement(Stat, { key:'ok', label:'OK', value: stats.ok, cls:'c-green' }),
      React.createElement(Stat, { key:'ko', label:'ÉCART', value: stats.ko, cls:'c-red' }),
      React.createElement(Stat, { key:'ms', label:'SANS DOSSIER', value: stats.miss, cls:'c-orange' }),
      React.createElement(Stat, { key:'nt', label:'SANS TARIF', value: stats.notarif, cls:'c-purple' }),
      React.createElement(Stat, { key:'hf', label:'HT FACTURÉ', value: fmtEur(stats.htFact), cls:'c-amber', sub: '' }),
      React.createElement(Stat, { key:'ec', label:'ÉCART TOTAL', value: fmtEur(stats.ecart), cls: stats.ecart >= 0 ? 'c-red' : 'c-green' })
    ]),

    // Table
    React.createElement('div', { key:'tab', className:'rec-table-wrap' },
      React.createElement('table', { className:'rec-table' }, [
        React.createElement('thead', { key:'h' },
          React.createElement('tr', null, [
            React.createElement('th', { key:'1' }, 'LTA'),
            React.createElement('th', { key:'2' }, 'Dossier Malta'),
            React.createElement('th', { key:'3' }, 'Client'),
            React.createElement('th', { key:'4' }, 'Produit'),
            React.createElement('th', { key:'5', style:{textAlign:'right'} }, 'Poids'),
            React.createElement('th', { key:'6', style:{textAlign:'right'} }, 'HT Facturé'),
            React.createElement('th', { key:'7', style:{textAlign:'right'} }, 'HT Attendu'),
            React.createElement('th', { key:'8', style:{textAlign:'right'} }, 'Écart'),
            React.createElement('th', { key:'9', style:{textAlign:'center'} }, 'Verdict'),
            React.createElement('th', { key:'10', style:{textAlign:'center'} }, '🔍')

function PageHandlers({ params, setParams }) {
  const [expandedH, setExpandedH] = useState(params.handlers[0]?.id || null);
  const [activeMod, setActiveMod] = useState({}); // {handlerId: 'cargo'|'seafood'|...}

  const getMod = (hid) => activeMod[hid] || 'cargo';
  const setMod = (hid, m) => setActiveMod(p => ({ ...p, [hid]: m }));

  const updateHandler = (hid, patch) => {
    setParams(prev => ({ ...prev, handlers: prev.handlers.map(h => h.id === hid ? { ...h, ...patch } : h) }));
  };

  const updateModuleLignes = (hid, mod, lignes) => {
    setParams(prev => ({
      ...prev,
      handlers: prev.handlers.map(h => h.id === hid
        ? { ...h, modules: { ...h.modules, [mod]: lignes } }
        : h)
    }));
  };

  const addHandler = () => {
    const id = 'h_' + Date.now();
    setParams(prev => ({
      ...prev,
      handlers: [...prev.handlers, {
        id, nom: 'Nouveau handler', prefixesAWB: [], toleranceEcart: 2,
        modules: { cargo:[], seafood:[], avi:[], fl:[] }
      }]
    }));
    setExpandedH(id);
  };

  const removeHandler = (hid) => {
    if (!confirm('Supprimer ce handler ?')) return;
    setParams(prev => ({ ...prev, handlers: prev.handlers.filter(h => h.id !== hid) }));
  };

  return React.createElement('div', { className:'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Handlers & Grilles tarifaires'),
        React.createElement('div', { key:'s', className:'page-sub' }, 'Préfixes LTA autorisés + grille tarifaire par type de produit')
      ]),
      React.createElement('button', {
        key:'add', className:'btn btn-primary', onClick: addHandler
      }, '+ Nouveau handler')
    ]),
    React.createElement('div', { key:'list' },
      params.handlers.map(h => React.createElement(HandlerCard, {
        key: h.id,
        handler: h,
        expanded: expandedH === h.id,
        onToggle: () => setExpandedH(expandedH === h.id ? null : h.id),
        activeMod: getMod(h.id),
        setActiveMod: (m) => setMod(h.id, m),
        onUpdate: (patch) => updateHandler(h.id, patch),
        onUpdateLignes: (mod, lignes) => updateModuleLignes(h.id, mod, lignes),
        onRemove: () => removeHandler(h.id)
      }))
    )
  ]);
}

// ═══════════════════════════════════════════════════════════════════
function PageClients({ params, setParams }) {
  const updateClients = (pt, clients) => {
    setParams(prev => ({
      ...prev,
      productTypes: {
        ...prev.productTypes,
        [pt]: { ...prev.productTypes[pt], clients }
      }
    }));
  };

  const addClient = (pt) => {
    updateClients(pt, [...(params.productTypes[pt].clients || []), { code: '', nom: '' }]);
  };

  const updateClient = (pt, i, patch) => {
    const next = [...(params.productTypes[pt].clients || [])];
    next[i] = { ...next[i], ...patch };
    updateClients(pt, next);
  };

  const removeClient = (pt, i) => {
    updateClients(pt, (params.productTypes[pt].clients || []).filter((_, k) => k !== i));
  };

  // Import CSV
  const fileRef = useRef(null);
  const onImportCSV = async (e, pt) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const text = await f.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const clients = [];
    for (const ln of lines) {
      // ignore entête si contient "code"
      if (/code/i.test(ln) && clients.length === 0) continue;
      const parts = ln.split(/[;,\t]/).map(s => s.trim().replace(/^"|"$/g, ''));
      if (parts.length >= 2) clients.push({ code: parts[0].toUpperCase(), nom: parts[1] });
      else if (parts.length === 1) clients.push({ code: parts[0].toUpperCase(), nom: '' });
    }
    if (clients.length) updateClients(pt, [...(params.productTypes[pt].clients || []), ...clients]);
    e.target.value = '';
  };

  return React.createElement('div', { className:'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Clients par type de produit'),
        React.createElement('div', { key:'s', className:'page-sub' }, 'Mappe chaque code compta Malta au bon type de produit')
      ])
    ]),
    React.createElement('div', { key:'info', className:'alert alert-info' }, [
      React.createElement('span', { key:'i', className:'alert-icon' }, 'ℹ️'),
      React.createElement('div', { key:'b', className:'alert-body' }, [
        React.createElement('div', { key:'t', className:'alert-title' }, 'Import CSV possible'),
        React.createElement('div', { key:'d' }, 'Format : code;nom (une ligne par client). Tu peux aussi saisir manuellement.')
      ])
    ]),
    ...Object.entries(params.productTypes).map(([pt, pd]) =>
      React.createElement('div', { key: pt, className:'client-card' }, [
        React.createElement('div', { key:'h', className:'client-hdr' }, [
          React.createElement('div', { key:'l', className:'client-hdr-left' }, [
            React.createElement('span', { key:'i', className:'client-hdr-icon' }, pd.icon),
            React.createElement('div', { key:'t' }, [
              React.createElement('span', { key:'1', className:'client-hdr-title' }, pd.label),
              React.createElement('span', { key:'2', className:'client-hdr-count' }, ` · ${pd.clients?.length || 0} clients`)
            ])
          ]),
          React.createElement('div', { key:'r', style:{display:'flex',gap:6} }, [
            React.createElement('label', { key:'imp', className:'btn btn-sec btn-sm', style:{cursor:'pointer'} }, [
              React.createElement('span', { key:'l' }, '📥 Import CSV'),
              React.createElement('input', {
                key:'i', type:'file', accept:'.csv,.txt', style:{display:'none'},
                onChange: (e) => onImportCSV(e, pt)
              })
            ]),
            React.createElement('button', {
              key:'add', className:'btn btn-primary btn-sm', onClick: () => addClient(pt)
            }, '+ Client')
          ])
        ]),
        React.createElement('div', { key:'list', className:'client-list' },
          (pd.clients || []).length === 0
            ? [React.createElement('div', { key:'e', style:{gridColumn:'1/-1',textAlign:'center',color:'var(--muted)',padding:20,fontSize:12} }, 'Aucun client — ajoute-les manuellement ou importe un CSV')]
            : pd.clients.map((c, i) =>
                React.createElement('div', { key:i, className:'client-row' }, [
                  React.createElement('input', {
                    key:'c', placeholder:'CODE',
                    value: c.code || '',
                    onChange: (e) => updateClient(pt, i, { code: e.target.value.toUpperCase() })
                  }),
                  React.createElement('input', {
                    key:'n', className:'client-name-inp', placeholder:'Nom client',
                    value: c.nom || '',
                    onChange: (e) => updateClient(pt, i, { nom: e.target.value })
                  }),
                  React.createElement('button', {
                    key:'r', className:'btn btn-danger btn-xs',
                    onClick: () => removeClient(pt, i)
                  }, '🗑')
                ])
              )
        )
      ])
    )
  ]);
}

// ═══════════════════════════════════════════════════════════════════
// MOUNT
// ═══════════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
