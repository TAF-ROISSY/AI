<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF VERICHECK v4.7 — Auto-ajout client inconnu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e17;--surface:#111420;--surface2:#181c2e;--surface3:#1e2238;
  --border:#1f2440;--border2:#2a304f;--border3:#353d66;
  --amber:#f59e0b;--amber2:#fbbf24;--amber-bg:rgba(245,158,11,.08);
  --green:#10b981;--green-bg:rgba(16,185,129,.08);
  --red:#ef4444;--red-bg:rgba(239,68,68,.08);
  --orange:#f97316;--orange-bg:rgba(249,115,22,.08);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.08);
  --purple:#a855f7;--purple-bg:rgba(168,85,247,.08);
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:56px;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0}
.nav-logo-badge{background:var(--amber);color:#000;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1.5px}
.nav-title{font-size:15px;font-weight:800;letter-spacing:2px}
.nav-sub{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:1.5px;margin-top:1px}
.nav-links{display:flex;gap:2px;flex:1}
.nbtn{background:none;border:none;color:var(--muted2);cursor:pointer;padding:8px 16px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.5px;transition:all .15s;display:flex;align-items:center;gap:7px}
.nbtn:hover{background:var(--surface2);color:var(--text)}
.nbtn.active{background:var(--surface2);color:var(--amber)}
.nbadge{background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;font-weight:700}
.nav-right{display:flex;align-items:center;gap:12px}
.version-tag{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amber-bg);padding:3px 9px;border-radius:4px;border:1px solid rgba(245,158,11,.3);font-weight:700;letter-spacing:.5px}
.drive-sync{display:flex;align-items:center;gap:7px;font-size:10px;font-family:var(--mono);color:var(--muted2);padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;letter-spacing:.5px;cursor:pointer;transition:all .15s}
.drive-sync:hover{border-color:var(--border3)}
.drive-sync.ok{color:var(--green);border-color:rgba(16,185,129,.3)}
.drive-sync.saving{color:var(--amber);border-color:rgba(245,158,11,.35)}
.drive-sync.error{color:var(--red);border-color:rgba(239,68,68,.3)}
.drive-sync.dirty{color:var(--orange);border-color:rgba(249,115,22,.4);background:rgba(249,115,22,.08)}
.drive-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.drive-sync.saving .drive-dot{animation:pulse 1s infinite}
.drive-sync.dirty .drive-dot{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-save{background:var(--green);color:#000;padding:7px 14px;font-size:12px;border:none;border-radius:6px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;font-family:var(--sans);letter-spacing:.5px}
.btn-save:hover{background:#0f9d72;transform:translateY(-1px)}
.btn-save:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed;transform:none}
.btn-exit{background:var(--surface2);color:var(--text);padding:7px 14px;font-size:12px;border:1px solid var(--border2);border-radius:6px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;font-family:var(--sans);letter-spacing:.5px}
.btn-exit:hover{border-color:var(--red);color:var(--red)}
.btn-exit:disabled{opacity:.5;cursor:not-allowed}

/* LAYOUT */
.page{padding:24px 32px;max-width:1500px;margin:0 auto}
.page-hdr{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.page-title{font-size:22px;font-weight:800;letter-spacing:1px}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* BUTTONS */
.btn{border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);font-weight:700;letter-spacing:.5px;transition:all .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary{background:var(--amber);color:#000;padding:11px 22px;font-size:13px}
.btn-primary:hover{background:var(--amber2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,.3)}
.btn-primary:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none}
.btn-sec{background:var(--surface2);color:var(--text);padding:9px 18px;font-size:13px;border:1px solid var(--border2)}
.btn-sec:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--red-bg);color:var(--red);padding:6px 12px;font-size:12px;border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-ghost{background:none;color:var(--muted2);padding:7px 12px;font-size:12px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-green{background:var(--green-bg);color:var(--green);padding:9px 18px;font-size:13px;border:1px solid rgba(16,185,129,.35)}
.btn-green:hover{background:rgba(16,185,129,.2)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.card-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* STEPS */
.steps{display:flex;gap:6px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;overflow-x:auto}
.step{flex:1;min-width:150px;padding:12px 16px;border-radius:7px;display:flex;align-items:center;gap:10px;transition:all .15s;cursor:default}
.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;flex-shrink:0}
.step-lbl{font-size:12px;font-weight:700;letter-spacing:.5px}
.step-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.step.pending .step-num{background:var(--surface3);color:var(--muted)}
.step.pending .step-lbl{color:var(--muted2)}
.step.active{background:var(--amber-bg);border:1px solid rgba(245,158,11,.4)}
.step.active .step-num{background:var(--amber);color:#000}
.step.active .step-lbl{color:var(--amber)}
.step.done{background:var(--green-bg);border:1px solid rgba(16,185,129,.4)}
.step.done .step-num{background:var(--green);color:#000}
.step.done .step-lbl{color:var(--green)}

/* UPLOAD */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:28px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);position:relative;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.upload-zone:hover,.upload-zone.drag{border-color:var(--amber);background:var(--amber-bg)}
.upload-zone.loaded{border-color:var(--green);border-style:solid;background:var(--green-bg)}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-title{font-size:14px;font-weight:700;margin-bottom:4px}
.upload-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.upload-fname{font-family:var(--mono);font-size:11px;color:var(--green);margin-top:10px;background:rgba(16,185,129,.12);padding:4px 11px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-clear{position:absolute;top:10px;right:10px;background:var(--red-bg);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:var(--mono)}

/* HANDLER SELECT */
.handler-select-wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.handler-pill{padding:10px 20px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.handler-pill:hover{border-color:var(--border3)}
.handler-pill.active{background:var(--amber);color:#000;border-color:var(--amber)}
.handler-pill-prefix{font-family:var(--mono);font-size:10px;opacity:.7;padding:2px 6px;background:rgba(0,0,0,.15);border-radius:3px}
.handler-pill.active .handler-pill-prefix{background:rgba(0,0,0,.2)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-val{font-size:22px;font-weight:800;font-family:var(--mono);line-height:1}
.stat-sub{font-size:10px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.c-green{color:var(--green)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-orange{color:var(--orange)}.c-blue{color:var(--blue)}.c-muted{color:var(--muted2)}.c-purple{color:var(--purple)}

/* TABLE */
.rec-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:auto;margin-bottom:14px}
.rec-table{width:100%;border-collapse:collapse;min-width:1200px}
.rec-table th{background:var(--surface2);color:var(--muted);font-size:10px;letter-spacing:1.5px;font-weight:700;padding:11px 10px;text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;position:sticky;top:0;z-index:2}
.rec-table td{padding:10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.rec-table tr:hover td{background:var(--surface2)}
.rec-table tr.ok-row{background:rgba(16,185,129,.04)}
.rec-table tr.ko-row{background:rgba(239,68,68,.04)}
.rec-table tr.miss-row{background:rgba(249,115,22,.04)}
.td-lta{font-family:var(--mono);font-weight:700;color:var(--amber)}
.td-mono{font-family:var(--mono);font-size:11px}
.td-client{font-weight:600;font-size:12px}
.td-right{text-align:right;font-family:var(--mono);font-weight:600}
.td-center{text-align:center}
.verdict{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:var(--mono)}
.verdict-ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.verdict-ko{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.verdict-miss{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.verdict-notarif{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(168,85,247,.3)}

.inp-inline{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 9px;border-radius:5px;font-family:var(--mono);font-size:12px;width:90px;text-align:right}
.inp-inline:focus{outline:none;border-color:var(--amber)}
.sel-inline{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 8px;border-radius:5px;font-size:11px;font-family:var(--sans)}
.sel-inline:focus{outline:none;border-color:var(--amber)}

.prod-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:.3px}
.prod-cargo{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.3)}
.prod-seafood{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.prod-avi{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3)}
.prod-fl{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}

/* FORM INPUTS */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.inp{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:9px 13px;border-radius:7px;font-family:var(--sans);font-size:13px;width:100%}
.inp:focus{outline:none;border-color:var(--amber)}
.inp-mono{font-family:var(--mono);font-size:12px}

/* TABS (handlers/clients pages) */
.subtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:5px;border-radius:9px;margin-bottom:16px;flex-wrap:wrap}
.subtab{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted2);transition:all .15s;border:none;background:none;font-family:var(--sans);display:flex;align-items:center;gap:7px}
.subtab:hover{color:var(--text);background:var(--surface2)}
.subtab.active{background:var(--amber);color:#000}
.subtab-badge{font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,.15);font-family:var(--mono)}
.subtab.active .subtab-badge{background:rgba(0,0,0,.25)}

/* HANDLERS PAGE */
.handler-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.handler-hdr{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:14px;flex-wrap:wrap}
.handler-hdr-info{flex:1;min-width:200px}
.handler-name{font-size:15px;font-weight:800;margin-bottom:4px}
.handler-prefix-list{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.prefix-chip{font-family:var(--mono);font-size:10px;padding:2px 7px;background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,.3);border-radius:3px;font-weight:700}
.handler-hdr-actions{display:flex;gap:6px}
.handler-body{padding:16px 20px}
.mod-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px}
.mod-tab{padding:6px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted2);background:none;border:1px solid transparent;font-family:var(--sans)}
.mod-tab:hover{background:var(--surface2)}
.mod-tab.active{background:var(--surface3);color:var(--amber);border-color:rgba(245,158,11,.4)}
.mod-tab-count{font-family:var(--mono);font-size:9px;margin-left:5px;opacity:.7}

.ligne-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.ligne-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.ligne-lbl{font-weight:700;font-size:13px}
.ligne-type{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface3);padding:2px 7px;border-radius:3px;margin-left:8px}
.grille-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
.grille-table th{background:var(--surface3);color:var(--muted);padding:5px 8px;text-align:left;font-size:10px;letter-spacing:1px;font-weight:700}
.grille-table td{padding:5px 8px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.grille-table input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:3px 7px;border-radius:4px;font-family:var(--mono);font-size:11px;width:90px}
.grille-table input:focus{outline:none;border-color:var(--amber)}

/* CLIENTS PAGE */
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.client-hdr{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--surface2)}
.client-hdr-left{display:flex;align-items:center;gap:12px}
.client-hdr-icon{font-size:20px}
.client-hdr-title{font-size:14px;font-weight:800}
.client-hdr-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.client-list{padding:12px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.client-row{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
.client-row input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 8px;border-radius:4px;font-family:var(--mono);font-size:11px;width:100%}
.client-row input.client-name-inp{font-family:var(--sans);font-size:12px}
.client-row input:focus{outline:none;border-color:var(--amber)}

/* ALERTS */
.alert{border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px;font-size:12px}
.alert-err{background:var(--red-bg);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.alert-warn{background:var(--orange-bg);border:1px solid rgba(249,115,22,.3);color:var(--orange)}
.alert-info{background:var(--blue-bg);border:1px solid rgba(59,130,246,.3);color:var(--blue)}
.alert-icon{font-size:16px;flex-shrink:0}
.alert-body{flex:1;line-height:1.5}
.alert-title{font-weight:700;margin-bottom:3px;font-size:12px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column}
.modal-hdr{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:14px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.modal-body{padding:20px 22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);position:sticky;bottom:0;flex-wrap:wrap}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;padding:4px 8px;line-height:1;border-radius:4px}
.modal-close:hover{color:var(--red);background:var(--surface2)}

/* DETAIL MODAL SPECIFIC */
.dm-kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px}
.dm-kv-item{display:flex;flex-direction:column;gap:3px}
.dm-kv-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.dm-kv-val{font-size:13px;font-weight:700;color:var(--text);font-family:var(--mono)}
.dm-section{margin-bottom:18px}
.dm-section-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:8px}

<script>
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════
// PDF.js WORKER
// ═══════════════════════════════════════════════════════════════════
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ═══════════════════════════════════════════════════════════════════
// STORAGE — on réutilise les mêmes clés que v3 pour garder les data
// ═══════════════════════════════════════════════════════════════════
const LS_P = 'taf_vc3_params';
const LS_SESSION_V4 = 'taf_vc4_session';
const LS_LITIGES_V4 = 'taf_vc4_litiges';

// ═══════════════════════════════════════════════════════════════════
// DRIVE — proxy Apps Script de l'écosystème TAF
// ═══════════════════════════════════════════════════════════════════
const PROXY = 'https://script.google.com/macros/s/AKfycbyi-yM6BSllYmM9Kmb21-C935rXPrIcwbUCXDAKIP6sADk9XwnezSTmwGmKHSAL7GH2/exec';
const DRIVE_FOLDER = '143DZMp79_EfrVAjyOMquBU0L-JXlKdnF';
const DRIVE_PARAMS_FILE = 'vericheck_v4_params.json';
const DRIVE_ARCHIVES_INDEX = 'vericheck_v4_archives_index.json';
const DRIVE_ARCHIVE_PREFIX = 'vericheck_v4_archive_';

function safeB64(str) {
  try { return btoa(unescape(encodeURIComponent(str))); }
  catch { return btoa(str.replace(/[^\x00-\xFF]/g, '?')); }
}

async function driveUpload(filename, data) {
  try {
    const json = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    const b64 = safeB64(json);
    const body = JSON.stringify({
      action: 'uploadPDF', filename, mimeType: 'application/json',
      base64: b64, folder: DRIVE_FOLDER
    });
    try {
      const resp = await fetch(PROXY, { method:'POST', redirect:'follow', body });
      if (resp.ok || resp.type === 'opaque') return true;
    } catch (_) {}
    await fetch(PROXY, { method:'POST', mode:'no-cors', body });
    return true;
  } catch (e) {
    console.warn('[VC4] driveUpload error:', e.message);
    return false;
  }
}

async function driveRead(filename) {
  const folder = DRIVE_FOLDER;
  const strategies = [
    () => fetch(`${PROXY}?action=read&file=${encodeURIComponent(filename)}&folder=${folder}`, { method:'GET', redirect:'follow' }),
    () => fetch(`${PROXY}?action=read&filename=${encodeURIComponent(filename)}&folder=${folder}`, { method:'GET', redirect:'follow' }),
    () => fetch(`${PROXY}?action=getFile&file=${encodeURIComponent(filename)}&folder=${folder}`, { method:'GET', redirect:'follow' }),
    () => fetch(PROXY, { method:'POST', redirect:'follow', body: JSON.stringify({ action:'read', file: filename, folder }) })
  ];
  for (let i = 0; i < strategies.length; i++) {
    try {
      const resp = await strategies[i]();
      const text = resp.type === 'opaque' ? null : await resp.text().catch(() => null);
      if (!text || text.trim().length < 5) continue;
      if (text.trim().startsWith('<!') || text.trim().startsWith('<html')) continue;
      try {
        const data = JSON.parse(text);
        if (data?.error) continue;
        console.log(`[VC4] driveRead OK "${filename}"`);
        return data;
      } catch (_) { continue; }
    } catch (e) { /* next */ }
  }
  console.warn(`[VC4] driveRead: fichier "${filename}" introuvable ou inaccessible`);
  return null;
}

// ═══════════════════════════════════════════════════════════════════
// PARAMS PAR DÉFAUT (seed si vide)
// ═══════════════════════════════════════════════════════════════════
const DEF_PARAMS = {
  productTypes: {
    cargo:   { label: 'Cargo Général',        icon: '📦', cls: 'prod-cargo',   clients: [] },
    seafood: { label: 'Seafood / Poisson',    icon: '🐟', cls: 'prod-seafood', clients: [] },
    avi:     { label: 'Animaux Vivants',      icon: '🐾', cls: 'prod-avi',     clients: [] },
    fl:      { label: 'Fruits & Légumes',     icon: '🍎', cls: 'prod-fl',      clients: [] }
  },
  handlers: [
    {
      id: 'wfs',
      nom: 'WFS — Worldwide Flight Services',
      prefixesAWB: ['074', '020'],
      toleranceEcart: 2,
      modules: { cargo: [], seafood: [], avi: [], fl: [] }
    },
    {
      id: 'afch',
      nom: 'Air France Cargo Handling',
      prefixesAWB: ['057', '125'],
      toleranceEcart: 1,
      modules: {
        cargo: [{
          id: 'af_arr', libelle: 'FRAIS ARRIVÉE', type: 'mise_dispo',
          params: { grille: [
            { min: 0, max: 1000, montant: 180 },
            { min: 1001, max: 2000, montant: 235 },
            { min: 2001, max: 3000, montant: 280 },
            { min: 3001, max: 4000, montant: 310 },
            { min: 4001, max: 5000, montant: 350 },
            { min: 5001, max: 6000, montant: 390 },
            { min: 6001, max: 99999, montant: 440 }
          ]},
          actif: true
        }],
        seafood: [], avi: [], fl: []
      }
    },
    {
      id: 'gsh',
      nom: 'GSH — Ground Service Handling',
      prefixesAWB: [],
      toleranceEcart: 2,
      modules: { cargo: [], seafood: [], avi: [], fl: [] }
    }
  ]
};

// ═══════════════════════════════════════════════════════════════════
// MIGRATION : s'assurer que la structure chargée est complète
// ═══════════════════════════════════════════════════════════════════
function migrateParams(raw) {
  const p = JSON.parse(JSON.stringify(raw || {}));
  // productTypes
  if (!p.productTypes) p.productTypes = DEF_PARAMS.productTypes;
  ['cargo','seafood','avi','fl'].forEach(k => {
    if (!p.productTypes[k]) p.productTypes[k] = DEF_PARAMS.productTypes[k];
    if (!Array.isArray(p.productTypes[k].clients)) p.productTypes[k].clients = [];
    // normalize clients : { code, nom, exclusions }
    p.productTypes[k].clients = p.productTypes[k].clients
      .filter(c => c && (c.code || c.codeMalta || c.nom))
      .map(c => ({
        code: String(c.code ?? c.codeMalta ?? '').trim().toUpperCase(),
        nom:  String(c.nom ?? '').trim(),
        exclusions: Array.isArray(c.exclusions)
          ? c.exclusions.map(s => String(s).trim()).filter(Boolean)
          : []
      }))
      .filter(c => c.code || c.nom);
  });
  // handlers
  if (!Array.isArray(p.handlers) || !p.handlers.length) p.handlers = DEF_PARAMS.handlers;
  p.handlers = p.handlers.map(h => {
    const nh = { ...h };
    if (!nh.modules) nh.modules = { cargo: [], seafood: [], avi: [], fl: [] };
    ['cargo','seafood','avi','fl'].forEach(k => {
      if (!Array.isArray(nh.modules[k])) nh.modules[k] = [];
    });
    // si ancienne structure lignesT, on la glisse dans cargo
    if (Array.isArray(nh.lignesT) && !nh.modules.cargo.length) {
      nh.modules.cargo = nh.lignesT;
    }
    if (!Array.isArray(nh.prefixesAWB)) nh.prefixesAWB = [];
    if (nh.toleranceEcart == null) nh.toleranceEcart = 2;
    return nh;
  });
  return p;
}

function loadParams() {
  try {
    const raw = localStorage.getItem(LS_P);
    if (!raw) return migrateParams(DEF_PARAMS);
    return migrateParams(JSON.parse(raw));
  } catch (e) {
    console.warn('loadParams error', e);
    return migrateParams(DEF_PARAMS);
  }
}
function saveParamsLocal(p) {
  try {
    const stamped = { ...p, _updatedAt: Date.now() };
    localStorage.setItem(LS_P, JSON.stringify(stamped));
    return stamped;
  } catch(e){ console.warn(e); return p; }
}

// ═══════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════
const fmtEur = v => v == null || isNaN(Number(v)) ? '—'
  : new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', minimumFractionDigits:2 }).format(v);
const fmtKg  = v => v == null || isNaN(Number(v)) ? '—' : `${Number(v).toLocaleString('fr-FR')} kg`;
const escHTML = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/**
 * Normalise une LTA en 11 chiffres.
 * Malta : "xxx xxxx xxxx" (11 chiffres avec espaces)
 * Facture : "xxx-xxxxxxx" (3+7=10) ou "xxx-xxxxxxxx" (3+8=11)
 * On retire tout sauf les chiffres. Si 11 chiffres → tel quel. Si 10 → on essaiera avec ou sans check digit.
 */
function normalizeLTA(raw) {
  if (raw == null) return '';
  const digits = String(raw).replace(/\D/g, '');
  return digits;
}

/**
 * Clé de matching : 10 chiffres (préfixe 3 + serial 7 SANS check digit)
 * Malta 11 chiffres → on retire le dernier (check digit)
 * Facture 10 chiffres → tel quel
 * Facture 11 chiffres → on retire le dernier
 */
function ltaKey(raw) {
  const d = normalizeLTA(raw);
  if (d.length === 11) return d.slice(0, 10);
  if (d.length === 10) return d;
  if (d.length >= 10)  return d.slice(0, 10); // au cas où
  return d;
}

/**
 * Affichage LTA standard : xxx-xxxxxxxx (préfixe-serial 8 digits)
 */
function fmtLTA(raw) {
  const d = normalizeLTA(raw);
  if (d.length === 11) return `${d.slice(0,3)}-${d.slice(3)}`;
  if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3)}`;
  return raw;
}

function parseNumber(s) {
  if (s == null) return null;
  if (typeof s === 'number') return isNaN(s) ? null : s;
  let str = String(s).trim();
  if (!str) return null;
  // Retire les espaces (incl. nbsp) et le symbole €
  str = str.replace(/[€\s\u00a0]/g, '');
  // Remplace virgule décimale par point
  if (str.includes(',') && !str.includes('.')) {
    str = str.replace(',', '.');
  } else if (str.includes(',') && str.includes('.')) {
    // Format "1,234.56" → on retire les virgules
    str = str.replace(/,/g, '');
  }
  const n = Number(str);
  return isNaN(n) ? null : n;
}

// ═══════════════════════════════════════════════════════════════════
// CALCUL TARIF (un handler + un module + un poids)
// ═══════════════════════════════════════════════════════════════════
function calcLigneMontant(lt, poids) {
  if (!lt?.actif || !lt.params || poids == null) return null;
  const p = lt.params;
  switch (lt.type) {
    case 'fixe': return p.montant != null ? Number(p.montant) : null;
    case 'kg_brut': {
      if (p.taux == null) return null;
      const v = Number(p.taux) * poids;
      return p.mini ? Math.max(v, Number(p.mini)) : v;
    }
    case 'mise_dispo': {
      const g = (p.grille || []).find(g => poids >= g.min && poids <= g.max);
      return g ? Number(g.montant) : null;
    }
    case 'uc_tranche': {
      if (p.taux_uc == null) return null;
      const tr = Number(p.tranche) || 150;
      return Math.ceil(poids / tr) * Number(p.taux_uc);
    }
    case 'uc_tranche_fixe': {
      const tr = Number(p.tranche) || 150;
      const uc = p.taux_uc != null ? Math.ceil(poids / tr) * Number(p.taux_uc) : 0;
      const fixe = p.montant != null ? Number(p.montant) : 0;
      return uc + fixe;
    }
    default: return p.montant != null ? Number(p.montant) : null;
  }
}

function calcTarifAttendu(handler, productType, poids) {
  if (!handler || !productType || poids == null) return { total: null, detail: [], diag: 'params_incomplets' };
  const lignes = handler.modules?.[productType] || [];
  if (!lignes.length) return { total: null, detail: [], diag: 'aucun_tarif_configure' };
  let total = 0, someOk = false;
  const detail = [];
  for (const lt of lignes) {
    if (!lt.actif) continue;
    const m = calcLigneMontant(lt, poids);
    if (m != null) { total += m; someOk = true; detail.push({ libelle: lt.libelle, montant: m }); }
    else detail.push({ libelle: lt.libelle, montant: null, err: 'incomplet' });
  }
  return someOk
    ? { total, detail, diag: 'ok' }
    : { total: null, detail, diag: 'calcul_impossible' };
}

// ═══════════════════════════════════════════════════════════════════
// PARSING MALTA (XLS/XLSX)
// Colonnes FIXES :
//   A : date création
//   B : n° dossier
//   C : LTA (format "xxx xxxx xxxx")
//   H : code Malta client
//   K : poids
// Lignes 1-3 ignorées (skiprows = 3) → data à partir de ligne 4
// ═══════════════════════════════════════════════════════════════════
async function parseMalta(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
  // skiprows = 3 → data à partir de l'index 3 (lignes 1-3 ignorées)
  const dataRows = rows.slice(3);
  const dossiers = [];
  for (const r of dataRows) {
    if (!r || !r.length) continue;
    const dateStr    = r[0];  // A
    const numDossier = r[1];  // B
    const ltaRaw     = r[2];  // C
    const codeClient = r[7];  // H
    const poidsRaw   = r[10]; // K
    if (!ltaRaw && !numDossier) continue;
    const ltaNorm = normalizeLTA(ltaRaw);
    if (ltaNorm.length < 10) continue; // on skip les lignes sans LTA valide
    dossiers.push({
      date: String(dateStr || '').trim(),
      numDossier: String(numDossier || '').trim(),
      ltaRaw: String(ltaRaw || '').trim(),
      ltaKey: ltaKey(ltaRaw),
      codeClient: String(codeClient || '').trim().toUpperCase(),
      poids: parseNumber(poidsRaw) || 0
    });
  }
  // Index par ltaKey
  const indexLTA = new Map();
  for (const d of dossiers) {
    if (!indexLTA.has(d.ltaKey)) indexLTA.set(d.ltaKey, d);
  }
  return { dossiers, indexLTA, nbTotal: dataRows.length };
}

// ═══════════════════════════════════════════════════════════════════
// PARSING FACTURE PDF
//
// Format type (page LTA WFS) — 7 montants par ligne data :
//   No_LTA | Prov | Poids | Poids_Vol | Qarr | Qsor
//   | Magasin. | Transfert | TMD/DEP | Frais | Port_du | [Total HT] | TVA
//
// Règle clé : l'AVANT-DERNIER montant = Total HT, le DERNIER = TVA.
// On NE somme PAS les composantes (ça doublerait) → on prend Total HT direct.
// Pour une LTA multi-lignes : on somme les Total HT de chaque ligne.
//
// Skip :
//   - Pages "FRAIS ANNEXES" (détail qui double les pages LTA)
//   - Lignes récap : "Total Compagnie", "NET A PAYER"
//   - Lignes avec < 2 montants (en-têtes, titres)
// ═══════════════════════════════════════════════════════════════════
async function parseFacturePDF(file, handler) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

  // Regex LTA générique : 3 chiffres + séparateur optionnel + 7 ou 8 chiffres
  const rxLTA = /\b(\d{3})[\s\u00a0\-]?(\d{7,8})\b/g;
  // Regex montant format fr : "116,60" / "1 749,00" / "-1 234,56" / "1234.56"
  const rxMontant = /-?(?:\d{1,3}(?:[\s\u00a0]\d{3})*|\d+)[.,]\d{2}/g;
  // Regex n° facture : "Facture/Invoice 26030590" ou "FACTURE IMPORT 26030590"
  const rxNumFacture = /(?:Facture\/?Invoice|FACTURE\s+IMPORT|Facture\s+N[°o]|Invoice\s+N[°o])[^\d]{0,5}(\d{6,12})/i;

  const lignesParLTA = new Map();
  let rawText = '';
  let currentLTA = null;
  let pagesSkipped = 0;
  let totalLignesData = 0;
  let numFacture = null;

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    // Regroupe items par ligne visuelle (y rounded)
    const linesMap = new Map();
    for (const item of content.items) {
      const y = Math.round(item.transform[5] / 2) * 2;
      const x = item.transform[4];
      if (!linesMap.has(y)) linesMap.set(y, []);
      linesMap.get(y).push({ x, str: item.str });
    }
    const ys = [...linesMap.keys()].sort((a,b) => b - a);
    const pageLines = [];
    for (const y of ys) {
      const items = linesMap.get(y).sort((a,b) => a.x - b.x);
      const text = items.map(i => i.str).join(' ').replace(/\s+/g,' ').trim();
      if (text) pageLines.push(text);
    }

    const pageText = pageLines.join('\n');

    // ── DÉTECTION N° FACTURE (si pas encore trouvé) ──
    if (!numFacture) {
      const m = pageText.match(rxNumFacture);
      if (m) numFacture = m[1];
    }

    // ── SKIP pages FRAIS ANNEXES (détail qui double les pages LTA) ──
    if (/FRAIS\s+ANNEXES/i.test(pageText)) {
      rawText += `----- PAGE ${p} (IGNORÉE : FRAIS ANNEXES) -----\n\n`;
      pagesSkipped++;
      continue;
    }

    rawText += `----- PAGE ${p} -----\n${pageText}\n\n`;

    // Reset LTA courante à chaque page
    currentLTA = null;

    for (const txt of pageLines) {
      // Détection LTA dans la ligne
      rxLTA.lastIndex = 0;
      const lm = [...txt.matchAll(rxLTA)];
      if (lm.length > 0) {
        const mm = lm[0];
        const ltaRaw = `${mm[1]}-${mm[2]}`;
        currentLTA = ltaKey(ltaRaw);
        if (!lignesParLTA.has(currentLTA)) {
          lignesParLTA.set(currentLTA, {
            ltaKey: currentLTA,
            ltaAffiche: fmtLTA(ltaRaw),
            lignes: [],
            totalHT: 0
          });
        }
      }
      if (!currentLTA) continue;

      // Extraire montants
      rxMontant.lastIndex = 0;
      const montants = [];
      let m;
      while ((m = rxMontant.exec(txt)) !== null) {
        const n = parseNumber(m[0]);
        if (n != null) montants.push(n);
      }

      // Détection lignes récap à ignorer
      const upper = txt.toUpperCase();
      const isRecap = /(TOTAL\s+COMPAGNIE|TOTAL\s*\(EN\s*EUR|NET\s+A\s+PAYER|NET\s*À\s*PAYER|GRAND\s+TOTAL|SOUS[\s\-]?TOTAL)/.test(upper);

      // Si récap ou moins de 2 montants → ligne non data
      if (isRecap || montants.length < 2) {
        lignesParLTA.get(currentLTA).lignes.push({
          text: txt, montants, htDetecte: 0,
          isRecap: true
        });
        continue;
      }

      // ✅ LIGNE DATA VALIDE
      // L'avant-dernier montant = Total HT de cette ligne (le dernier = TVA)
      const htDetecte = montants[montants.length - 2];

      lignesParLTA.get(currentLTA).lignes.push({
        text: txt, montants, htDetecte, isRecap: false
      });
      lignesParLTA.get(currentLTA).totalHT += htDetecte;
      totalLignesData++;
    }
  }

  // Arrondi pour éviter les float drift
  for (const [k, v] of lignesParLTA.entries()) {
    v.totalHT = Math.round(v.totalHT * 100) / 100;
  }

  const debug = `${lignesParLTA.size} LTA détectées · ${totalLignesData} lignes data · ${pagesSkipped} page(s) FRAIS ANNEXES ignorée(s)`;
  return { lignesParLTA, rawText, debug, numFacture };
}

// ═══════════════════════════════════════════════════════════════════
// GÉNÉRATION PDF SYNTHÈSE COMPTA (jsPDF + autotable)
// ═══════════════════════════════════════════════════════════════════
function generateSynthesePDF(ctx) {
  const { rows, stats, handler, factureParsed, facture, malta, params, litiges } = ctx;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marg = 14;

  // ── Helpers ──
  const nf = factureParsed?.numFacture || '—';
  const today = new Date();
  const todayStr = today.toLocaleDateString('fr-FR');
  const timeStr = today.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  const fmt = v => v == null || isNaN(Number(v)) ? '—' :
    new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v) + ' €';
  const fmtKgPdf = v => v == null ? '—' : Number(v).toLocaleString('fr-FR') + ' kg';

  const tva = stats.htFact * 0.20;
  const ttc = stats.htFact * 1.20;
  const kos = rows.filter(r => r.verdict === 'ko' || r.isLitigePushed);
  const miss = rows.filter(r => r.verdict === 'miss');
  const ok = rows.filter(r => r.verdict === 'ok' && !r.isLitigePushed);
  const rowsPourImputation = rows.filter(r => r.dossierNum); // lignes avec dossier Malta = à imputer

  // ─── PAGE 1 : RÉCAP POUR SÉGOLÈNE ───────────────────────────────
  // Header TAF
  doc.setFillColor(245, 158, 11);
  doc.rect(0, 0, pageW, 18, 'F');
  doc.setTextColor(0, 0, 0);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('TAF TRANS AIR FREIGHT', marg, 12);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text('Service Import · CDG / Roissy', pageW - marg, 12, { align: 'right' });

  // Titre
  doc.setTextColor(0, 0, 0);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text('SYNTHÈSE FACTURE IMPORT', marg, 30);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.setTextColor(100, 100, 100);
  doc.text('Pour imputation comptable par dossier', marg, 36);

  // Destinataire / expéditeur
  doc.setDrawColor(220, 220, 220);
  doc.setLineWidth(0.3);
  doc.line(marg, 41, pageW - marg, 41);
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.text('À :', marg, 48);
  doc.setFont('helvetica', 'normal');
  doc.text('Ségolène — Comptabilité', marg + 8, 48);
  doc.setFont('helvetica', 'bold');
  doc.text('De :', marg, 54);
  doc.setFont('helvetica', 'normal');
  doc.text('Service Import TAF', marg + 8, 54);
  doc.setFont('helvetica', 'bold');
  doc.text('Date :', pageW - marg - 40, 48);
  doc.setFont('helvetica', 'normal');
  doc.text(todayStr + ' ' + timeStr, pageW - marg - 40 + 12, 48);
  doc.setFont('helvetica', 'bold');
  doc.text('Réf :', pageW - marg - 40, 54);
  doc.setFont('helvetica', 'normal');
  doc.text(`VC-${nf}`, pageW - marg - 40 + 12, 54);

  // Bloc FACTURE
  doc.setFillColor(250, 245, 230);
  doc.setDrawColor(245, 158, 11);
  doc.setLineWidth(0.5);
  doc.rect(marg, 60, pageW - 2 * marg, 32, 'FD');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.setTextColor(0, 0, 0);
  doc.text('FACTURE À IMPUTER', marg + 3, 66);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  const factInfo = [
    ['Handler', handler?.nom || '—'],
    ['N° Facture', nf],
    ['Fichier PDF', facture?.name || '—']
  ];
  let yF = 72;
  factInfo.forEach(([l, v]) => {
    doc.setFont('helvetica', 'bold');
    doc.text(l + ' :', marg + 3, yF);
    doc.setFont('helvetica', 'normal');
    doc.text(String(v), marg + 35, yF);
    yF += 5;
  });
  // Totaux facture à droite
  doc.setFont('helvetica', 'bold');
  doc.text('Net à payer HT  :', pageW - marg - 55, 72);
  doc.setFont('helvetica', 'normal');
  doc.text(fmt(stats.htFact), pageW - marg - 3, 72, { align:'right' });
  doc.setFont('helvetica', 'bold');
  doc.text('TVA (20 %)      :', pageW - marg - 55, 77);
  doc.setFont('helvetica', 'normal');
  doc.text(fmt(tva), pageW - marg - 3, 77, { align:'right' });
  doc.setDrawColor(200, 200, 200);
  doc.line(pageW - marg - 55, 80, pageW - marg - 3, 80);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.text('Net à payer TTC :', pageW - marg - 55, 85);
  doc.text(fmt(ttc), pageW - marg - 3, 85, { align:'right' });

  // Bloc CONTRÔLE
  let yC = 100;
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(0, 0, 0);
  doc.text('CONTRÔLE VÉRIFICATION', marg, yC);
  yC += 2;
  doc.setDrawColor(0, 0, 0);
  doc.line(marg, yC, pageW - marg, yC);
  yC += 5;

  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  const controlGrid = [
    ['LTA totales', stats.total, null],
    ['Conformes', ok.length, [0, 130, 0]],
    ['En écart / litige', kos.length, kos.length ? [180, 20, 20] : null],
    ['Sans dossier Malta', miss.length, miss.length ? [200, 120, 0] : null]
  ];
  const colW = (pageW - 2 * marg) / controlGrid.length;
  controlGrid.forEach(([lbl, val, col], i) => {
    const x = marg + i * colW;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
    doc.setTextColor(110, 110, 110);
    doc.text(lbl.toUpperCase(), x + 2, yC);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    if (col) doc.setTextColor(col[0], col[1], col[2]);
    else doc.setTextColor(0, 0, 0);
    doc.text(String(val), x + 2, yC + 7);
  });
  yC += 14;

  // Bloc ÉCART BILAN
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text('Tarif TAF attendu total :', marg, yC);
  doc.setFont('helvetica', 'normal');
  doc.text(fmt(stats.htAtt), marg + 55, yC);

  doc.setFont('helvetica', 'bold');
  doc.text('Écart facture vs tarif TAF :', pageW - marg - 55 - 20, yC);
  const ecartCol = stats.ecart > 5 ? [180, 20, 20] : stats.ecart < -5 ? [0, 130, 0] : [80, 80, 80];
  doc.setTextColor(ecartCol[0], ecartCol[1], ecartCol[2]);
  doc.text(fmt(stats.ecart), pageW - marg - 3, yC, { align:'right' });
  doc.setTextColor(0, 0, 0);
  yC += 8;

  // Section LITIGES (si des lignes KO)
  if (kos.length) {
    doc.setFillColor(252, 235, 235);
    doc.setDrawColor(200, 40, 40);
    doc.rect(marg, yC, pageW - 2 * marg, 6, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.setTextColor(180, 20, 20);
    doc.text(`⚠ ${kos.length} LIGNE(S) EN ÉCART / LITIGE — Détail ci-dessous`, marg + 2, yC + 4);
    doc.setTextColor(0, 0, 0);
    yC += 9;

    doc.autoTable({
      startY: yC,
      head: [['LTA', 'Dossier', 'Client', 'Poids', 'HT Fact.', 'HT Att.', 'Écart', 'Note']],
      body: kos.map(r => [
        r.ltaAffiche,
        r.dossierNum || '—',
        r.client || r.codeClient || '—',
        fmtKgPdf(r.poids),
        fmt(r.htFacture),
        fmt(r.tarifAttendu),
        fmt(r.ecart),
        r.note || (r.isLitigePushed ? 'En litige' : '')
      ]),
      theme: 'grid',
      styles: { fontSize: 7.5, cellPadding: 1.5, overflow: 'linebreak' },
      headStyles: { fillColor: [180, 20, 20], textColor: 255, fontSize: 7.5, fontStyle: 'bold' },
      columnStyles: {
        0: { cellWidth: 22, fontStyle: 'bold' },
        1: { cellWidth: 24 },
        2: { cellWidth: 30 },
        3: { cellWidth: 16, halign: 'right' },
        4: { cellWidth: 18, halign: 'right' },
        5: { cellWidth: 18, halign: 'right' },
        6: { cellWidth: 18, halign: 'right', textColor: [180, 20, 20], fontStyle: 'bold' },
        7: { cellWidth: 'auto' }
      },
      margin: { left: marg, right: marg },
      didDrawPage: (data) => { addFooter(doc, pageW, pageH, marg, nf); }
    });
    yC = doc.lastAutoTable.finalY + 6;
  }

  // Note de bas page 1 pour forcer à continuer page 2 sur tableau imputations
  if (yC < pageH - 30) {
    doc.setFontSize(8);
    doc.setFont('helvetica', 'italic');
    doc.setTextColor(110, 110, 110);
    doc.text('→ Détail complet des imputations par dossier page suivante.', marg, yC + 4);
    doc.setTextColor(0, 0, 0);
  }

  addFooter(doc, pageW, pageH, marg, nf);

  // ─── PAGE 2+ : TABLEAU COMPLET DES IMPUTATIONS ──────────────────
  doc.addPage();
  doc.setFillColor(245, 158, 11);
  doc.rect(0, 0, pageW, 10, 'F');
  doc.setTextColor(0, 0, 0);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
  doc.text('TAF TRANS AIR FREIGHT — Synthèse Facture ' + nf, marg, 7);

  doc.setFontSize(12);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(0, 0, 0);
  doc.text('IMPUTATIONS COMPTABLES PAR DOSSIER', marg, 20);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(100, 100, 100);
  doc.text(`${rowsPourImputation.length} dossier(s) · Handler ${handler?.nom || '—'} · Facture ${nf}`, marg, 25);
  doc.setTextColor(0, 0, 0);

  // Tri par n° dossier
  const sortedRows = [...rowsPourImputation].sort((a, b) =>
    String(a.dossierNum || '').localeCompare(String(b.dossierNum || ''), 'fr', { numeric: true })
  );

  const body = sortedRows.map(r => {
    const statut = r.isLitigePushed ? '⚠ LITIGE'
                 : r.verdict === 'ko' ? '⚠ ÉCART'
                 : r.verdict === 'ok' ? 'OK'
                 : r.verdict === 'notarif' ? 'S.TARIF' : '—';
    return [
      r.dossierNum || '—',
      r.codeClient || '—',
      r.client || '—',
      r.ltaAffiche,
      r.productType ? (params.productTypes[r.productType]?.label || r.productType).slice(0, 10) : '—',
      fmtKgPdf(r.poids),
      fmt(r.htFacture),
      fmt(r.tarifAttendu),
      statut
    ];
  });

  // Ligne de total en bas
  const totalHTFact = sortedRows.reduce((a, r) => a + (r.htFacture || 0), 0);
  const totalHTAtt = sortedRows.reduce((a, r) => a + (r.tarifAttendu || 0), 0);

  doc.autoTable({
    startY: 30,
    head: [['N° Dossier', 'Code Cl.', 'Client', 'LTA', 'Produit', 'Poids', 'HT Facturé', 'HT TAF att.', 'Statut']],
    body,
    foot: [[
      { content: 'TOTAL À IMPUTER', colSpan: 6, styles: { halign: 'right', fillColor: [50, 50, 50], textColor: 255, fontStyle: 'bold' } },
      { content: fmt(totalHTFact), styles: { halign: 'right', fillColor: [245, 158, 11], textColor: 0, fontStyle: 'bold' } },
      { content: fmt(totalHTAtt), styles: { halign: 'right', fillColor: [220, 220, 220], textColor: 0, fontStyle: 'bold' } },
      { content: '', styles: { fillColor: [50, 50, 50] } }
    ]],
    theme: 'grid',
    styles: { fontSize: 7, cellPadding: 1.3, overflow: 'linebreak' },
    headStyles: { fillColor: [40, 40, 40], textColor: 255, fontSize: 7.5, fontStyle: 'bold' },
    columnStyles: {
      0: { cellWidth: 22, fontStyle: 'bold' },
      1: { cellWidth: 15 },
      2: { cellWidth: 30 },
      3: { cellWidth: 22 },
      4: { cellWidth: 16 },
      5: { cellWidth: 15, halign: 'right' },
      6: { cellWidth: 20, halign: 'right', fontStyle: 'bold' },
      7: { cellWidth: 20, halign: 'right' },
      8: { cellWidth: 'auto' }
    },
    didParseCell: (data) => {
      if (data.section === 'body' && data.column.index === 8) {
        const v = data.cell.raw;
        if (v === '⚠ LITIGE' || v === '⚠ ÉCART') {
          data.cell.styles.textColor = [180, 20, 20];
          data.cell.styles.fontStyle = 'bold';
        } else if (v === 'OK') {
          data.cell.styles.textColor = [0, 130, 0];
        } else if (v === 'S.TARIF') {
          data.cell.styles.textColor = [150, 80, 200];
        }
      }
    },
    margin: { left: marg, right: marg },
    didDrawPage: () => { addFooter(doc, pageW, pageH, marg, nf); }
  });

  const yAfter = doc.lastAutoTable.finalY + 8;

  // Signature (si assez de place)
  if (yAfter < pageH - 35) {
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('Vérifié par :', marg, yAfter + 5);
    doc.setFont('helvetica', 'normal');
    doc.setDrawColor(150, 150, 150);
    doc.line(marg + 25, yAfter + 5, marg + 80, yAfter + 5);

    doc.setFont('helvetica', 'bold');
    doc.text('Bon à payer :', pageW - marg - 55, yAfter + 5);
    doc.setFont('helvetica', 'normal');
    doc.line(pageW - marg - 25, yAfter + 5, pageW - marg, yAfter + 5);

    doc.setFontSize(7);
    doc.setTextColor(110, 110, 110);
    doc.text('Date : ..... / ..... / .........', marg, yAfter + 12);
    doc.text('Date : ..... / ..... / .........', pageW - marg - 55, yAfter + 12);
  }

  addFooter(doc, pageW, pageH, marg, nf);

  // Retourne Blob et infos
  const blob = doc.output('blob');
  const base64 = doc.output('datauristring').split(',')[1];
  return { blob, base64, size: blob.size };
}

function addFooter(doc, pageW, pageH, marg, nf) {
  doc.setFont('helvetica', 'italic'); doc.setFontSize(7);
  doc.setTextColor(150, 150, 150);
  const pageNum = doc.internal.getCurrentPageInfo().pageNumber;
  const totalPages = doc.internal.getNumberOfPages();
  doc.text(
    `TAF VERICHECK v4.6 · Facture ${nf} · Généré le ${new Date().toLocaleDateString('fr-FR')} · Page ${pageNum}/${totalPages}`,
    pageW / 2, pageH - 6, { align: 'center' }
  );
  doc.setTextColor(0, 0, 0);
}

// ═══════════════════════════════════════════════════════════════════
// DRIVE BINAIRE — upload d'un PDF
// ═══════════════════════════════════════════════════════════════════
async function driveUploadBinary(filename, base64, mimeType) {
  try {
    const body = JSON.stringify({
      action: 'uploadPDF',
      filename,
      mimeType: mimeType || 'application/pdf',
      base64,
      folder: DRIVE_FOLDER
    });
    try {
      const resp = await fetch(PROXY, { method:'POST', redirect:'follow', body });
      if (resp.ok || resp.type === 'opaque') return true;
    } catch (_) {}
    await fetch(PROXY, { method:'POST', mode:'no-cors', body });
    return true;
  } catch (e) {
    console.warn('[VC4] driveUploadBinary error:', e.message);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════
// ARCHIVES — index + archive complète
// ═══════════════════════════════════════════════════════════════════
async function loadArchivesIndex() {
  const idx = await driveRead(DRIVE_ARCHIVES_INDEX);
  return (idx && Array.isArray(idx.archives)) ? idx.archives : [];
}

async function saveArchivesIndex(archives) {
  return await driveUpload(DRIVE_ARCHIVES_INDEX, { archives, _updatedAt: Date.now() });
}

async function archiveSynthesePDF(ctx) {
  // ctx : { rows, stats, handler, factureParsed, facture, malta, params, litiges }
  const { blob, base64, size } = generateSynthesePDF(ctx);
  const nf = ctx.factureParsed?.numFacture || 'sansref';
  const ts = new Date();
  const tsStr = ts.toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const id = `arc_${Date.now()}`;
  const pdfFilename = `synthese_compta_${nf}_${tsStr}.pdf`;
  const archiveJsonFile = `${DRIVE_ARCHIVE_PREFIX}${id}.json`;

  // 1. Upload du PDF (fichier binaire séparé visible dans Drive)
  await driveUploadBinary(pdfFilename, base64, 'application/pdf');

  // 2. Sauvegarde JSON complet avec pdfBase64 embedded + métadonnées rows
  const archivePayload = {
    id,
    version: 'v4.6',
    dateISO: ts.toISOString(),
    dateAffichage: ts.toLocaleDateString('fr-FR') + ' ' + ts.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
    factureNum: nf,
    handlerId: ctx.handler?.id,
    handlerNom: ctx.handler?.nom,
    pdfFilename,
    pdfBase64: base64,
    pdfSize: size,
    stats: ctx.stats,
    rowsCount: ctx.rows.length,
    koCount: ctx.rows.filter(r => r.verdict === 'ko' || r.isLitigePushed).length,
    rows: ctx.rows.map(r => ({
      lta: r.ltaAffiche, dossierNum: r.dossierNum, codeClient: r.codeClient,
      client: r.client, productType: r.productType, poids: r.poids,
      htFacture: r.htFacture, tarifAttendu: r.tarifAttendu, ecart: r.ecart,
      verdict: r.verdict, isLitigePushed: !!r.isLitigePushed, note: r.note || ''
    })),
    facture: { name: ctx.facture?.name, numero: nf },
    malta: { name: ctx.malta?.name, count: ctx.maltaParsed?.dossiers?.length }
  };
  await driveUpload(archiveJsonFile, archivePayload);

  // 3. Mise à jour de l'index
  const indexEntry = {
    id,
    dateISO: archivePayload.dateISO,
    dateAffichage: archivePayload.dateAffichage,
    factureNum: nf,
    handlerId: ctx.handler?.id,
    handlerNom: ctx.handler?.nom,
    pdfFilename,
    archiveJsonFile,
    rowsCount: archivePayload.rowsCount,
    koCount: archivePayload.koCount,
    htFacture: ctx.stats.htFact,
    htAttendu: ctx.stats.htAtt,
    ecart: ctx.stats.ecart
  };
  const current = await loadArchivesIndex();
  const updated = [indexEntry, ...current.filter(a => a.id !== id)];
  await saveArchivesIndex(updated);

  // 4. Téléchargement immédiat pour l'user
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = pdfFilename;
  a.click();
  URL.revokeObjectURL(url);

  return { id, filename: pdfFilename, archiveJsonFile, indexEntry };
}

async function deleteArchive(archiveId) {
  // On retire de l'index (les fichiers Drive restent dans le dossier, à supprimer à la main si besoin)
  const current = await loadArchivesIndex();
  const updated = current.filter(a => a.id !== archiveId);
  await saveArchivesIndex(updated);
  return true;
}

async function loadArchiveFull(archive) {
  if (!archive?.archiveJsonFile) return null;
  return await driveRead(archive.archiveJsonFile);
}

function downloadArchivePDF(archive, fullData) {
  const b64 = fullData?.pdfBase64;
  if (!b64) { alert('PDF non disponible dans cette archive'); return; }
  // Reconstruit le Blob depuis base64
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = archive.pdfFilename || `synthese_${archive.id}.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}

  // ── Save immédiat (sans debounce) ──
  const saveNow = useCallback(async () => {

    }
    return await pushToDrive(paramsRef.current);

  // ── BOOT : essayer de charger depuis Drive ──
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setDriveStatus('loading');
      try {
        const remote = await driveRead(DRIVE_PARAMS_FILE);
        if (cancelled) return;
        if (remote && typeof remote === 'object' && remote.handlers) {

    })();
    return () => { cancelled = true; };
  }, []);

  // ── BEFOREUNLOAD : avertir si modifs pending ──
  useEffect(() => {
    const handler = (e) => {
      if (isDirty) {
        e.preventDefault();
        e.returnValue = 'Modifications non sauvegardées. Quitter quand même ?';
        return e.returnValue;
      }
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [isDirty]);

  // ── SAVE : localStorage immédiat + Drive debounced (1s) ──
  const persistParams = useCallback((updater) => {
    setParams(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      const stamped = saveParamsLocal(next);
      setIsDirty(true);
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      if (bootLoaded) {
        setDriveStatus('dirty');
        saveTimerRef.current = setTimeout(() => {
          pushToDrive(stamped);

  return React.createElement('div', null, [
    // NAV
