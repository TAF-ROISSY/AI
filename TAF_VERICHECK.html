function PageVerif({ params, setParams, archiveRapprochement, addLitige }) {
  const [handlerId, setHandlerId] = useState(() => params.handlers[0]?.id || '');
  const [facture, setFacture] = useState(null);
  const [factureParsed, setFactureParsed] = useState(null);
  const [malta, setMalta] = useState(null);
  const [maltaParsed, setMaltaParsed] = useState(null);
  const [loading, setLoading] = useState(null);
  const [erreur, setErreur] = useState('');
  const [rows, setRows] = useState([]);
  const [showDebug, setShowDebug] = useState(false);
  const [archiving, setArchiving] = useState(false);
  const [archiveMsg, setArchiveMsg] = useState('');
  const [detailIdx, setDetailIdx] = useState(null); // index de la row ouverte en modal
  const [syntheseOpen, setSyntheseOpen] = useState(false);
  const [sessionLoaded, setSessionLoaded] = useState(false);
  const [toast, toastEl] = useToast();

  const handler = useMemo(
    () => params.handlers.find(h => h.id === handlerId) || null,
    [params.handlers, handlerId]
  );

  // ── INDEX CLIENTS : code Malta → { nom, productType, exclusions } ──
  const clientIndex = useMemo(() => {
    const idx = new Map();
    for (const [pt, pd] of Object.entries(params.productTypes || {})) {
      for (const c of pd.clients || []) {
        if (c.code) idx.set(String(c.code).toUpperCase(), {
          nom: c.nom,
          productType: pt,
          exclusions: c.exclusions || []
        });
      }
    }
    return idx;
  }, [params.productTypes]);

  // ── RESTAURATION SESSION ──
  useEffect(() => {
    try {
      const raw = localStorage.getItem(LS_SESSION_V4);
      if (raw) {
        const s = JSON.parse(raw);
        if (s?.rows?.length) {
          setRows(s.rows);
          if (s.handlerId) setHandlerId(s.handlerId);
          if (s.pdfName) setFacture({ name: s.pdfName });
          if (s.xlsName) setMalta({ name: s.xlsName });
          if (s.factureMeta) setFactureParsed({
            lignesParLTA: new Map(),
            rawText: s.factureRawText || '(rechargé)',
            debug: s.factureMeta.debug || '',
            numFacture: s.factureMeta.numFacture
          });
          if (s.maltaMeta) setMaltaParsed({
            dossiers: [],
            indexLTA: new Map(),
            nbTotal: s.maltaMeta.nbTotal
          });
        }
      }
    } catch(e){ console.warn('session load error', e); }
    setSessionLoaded(true);
  }, []);

  // ── PERSISTANCE SESSION ──
  useEffect(() => {
    if (!sessionLoaded) return;
    try {
      const payload = {
        handlerId,
        pdfName: facture?.name || null,
        xlsName: malta?.name || null,
        rows,
        factureMeta: factureParsed ? { debug: factureParsed.debug, numFacture: factureParsed.numFacture } : null,
        factureRawText: factureParsed?.rawText || '',
        maltaMeta: maltaParsed ? { nbTotal: maltaParsed.nbTotal } : null,
        _updatedAt: Date.now()
      };
      localStorage.setItem(LS_SESSION_V4, JSON.stringify(payload));
    } catch(e){ console.warn('session save error', e); }
  }, [rows, handlerId, facture, malta, factureParsed, maltaParsed, sessionLoaded]);

  // ── Upload facture ──
  const onUploadFacture = async (file) => {
    if (!file) return;
    if (!handler) { setErreur('Sélectionne un handler avant d\'uploader la facture.'); return; }
    setErreur('');
    setFacture(file);
    setLoading('facture');
    try {
      const parsed = await parseFacturePDF(file, handler);
      setFactureParsed(parsed);
    } catch (e) {
      setErreur(`Erreur parsing facture : ${e.message}`);
      setFactureParsed(null);
    } finally { setLoading(null); }
  };

  // ── Upload Malta ──
  const onUploadMalta = async (file) => {
    if (!file) return;
    setErreur('');
    setMalta(file);
    setLoading('malta');
    try {
      const parsed = await parseMalta(file);
      setMaltaParsed(parsed);
    } catch (e) {
      setErreur(`Erreur parsing Malta : ${e.message}`);
      setMaltaParsed(null);
    } finally { setLoading(null); }
  };

  // ── LANCEMENT RAPPROCHEMENT ──
  const canRapprocher = factureParsed && maltaParsed && handler
    && factureParsed.lignesParLTA?.size > 0 && maltaParsed.dossiers?.length > 0;

  const lancerRapprochement = () => {
    if (!canRapprocher) return;
    const newRows = [];
    for (const [ltaK, data] of factureParsed.lignesParLTA.entries()) {
      const dossier = maltaParsed.indexLTA.get(ltaK) || null;
      let client = null, productType = null, clientExclusions = [];
      if (dossier?.codeClient) {
        const info = clientIndex.get(String(dossier.codeClient).toUpperCase());
        if (info) {
          client = info.nom;
          productType = info.productType;
          clientExclusions = info.exclusions || [];
        }
      }
      const poids = dossier?.poids ?? null;
      const calc = (productType && poids != null)
        ? calcTarifAttendu(handler, productType, poids)
        : { total: null, detail: [], diag: dossier ? (productType ? 'pas_de_poids' : 'client_inconnu') : 'dossier_introuvable' };

      // ── APPLIQUER LES EXCLUSIONS CLIENT ──
      // Les composantes dont le libellé matche (insensitive, partiel) une exclusion
      // sont désactivées automatiquement via ligneOverrides.
      const ligneOverrides = {};
      const exclLC = clientExclusions.map(e => e.toLowerCase().trim()).filter(Boolean);
      let tarifAtt = calc.total;
      let detailCalc = calc.detail || [];

      if (exclLC.length && detailCalc.length) {
        let totalFiltre = 0, any = false;
        const newDetail = [];
        for (const d of detailCalc) {
          const libelleLC = (d.libelle || '').toLowerCase();
          const matched = exclLC.find(ex => libelleLC.includes(ex));
          if (matched) {
            ligneOverrides[d.libelle] = { actif: false, excludedByClient: matched };
            newDetail.push({ ...d, actif: false });
          } else {
            if (d.montant != null && !isNaN(d.montant)) { totalFiltre += d.montant; any = true; }
            newDetail.push({ ...d, actif: true });
          }
        }
        tarifAtt = any ? Math.round(totalFiltre * 100) / 100 : null;
        detailCalc = newDetail;
      }

      const htFacture = data.totalHT || 0;
      let ecart = null, verdict = null;
      if (!dossier) verdict = 'miss';
      else if (tarifAtt == null) verdict = 'notarif';
      else {
        ecart = Math.round((htFacture - tarifAtt) * 100) / 100;
        const tol = Number(handler.toleranceEcart || 0);
        verdict = Math.abs(ecart) <= tol ? 'ok' : 'ko';
      }
      newRows.push({
        ltaKey: ltaK,
        ltaAffiche: data.ltaAffiche,
        dossierNum: dossier?.numDossier || null,
        codeClient: dossier?.codeClient || null,
        client,
        productType,
        poids,
        htFacture: Math.round(htFacture * 100) / 100,
        tarifAttendu: tarifAtt != null ? Math.round(tarifAtt * 100) / 100 : null,
        tarifAttenduOverride: null,
        ligneOverrides,
        ecart,
        verdict,
        diag: calc.diag,
        detailCalc,
        rawLignes: data.lignes
      });
    }
    const order = { ko:0, miss:1, notarif:2, ok:3 };
    newRows.sort((a,b) => (order[a.verdict] ?? 9) - (order[b.verdict] ?? 9));
    setRows(newRows);
  };

  // ── STATS ──
  const stats = useMemo(() => {
    const s = { total: rows.length, ok: 0, ko: 0, miss: 0, notarif: 0, htFact: 0, htAtt: 0, ecart: 0 };
    for (const r of rows) {
      s[r.verdict] = (s[r.verdict] || 0) + 1;
      s.htFact += r.htFacture || 0;
      if (r.tarifAttendu != null) s.htAtt += r.tarifAttendu;
      if (r.ecart != null) s.ecart += r.ecart;
    }
    s.htFact = Math.round(s.htFact * 100) / 100;
    s.htAtt = Math.round(s.htAtt * 100) / 100;
    s.ecart = Math.round(s.ecart * 100) / 100;
    return s;
  }, [rows]);

  // Édition ligne avec gestion des overrides + AUTO-AJOUT client
  const updateRow = (i, patch) => {
    let autoAdd = null; // client à ajouter à la base après le setRows

    setRows(prev => {
      const next = [...prev];
      next[i] = { ...next[i], ...patch };
      const r = next[i];

      // ── AUTO-AJOUT CLIENT dans la base ──
      // Si l'user change le productType d'une ligne dont le client
      // n'existe DANS AUCUNE catégorie → on l'ajoute automatiquement
      if (patch.productType && r.codeClient) {
        let foundIn = null;
        for (const [pt, pd] of Object.entries(params.productTypes || {})) {
          if ((pd.clients || []).some(c => c.code === r.codeClient)) {
            foundIn = pt; break;
          }
        }
        if (!foundIn) {
          autoAdd = { code: r.codeClient, productType: patch.productType };
          // Affiche le code comme nom provisoire dans la row
          r.client = r.codeClient;
          // Propager aux autres rows du même code client (mass update)
          for (let j = 0; j < next.length; j++) {
            if (j !== i && next[j].codeClient === r.codeClient && !next[j].client) {
              next[j] = {
                ...next[j],
                client: r.codeClient,
                productType: patch.productType
              };
              // Recalcul tarif pour cette row aussi
              const rj = next[j];
              if (handler && rj.poids != null) {
                const calc = calcTarifAttendu(handler, patch.productType, rj.poids);
                rj.tarifAttendu = calc.total != null ? Math.round(calc.total * 100) / 100 : null;
                rj.detailCalc = calc.detail;
                rj.diag = calc.diag;
                if (rj.tarifAttendu != null) {
                  rj.ecart = Math.round((rj.htFacture - rj.tarifAttendu) * 100) / 100;
                  const tol = Number(handler?.toleranceEcart || 0);
                  rj.verdict = Math.abs(rj.ecart) <= tol ? 'ok' : 'ko';
                } else {
                  rj.verdict = 'notarif';
                  rj.ecart = null;
                }
              }
            }
          }
        }
      }

      // Recalcul tarif attendu selon overrides (pour la row courante)
      if (r.tarifAttenduOverride != null && !isNaN(Number(r.tarifAttenduOverride))) {
        r.tarifAttendu = Math.round(Number(r.tarifAttenduOverride) * 100) / 100;
      } else if (r.productType && r.poids != null && handler) {
        const calc = calcTarifAttendu(handler, r.productType, r.poids);
        let total = 0, someOk = false;
        const detail = [];
        for (const d of calc.detail) {
          const ov = r.ligneOverrides?.[d.libelle];
          const actif = ov?.actif !== false;
          const mm = (ov?.montantOverride != null && !isNaN(Number(ov.montantOverride)))
            ? Number(ov.montantOverride) : d.montant;
          if (actif && mm != null && !isNaN(mm)) { total += mm; someOk = true; }
          detail.push({ libelle: d.libelle, montant: mm, actif, err: d.err });
        }
        r.tarifAttendu = someOk ? Math.round(total * 100) / 100 : null;
        r.detailCalc = detail;
      }
      if (r.tarifAttendu != null) {
        r.ecart = Math.round((r.htFacture - r.tarifAttendu) * 100) / 100;
        const tol = Number(handler?.toleranceEcart || 0);
        r.verdict = Math.abs(r.ecart) <= tol ? 'ok' : 'ko';
      } else if (!r.dossierNum) {
        r.verdict = 'miss';
      } else {
        r.verdict = 'notarif';
        r.ecart = null;
      }
      return next;
    });

    // Applique l'auto-ajout client dans params (déclenche auto-save Drive)
    if (autoAdd) {
      setParams(prev => {
        const existing = (prev.productTypes?.[autoAdd.productType]?.clients || [])
          .some(c => c.code === autoAdd.code);
        if (existing) return prev;
        return {
          ...prev,
          productTypes: {
            ...prev.productTypes,
            [autoAdd.productType]: {
              ...prev.productTypes[autoAdd.productType],
              clients: [
                ...(prev.productTypes[autoAdd.productType].clients || []),
                { code: autoAdd.code, nom: '', exclusions: [] }
              ]
            }
          }
        };
      });
      const ptLabel = params.productTypes?.[autoAdd.productType]?.label || autoAdd.productType;
      toast(`✓ Client ${autoAdd.code} ajouté à "${ptLabel}"`, 'success');
    }
  };

  // ── RESET SESSION ──
  const resetSession = () => {
    if (!confirm('Réinitialiser l\'analyse en cours ? Les modifications non archivées seront perdues.')) return;
    setFacture(null); setFactureParsed(null);
    setMalta(null); setMaltaParsed(null);
    setRows([]);
    try { localStorage.removeItem(LS_SESSION_V4); } catch {}
  };

  // ── EXPORT CSV ──
  const exportCSV = () => {
    const header = ['LTA','Dossier','Code Client','Client','Produit','Poids (kg)','HT Facturé (€)','Tarif Attendu (€)','Écart (€)','Verdict'];
    const lines = rows.map(r => [
      r.ltaAffiche, r.dossierNum || '', r.codeClient || '', r.client || '',
      r.productType ? (params.productTypes[r.productType]?.label || r.productType) : '',
      r.poids ?? '',
      (r.htFacture ?? '').toString().replace('.',','),
      (r.tarifAttendu ?? '').toString().replace('.',','),
      (r.ecart ?? '').toString().replace('.',','),
      r.verdict?.toUpperCase() || ''
    ].map(s => `"${String(s).replace(/"/g,'""')}"`).join(';'));
    const csv = [header.join(';'), ...lines].join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `verification_${handler?.id || 'handler'}_${factureParsed?.numFacture || Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // ── IMPRIMER ──
  const imprimer = () => { window.print(); };

  // ── MAIL SYNTHÈSE ──
  const mailSynthese = () => {
    const nf = factureParsed?.numFacture || '—';
    const subject = `Synthèse vérification facture ${handler?.nom || ''} N°${nf}`;
    let body = `Synthèse de vérification\n\n`;
    body += `Handler : ${handler?.nom || '—'}\n`;
    body += `N° Facture : ${nf}\n`;
    body += `Fichier PDF : ${facture?.name || '—'}\n`;
    body += `Date analyse : ${new Date().toLocaleDateString('fr-FR')}\n\n`;
    body += `── STATISTIQUES ──\n`;
    body += `LTA totales     : ${stats.total}\n`;
    body += `✓ OK            : ${stats.ok}\n`;
    body += `⚠ Écart         : ${stats.ko}\n`;
    body += `? Sans dossier  : ${stats.miss}\n`;
    body += `Sans tarif      : ${stats.notarif}\n\n`;
    body += `HT Facturé total : ${stats.htFact.toFixed(2)} €\n`;
    body += `HT Attendu total : ${stats.htAtt.toFixed(2)} €\n`;
    body += `Écart total      : ${stats.ecart.toFixed(2)} €\n\n`;
    const kos = rows.filter(r => r.verdict === 'ko');
    if (kos.length) {
      body += `── LIGNES EN ÉCART (${kos.length}) ──\n`;
      for (const r of kos) {
        body += `\n• ${r.ltaAffiche}\n`;
        body += `  Dossier : ${r.dossierNum || '—'} · Client : ${r.client || '—'}\n`;
        body += `  Poids : ${r.poids ?? '—'} kg · Produit : ${r.productType ? params.productTypes[r.productType]?.label : '—'}\n`;
        body += `  HT Facturé : ${(r.htFacture ?? 0).toFixed(2)} € · HT Attendu : ${(r.tarifAttendu ?? 0).toFixed(2)} €\n`;
        body += `  Écart : ${(r.ecart ?? 0).toFixed(2)} €\n`;
      }
    }
    const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  };

  // STEP status
  const stepStatus = {
    s1: handler ? 'done' : 'active',
    s2: !handler ? 'pending' : (facture ? 'done' : 'active'),
    s3: !facture ? 'pending' : (malta ? 'done' : 'active'),
    s4: (!facture || !malta) ? 'pending' : (rows.length ? 'done' : 'active')
  };

  return React.createElement('div', { className: 'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Vérification de facture handler'),
        React.createElement('div', { key:'s', className:'page-sub' }, 'Choix handler → Facture → Malta → Rapprochement')
      ]),
      React.createElement('div', { key:'r', style:{display:'flex',gap:8,flexWrap:'wrap'} }, [
        rows.length ? React.createElement('button', {
          key:'pdf', className:'btn btn-primary',
          disabled: archiving,
          title: 'Génère un PDF de synthèse pour la compta et l\'archive sur Drive',
          onClick: async () => {
            if (!window.jspdf) { alert('Bibliothèque PDF non chargée — rafraîchis la page'); return; }
            setArchiving(true); setArchiveMsg('');
            try {
              const res = await archiveSynthesePDF({
                rows, stats, handler, factureParsed, facture, malta, params, maltaParsed, litiges: []
              });
              setArchiveMsg('✓ PDF archivé dans les archives : ' + res.filename);
              toast('PDF généré et téléchargé', 'success');
            } catch(e) {
              console.error(e);
              setArchiveMsg('⚠ Erreur : ' + e.message);
              toast('Erreur PDF : ' + e.message, 'error');
            }
            setArchiving(false);
            setTimeout(() => setArchiveMsg(''), 8000);
          }
        }, archiving ? '⏳ Génération...' : '📄 PDF Compta') : null,
        rows.length ? React.createElement('button', {
          key:'syn', className:'btn btn-sec',
          onClick: () => setSyntheseOpen(true)
        }, '📋 Aperçu') : null,
        rows.length ? React.createElement('button', { key:'exp', className:'btn btn-green', onClick: exportCSV }, '📥 CSV') : null,
        rows.length ? React.createElement('button', {
          key:'arc',
          className:'btn btn-sec',
          disabled: archiving,
          onClick: async () => {
            setArchiving(true);
            setArchiveMsg('');
            try {
              const res = await archiveRapprochement(handler, rows, stats);
              setArchiveMsg(res.ok ? `✓ Archivé sur Drive : ${res.filename}` : '⚠ Échec archivage Drive');
            } catch(e) { setArchiveMsg('⚠ Erreur : ' + e.message); }
            setArchiving(false);
            setTimeout(() => setArchiveMsg(''), 6000);
          }
        }, archiving ? '⏳' : '📦 JSON') : null,
        (facture || malta || rows.length) ? React.createElement('button', {
          key:'reset', className:'btn btn-ghost',
          onClick: resetSession,
          title: 'Effacer la session et repartir de zéro'
        }, '🔄 Nouveau') : null
      ])
    ]),

    // STEPS
    React.createElement('div', { key:'steps', className:'steps' }, [
      React.createElement('div', { key:'1', className:'step ' + stepStatus.s1 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '1'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Handler'),
          React.createElement('div', { key:'b', className:'step-sub' }, handler ? handler.id.toUpperCase() : 'À choisir')
        ])
      ]),
      React.createElement('div', { key:'2', className:'step ' + stepStatus.s2 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '2'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Facture PDF'),
          React.createElement('div', { key:'b', className:'step-sub' }, factureParsed ? `${factureParsed.lignesParLTA.size} LTA` : 'En attente')
        ])
      ]),
      React.createElement('div', { key:'3', className:'step ' + stepStatus.s3 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '3'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Fichier Malta'),
          React.createElement('div', { key:'b', className:'step-sub' }, maltaParsed ? `${maltaParsed.dossiers.length} dossiers` : 'En attente')
        ])
      ]),
      React.createElement('div', { key:'4', className:'step ' + stepStatus.s4 }, [
        React.createElement('div', { key:'n', className:'step-num' }, '4'),
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'a', className:'step-lbl' }, 'Rapprochement'),
          React.createElement('div', { key:'b', className:'step-sub' }, rows.length ? `${stats.ok} OK / ${stats.ko} KO` : 'En attente')
        ])
      ])
    ]),

    erreur ? React.createElement('div', { key:'err', className:'alert alert-err' }, [
      React.createElement('span', { key:'i', className:'alert-icon' }, '⚠️'),
      React.createElement('div', { key:'b', className:'alert-body' }, erreur)
    ]) : null,

    // STEP 1 : HANDLER
    React.createElement('div', { key:'s1', className:'card' }, [
      React.createElement('div', { key:'t', className:'card-title' }, '1 — Choisis le handler à contrôler'),
      React.createElement('div', { key:'pills', className:'handler-select-wrap' },
        params.handlers.map(h =>
          React.createElement('button', {
            key: h.id,
            className: 'handler-pill' + (h.id === handlerId ? ' active' : ''),
            onClick: () => setHandlerId(h.id)
          }, [
            React.createElement('span', { key:'n' }, h.nom),
            (h.prefixesAWB?.length
              ? React.createElement('span', { key:'p', className:'handler-pill-prefix' }, h.prefixesAWB.join(' · '))
              : React.createElement('span', { key:'p', className:'handler-pill-prefix' }, '⚠ pas de préfixe')
            )
          ])
        )
      )
    ]),

    // STEPS 2+3 : UPLOADS
    React.createElement('div', { key:'ups', className:'upload-grid' }, [
      React.createElement(UploadZone, {
        key:'fact',
        title: '2 — Facture handler (PDF)',
        subtitle: handler ? `Préfixes ${handler.prefixesAWB.join(' · ')}` : 'Sélectionne un handler d\'abord',
        icon: '📄',
        file: facture,
        loading: loading === 'facture',
        accept: '.pdf',
        disabled: !handler,
        onFile: onUploadFacture,
        onClear: () => { setFacture(null); setFactureParsed(null); setRows([]); },
        statusMsg: factureParsed ? `${factureParsed.lignesParLTA.size} LTA détectées` : null
      }),
      React.createElement(UploadZone, {
        key:'malta',
        title: '3 — Fichier Malta (XLS)',
        subtitle: 'Cols A(date), B(dossier), C(LTA), H(client), K(poids) — 3 lignes d\'en-tête',
        icon: '📊',
        file: malta,
        loading: loading === 'malta',
        accept: '.xls,.xlsx',
        onFile: onUploadMalta,
        onClear: () => { setMalta(null); setMaltaParsed(null); setRows([]); },
        statusMsg: maltaParsed ? `${maltaParsed.dossiers.length} dossiers` : null
      })
    ]),

    // BOUTON RAPPROCHEMENT
    canRapprocher ? React.createElement('div', { key:'run', style:{textAlign:'center',marginBottom:18} },
      React.createElement('button', {
        className:'btn btn-primary',
        style:{padding:'14px 32px',fontSize:14},
        onClick: lancerRapprochement
      }, rows.length ? '🔄 Relancer le rapprochement' : '▶ Lancer le rapprochement')
    ) : null,

    // RÉSULTATS
    rows.length ? React.createElement('div', { key:'res-wrap' }, [
      archiveMsg ? React.createElement('div', {
        key:'arcmsg',
        className: 'alert ' + (archiveMsg.startsWith('✓') ? 'alert-info' : 'alert-warn'),
        style: { marginBottom: 12 }
      }, [
        React.createElement('span', { key:'i', className:'alert-icon' }, archiveMsg.startsWith('✓') ? '✓' : '⚠'),
        React.createElement('div', { key:'b', className:'alert-body' }, archiveMsg)
      ]) : null,
      React.createElement(ResultsSection, {
        key:'res',
        rows, stats, params, handler,
        onUpdateRow: updateRow,
        showDebug, setShowDebug,
        factureParsed,
        onRowClick: (i) => setDetailIdx(i)
      })
    ]) : null,

    // MODAL DÉTAIL LTA
    detailIdx != null && rows[detailIdx] ? React.createElement(DetailModal, {
      key: 'dm',
      row: rows[detailIdx],
      rowIdx: detailIdx,
      handler,
      params,
      factureParsed,
      facture, malta,
      onClose: () => setDetailIdx(null),
      onUpdateRow: updateRow,
      onPushLitige: (r) => addLitige(r, {
        handler,
        numFacture: factureParsed?.numFacture || '',
        pdfName: facture?.name || '',
        xlsName: malta?.name || ''
      }),
      toast
    }) : null,

    // MODAL SYNTHÈSE
    syntheseOpen ? React.createElement(SyntheseModal, {
      key: 'sm',
      rows, stats, handler, facture, malta, factureParsed, params,
      onClose: () => setSyntheseOpen(false),
      onMail: mailSynthese,
      toast
    }) : null,

    // TOAST
    toastEl
  ]);
}

// ═══════════════════════════════════════════════════════════════════
// COMPOSANT UPLOAD ZONE
// ═══════════════════════════════════════════════════════════════════
function UploadZone({ title, subtitle, icon, file, loading, accept, disabled, onFile, onClear, statusMsg }) {
  const inpRef = useRef(null);
  const [drag, setDrag] = useState(false);

  const onDrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    setDrag(false);
    if (disabled) return;
    const f = e.dataTransfer.files?.[0];
    if (f) onFile(f);
  };

  return React.createElement('div', {
    className: 'upload-zone' + (drag ? ' drag' : '') + (file ? ' loaded' : ''),
    style: disabled ? { opacity: .5, cursor: 'not-allowed' } : null,
    onClick: () => !disabled && !loading && inpRef.current?.click(),
    onDragOver: (e) => { e.preventDefault(); setDrag(true); },
    onDragLeave: (e) => { e.preventDefault(); setDrag(false); },
    onDrop
  }, [
    file && !loading ? React.createElement('button', {
      key:'clr', className:'upload-clear',
      onClick: (e) => { e.stopPropagation(); onClear(); }
    }, '✕') : null,
    loading
      ? React.createElement('div', { key:'ld', className:'spinner' })
      : React.createElement('div', { key:'ic', className:'upload-icon' }, file ? '✓' : icon),
    React.createElement('div', { key:'t', className:'upload-title' }, title),
    React.createElement('div', { key:'s', className:'upload-sub' }, subtitle),
    file ? React.createElement('div', { key:'f', className:'upload-fname' }, file.name) : null,
    statusMsg ? React.createElement('div', { key:'st', style:{fontSize:11,color:'var(--green)',marginTop:6,fontFamily:'var(--mono)'} }, statusMsg) : null,
    React.createElement('input', {
      key:'inp', ref: inpRef, type:'file', accept,
      style: { display:'none' },
      onChange: (e) => { const f = e.target.files?.[0]; if (f) onFile(f); e.target.value=''; }
    })
  ]);
}

function PageHandlers({ params, setParams }) {
  const [expandedH, setExpandedH] = useState(params.handlers[0]?.id || null);
  const [activeMod, setActiveMod] = useState({}); // {handlerId: 'cargo'|'seafood'|...}

  const getMod = (hid) => activeMod[hid] || 'cargo';
  const setMod = (hid, m) => setActiveMod(p => ({ ...p, [hid]: m }));

  const updateHandler = (hid, patch) => {
    setParams(prev => ({ ...prev, handlers: prev.handlers.map(h => h.id === hid ? { ...h, ...patch } : h) }));
  };

  const updateModuleLignes = (hid, mod, lignes) => {
    setParams(prev => ({
      ...prev,
      handlers: prev.handlers.map(h => h.id === hid
        ? { ...h, modules: { ...h.modules, [mod]: lignes } }
        : h)
    }));
  };

  const addHandler = () => {
    const id = 'h_' + Date.now();
    setParams(prev => ({
      ...prev,
      handlers: [...prev.handlers, {
        id, nom: 'Nouveau handler', prefixesAWB: [], toleranceEcart: 2,
        modules: { cargo:[], seafood:[], avi:[], fl:[] }
      }]
    }));
    setExpandedH(id);
  };

  const removeHandler = (hid) => {
    if (!confirm('Supprimer ce handler ?')) return;
    setParams(prev => ({ ...prev, handlers: prev.handlers.filter(h => h.id !== hid) }));
  };

  return React.createElement('div', { className:'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Handlers & Grilles tarifaires'),
        React.createElement('div', { key:'s', className:'page-sub' }, 'Préfixes LTA autorisés + grille tarifaire par type de produit')
      ]),
      React.createElement('button', {
        key:'add', className:'btn btn-primary', onClick: addHandler
      }, '+ Nouveau handler')
    ]),
    React.createElement('div', { key:'list' },
      params.handlers.map(h => React.createElement(HandlerCard, {
        key: h.id,
        handler: h,
        expanded: expandedH === h.id,
        onToggle: () => setExpandedH(expandedH === h.id ? null : h.id),
        activeMod: getMod(h.id),
        setActiveMod: (m) => setMod(h.id, m),
        onUpdate: (patch) => updateHandler(h.id, patch),
        onUpdateLignes: (mod, lignes) => updateModuleLignes(h.id, mod, lignes),
        onRemove: () => removeHandler(h.id)
      }))
    )
  ]);
}

// PAGE CLIENTS
// ═══════════════════════════════════════════════════════════════════
function PageClients({ params, setParams }) {
  const updateClients = (pt, clients) => {
    setParams(prev => ({
      ...prev,
      productTypes: {
        ...prev.productTypes,
        [pt]: { ...prev.productTypes[pt], clients }
      }
    }));
  };

  const addClient = (pt) => {
    updateClients(pt, [...(params.productTypes[pt].clients || []), { code: '', nom: '' }]);
  };

  const updateClient = (pt, i, patch) => {
    const next = [...(params.productTypes[pt].clients || [])];
    next[i] = { ...next[i], ...patch };
    updateClients(pt, next);
  };

  const removeClient = (pt, i) => {
    updateClients(pt, (params.productTypes[pt].clients || []).filter((_, k) => k !== i));
  };

  // Import CSV — format : code;nom;exclusions (séparées par |)
  const fileRef = useRef(null);
  const onImportCSV = async (e, pt) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const text = await f.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const clients = [];
    for (const ln of lines) {
      if (/code/i.test(ln) && clients.length === 0) continue;
      const parts = ln.split(/[;\t]/).map(s => s.trim().replace(/^"|"$/g, ''));
      if (!parts[0]) continue;
      const c = {
        code: parts[0].toUpperCase(),
        nom: parts[1] || '',
        exclusions: parts[2] ? parts[2].split('|').map(s => s.trim()).filter(Boolean) : []
      };
      clients.push(c);
    }
    if (clients.length) updateClients(pt, [...(params.productTypes[pt].clients || []), ...clients]);
    e.target.value = '';
  };

  return React.createElement('div', { className:'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Clients par type de produit'),
        React.createElement('div', { key:'s', className:'page-sub' }, 'Mappe chaque code compta Malta au bon type de produit')
      ])
    ]),
    React.createElement('div', { key:'info', className:'alert alert-info' }, [
      React.createElement('span', { key:'i', className:'alert-icon' }, 'ℹ️'),
      React.createElement('div', { key:'b', className:'alert-body' }, [
        React.createElement('div', { key:'t', className:'alert-title' }, 'Import CSV + Exclusions tarifaires'),
        React.createElement('div', { key:'d' }, 'CSV : code;nom;exclusions (séparées par |). Exemple : "SEDIS;Sedis SA;TMD|Magasinage". Les exclusions désactivent automatiquement certaines composantes du tarif attendu pour ce client.')
      ])
    ]),
    ...Object.entries(params.productTypes).map(([pt, pd]) =>
      React.createElement('div', { key: pt, className:'client-card' }, [
        React.createElement('div', { key:'h', className:'client-hdr' }, [
          React.createElement('div', { key:'l', className:'client-hdr-left' }, [
            React.createElement('span', { key:'i', className:'client-hdr-icon' }, pd.icon),
            React.createElement('div', { key:'t' }, [
              React.createElement('span', { key:'1', className:'client-hdr-title' }, pd.label),
              React.createElement('span', { key:'2', className:'client-hdr-count' }, ` · ${pd.clients?.length || 0} clients`)
            ])
          ]),
          React.createElement('div', { key:'r', style:{display:'flex',gap:6} }, [
            React.createElement('label', { key:'imp', className:'btn btn-sec btn-sm', style:{cursor:'pointer'} }, [
              React.createElement('span', { key:'l' }, '📥 Import CSV'),
              React.createElement('input', {
                key:'i', type:'file', accept:'.csv,.txt', style:{display:'none'},
                onChange: (e) => onImportCSV(e, pt)
              })
            ]),
            React.createElement('button', {
              key:'add', className:'btn btn-primary btn-sm', onClick: () => addClient(pt)
            }, '+ Client')
          ])
        ]),
        React.createElement('div', { key:'list', className:'client-list' },
          (pd.clients || []).length === 0

// DETAIL MODAL — Pop-up détail d'une LTA avec édition complète
// ═══════════════════════════════════════════════════════════════════
function DetailModal({ row, rowIdx, handler, params, factureParsed, facture, malta, onClose, onUpdateRow, onPushLitige, toast }) {
  const [localRow, setLocalRow] = useState(() => JSON.parse(JSON.stringify(row)));
  const [note, setNote] = useState(row.note || '');

  useEffect(() => {
    setLocalRow(JSON.parse(JSON.stringify(row)));
    setNote(row.note || '');
  }, [row]);

  if (!row) return null;
  const prodInfo = localRow.productType ? params.productTypes[localRow.productType] : null;

  // ── Handlers d'édition locale ──
  const toggleLigneActive = (libelle) => {
    setLocalRow(prev => {
      const next = { ...prev, ligneOverrides: { ...(prev.ligneOverrides || {}) } };
      const current = next.ligneOverrides[libelle] || {};
      next.ligneOverrides[libelle] = { ...current, actif: current.actif === false ? true : false };
      return recomputeLocal(next);
    });
  };
  const setLigneOverride = (libelle, val) => {
    setLocalRow(prev => {
      const next = { ...prev, ligneOverrides: { ...(prev.ligneOverrides || {}) } };
      const current = next.ligneOverrides[libelle] || {};
      next.ligneOverrides[libelle] = { ...current, montantOverride: val === '' || val == null ? null : Number(val) };
      return recomputeLocal(next);
    });
  };
  const setHTFacture = (val) => {
    setLocalRow(prev => recomputeLocal({ ...prev, htFacture: Number(val) || 0 }));
  };
  const setTotalOverride = (val) => {
    setLocalRow(prev => recomputeLocal({
      ...prev,
      tarifAttenduOverride: val === '' || val == null ? null : Number(val)
    }));
  };
  const resetOverrides = () => {
    setLocalRow(prev => recomputeLocal({ ...prev, tarifAttenduOverride: null, ligneOverrides: {} }));
  };

  // Recalcul local (n'applique pas au state parent tant qu'on ne sauve pas)
  function recomputeLocal(r) {
    const out = { ...r };
    if (out.tarifAttenduOverride != null && !isNaN(Number(out.tarifAttenduOverride))) {
      out.tarifAttendu = Math.round(Number(out.tarifAttenduOverride) * 100) / 100;
    } else if (out.productType && out.poids != null && handler) {
      const calc = calcTarifAttendu(handler, out.productType, out.poids);
      let total = 0, someOk = false;
      const detail = [];
      for (const d of calc.detail) {
        const ov = out.ligneOverrides?.[d.libelle];
        const actif = ov?.actif !== false;
        const mm = (ov?.montantOverride != null && !isNaN(Number(ov.montantOverride))) ? Number(ov.montantOverride) : d.montant;
        if (actif && mm != null && !isNaN(mm)) { total += mm; someOk = true; }
        detail.push({ libelle: d.libelle, montant: mm, actif, err: d.err });
      }
      out.tarifAttendu = someOk ? Math.round(total * 100) / 100 : null;
      out.detailCalc = detail;
    }
    if (out.tarifAttendu != null) {
      out.ecart = Math.round((out.htFacture - out.tarifAttendu) * 100) / 100;
      const tol = Number(handler?.toleranceEcart || 0);
      out.verdict = Math.abs(out.ecart) <= tol ? 'ok' : 'ko';
    } else if (!out.dossierNum) {
      out.verdict = 'miss';
    } else {
      out.verdict = 'notarif';
      out.ecart = null;
    }
    return out;
  }

  const save = () => {
    onUpdateRow(rowIdx, {
      htFacture: localRow.htFacture,
      tarifAttenduOverride: localRow.tarifAttenduOverride,
      ligneOverrides: localRow.ligneOverrides,
      note
    });
    toast && toast('Modifications enregistrées', 'success');
    onClose();
  };

  const pushToLitige = async () => {
    // Save first
    const saved = { ...localRow, note };
    onUpdateRow(rowIdx, {
      htFacture: saved.htFacture,
      tarifAttenduOverride: saved.tarifAttenduOverride,
      ligneOverrides: saved.ligneOverrides,
      note,
      isLitigePushed: true
    });
    onPushLitige(saved);
    toast && toast('Ligne ajoutée aux litiges', 'success');
    onClose();
  };

  const verdictLabel = {
    ok: { txt: '✓ OK', cls: 'verdict-ok' },
    ko: { txt: '⚠ ÉCART', cls: 'verdict-ko' },
    miss: { txt: '? MALTA', cls: 'verdict-miss' },
    notarif: { txt: 'SANS TARIF', cls: 'verdict-notarif' }
  }[localRow.verdict] || { txt: '—', cls: '' };

  return React.createElement('div', {
    className: 'modal-bg',
    onClick: (e) => { if (e.target.className === 'modal-bg') onClose(); }
  }, React.createElement('div', { className: 'modal' }, [
    // HEADER
    React.createElement('div', { key:'h', className:'modal-hdr' }, [

        React.createElement('span', { key:'v', className: 'verdict ' + verdictLabel.cls }, verdictLabel.txt),
        localRow.isLitigePushed ? React.createElement('span', { key:'lit', className:'row-litige-badge' }, '⚖️ en litige') : null
      ]),
      React.createElement('button', { key:'c', className:'modal-close', onClick: onClose }, '×')
    ]),
    // BODY
    React.createElement('div', { key:'b', className:'modal-body' }, [
      // Infos Malta
      React.createElement('div', { key:'info', className:'dm-kv-grid' }, [
        React.createElement('div', { key:'1', className:'dm-kv-item' }, [
          React.createElement('div', { key:'l', className:'dm-kv-lbl' }, 'N° DOSSIER MALTA'),
          React.createElement('div', { key:'v', className:'dm-kv-val' }, localRow.dossierNum || '—')
        ]),
        React.createElement('div', { key:'2', className:'dm-kv-item' }, [
          React.createElement('div', { key:'l', className:'dm-kv-lbl' }, 'CODE CLIENT'),
          React.createElement('div', { key:'v', className:'dm-kv-val' }, localRow.codeClient || '—')
        ]),
        React.createElement('div', { key:'3', className:'dm-kv-item' }, [
          React.createElement('div', { key:'l', className:'dm-kv-lbl' }, 'CLIENT'),
          React.createElement('div', { key:'v', className:'dm-kv-val', style:{fontFamily:'var(--sans)'} }, localRow.client || '—')
        ]),
        React.createElement('div', { key:'4', className:'dm-kv-item' }, [
          React.createElement('div', { key:'l', className:'dm-kv-lbl' }, 'POIDS'),
          React.createElement('div', { key:'v', className:'dm-kv-val' }, localRow.poids != null ? fmtKg(localRow.poids) : '—')
        ]),
        React.createElement('div', { key:'5', className:'dm-kv-item' }, [

          React.createElement('div', { key:'v' },
            React.createElement('select', {
              className:'sel-inline', style:{width:'100%'},
              value: localRow.productType || '',
              onChange: (e) => setLocalRow(prev => recomputeLocal({ ...prev, productType: e.target.value || null }))
            }, [

            ])),
            React.createElement('tbody', { key:'b' },
              miss.map((r, i) => React.createElement('tr', { key:i, className:'miss-row' }, [
                React.createElement('td', { key:'1' }, r.ltaAffiche),
                React.createElement('td', { key:'2', style:{textAlign:'right'} }, (r.htFacture ?? 0).toFixed(2) + ' €')
              ]))
            )
          ])
        ]) : null,
        React.createElement('div', { key:'sig', style:{marginTop:20,fontSize:11,color:'#666',borderTop:'1px solid #ccc',paddingTop:8} },
          `Document généré par TAF VERICHECK v4.4 — TAF TRANS AIR FREIGHT`
        )
      ])
    ),
    React.createElement('div', { key:'f', className:'modal-footer' }, [
      React.createElement('button', { key:'c', className:'btn btn-ghost', onClick: onClose }, 'Fermer'),
      React.createElement('div', { key:'r', style:{display:'flex',gap:8,marginLeft:'auto'} }, [
        React.createElement('button', { key:'cp', className:'btn btn-sec', onClick: copyText }, '📋 Copier texte'),
        React.createElement('button', { key:'ml', className:'btn btn-sec', onClick: onMail }, '📧 Mail'),
        React.createElement('button', { key:'pr', className:'btn btn-primary', onClick: () => window.print() }, '🖨️ Imprimer')
      ])
    ])
  ]));
}

// PAGE LITIGES — Liste des litiges avec édition
// ═══════════════════════════════════════════════════════════════════
function PageLitiges({ litiges, updateLitige, removeLitige, params }) {
  const [filter, setFilter] = useState('all'); // all | ouvert | envoye | resolu

  const filtered = litiges.filter(l => filter === 'all' ? true : l.statut === filter);

  const copyEmailTemplate = (lit) => {
    const txt = `Objet : Litige facture N°${lit.numFacture} — AWB ${lit.ltaAffiche}

Madame, Monsieur,

Suite à notre vérification de la facture ${lit.numFacture} du ${lit.dateAffichage}, nous contestons le montant facturé sur l'AWB ${lit.ltaAffiche}.

Détails :
  • Dossier TAF : ${lit.dossierNum || '—'}
  • Client : ${lit.client || '—'}
  • Poids : ${lit.poids ?? '—'} kg
  • Montant facturé HT : ${(lit.htFacture ?? 0).toFixed(2)} €
  • Montant attendu HT (grille TAF) : ${(lit.tarifAttendu ?? 0).toFixed(2)} €
  • Écart constaté : ${(lit.ecart ?? 0).toFixed(2)} €

${lit.commentaire ? 'Note : ' + lit.commentaire + '\n\n' : ''}Nous vous prions de bien vouloir vérifier ce point et de nous adresser un avoir correspondant.

Cordialement,
Service Import — TAF Trans Air Freight
import@taftrans.fr`;
    navigator.clipboard.writeText(txt).then(
      () => alert('Email copié dans le presse-papier'),
      () => alert('Copie échouée')
    );
  };

  return React.createElement('div', { className:'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Litiges en cours'),
        React.createElement('div', { key:'s', className:'page-sub' }, `${litiges.length} litige(s) · ${litiges.filter(l => l.statut !== 'resolu').length} non résolu(s)`)
      ])
    ]),
    // Filtres
    React.createElement('div', { key:'filt', className:'subtabs' }, [
      ['all','Tous'],['ouvert','Ouverts'],['envoye','Envoyés'],['resolu','Résolus']
    ].map(([k, lbl]) =>
      React.createElement('button', {
        key:k, className: 'subtab' + (filter === k ? ' active' : ''),
        onClick: () => setFilter(k)
      }, [
        lbl,
        React.createElement('span', { key:'c', className:'subtab-badge' },
          k === 'all' ? litiges.length : litiges.filter(l => l.statut === k).length
        )
      ])
    )),
    // Liste
    filtered.length === 0
      ? React.createElement('div', { key:'e', className:'empty' }, [
          React.createElement('div', { key:'i', className:'empty-icon' }, '⚖️'),
          React.createElement('div', { key:'t', className:'empty-txt' }, filter === 'all' ? 'Aucun litige' : `Aucun litige ${filter}`),
          React.createElement('div', { key:'s', className:'empty-sub' }, 'Les litiges sont créés depuis l\'onglet Vérification en cliquant sur "Mettre en litige"')
        ])
      : React.createElement('div', { key:'list' },
          filtered.map(lit => React.createElement('div', { key: lit.id, className:'lit-card' }, [
            React.createElement('div', { key:'h', className:'lit-hdr' }, [
              React.createElement('div', { key:'l', className:'lit-hdr-left' }, [
                React.createElement('span', { key:'lta', className:'lit-lta' }, lit.ltaAffiche),
                React.createElement('span', { key:'f', className:'lit-facture' }, `Facture N°${lit.numFacture || '—'}`),
                React.createElement('span', { key:'d', style:{fontSize:11,color:'var(--muted)',fontFamily:'var(--mono)'} }, lit.dateAffichage),
                React.createElement('select', {
                  key:'st', className:'sel-inline',
                  value: lit.statut,
                  onChange: (e) => updateLitige(lit.id, { statut: e.target.value })
                }, [
                  React.createElement('option', { key:'1', value:'ouvert' }, '🟠 Ouvert'),
                  React.createElement('option', { key:'2', value:'envoye' }, '🔵 Envoyé'),
                  React.createElement('option', { key:'3', value:'resolu' }, '🟢 Résolu')
                ])
              ]),
              React.createElement('div', { key:'a', className:'lit-actions' }, [
                React.createElement('button', {
                  key:'m', className:'btn btn-sec btn-sm',
                  onClick: () => copyEmailTemplate(lit)
                }, '📋 Copier email'),
                React.createElement('button', {
                  key:'d', className:'btn btn-danger btn-sm',
                  onClick: () => { if (confirm('Supprimer ce litige ?')) removeLitige(lit.id); }
                }, '🗑 Supprimer')
              ])
            ]),
            React.createElement('div', { key:'g', className:'lit-grid' }, [
              { lbl: 'HANDLER',      val: lit.handlerNom || lit.handlerId || '—' },
              { lbl: 'DOSSIER',      val: lit.dossierNum || '—' },
              { lbl: 'CLIENT',       val: lit.client || '—' },
              { lbl: 'PRODUIT',      val: lit.productType ? (params.productTypes[lit.productType]?.label || lit.productType) : '—' },
              { lbl: 'POIDS',        val: lit.poids != null ? lit.poids + ' kg' : '—' },
              { lbl: 'HT FACTURÉ',   val: fmtEur(lit.htFacture), color: 'var(--amber)' },
              { lbl: 'HT ATTENDU',   val: fmtEur(lit.tarifAttendu), color: 'var(--green)' },
              { lbl: 'ÉCART',        val: fmtEur(lit.ecart), color: lit.ecart > 0 ? 'var(--red)' : 'var(--green)' }
            ].map((k, i) =>
              React.createElement('div', { key:i, className:'lit-kv' }, [
                React.createElement('div', { key:'l', className:'lit-kv-lbl' }, k.lbl),
                React.createElement('div', { key:'v', className:'lit-kv-val', style: k.color ? {color:k.color} : null }, k.val)
              ])
            )),
            React.createElement('textarea', {
              key:'c', className:'lit-comm', rows: 2,
              placeholder: 'Commentaire, statut de la relance, etc.',
              value: lit.commentaire || '',
              onChange: (e) => updateLitige(lit.id, { commentaire: e.target.value })
            })
          ]))
        )
  ]);
}

// PAGE ARCHIVES — Liste des synthèses PDF archivées
// ═══════════════════════════════════════════════════════════════════
function PageArchives() {
  const [archives, setArchives] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(null); // id en cours de download
  const [filterHandler, setFilterHandler] = useState('all');

  const load = async () => {
    setLoading(true); setErr('');
    try {
      const list = await loadArchivesIndex();
      setArchives(list);
    } catch (e) { setErr('Erreur chargement index : ' + e.message); }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const download = async (arc) => {
    setBusy(arc.id);
    try {
      const full = await loadArchiveFull(arc);
      if (!full) { alert('Archive introuvable sur Drive'); setBusy(null); return; }
      downloadArchivePDF(arc, full);
    } catch (e) { alert('Erreur : ' + e.message); }
    setBusy(null);
  };

  const remove = async (arc) => {
    if (!confirm(`Supprimer l'archive "${arc.pdfFilename}" de l'index ?\n(Le fichier PDF reste sur Drive, à supprimer manuellement si besoin)`)) return;
    setBusy(arc.id);
    try {
      await deleteArchive(arc.id);
      await load();
    } catch (e) { alert('Erreur : ' + e.message); }
    setBusy(null);
  };

  // Filter
  const handlers = useMemo(() => {
    const s = new Set();
    archives.forEach(a => a.handlerId && s.add(a.handlerId));
    return ['all', ...s];
  }, [archives]);
  const filtered = filterHandler === 'all' ? archives : archives.filter(a => a.handlerId === filterHandler);

  // Stats globales
  const totalHT = archives.reduce((a, b) => a + (b.htFacture || 0), 0);
  const totalEcart = archives.reduce((a, b) => a + (b.ecart || 0), 0);

  return React.createElement('div', { className:'page' }, [
    React.createElement('div', { key:'hdr', className:'page-hdr' }, [
      React.createElement('div', { key:'l' }, [
        React.createElement('h1', { key:'t', className:'page-title' }, 'Archives des synthèses PDF'),
        React.createElement('div', { key:'s', className:'page-sub' },
          `${archives.length} archive(s) stockée(s) sur Drive · Dossier TAF ops`
        )
      ]),
      React.createElement('button', {
        key:'r', className:'btn btn-sec',
        onClick: load, disabled: loading
      }, loading ? '⏳ Chargement...' : '🔄 Rafraîchir')
    ]),

    // Stats globales
    archives.length ? React.createElement('div', { key:'st', className:'stats-grid', style:{marginBottom:18} }, [
      React.createElement('div', { key:'1', className:'stat' }, [
        React.createElement('div', { key:'l', className:'stat-lbl' }, 'TOTAL ARCHIVES'),
        React.createElement('div', { key:'v', className:'stat-val c-amber' }, archives.length)
      ]),
      React.createElement('div', { key:'2', className:'stat' }, [
        React.createElement('div', { key:'l', className:'stat-lbl' }, 'HT TOTAL FACTURÉ'),
        React.createElement('div', { key:'v', className:'stat-val c-green' }, fmtEur(totalHT))
      ]),
      React.createElement('div', { key:'3', className:'stat' }, [
        React.createElement('div', { key:'l', className:'stat-lbl' }, 'ÉCART CUMULÉ'),
        React.createElement('div', { key:'v', className: 'stat-val ' + (totalEcart > 0 ? 'c-red' : 'c-green') }, fmtEur(totalEcart))
      ])
    ]) : null,

    // Filter
    handlers.length > 2 ? React.createElement('div', { key:'f', className:'subtabs' },
      handlers.map(h =>
        React.createElement('button', {
          key: h,
          className: 'subtab' + (filterHandler === h ? ' active' : ''),
          onClick: () => setFilterHandler(h)
        }, h === 'all' ? 'Tous' : h.toUpperCase())
      )
    ) : null,

    err ? React.createElement('div', { key:'e', className:'alert alert-err' },
      React.createElement('div', { className:'alert-body' }, err)
    ) : null,

    loading ? React.createElement('div', { key:'ld', className:'loader' }, [
      React.createElement('div', { key:'s', className:'spinner' }),
      React.createElement('div', { key:'t', style:{color:'var(--muted)',fontSize:12} }, 'Lecture des archives Drive...')
    ]) : null,

    !loading && filtered.length === 0
      ? React.createElement('div', { key:'em', className:'empty' }, [
          React.createElement('div', { key:'i', className:'empty-icon' }, '📚'),
          React.createElement('div', { key:'t', className:'empty-txt' }, 'Aucune archive'),
          React.createElement('div', { key:'s', className:'empty-sub' }, 'Génère un PDF depuis l\'onglet Vérification')
        ])
      : null,

    !loading && filtered.length ? React.createElement('div', { key:'list' },
      filtered.map(arc => React.createElement('div', {
        key: arc.id,
        style:{
          background:'var(--surface)',border:'1px solid var(--border)',
          borderRadius:10,padding:'16px 18px',marginBottom:10,
          display:'grid',gridTemplateColumns:'1fr auto',gap:14,alignItems:'center'
        }
      }, [
        React.createElement('div', { key:'l' }, [
          React.createElement('div', { key:'h', style:{display:'flex',gap:12,alignItems:'center',marginBottom:8,flexWrap:'wrap'} }, [
            React.createElement('span', { key:'f', style:{fontFamily:'var(--mono)',fontSize:15,fontWeight:800,color:'var(--amber)'} },
              'Facture ' + (arc.factureNum || '—')
            ),
            React.createElement('span', { key:'h', style:{fontSize:11,padding:'3px 9px',background:'var(--surface2)',border:'1px solid var(--border2)',borderRadius:4,fontFamily:'var(--mono)'} },
              arc.handlerNom || arc.handlerId || '—'
            ),
            React.createElement('span', { key:'d', style:{fontSize:11,color:'var(--muted)',fontFamily:'var(--mono)'} }, arc.dateAffichage),
            arc.koCount > 0 ? React.createElement('span', {
              key:'ko',
              style:{fontSize:10,padding:'2px 8px',background:'var(--red-bg)',color:'var(--red)',border:'1px solid rgba(239,68,68,.3)',borderRadius:3,fontWeight:700,letterSpacing:.5}
            }, `${arc.koCount} LITIGE`) : null
          ]),
          React.createElement('div', { key:'g', style:{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(120px, 1fr))',gap:12,fontSize:11} }, [
            { l:'LTA', v: arc.rowsCount },
            { l:'HT FACTURÉ', v: fmtEur(arc.htFacture), color:'var(--amber)' },
            { l:'HT ATTENDU', v: fmtEur(arc.htAttendu), color:'var(--green)' },
            { l:'ÉCART', v: fmtEur(arc.ecart), color: (arc.ecart||0) > 0 ? 'var(--red)' : 'var(--green)' }
          ].map((k, i) => React.createElement('div', { key:i }, [
            React.createElement('div', { key:'l', style:{fontSize:9,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',fontWeight:700} }, k.l),
            React.createElement('div', { key:'v', style:{fontFamily:'var(--mono)',fontSize:12,fontWeight:700,color: k.color || 'var(--text)'} }, k.v)
          ]))),
          React.createElement('div', { key:'fn', style:{fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)',marginTop:8} },
            '📄 ' + arc.pdfFilename
          )
        ]),
        React.createElement('div', { key:'r', style:{display:'flex',flexDirection:'column',gap:6} }, [
          React.createElement('button', {
            key:'d', className:'btn btn-primary btn-sm',
            disabled: busy === arc.id,
            onClick: () => download(arc)
          }, busy === arc.id ? '⏳ ...' : '📥 Télécharger PDF'),
          React.createElement('button', {
            key:'x', className:'btn btn-ghost btn-sm',
            disabled: busy === arc.id,
            onClick: () => remove(arc),
            title:'Retirer de l\'index'
          }, '🗑 Retirer')
        ])
      ]))
    ) : null
  ]);
}

// TOAST hook
// ═══════════════════════════════════════════════════════════════════
function useToast() {
  const [t, setT] = useState(null);
  const show = useCallback((msg, type) => {
    setT({ msg, type: type || 'info' });
    setTimeout(() => setT(null), 3000);
  }, []);
  const render = t ? React.createElement('div', { className: 'toast ' + (t.type || '') }, t.msg) : null;
  return [show, render];
}
