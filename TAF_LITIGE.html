<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF Litige Compagnies v1.1.0</title>
<style>
:root{--bg:#0b0e14;--s:#111520;--s2:#181d2e;--bd:#1e2540;--ac:#e05a2b;--ac2:#f0883e;--bl:#3b82f6;--gn:#22c55e;--yw:#f59e0b;--rd:#ef4444;--tx:#e8eaf2;--mt:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',sans-serif;min-height:100vh;}
.hdr{background:var(--s);border-bottom:1px solid var(--bd);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr-l{display:flex;align-items:center;gap:14px;}
.logo-ic{width:36px;height:36px;background:linear-gradient(135deg,#e05a2b,#f0883e);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-tx{font-size:14px;font-weight:700;}
.logo-sb{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.1em;}
.ver{background:var(--s2);border:1px solid var(--bd);padding:2px 8px;border-radius:4px;font-size:10px;font-family:monospace;color:var(--mt);}
.sbar{display:flex;gap:12px;padding:14px 24px;background:var(--s);border-bottom:1px solid var(--bd);}
.sc{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;}
.sc.r{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);}
.sc.y{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06);}
.sc.g{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.06);}
.sv{font-size:24px;font-weight:700;font-family:monospace;}
.sc.r .sv{color:var(--rd);}
.sc.y .sv{color:var(--yw);}
.sc.g .sv{color:var(--gn);}
.sl{font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}
.lay{display:flex;min-height:calc(100vh - 130px);}
.sdbar{width:230px;min-width:230px;background:var(--s);border-right:1px solid var(--bd);padding:12px;}
.stit{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mt);padding:4px 8px;margin-top:8px;}
.fbtn{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:7px;cursor:pointer;background:transparent;border:none;color:var(--tx);font-size:13px;width:100%;text-align:left;}
.fbtn:hover{background:var(--s2);}
.fbtn.act{background:var(--s2);border-left:3px solid var(--ac);padding-left:9px;}
.fc{font-family:monospace;font-size:11px;background:var(--bd);padding:1px 7px;border-radius:10px;color:var(--mt);}
.fc.r{background:rgba(239,68,68,.18);color:var(--rd);}
.fc.y{background:rgba(245,158,11,.18);color:var(--yw);}
.fc.g{background:rgba(34,197,94,.18);color:var(--gn);}
.fc.b{background:rgba(59,130,246,.18);color:var(--bl);}
.sd-note{margin-top:10px;padding:10px 12px;font-size:11px;color:var(--mt);line-height:1.7;background:var(--s2);border-radius:8px;border:1px solid var(--bd);}
.cnt{flex:1;padding:20px 24px;overflow-y:auto;}
.cnt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cnt-ttl{font-size:16px;font-weight:600;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.bp{background:var(--ac);color:#fff;}
.bp:hover{background:var(--ac2);}
.bs{background:var(--s2);color:var(--tx);border:1px solid var(--bd);}
.bs:hover{background:var(--bd);}
.bg{background:transparent;color:var(--mt);border:1px solid var(--bd);font-size:12px;}
.bg:hover{color:var(--tx);background:var(--s2);}
.bd2{background:rgba(239,68,68,.1);color:var(--rd);border:1px solid rgba(239,68,68,.28);}
.bd2:hover{background:rgba(239,68,68,.2);}
.lst{display:flex;flex-direction:column;gap:10px;}
.lc{background:var(--s);border:1px solid var(--bd);border-left:4px solid;border-radius:10px;padding:15px 18px;}
.lc.u{border-left-color:var(--rd);}
.lc.w{border-left-color:var(--yw);}
.lc.k{border-left-color:var(--gn);}
.lc.c{opacity:.55;border-left-color:var(--mt);}
.r1{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;}
.awb{font-family:monospace;font-size:13px;font-weight:700;color:var(--ac2);}
.cli{font-size:14px;font-weight:600;margin-top:2px;}
.dsc{font-size:12px;color:var(--mt);margin-top:2px;}
.mta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tag{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.t-al{background:var(--s2);border:1px solid var(--bd);color:var(--tx);}
.t-av{background:rgba(239,68,68,.12);color:var(--rd);border:1px solid rgba(239,68,68,.28);}
.t-mn{background:rgba(245,158,11,.12);color:var(--yw);border:1px solid rgba(245,158,11,.28);}
.t-rt{background:rgba(168,85,247,.12);color:#a855f7;border:1px solid rgba(168,85,247,.28);}
.t-ou{background:rgba(59,130,246,.12);color:var(--bl);border:1px solid rgba(59,130,246,.28);}
.t-co{background:rgba(245,158,11,.12);color:var(--yw);border:1px solid rgba(245,158,11,.28);}
.t-re{background:rgba(34,197,94,.12);color:var(--gn);border:1px solid rgba(34,197,94,.28);}
.t-pe{background:rgba(107,114,128,.12);color:var(--mt);border:1px solid rgba(107,114,128,.28);}
.amt{font-family:monospace;font-size:16px;font-weight:700;color:var(--ac2);flex-shrink:0;}
.r2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
.dls{display:flex;gap:12px;align-items:center;}
.dl-it{display:flex;flex-direction:column;align-items:center;gap:2px;}
.dc{font-family:monospace;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;}
.dc.ok{background:rgba(34,197,94,.12);color:var(--gn);}
.dc.wn{background:rgba(245,158,11,.12);color:var(--yw);}
.dc.ug{background:rgba(239,68,68,.12);color:var(--rd);}
.dc.ps{background:rgba(107,114,128,.1);color:var(--mt);text-decoration:line-through;}
.dsub{font-size:10px;color:var(--mt);}
.sep{width:1px;height:26px;background:var(--bd);}
.acts{display:flex;gap:6px;}
.nbox{margin-top:8px;padding:7px 11px;background:var(--s2);border-radius:6px;font-size:11px;color:var(--mt);border-left:2px solid var(--bd);}
.empty{text-align:center;padding:60px 20px;color:var(--mt);}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.mdl{background:var(--s);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:650px;max-height:90vh;overflow-y:auto;padding:26px;}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.mt2{font-size:17px;font-weight:600;}
.mcl{background:none;border:none;color:var(--mt);font-size:20px;cursor:pointer;padding:3px 6px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fp{display:flex;flex-direction:column;gap:5px;}
.fp.ful{grid-column:span 2;}
.fl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mt);}
.fi{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:9px 12px;color:var(--tx);font-size:13px;outline:none;width:100%;}
.fi:focus{border-color:var(--ac);}
textarea.fi{resize:vertical;min-height:70px;}
.fac{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd);}
.ltr{background:#fff;color:#222;border-radius:8px;padding:28px;font-family:Georgia,serif;font-size:13px;line-height:1.75;white-space:pre-wrap;margin-top:12px;}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-l">
    <div class="logo-ic">⚠️</div>
    <div><div class="logo-tx">TAF LITIGE COMPAGNIES</div><div class="logo-sb">Réclamations · Convention de Montréal</div></div>
    <span class="ver">v1.1.0</span>
    <span id="bridge-dot-lit" title="Bridge Drive" style="width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block;margin-left:4px"></span>
  </div>
  <button class="btn bp" onclick="openForm()">+ Nouveau litige</button>
</header>
<div class="sbar" id="sbar"></div>
<div class="lay">
  <aside class="sdbar">
    <div class="stit">Filtres</div>
    <button class="fbtn act" id="f-tous" onclick="setF('tous')">Tous les litiges <span class="fc b" id="cnt-tous">0</span></button>
    <button class="fbtn" id="f-urgents" onclick="setF('urgents')">⚡ Délais critiques <span class="fc r" id="cnt-urgents">0</span></button>
    <button class="fbtn" id="f-ouverts" onclick="setF('ouverts')">Ouverts <span class="fc b" id="cnt-ouverts">0</span></button>
    <button class="fbtn" id="f-cours" onclick="setF('cours')">En cours <span class="fc y" id="cnt-cours">0</span></button>
    <button class="fbtn" id="f-regles" onclick="setF('regles')">Réglés <span class="fc g" id="cnt-regles">0</span></button>
    <button class="fbtn" id="f-perdus" onclick="setF('perdus')">Perdus <span class="fc" id="cnt-perdus">0</span></button>
    <div class="sd-note">📌 <b>J+14</b> Réserves avaries/manquants<br>📌 <b>J+21</b> Réserves retards<br>📌 <b>2 ans</b> Action en justice</div>
  </aside>
  <main class="cnt">
    <div class="cnt-top"><div class="cnt-ttl" id="ttl">Tous les litiges</div></div>
    <div class="lst" id="lst"></div>
  </main>
</div>
<div class="ov" id="fModal" style="display:none">
  <div class="mdl">
    <div class="mh"><div class="mt2" id="fTtl">Nouveau litige</div><button class="mcl" onclick="closeF()">✕</button></div>
    <div class="fg">
      <div class="fp"><label class="fl">N° AWB *</label><input class="fi" id="fAwb" placeholder="057-12345678"></div>
      <div class="fp"><label class="fl">Client *</label><input class="fi" id="fCli" placeholder="Nom client"></div>
      <div class="fp"><label class="fl">Compagnie</label><select class="fi" id="fCmp"><option>Air France</option><option>Air Algerie</option><option>Corsair</option><option>Emirates</option><option>Ethiopian</option><option>Qatar Airways</option><option>Turkish Airlines</option><option>WFS</option><option>Autre</option></select></div>
      <div class="fp"><label class="fl">Type</label><select class="fi" id="fTyp"><option>Avarie</option><option>Manquant</option><option>Retard</option></select></div>
      <div class="fp"><label class="fl">Date de constat</label><input type="date" class="fi" id="fDat"></div>
      <div class="fp"><label class="fl">Montant (€)</label><input type="number" class="fi" id="fMnt" placeholder="0"></div>
      <div class="fp ful"><label class="fl">Description</label><input class="fi" id="fDsc" placeholder="Nature du sinistre"></div>
      <div class="fp"><label class="fl">Statut</label><select class="fi" id="fStt"><option>Ouvert</option><option>En cours</option><option>Réglé</option><option>Perdu</option></select></div>
      <div class="fp ful"><label class="fl">Notes internes</label><textarea class="fi" id="fNot" placeholder="Suivi, relances..."></textarea></div>
    </div>
    <div class="fac"><button class="btn bg" onclick="closeF()">Annuler</button><button class="btn bp" onclick="saveF()">💾 Enregistrer</button></div>
  </div>
</div>
<div class="ov" id="lModal" style="display:none">
  <div class="mdl" style="max-width:750px">
    <div class="mh"><div class="mt2" id="lTtl">Lettre</div><button class="mcl" onclick="document.getElementById('lModal').style.display='none'">✕</button></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn bs" onclick="copyL()">📋 Copier</button>
      <button class="btn bg" onclick="window.print()">🖨️ Imprimer</button>
    </div>
    <div class="ltr" id="lCnt"></div>
  </div>
</div>
<script>
// ── BRIDGE DRIVE V1.1 ────────────────────────────────────────────────
const BRIDGE_CONFIG={
  proxyUrl:"https://script.google.com/macros/s/AKfycbyi-yM6BSllYmM9Kmb21-C935rXPrIcwbUCXDAKIP6sADk9XwnezSTmwGmKHSAL7GH2/exec",
  driveFolder:"143DZMp79_EfrVAjyOMquBU0L-JXlKdnF",
  bridgeFileLitige:"taf_bridge_litige.json",
  bridgeFileRec:"taf_bridge_recouvrement.json"
};
let _recouvrementData=null;
async function bridgeDriveUpload(filename,data){
  try{
    const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const resp=await fetch(BRIDGE_CONFIG.proxyUrl,{
      method:"POST",headers:{"Content-Type":"text/plain"},redirect:"follow",
      body:JSON.stringify({action:"uploadPDF",filename,mimeType:"application/json",base64:b64,folder:BRIDGE_CONFIG.driveFolder})
    });
    if(resp.ok){const r=await resp.json();setBridgeDot('ok');return r;}
  }catch(err){
    try{
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      await fetch(BRIDGE_CONFIG.proxyUrl,{method:"POST",headers:{"Content-Type":"text/plain"},redirect:"follow",mode:"no-cors",
        body:JSON.stringify({action:"uploadPDF",filename,mimeType:"application/json",base64:b64,folder:BRIDGE_CONFIG.driveFolder})});
      setBridgeDot('ok');
    }catch(e2){setBridgeDot('err');}
  }
  return null;
}
async function bridgeDriveRead(filename){
  try{
    const resp=await fetch(BRIDGE_CONFIG.proxyUrl+"?action=read&file="+encodeURIComponent(filename),{redirect:"follow"});
    if(!resp.ok)return null;
    const t=await resp.text();
    if(!t||t.trim().length<5)return null;
    const d=JSON.parse(t);
    if(d&&d.error)return null;
    return d;
  }catch(err){return null;}
}
function setBridgeDot(state){
  const d=document.getElementById('bridge-dot-lit');
  if(!d)return;
  d.style.background=state==='ok'?'#22c55e':state==='err'?'#ef4444':'#6b7280';
}
// Publie les litiges vers le Drive pour que TAF_RECOUVREMENT (et autres) puissent les lire
async function publishLitiges(){
  const payload={
    source:"TAF_LITIGE",
    version:"1.1.0",
    timestamp:new Date().toISOString(),
    total:data.length,
    nb_urgents:data.filter(l=>{const u=urg(l);return u==='u'||u==='w';}).length,
    total_encours:data.filter(l=>l.statut!=='Réglé'&&l.statut!=='Perdu').reduce((s,l)=>s+(+l.montant||0),0),
    litiges:data.map(l=>({
      id:l.id,awb:l.awb,client:l.client,compagnie:l.compagnie,
      type:l.type,description:l.description,dateConstat:l.dateConstat,
      montant:+l.montant||0,statut:l.statut,notes:l.notes||''
    }))
  };
  await bridgeDriveUpload(BRIDGE_CONFIG.bridgeFileLitige,payload);
  console.log('[BRIDGE-LITIGE] Publié:',data.length,'litiges');
}
// Lit les données de TAF_RECOUVREMENT pour enrichir la vue
async function pullRecouvrement(){
  const d=await bridgeDriveRead(BRIDGE_CONFIG.bridgeFileRec);
  if(d&&d.clients){
    _recouvrementData=d;
    console.log('[BRIDGE-REC] Clients impayés:',Object.keys(d.clients).length);
  }
}
// Trouver si un client a des impayés côté RECOUVREMENT
function getRecouvrementInfoForClient(clientName){
  if(!_recouvrementData||!_recouvrementData.clients)return null;
  const norm=s=>(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const n=norm(clientName);
  for(const code in _recouvrementData.clients){
    const c=_recouvrementData.clients[code];
    if(norm(c.nom||code).includes(n)||n.includes(norm(c.nom||code))){
      return {code,...c};
    }
  }
  return null;
}

const KEY='taf_litiges_v1';
const SAMPLE=[
  {id:1,awb:'057-12345678',client:'CAPMARIN IMPORT',compagnie:'Air France',type:'Avarie',description:'Cartons endommagés — 45kg saumon',dateConstat:'2026-04-01',montant:1240,statut:'Ouvert',notes:'Photos prises à réception.'},
  {id:2,awb:'235-98765432',client:'EXOFLORE PARIS',compagnie:'Ethiopian',type:'Manquant',description:'3 colis non livrés — Fleurs coupées',dateConstat:'2026-03-28',montant:890,statut:'En cours',notes:'Réclamation formelle envoyée.'},
  {id:3,awb:'176-11223344',client:'AQUA VIVANT',compagnie:'Qatar Airways',type:'Retard',description:'Vol dérouté — homards morts',dateConstat:'2026-04-05',montant:3200,statut:'Ouvert',notes:''},
];
let data=[],curF='tous',editId=null;
function load(){try{data=JSON.parse(localStorage.getItem(KEY))||SAMPLE;}catch{data=SAMPLE;}}
function sv(){localStorage.setItem(KEY,JSON.stringify(data));publishLitiges().catch(()=>{});}
function dL(dc,n){const d=new Date(dc),dl=new Date(d.getTime()+n*864e5);return Math.ceil((dl-new Date())/864e5);}
function urg(l){if(l.statut==='Réglé'||l.statut==='Perdu')return'c';const d14=dL(l.dateConstat,14),d21=dL(l.dateConstat,21);if(d14<=0&&d21<=0)return'c';if(d14<=3||d21<=3)return'u';if(d14<=7||d21<=7)return'w';return'k';}
function chip(days,lbl){const c=days<0?'ps':days<=3?'ug':days<=7?'wn':'ok';return`<div class="dl-it"><span class="dc ${c}">${days<0?'EXPIRÉ':'J-'+days}</span><span class="dsub">${lbl}</span></div>`;}
function tagT(t){const m={Avarie:'t-av',Manquant:'t-mn',Retard:'t-rt'};return`<span class="tag ${m[t]}">${t}</span>`;}
function tagS(s){const m={Ouvert:'t-ou','En cours':'t-co','Réglé':'t-re',Perdu:'t-pe'};return`<span class="tag ${m[s]}">${s}</span>`;}
function render(){
  sv();
  const ugu=data.filter(l=>{const u=urg(l);return u==='u'||u==='w';});
  const enc=data.filter(l=>l.statut!=='Réglé'&&l.statut!=='Perdu').reduce((a,b)=>a+(+b.montant||0),0);
  const reg=data.filter(l=>l.statut==='Réglé').reduce((a,b)=>a+(+b.montant||0),0);
  document.getElementById('sbar').innerHTML=
    `<div class="sc r"><div class="sv">${ugu.length}</div><div class="sl">⚡ Délais critiques</div></div>
     <div class="sc y"><div class="sv">${enc.toLocaleString('fr-FR')} €</div><div class="sl">💰 En cours</div></div>
     <div class="sc g"><div class="sv">${reg.toLocaleString('fr-FR')} €</div><div class="sl">✅ Récupéré</div></div>
     <div class="sc"><div class="sv" style="color:var(--bl)">${data.length}</div><div class="sl">📋 Total</div></div>`;
  document.getElementById('cnt-tous').textContent=data.length;
  document.getElementById('cnt-urgents').textContent=ugu.length;
  document.getElementById('cnt-ouverts').textContent=data.filter(l=>l.statut==='Ouvert').length;
  document.getElementById('cnt-cours').textContent=data.filter(l=>l.statut==='En cours').length;
  document.getElementById('cnt-regles').textContent=data.filter(l=>l.statut==='Réglé').length;
  document.getElementById('cnt-perdus').textContent=data.filter(l=>l.statut==='Perdu').length;
  ['tous','urgents','ouverts','cours','regles','perdus'].forEach(f=>{document.getElementById('f-'+f).className='fbtn'+(curF===f?' act':'');});
  let fil=data;
  if(curF==='urgents')fil=ugu;
  else if(curF==='ouverts')fil=data.filter(l=>l.statut==='Ouvert');
  else if(curF==='cours')fil=data.filter(l=>l.statut==='En cours');
  else if(curF==='regles')fil=data.filter(l=>l.statut==='Réglé');
  else if(curF==='perdus')fil=data.filter(l=>l.statut==='Perdu');
  const lst=document.getElementById('lst');
  if(!fil.length){lst.innerHTML='<div class="empty"><div style="font-size:42px;margin-bottom:12px">🎉</div>Aucun litige dans cette catégorie</div>';return;}
  lst.innerHTML=fil.map(l=>{
    const d14=dL(l.dateConstat,14),d21=dL(l.dateConstat,21),u=urg(l);
    const recInfo=getRecouvrementInfoForClient(l.client);
    const recBadge=recInfo?`<span class="tag" style="background:rgba(224,90,43,.15);color:var(--ac);border:1px solid rgba(224,90,43,.4);cursor:help" title="Ce client a ${(recInfo.solde||0).toLocaleString('fr-FR')} € d'impayés chez Recouvrement">⚠️ Impayé ${(recInfo.solde||0).toLocaleString('fr-FR')} €</span>`:'';
    return`<div class="lc ${u}">
      <div class="r1">
        <div>
          <div class="awb">${l.awb}</div>
          <div class="cli">${l.client}</div>
          <div class="dsc">${l.description||''}</div>
          <div class="mta"><span class="tag t-al">${l.compagnie}</span>${tagT(l.type)}${tagS(l.statut)}${recBadge}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="amt">${(+l.montant||0).toLocaleString('fr-FR')} €</div>
          <div style="font-size:11px;color:var(--mt);margin-top:4px">Constaté le ${new Date(l.dateConstat).toLocaleDateString('fr-FR')}</div>
        </div>
      </div>
      <div class="r2">
        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mt);margin-bottom:4px">Délais Convention Montréal</div>
          <div class="dls">${chip(d14,'J+14 réserves')}<div class="sep"></div>${chip(d21,'J+21 retards')}</div>
        </div>
        <div class="acts">
          <button class="btn bg" onclick="showL(${l.id})">📄 Lettre</button>
          <button class="btn bs" onclick="openForm(${l.id})" style="padding:5px 10px;font-size:12px">✏️</button>
          <button class="btn bd2" onclick="del(${l.id})" style="padding:5px 10px;font-size:12px">🗑</button>
        </div>
      </div>
      ${l.notes?`<div class="nbox">📝 ${l.notes}</div>`:''}
    </div>`;
  }).join('');
}
function setF(f){curF=f;render();}
function openForm(id=null){
  editId=id;
  const t=new Date().toISOString().slice(0,10);
  if(id){const l=data.find(x=>x.id===id);document.getElementById('fTtl').textContent='Modifier';document.getElementById('fAwb').value=l.awb;document.getElementById('fCli').value=l.client;document.getElementById('fCmp').value=l.compagnie;document.getElementById('fTyp').value=l.type;document.getElementById('fDat').value=l.dateConstat;document.getElementById('fMnt').value=l.montant;document.getElementById('fDsc').value=l.description;document.getElementById('fStt').value=l.statut;document.getElementById('fNot').value=l.notes;}
  else{document.getElementById('fTtl').textContent='Nouveau litige';['fAwb','fCli','fMnt','fDsc','fNot'].forEach(i=>document.getElementById(i).value='');document.getElementById('fCmp').value='Air France';document.getElementById('fTyp').value='Avarie';document.getElementById('fDat').value=t;document.getElementById('fStt').value='Ouvert';}
  document.getElementById('fModal').style.display='flex';
}
function closeF(){document.getElementById('fModal').style.display='none';}
function saveF(){
  const awb=document.getElementById('fAwb').value.trim(),cli=document.getElementById('fCli').value.trim();
  if(!awb||!cli){alert('AWB et Client sont requis');return;}
  const o={id:editId||Date.now(),awb,client:cli,compagnie:document.getElementById('fCmp').value,type:document.getElementById('fTyp').value,dateConstat:document.getElementById('fDat').value,montant:+document.getElementById('fMnt').value||0,description:document.getElementById('fDsc').value,statut:document.getElementById('fStt').value,notes:document.getElementById('fNot').value};
  if(editId)data=data.map(x=>x.id===editId?o:x);else data.push(o);
  closeF();render();
}
function del(id){if(confirm('Supprimer ?')){data=data.filter(x=>x.id!==id);render();}}
function showL(id){
  const l=data.find(x=>x.id===id);
  const today=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('lTtl').textContent='📄 Lettre — '+l.awb;
  document.getElementById('lCnt').textContent=`Roissy CDG, le ${today}\n\nTrans Air Freight\nZone Fret 6 — Bâtiment GARONOR\n95731 Roissy CDG Cedex\n\nÀ l'attention du Service Litige\n${l.compagnie}\n\nOBJET : Déclaration de réserves / Demande d'indemnisation\nLTA n° ${l.awb}\n\nMadame, Monsieur,\n\nPar la présente, Trans Air Freight, commissionnaire en douane et transitaire aérien, agissant pour le compte de ${l.client}, formule une réclamation formelle.\n\nNature du sinistre : ${l.type}\nDescription : ${l.description}\nDate de constat : ${new Date(l.dateConstat).toLocaleDateString('fr-FR')}\nMontant réclamé : ${(+l.montant||0).toLocaleString('fr-FR')} €\n\nConformément à la Convention de Montréal (1999), art. 31, nous vous demandons d'ouvrir un dossier de sinistre et de nous faire parvenir votre accusé de réception.\n\nVeuillez agréer, Madame, Monsieur, nos salutations distinguées.\n\nChristophe Hermann\nDirecteur Import — Trans Air Freight\nchristophe@taftrans.fr`;
  document.getElementById('lModal').style.display='flex';
}
function copyL(){navigator.clipboard.writeText(document.getElementById('lCnt').textContent).then(()=>alert('Copié !'));}
load();render();
// V1.1 — Bridge Drive : publier + lire recouvrement au démarrage
(async function initBridge(){
  try{
    await pullRecouvrement();
    await publishLitiges();
    render(); // re-render avec les badges impayés
  }catch(e){console.warn('[BRIDGE] init error:',e.message);}
})();
</script>
