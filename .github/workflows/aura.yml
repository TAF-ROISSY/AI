name: Aura (Mac) — compilation et publication

# À chaque envoi touchant le dossier aura/ :
#   1. compile Aura sur un Mac GitHub (détecte les erreurs) ;
#   2. si le numéro de aura/VERSION n'a pas encore de release, publie
#      « aura-vX.Y.Z » avec Aura.zip : les Aura installées se mettent à jour.
on:
  push:
    branches: [main]
    paths: ['aura/**', '.github/workflows/aura.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-build
  cancel-in-progress: false

jobs:
  aura:
    runs-on: macos-15
    defaults:
      run:
        working-directory: aura
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if gh release view "aura-v$V" >/dev/null 2>&1; then
            echo "PUBLIER=non" >> "$GITHUB_ENV"
            echo "aura-v$V existe déjà : compilation de contrôle uniquement."
          else
            echo "PUBLIER=oui" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compilation (contrôle rapide, Apple Silicon)
        if: env.PUBLIER == 'non'
        run: |
          chmod +x build_app.sh
          set -o pipefail
          ARCHS="arm64" ./build_app.sh 2>&1 | tee build.log

      - name: Compilation universelle (Apple Silicon + Intel)
        if: env.PUBLIER == 'oui'
        run: |
          chmod +x build_app.sh
          set -o pipefail
          ARCHS="arm64 x86_64" BUILD_NUMBER="${{ github.run_number }}" ./build_app.sh 2>&1 | tee build.log

      - name: Remontée des erreurs de compilation
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          # Une note par erreur (10 max) + une note récapitulative lisible via l'API
          grep -E ": error: " build.log | sort -u > errors.txt || true
          head -10 errors.txt | while IFS= read -r l; do
            f=$(echo "$l" | cut -d: -f1); n=$(echo "$l" | cut -d: -f2); m=$(echo "$l" | cut -d: -f4- | sed 's/^ error: //')
            echo "::error file=aura/$f,line=$n::$m"
          done
          ALL=$( (cat errors.txt; echo "----"; tail -40 build.log) | head -c 60000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Journal de compilation::$ALL"

      - name: Publication de la version
        if: env.PUBLIER == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="Nouvelle version d'Aura."
          gh release create "aura-v$VERSION" build/Aura.zip \
            --title "Aura $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
