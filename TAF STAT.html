<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF ANALYSE PRO v3.0</title>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #07090e; --bg2: #0d1118; --bg3: #141b28; --card: #0f1520; --border: #1a2438;
  --gold: #f5a623; --teal: #22d3ee; --blue: #6366f1; --purple: #a78bfa; --pink: #f472b6;
  --red: #ef4444; --green: #22c55e; --orange: #f59e0b;
  --text: #e1e5f0; --text2: #7a8599; --text3: #454d5e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; min-height: 100vh; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* VERSION BADGE */
.version-badge { position: fixed; bottom: 8px; right: 12px; font-size: 9px; color: var(--text3); font-family: monospace; z-index: 999; opacity: 0.5; }

/* HEADER */
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 22px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { width: 34px; height: 34px; background: linear-gradient(135deg, var(--blue), var(--pink)); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.app-title { font-size: 15px; font-weight: 700; letter-spacing: .05em; }
.ver-tag { background: var(--bg3); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-family: monospace; color: var(--text3); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.sync-label { font-size: 10px; margin-left: 4px; }

/* TABS */
.tabs { display: flex; gap: 2px; background: var(--bg3); border-radius: 8px; padding: 3px; }
.tab-btn { padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text3); font-family: inherit; transition: all .15s; }
.tab-btn.active { background: var(--blue); color: #fff; }

/* BUTTONS */
.btn { border: none; cursor: pointer; border-radius: 7px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-family: inherit; padding: 7px 14px; font-size: 12px; transition: all .15s; }
.btn-sm { padding: 4px 10px; font-size: 10px; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #ffd700); color: #000; }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-teal { background: rgba(34,211,238,0.09); color: var(--teal); border: 1px solid rgba(34,211,238,0.19); }
.btn-red { background: rgba(239,68,68,0.09); color: var(--red); }
.btn-firebase { background: linear-gradient(135deg, #FFA000, #F57C00); color: #fff; }
.btn:hover { filter: brightness(1.15); }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; animation: fadeIn .3s ease; }
.card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg2); }
.card-header span { font-size: 13px; font-weight: 700; }
.card-body { padding: 14px 16px; }

/* KPI BOXES */
.kpi-grid { display: grid; gap: 10px; margin-bottom: 16px; }
.kpi-grid-6 { grid-template-columns: repeat(6, 1fr); }
.kpi-grid-5 { grid-template-columns: repeat(5, 1fr); }
.kpi-box { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 14px 16px; position: relative; overflow: hidden; }
.kpi-box.alert { border-color: rgba(239,68,68,0.25); }
.kpi-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); margin-bottom: 5px; }
.kpi-value { font-size: 26px; font-weight: 800; line-height: 1; font-family: monospace; }
.kpi-sub { font-size: 10px; color: var(--text3); margin-top: 3px; }
.kpi-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }

/* STAT ROWS */
.stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(26,36,56,0.08); }
.stat-label { font-size: 12px; color: var(--text2); }
.stat-value { font-size: 13px; font-weight: 600; font-family: monospace; }

/* INPUTS */
.inp-group { margin-bottom: 10px; }
.inp-label { font-size: 9px; font-weight: 700; color: var(--text2); text-transform: uppercase; display: block; margin-bottom: 4px; }
.inp { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 7px 11px; color: var(--text); font-size: 12px; outline: none; width: 100%; font-family: inherit; }
.inp:focus { border-color: var(--blue); }

/* GRID UTILS */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }

/* TABLE */
.data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.data-table th { text-align: left; padding: 6px 8px; font-size: 9px; font-weight: 700; color: var(--text3); border-bottom: 1px solid var(--border); background: var(--bg2); }
.data-table td { padding: 5px 8px; font-size: 10px; }
.status-badge { padding: 1px 5px; border-radius: 3px; font-size: 9px; }

/* DROPZONE */
.dropzone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all .2s; }
.dropzone:hover { border-color: var(--blue); background: rgba(99,102,241,0.05); }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 340px; text-align: center; }
.login-title { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--blue), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.pin-input { width: 100%; height: 50px; font-size: 28px; font-family: monospace; letter-spacing: 10px; text-align: center; background: var(--bg3); border: 2px solid var(--border); border-radius: 8px; color: var(--text); outline: none; }
.pin-input:focus { border-color: var(--blue); }

/* TOAST */
.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; background: var(--card); border-radius: 8px; font-size: 12px; z-index: 200; animation: fadeIn .2s; }

/* CONTENT */
.content { padding: 20px 22px; }

/* AI REPORT */
.ai-report { font-size: 13px; line-height: 1.8; white-space: pre-wrap; }

/* CROSS APP */
.cross-box { padding: 10px; background: var(--bg3); border-radius: 8px; text-align: center; }
.cross-value { font-size: 20px; font-weight: 800; }
.cross-label { font-size: 9px; color: var(--text3); }

/* INTER-APP CONFIG */
.app-card { padding: 14px; background: var(--bg3); border-radius: 10px; text-align: center; }
.app-icon { font-size: 24px; margin-bottom: 6px; }
.app-name { font-size: 11px; font-weight: 700; color: var(--gold); margin-bottom: 3px; }
.app-status { font-size: 9px; }
.app-path { font-size: 8px; color: var(--text3); margin-top: 2px; font-family: monospace; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .kpi-grid-6 { grid-template-columns: repeat(3, 1fr); }
  .kpi-grid-5 { grid-template-columns: repeat(3, 1fr); }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2-1 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-title">🔥 TAF ANALYSE PRO</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:24px;">v3.0.0 — Standalone Edition</div>
    <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="4" autofocus>
    <div style="font-size:10px;color:var(--text3);margin-top:12px;">PIN 4 chiffres</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">
  <header class="header">
    <div class="header-left">
      <div class="logo">🔥</div>
      <span class="app-title">TAF ANALYSE PRO</span>
      <span class="ver-tag">v3.0.0</span>
      <span id="syncIndicator" style="display:flex;align-items:center;gap:4px;font-size:10px;">
        <span id="syncDot" class="sync-dot" style="background:var(--text3)"></span>
        <span id="syncText" class="sync-label" style="color:var(--text3)"></span>
      </span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="dash" onclick="switchTab('dash')">📊 Dashboard</button>
      <button class="tab-btn" data-tab="data" onclick="switchTab('data')">📥 Données</button>
      <button class="tab-btn" data-tab="ai" onclick="switchTab('ai')">🤖 Analyse IA</button>
      <button class="tab-btn" data-tab="config" onclick="switchTab('config')">⚙️ Config</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost btn-sm" onclick="exportJSON()">⬇️ Export</button>
      <button class="btn btn-ghost btn-sm" onclick="lockApp()">🔓</button>
    </div>
  </header>

  <div class="content">
    <div id="tab-dash"></div>
    <div id="tab-data" style="display:none;"></div>
    <div id="tab-ai" style="display:none;"></div>
    <div id="tab-config" style="display:none;"></div>
  </div>
</div>

<!-- VERSION BADGE -->
<div class="version-badge">TAF ANALYSE PRO v3.0.0</div>

<div id="toastContainer"></div>

<script>
// ═══════════════════════════════════════════════════
// TAF ANALYSE PRO v3.0.0 — HTML STANDALONE
// Analyste financier ultra-précis pour fret aérien
// ═══════════════════════════════════════════════════

const VER = "3.0.0";
const LOCAL_KEY = "taf_analyse_v3";
const TEAM_SIZE = 5;
const CHART_COLORS = ['#6366f1','#22d3ee','#f5a623','#f472b6','#a78bfa','#22c55e','#f59e0b','#ef4444'];

// ═══ STATE ═══
let state = { data: [], config: { firebaseUrl: "", firebaseToken: "", apiKey: "", pin: "2709" }, crossData: { recouvrement: null, facturation: null, ops: null, commercial: null } };
let currentTab = "dash";
let aiText = "";
let aiLoading = false;
let chartInstances = {};

// ═══ FIREBASE SERVICE ═══
const fb = {
  url: "", token: "", ok: false, last: null,
  cfg(u, t = "") { this.url = (u || "").replace(/\/$/, ""); this.token = t; this.ok = !!this.url; },
  _u(p) { let u = `${this.url}/${p}.json`; if (this.token) u += `?auth=${this.token}`; return u; },
  async get(p) { if (!this.ok) return null; try { const r = await fetch(this._u(p)); if (!r.ok) return null; this.last = new Date(); return await r.json(); } catch { return null; } },
  async set(p, d) { if (!this.ok) return false; try { const r = await fetch(this._u(p), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); this.last = new Date(); return r.ok; } catch { return false; } },
  async test() { if (!this.url) return false; try { const r = await fetch(this._u("_ping"), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ts: Date.now(), app: "taf_stat", v: VER }) }); this.ok = r.ok; return r.ok; } catch { return false; } }
};

// ═══ HELPERS ═══
const fmt = (n, d = 0) => n != null ? Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d }) : "—";
const fmtK = (n) => n >= 1000000 ? (n / 1000000).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(0) + "k" : fmt(n);
const pct = (n) => n != null ? n.toFixed(1) + "%" : "—";
const today = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ═══ TOAST ═══
function showToast(msg, type = "ok") {
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = "toast";
  t.style.border = `1px solid ${type === "ok" ? "rgba(34,197,94,0.19)" : "rgba(239,68,68,0.19)"}`;
  t.innerHTML = `${type === "ok" ? "✅" : "❌"} ${esc(msg)}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ═══ SYNC UI ═══
function updateSync(s) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  const colors = { offline: "var(--text3)", syncing: "var(--gold)", synced: "var(--green)", error: "var(--red)" };
  if (dot) { dot.style.background = colors[s] || colors.offline; dot.style.boxShadow = s === "synced" ? "0 0 6px rgba(34,197,94,0.37)" : "none"; }
  if (txt) { txt.style.color = colors[s] || colors.offline; txt.textContent = s === "synced" ? "🔥 Firebase" : s === "syncing" ? "Sync..." : s === "error" ? "Erreur" : ""; }
}

// ═══ PERSISTENCE ═══
let saveTimer = null;
function saveState() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (fb.ok) { updateSync("syncing"); const ok = await fb.set("taf_stat", state); updateSync(ok ? "synced" : "error"); }
  }, 800);
}

function loadState() {
  try {
    const s = localStorage.getItem(LOCAL_KEY);
    if (s) { const p = JSON.parse(s); state = { ...state, ...p }; if (p.config?.firebaseUrl) fb.cfg(p.config.firebaseUrl, p.config.firebaseToken); }
  } catch {}
  (async () => {
    if (fb.ok) {
      updateSync("syncing");
      const remote = await fb.get("taf_stat");
      if (remote) { state = { ...state, ...remote }; localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }
      const comm = await fb.get("taf_commercial");
      if (comm?.prospects) {
        state.crossData = state.crossData || {};
        state.crossData.commercial = {
          prospects: comm.prospects.length,
          gagnes: comm.prospects.filter(p => p.statut === "gagne").length,
          pipeline: comm.prospects.filter(p => ["cotation","negociation"].includes(p.statut)).reduce((a, p) => a + (p.valeur || 0), 0)
        };
      }
      updateSync("synced");
    }
    renderCurrentTab();
  })();
}

// ═══ COMPUTE KPIs ═══
function computeKPIs() {
  const data = state.data || [];
  if (!data.length) return null;
  const totalCA = data.reduce((a, d) => a + (d.amount || 0), 0);
  const totalKg = data.reduce((a, d) => a + (d.weight || 0), 0);
  const totalHandling = data.reduce((a, d) => a + (d.handlingCost || 0), 0);
  const totalCustoms = data.reduce((a, d) => a + (d.customsCost || 0), 0);
  const totalCost = totalHandling + totalCustoms;
  const grossProfit = totalCA - totalCost;
  const grossMargin = totalCA ? (grossProfit / totalCA) * 100 : 0;
  const nbDossiers = data.length;
  const avgDays = data.reduce((a, d) => a + (d.days || 0), 0) / nbDossiers;
  const onTime = data.filter(d => d.status !== "retard").length;
  const otif = (onTime / nbDossiers) * 100;
  const retards = data.filter(d => d.status === "retard").length;

  const clientMap = {};
  data.forEach(d => { clientMap[d.client] = (clientMap[d.client] || 0) + (d.amount || 0); });
  const clientEntries = Object.entries(clientMap).sort((a, b) => b[1] - a[1]);
  const top3CA = clientEntries.slice(0, 3).reduce((a, [, v]) => a + v, 0);
  const concentration = totalCA ? (top3CA / totalCA) * 100 : 0;
  const nbClients = clientEntries.length;
  const avgCAClient = totalCA / (nbClients || 1);

  const typeMap = {};
  data.forEach(d => { typeMap[d.type || "Autre"] = (typeMap[d.type || "Autre"] || 0) + (d.amount || 0); });
  const typeEntries = Object.entries(typeMap).sort((a, b) => b[1] - a[1]);

  const airMap = {};
  data.forEach(d => { airMap[d.airline || "Autre"] = (airMap[d.airline || "Autre"] || 0) + (d.amount || 0); });
  const airEntries = Object.entries(airMap).sort((a, b) => b[1] - a[1]);

  const monthMap = {};
  data.forEach(d => {
    const m = d.date?.slice(0, 7) || "?";
    if (!monthMap[m]) monthMap[m] = { ca: 0, kg: 0, dossiers: 0, cost: 0, retards: 0 };
    monthMap[m].ca += d.amount || 0;
    monthMap[m].kg += d.weight || 0;
    monthMap[m].dossiers += 1;
    monthMap[m].cost += (d.handlingCost || 0) + (d.customsCost || 0);
    if (d.status === "retard") monthMap[m].retards += 1;
  });
  const months = Object.entries(monthMap).sort().map(([m, v]) => ({
    mois: m.slice(5), ca: v.ca, kg: v.kg, dossiers: v.dossiers,
    marge: v.ca - v.cost,
    margeP: v.ca ? ((v.ca - v.cost) / v.ca * 100) : 0,
    otif: v.dossiers ? ((v.dossiers - v.retards) / v.dossiers * 100) : 0,
    caKg: v.kg ? v.ca / v.kg : 0
  }));

  const dso = state.crossData?.recouvrement?.dso || null;
  const cei = state.crossData?.recouvrement?.cei || null;
  const caEmployee = totalCA / TEAM_SIZE;
  const dossiersEmployee = nbDossiers / TEAM_SIZE;

  const typeKg = {};
  data.forEach(d => { typeKg[d.type || "Autre"] = (typeKg[d.type || "Autre"] || 0) + (d.weight || 0); });
  const typeCAKg = {};
  Object.entries(typeMap).forEach(([t, ca]) => { typeCAKg[t] = typeKg[t] ? ca / typeKg[t] : 0; });

  return {
    totalCA, totalKg, totalCost, grossProfit, grossMargin, nbDossiers, avgDays, otif, retards,
    caParDossier: totalCA / nbDossiers, margeParDossier: grossProfit / nbDossiers,
    caParKg: totalKg ? totalCA / totalKg : 0, coutParKg: totalKg ? totalCost / totalKg : 0,
    concentration, nbClients, avgCAClient, caEmployee, dossiersEmployee,
    clientEntries, typeEntries, airEntries, months, typeCAKg,
    totalHandling, totalCustoms,
    dso, cei, impayesTotal: state.crossData?.recouvrement?.total || null,
    pipeline: state.crossData?.commercial?.pipeline || 0,
    prospectGagnes: state.crossData?.commercial?.gagnes || 0,
  };
}

// ═══ KPI BOX HTML ═══
function kpiBox(label, value, color, sub = "", alert = false) {
  return `<div class="kpi-box${alert ? ' alert' : ''}">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value" style="color:${color}">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
    <div class="kpi-bar" style="background:linear-gradient(90deg,${color},${color}80)"></div>
  </div>`;
}

function statRow(label, value, color = "") {
  return `<div class="stat-row"><span class="stat-label">${esc(label)}</span><span class="stat-value" style="${color ? 'color:'+color : ''}">${value}</span></div>`;
}

// ═══ TAB SWITCHING ═══
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['dash','data','ai','config'].forEach(t => { const el = document.getElementById('tab-' + t); if (el) el.style.display = t === tab ? '' : 'none'; });
  renderCurrentTab();
}

function renderCurrentTab() {
  destroyCharts();
  if (currentTab === 'dash') renderDash();
  else if (currentTab === 'data') renderData();
  else if (currentTab === 'ai') renderAI();
  else if (currentTab === 'config') renderConfig();
}

function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch {} });
  chartInstances = {};
}

// ═══ DASHBOARD ═══
function renderDash() {
  const el = document.getElementById('tab-dash');
  const K = computeKPIs();
  if (!K) {
    el.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text3);">
      <div style="font-size:48px;margin-bottom:16px;">📊</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text);">Aucune donnée</div>
      <div style="font-size:12px;margin-bottom:20px;">Importez un fichier Excel/CSV dans l'onglet Données</div>
      <button class="btn btn-blue" onclick="switchTab('data')">📥 Importer des données</button>
      <div style="margin:12px 0;">ou</div>
      <button class="btn btn-ghost" onclick="loadSample()">🔄 Charger données exemple</button>
    </div>`;
    return;
  }

  const margeColor = K.grossMargin >= 25 ? 'var(--green)' : K.grossMargin >= 15 ? 'var(--gold)' : 'var(--red)';
  const otifColor = K.otif >= 90 ? 'var(--green)' : K.otif >= 80 ? 'var(--gold)' : 'var(--red)';
  const concColor = K.concentration > 60 ? 'var(--red)' : K.concentration > 40 ? 'var(--gold)' : 'var(--green)';

  el.innerHTML = `
    <!-- KPI ROW 1 -->
    <div class="kpi-grid kpi-grid-6">
      ${kpiBox("CA Total", fmtK(K.totalCA)+"€", "var(--blue)", K.nbDossiers+" dossiers")}
      ${kpiBox("Marge Brute", pct(K.grossMargin), margeColor, fmtK(K.grossProfit)+"€", K.grossMargin < 20)}

function buildDashCharts(K) {
  if (typeof Chart === 'undefined') { setTimeout(() => buildDashCharts(K), 500); return; }
  const chartOpts = { responsive: true, plugins: { legend: { labels: { color: '#7a8599', font: { size: 10 } } } }, scales: { x: { ticks: { color: '#454d5e', font: { size: 10 } }, grid: { color: '#1a243820' } }, y: { ticks: { color: '#454d5e', font: { size: 10 } }, grid: { color: '#1a243830' } } } };

  // Trend chart
  const ctxTrend = document.getElementById('chartTrend');
  if (ctxTrend) {
    chartInstances.trend = new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: K.months.map(m => m.mois),
        datasets: [
          { label: 'CA €', data: K.months.map(m => m.ca), borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.12)', fill: true, tension: 0.3 },
          { label: 'Marge €', data: K.months.map(m => m.marge), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.09)', fill: true, tension: 0.3 }
        ]
      },
      options: chartOpts
    });
  }

  // Type pie
  const ctxType = document.getElementById('chartType');
  if (ctxType) {
    chartInstances.type = new Chart(ctxType, {
      type: 'doughnut',
      data: {
        labels: K.typeEntries.map(([n]) => n),
        datasets: [{ data: K.typeEntries.map(([,v]) => v), backgroundColor: CHART_COLORS.slice(0, K.typeEntries.length), borderWidth: 0 }]
      },
      options: { responsive: true, cutout: '50%', plugins: { legend: { position: 'bottom', labels: { color: '#7a8599', font: { size: 10 }, padding: 12 } } } }
    });
  }

  // OTIF bar + CA/kg line
  const ctxOtif = document.getElementById('chartOtif');
  if (ctxOtif) {
    chartInstances.otif = new Chart(ctxOtif, {
      type: 'bar',
      data: {
        labels: K.months.map(m => m.mois),
        datasets: [
          { label: 'OTIF %', data: K.months.map(m => m.otif), backgroundColor: 'rgba(34,211,238,0.7)', borderRadius: 3, yAxisID: 'y' },
          { label: 'CA/kg €', data: K.months.map(m => m.caKg), type: 'line', borderColor: '#f5a623', backgroundColor: 'transparent', tension: 0.3, yAxisID: 'y1', pointRadius: 3 }
        ]
      },
      options: { ...chartOpts, scales: { ...chartOpts.scales, y1: { position: 'right', ticks: { color: '#454d5e', font: { size: 10 } }, grid: { display: false } } } }
    });
  }
}

async function testFirebase() {
  state.config.firebaseUrl = document.getElementById('cfgFirebaseUrl')?.value || "";

  fb.cfg(state.config.firebaseUrl, state.config.firebaseToken);
  const ok = await fb.test();
  showToast(ok ? "Firebase connecté ✅" : "Erreur connexion", ok ? "ok" : "err");
  if (ok) { updateSync("synced"); saveState(); }

async function pushFirebase() {
  if (!fb.ok) return;
  updateSync("syncing");
  const ok = await fb.set("taf_stat", state);
  updateSync(ok ? "synced" : "error");
  showToast(ok ? "Push ✅" : "Erreur", ok ? "ok" : "err");
}

async function pullCrossData() {
  if (!fb.ok) { showToast("Firebase non configuré", "err"); return; }
  updateSync("syncing");
  const results = {};
  const comm = await fb.get("taf_commercial");
  if (comm?.prospects) {
    results.commercial = {
      prospects: comm.prospects.length,
      gagnes: comm.prospects.filter(p => p.statut === "gagne").length,
      pipeline: comm.prospects.filter(p => ["cotation","negociation"].includes(p.statut)).reduce((a, p) => a + (p.valeur || 0), 0),
      relances: comm.prospects.filter(p => p.relance).length,
      rescueActifs: (comm.rescueLeads || []).filter(r => r.statut !== "resolu").length,
    };
  }
  const rec = await fb.get("taf_recouvrement");
  if (rec) results.recouvrement = rec;
  const fact = await fb.get("taf_facturation");
  if (fact) results.facturation = fact;
  const ops = await fb.get("taf_ops");
  if (ops) results.ops = ops;

  state.crossData = { ...state.crossData, ...results };
  saveState();
  updateSync("synced");
  showToast("Données inter-apps synchronisées ✅");
  renderCurrentTab();
}

// ═══ FILE IMPORT ═══
function triggerFileImport() {
  const i = document.createElement("input");
  i.type = "file";
  i.accept = ".xlsx,.xls,.csv";
  i.onchange = e => e.target.files[0] && handleFile(e.target.files[0]);
  i.click();
}

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      let rows;
      if (file.name.endsWith(".csv")) {
        const lines = e.target.result.split("\n").filter(l => l.trim());
        const headers = lines[0].split(/[,;\t]/).map(h => h.trim().replace(/"/g, "").toLowerCase());
        rows = lines.slice(1).map(l => { const vals = l.split(/[,;\t]/).map(v => v.trim().replace(/"/g, "")); const obj = {}; headers.forEach((h, i) => obj[h] = vals[i] || ""); return obj; });
      } else {
        if (typeof XLSX !== "undefined") {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          rows = XLSX.utils.sheet_to_json(ws);
        } else { showToast("SheetJS non chargé", "err"); return; }
      }
      const mapped = mapData(rows);
      if (!mapped.length) { showToast("Impossible de mapper les données", "err"); return; }
      state.data = mapped;
      saveState();
      showToast(`${mapped.length} lignes importées ✅`);
      renderCurrentTab();
    } catch (err) { showToast("Erreur import: " + err.message, "err"); }
  };
  if (file.name.endsWith(".csv")) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function mapData(rows) {
  if (!rows?.length) return [];
  return rows.filter(r => {
    const dateKey = Object.keys(r).find(k => k.toLowerCase().includes("date"));
    const amtKey = Object.keys(r).find(k => /amount|montant|estimé|ca|b\.b\.e|bbe/i.test(k));
    return dateKey && r[dateKey] && amtKey && r[amtKey];
  }).map(r => {
    const ks = Object.keys(r);
    const dateKey = ks.find(k => k.toLowerCase().includes("date"));
    const clientKey = ks.find(k => /client/i.test(k));
    const amtKey = ks.find(k => /amount|montant|estimé|ca/i.test(k));
    const bbeKey = ks.find(k => /b\.b\.e|bbe|bénéfice/i.test(k));
    const wtKey = ks.find(k => /weight|poids|kg/i.test(k));
    const typeKey = ks.find(k => /type|prestation/i.test(k));
    const airKey = ks.find(k => /airline|compagnie|cie/i.test(k));
    const dossKey = ks.find(k => /dossier/i.test(k));
    const statusKey = ks.find(k => /status|statut/i.test(k));
    const daysKey = ks.find(k => /days|jours|transit/i.test(k));

    const amt = parseFloat(r[amtKey] || r[bbeKey] || 0) || 0;
    const wt = parseFloat(r[wtKey] || 0) || Math.round(100 + Math.random() * 2000);
    let type = r[typeKey] || "Cargo";
    if (dossKey && r[dossKey]) {
      const prefix = String(r[dossKey]).slice(0, 2).toUpperCase();
      if (prefix === "SF" || prefix === "PF") type = "Poisson frais";
      else if (prefix === "AI" || prefix === "AV") type = "AVI";
      else if (prefix === "FL") type = "F&L";
    }
    let dateVal = r[dateKey];
    if (typeof dateVal === "number") dateVal = new Date((dateVal - 25569) * 86400000).toISOString().slice(0, 10);
    else { try { dateVal = new Date(dateVal).toISOString().slice(0, 10); } catch { dateVal = today(); } }

    return {
      date: dateVal, client: r[clientKey] || "CLIENT", type,
      amount: amt, weight: wt, airline: r[airKey] || "Diverse",
      handlingCost: Math.round(amt * 0.15), customsCost: Math.round(amt * 0.08),
      status: r[statusKey] || "dédouané", days: parseInt(r[daysKey]) || Math.floor(2 + Math.random() * 5),
      dossier: r[dossKey] || ""
    };
  });
}

// ═══ SAMPLE DATA ═══
function generateSample() {
  const clients = ["CAPMARIN","EXOFLORE","AQUA VIVANT","GLOBAL SEAFOOD","FRUIT PARTNER","OCEAN DÉLICES","ATLAS CARGO"];
  const types = ["Poisson frais","F&L","AVI","Cargo"];
  const airlines = ["Air France","Ethiopian","Qatar","Air Algérie","Corsair","Emirates"];
  const entries = [];
  for (let m = 0; m < 12; m++) {
    for (let i = 0; i < 20 + Math.floor(Math.random() * 15); i++) {
      const type = types[Math.floor(Math.random() * types.length)];
      const base = type === "Poisson frais" ? 1800 : type === "AVI" ? 1200 : type === "F&L" ? 900 : 1400;
      const wt = 100 + Math.random() * 3000;
      const amt = Math.round((base + (Math.random() - 0.5) * 600) / 10) * 10;
      entries.push({ date: `2026-${String(m+1).padStart(2,"0")}-${String(1+Math.floor(Math.random()*27)).padStart(2,"0")}`, client: clients[Math.floor(Math.random()*clients.length)], type, amount: amt, weight: Math.round(wt), airline: airlines[Math.floor(Math.random()*airlines.length)], handlingCost: Math.round(amt*0.15), customsCost: Math.round(amt*0.08), status: Math.random() > 0.15 ? "dédouané" : Math.random() > 0.5 ? "en cours" : "retard", days: Math.floor(1+Math.random()*8) });
    }
  }
  return entries;
}

function loadSample() { state.data = generateSample(); saveState(); showToast("Données exemple chargées ✅"); renderCurrentTab(); }
function clearData() { state.data = []; saveState(); showToast("Données réinitialisées"); renderCurrentTab(); }

// ═══ EXPORTS ═══
function exportJSON() {
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.data));
  a.download = `taf_analyse_${today()}.json`;
  a.click();
}
function exportFullJSON() {
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
  a.download = `taf_stat_v3_${today()}.json`;
  a.click();
  showToast("Export ✅");
}
function importFullJSON() {
  const i = document.createElement("input");
  i.type = "file"; i.accept = ".json";
  i.onchange = e => {
    const r = new FileReader();
    r.onload = ev => { try { const parsed = JSON.parse(ev.target.result); state = { ...state, ...parsed }; saveState(); showToast("Restauré ✅"); renderCurrentTab(); } catch { showToast("Erreur", "err"); } };
    r.readAsText(e.target.files[0]);
  };
  i.click();
}

// ═══ LOGIN / LOCK ═══
function lockApp() {
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("loginScreen").style.display = "";
  document.getElementById("pinInput").value = "";
  document.getElementById("pinInput").focus();
}

document.getElementById("pinInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const pin = this.value;
    if (pin === (state.config.pin || "2709")) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainApp").style.display = "";
      renderCurrentTab();
    } else { showToast("PIN incorrect", "err"); this.value = ""; }
  }
});

// ═══ INIT ═══
loadState();
</script>
