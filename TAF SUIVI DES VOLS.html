];
function getDelayLevel(min){
  if(min===null||min===undefined) return null;
  return DELAY_LEVELS.find(function(l){return min>=l.min&&min<=l.max;})||DELAY_LEVELS[0];
}

/* ── Helpers temps Paris ── */
function parisNow(){
  var d=new Date();
  var s=d.toLocaleString("en-GB",{timeZone:TZ_PARIS,hour12:false});
  var dp=s.split(", ")[0].split("/");
  var tp=(s.split(", ")[1]||"00:00:00").split(":");
  return {h:parseInt(tp[0])||0,m:parseInt(tp[1])||0,s:parseInt(tp[2])||0};
}
function fmtTimeParis(iso){
  if(!iso) return "—";
  try{return new Date(iso).toLocaleTimeString("fr-FR",{timeZone:TZ_PARIS,hour:"2-digit",minute:"2-digit"});}catch(e){return "—";}
}
function fmtDateTimeParis(iso){
  if(!iso) return "—";
  try{return new Date(iso).toLocaleString("fr-FR",{timeZone:TZ_PARIS,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return "—";}
}
/* Retourne uniquement HH:MM heure Paris — pour stockage Airtable avec date du JOUR */
function fmtHeureParisOnly(iso){
  if(!iso) return "";
  try{return new Date(iso).toLocaleTimeString("fr-FR",{timeZone:TZ_PARIS,hour:"2-digit",minute:"2-digit"});}catch(e){return "";}
}



/* ── Appels Airtable via proxy Apps Script ── */
async function atProxy(action, table, data){
  try{
    var resp=await fetch(AT_PROXY,{
      method:"POST",
      body:JSON.stringify({
        action:"airtable",
        atAction:action,
        atToken:AT_TOKEN,
        atBase:AT_BASE,
        table,
        data,
      })
    });
    if(!resp.ok) return {ok:false,error:"HTTP "+resp.status};
    return await resp.json();
  }catch(e){return {ok:false,error:e.message};}
}

async function atUpsert(table, fields, matchField){
  return atProxy("upsert",table,{fields,matchField});
}

async function atCreate(table, fields){
  return atProxy("create",table,{fields});
}

async function atLoadVols(){
  try{
    var result=await atProxy("list","Vol",{sort:[{field:"horaire",direction:"asc"}]});
    if(!result||!result.records) return null;
    return result.records.map(function(rec){
      var f=rec.fields||{};
      if(!f.Name) return null;
      return {
        id:f.Name, /* On utilise le numéro de vol comme ID */
        flightNum:f.Name||"",
        label:f["tableau de bord"]||"",
        origin:"",
        scheduledArr:f.horaire||"",
        heuresRefresh:"",
        notes:"",
        alerts:[],
        _atId:rec.id,
      };
    }).filter(Boolean);
  }catch(e){return null;}
}

/* ── Appel FlightAware via proxy Apps Script ── */
async function fetchFlightViaProxy(flightNum){
  var PROXY="https://script.google.com/macros/s/AKfycbyCiyxw_ydQ5wLxQQJ68XuMpmwRkW8TyJwgCNZ3r-jCUO1VLRXZL-H11XsFiiX-mK-s/exec";
  var ident=flightNum.toUpperCase().replace(/\s/g,"");
  try{
    var controller=new AbortController();
    var timeout=setTimeout(function(){controller.abort();},15000);
    var url=PROXY+"?type=flight&ident="+encodeURIComponent(ident);
    var resp=await fetch(url,{signal:controller.signal});
    clearTimeout(timeout);
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    var data=await resp.json();
    if(data.error) throw new Error(data.error);
    /* data peut contenir flights[] (mode debug) ou les champs directs */
    var flights=data.flights||[];
    var f=null;
    if(flights.length>0){
      /* Sélection : vol arrivé dans les 30h, puis en route, puis prochain */
      var now=new Date();
      for(var j=0;j<flights.length;j++){
        var fl=flights[j];
        var st=fl.status||"";
        var isArrived=st.indexOf("Arriv")>=0||st==="Landed";
        var arrTime=fl.actual_in||fl.estimated_in||fl.scheduled_in;
        if(isArrived&&arrTime&&(now-new Date(arrTime))/3600000<30){f=fl;break;}
      }
      if(!f){for(var k=0;k<flights.length;k++){var st2=flights[k].status||"";if(st2.indexOf("En Route")>=0||st2.indexOf("En route")>=0){f=flights[k];break;}}}
      if(!f) f=flights[0];
    } else {
      /* Réponse directe (non-debug) */
      f={
        ident:data.ident||ident,
        status:data.status||"",
        scheduled_in:data.scheduled_in||null,
        estimated_in:data.estimated_in||null,
        actual_in:data.actual_in||null,
        origin:data.origin||"?",
        dest:data.dest||"CDG",
      };
    }
    /* Normalisation statut */
    var rawSt=f.status||"";
    var status="Inconnu";
    if(rawSt.indexOf("Arriv")>=0||rawSt==="Landed") status="Atterri";
    else if(rawSt.indexOf("En Route")>=0||rawSt.indexOf("En route")>=0) status="En route";
    else if(rawSt.indexOf("Planifi")>=0||rawSt==="Scheduled") status="Programmé";
    else if(rawSt.indexOf("Annul")>=0||rawSt==="Cancelled") status="Annulé";
    else if(rawSt.indexOf("Dérout")>=0||rawSt==="Diverted") status="Dérouté";
    else status=rawSt;
    var schArr=f.scheduled_in||null;
    var estArr=f.estimated_in||f.actual_in||f.scheduled_in||null;
    var actArr=f.actual_in||null;
    var ref=actArr||estArr;
    var delayMin=null;
    if(ref&&schArr) delayMin=Math.round((new Date(ref)-new Date(schArr))/60000);
    return {
      ident:f.ident||ident,
      origin:(function(o){if(!o)return "?";if(typeof o==="string")return o;return o.code_iata||o.code||"?";})(f.origin),
      dest:(function(o){if(!o)return "CDG";if(typeof o==="string")return o;return o.code_iata||o.code||"CDG";})(f.dest||f.destination),
      status,schArr,estArr,actArr,delayMin,
      cancelled:status==="Annulé",
      diverted:status==="Dérouté",
      fetchedAt:new Date().toISOString(),
    };
  }catch(e){
    return {error:e.name==="AbortError"?"Timeout (15s) — proxy lent":e.message||"Erreur réseau"};
  }
}

  /* ── Scheduler : vérifie toutes les 30s si une heure de refresh est due ── */
  React.useEffect(function(){
    if(schedRef.current) clearInterval(schedRef.current);
    schedRef.current=setInterval(function(){
      var now=parisNow();
      var key=now.h+":"+now.m;
      /* Refresh vols dont l'heure correspond */
      setVols(function(cur){
        cur.forEach(function(vol){
          var heures=parseHeures(vol.heuresRefresh);
          heures.forEach(function(hr){
            var fireKey=vol.id+"|"+hr.h+":"+hr.m+"|"+Math.floor(Date.now()/60000);
            if(hr.h===now.h&&hr.m===now.m&&!firedRef.current[fireKey]){
              firedRef.current[fireKey]=true;
              /* Nettoyer les anciennes clés */
              var keys=Object.keys(firedRef.current);
              if(keys.length>200) keys.slice(0,100).forEach(function(k){delete firedRef.current[k];});
              doRefresh(vol);
            }
          });
        });
        /* Récaps 06h45 et 14h00 */
        RECAP_TIMES.forEach(function(rt){
          var rKey="recap|"+rt.h+":"+rt.m+"|"+Math.floor(Date.now()/60000);

        });
        return cur;
      });
    },30000);
    return function(){clearInterval(schedRef.current);};
  },[templateId]);

  function parseHeures(str){

    setVols(function(prev){
      return prev.map(function(v){

        if(data&&!data.error){

            if(!newAlerts.length||newAlerts[0].msg!==alertMsg){

        var updated={...v,lastData:(data&&!data.error)?data:v.lastData,lastError:data.error||null,lastFetch:new Date().toISOString(),alerts:newAlerts};
        /* Mise a jour Airtable table Vol */
        if(data&&!data.error){
          /* Upsert : crée ou met à jour le vol dans la table Vol */

  }

                <span style={{color:TC.textDim,fontFamily:"monospace",fontSize:"11px",flexShrink:0}}>{fmtDateTimeParis(a.ts)}</span>
                <span style={{fontWeight:"700",color:"#fff",flexShrink:0}}>{a.volNum}</span>
                <span style={{color:TC.textMid}}>{a.msg}</span>
              </div>;
            })}
          </div>
        </div>}

        {/* ── Liste vols ── */}
        {vols.length===0&&<div style={{background:TC.card,border:"1px dashed "+TC.border,borderRadius:"10px",padding:"60px",textAlign:"center"}}>
          <div style={{fontSize:"40px",marginBottom:"14px",opacity:.3}}>✈</div>
          <div style={{color:TC.textDim,fontWeight:"600",marginBottom:"6px"}}>Aucun vol sous surveillance</div>
          <div style={{color:TC.border,fontSize:"12px"}}>Cliquez sur "＋ Ajouter un vol" pour démarrer</div>
        </div>}

        <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
          {vols.slice().sort(function(a,b){
            /* Tri par heure d'arrivée théorique saisie (scheduledArr) */
            var ta=a.scheduledArr||"99:99";
            var tb=b.scheduledArr||"99:99";
            return ta.localeCompare(tb);
          }).map(function(vol){
            var d=vol.lastData;
            var isLoad=loadingIds[vol.id];
            var level=d&&!d.error?getDelayLevel(d.delayMin):null;
            var heures=vol.heuresRefresh?vol.heuresRefresh.split(/[,;]+/).map(function(s){return s.trim();}).filter(Boolean):[];
            var borderCol=(function(){
              if(!d||d.error) return "#1a3050";
              if(d.cancelled||d.diverted) return "#ff2020";
              if(d.delayMin===null||d.delayMin===undefined) return "#1a3050";
              if(d.delayMin<0) return "#2a7fff";   /* En avance — bleu */
              if(d.delayMin===0) return "#00c853";  /* A l heure — vert */
              if(d.delayMin<60) return "#ff8c00";   /* +30min — orange */
              if(d.delayMin<120) return "#ff5500";  /* +1h — orange fonce */
              return "#ff2020";                     /* +2h — rouge */
            })();
            var statusCol=d?(d.status==="Atterri"?"#00c853":d.status==="En route"?"#2a9fff":d.status==="Annulé"?"#ff2020":"#8ab0d0"):"#4a7090";

            return(
              <div key={vol.id} style={{background:"#0a1828",border:"2px solid "+borderCol,borderRadius:"10px",overflow:"hidden",transition:"border-color .3s",boxShadow:"0 0 20px rgba(0,0,0,.4)"}}>
                {/* ── Ligne FIDS style tableau aéroport ── */}
                <div style={{background:"#060d1a",borderBottom:"1px solid #1a3050",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"8px"}}>
                  {/* Gauche : numéro vol + compagnie + heures refresh */}
                  <div style={{display:"flex",alignItems:"center",gap:"14px",flexWrap:"wrap"}}>
                    <span style={{fontFamily:"'Courier New',monospace",fontSize:"24px",fontWeight:"900",color:"#ffffff",letterSpacing:"3px",textShadow:"0 0 10px rgba(255,255,255,.3)"}}>{vol.flightNum}</span>
                    {vol.label&&<span style={{fontSize:"13px",color:"#8ab0d0",fontWeight:"600",borderLeft:"2px solid #1a3050",paddingLeft:"12px"}}>{vol.label}</span>}
                    {heures.length>0&&<div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginLeft:"4px"}}>
                      {heures.map(function(h){
                        var now=parisNow();
                        var hp=h.split(":");
                        var isNow=(parseInt(hp[0])||0)===now.h&&(parseInt(hp[1])||0)===now.m;
                        return <span key={h} style={{fontSize:"11px",fontFamily:"monospace",fontWeight:"700",padding:"3px 9px",borderRadius:"6px",background:isNow?"rgba(232,96,26,.25)":"rgba(255,255,255,.06)",color:isNow?"#e8601a":"#4a7090",border:"1px solid "+(isNow?"#e8601a":"#1a3050")}}>⏱ {h}</span>;
                      })}
                    </div>}
                  </div>
                  {/* Droite : statut + retard + boutons */}
                  <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                    {d&&d.status&&<span style={{fontSize:"12px",fontWeight:"800",fontFamily:"monospace",color:statusCol,background:"rgba(0,0,0,.3)",padding:"4px 12px",borderRadius:"6px",letterSpacing:"1px",border:"1px solid "+statusCol+"40"}}>{d.status.toUpperCase()}</span>}
                    {level&&<span style={{fontSize:"12px",fontWeight:"800",color:level.color,background:"rgba(0,0,0,.3)",padding:"4px 12px",borderRadius:"6px",border:"1px solid "+level.color+"60",letterSpacing:".5px"}}>{level.emoji} {level.label}{d&&d.delayMin!==0?" ("+(d.delayMin<0?d.delayMin:"+"+d.delayMin)+" min)":""}</span>}
                    <button onClick={function(){doRefresh(vol);}} title="Rafraîchir"
                      style={{background:"rgba(42,127,200,.15)",color:"#2a9fff",border:"1px solid rgba(42,127,200,.3)",borderRadius:"6px",padding:"5px 12px",fontSize:"14px",fontWeight:"700",cursor:"pointer",fontFamily:"inherit",minWidth:"36px",transition:"all .2s"}}>
                      {isLoad?<span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⟳</span>:"⟳"}
                    </button>
                    <button onClick={function(){openEdit(vol);}} title="Modifier"
                      style={{background:"rgba(255,255,255,.05)",color:"#8ab0d0",border:"1px solid #1a3050",borderRadius:"6px",padding:"5px 12px",fontSize:"13px",cursor:"pointer",fontFamily:"inherit"}}>✎</button>
                    <button onClick={function(){deleteVol(vol.id);}} title="Supprimer"
                      style={{background:"rgba(200,40,40,.1)",color:"#ff6060",border:"1px solid rgba(200,40,40,.2)",borderRadius:"6px",padding:"5px 10px",fontSize:"13px",cursor:"pointer",fontFamily:"inherit"}}>✕</button>
                  </div>
                </div>

                {/* ── Données FIDS ── */}
                <div style={{padding:"0"}}>
                  {!d&&!isLoad&&<div style={{color:"#2a5070",fontSize:"12px",fontFamily:"monospace",fontStyle:"italic",padding:"14px 16px"}}>Pas encore interrogé — cliquez ⟳</div>}
                  {isLoad&&<div style={{display:"flex",alignItems:"center",gap:"10px",color:"#2a9fff",fontSize:"12px",fontFamily:"monospace",padding:"14px 16px"}}><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span>Interrogation FlightAware...</div>}
                  {d&&d.error&&!isLoad&&<div style={{color:"#ff6060",fontSize:"12px",fontFamily:"monospace",background:"rgba(255,32,32,.08)",padding:"12px 16px",borderTop:"1px solid rgba(255,32,32,.15)"}}>✕ {d.error}</div>}
                  {d&&!d.error&&!isLoad&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",borderTop:"1px solid #0d2040"}}>
                    {[
                      {lbl:"Arrivée prévue",  val:fmtTimeParis(d.schArr),              col:"#c8d8e8", bg:"#060d1a"},
                      {lbl:"Estimée / Réelle",val:fmtTimeParis(d.actArr||d.estArr),    col:level&&level.code>0?level.color:"#00c853", bg:"#060d1a"},
                      d.delayMin!=null?{lbl:"Retard",val:d.delayMin===0?"À l'heure":d.delayMin<0?(d.delayMin+" min ✈"):"+"+d.delayMin+" min",col:d.delayMin<0?"#2a9fff":level?level.color:"#00c853",bg:"#060d1a"}:null,
                      {lbl:"Trajet",          val:(vol.origin||d.origin||"?")+" → "+(d.dest||"CDG"),col:"#8ab0d0",  bg:"#060d1a"},
                      {lbl:"Màj",             val:fmtDateTimeParis(new Date().toISOString()),      col:"#2a5070",   bg:"#060d1a"},
                    ].filter(Boolean).map(function(item,idx2){
                      return <div key={item.lbl} style={{background:item.bg,padding:"12px 16px",borderRight:"1px solid #0d2040",borderBottom:"0"}}>
                        <div style={{fontSize:"9px",color:"#2a5070",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:"6px"}}>{item.lbl}</div>
                        <div style={{fontSize:"18px",fontWeight:"800",color:item.col,fontFamily:"'Courier New',monospace",letterSpacing:"1px"}}>{item.val}</div>
                      </div>;
                    })}
                    {(d.cancelled||d.diverted)&&<div style={{gridColumn:"1/-1",padding:"10px 16px",background:"rgba(255,32,32,.1)",borderTop:"1px solid rgba(255,32,32,.2)",fontSize:"13px",fontWeight:"800",color:"#ff4040",fontFamily:"monospace",letterSpacing:"1px"}}>
                      {d.cancelled?"🚨 VOL ANNULÉ":"🔴 VOL DÉROUTÉ"}
                    </div>}
                  </div>}
                </div>

                {/* ── Alertes ── */}
                {vol.alerts&&vol.alerts.length>0&&<div style={{borderTop:"1px solid #0d2040",padding:"8px 16px",background:"rgba(0,0,0,.3)"}}>
                  {vol.alerts.slice(0,2).map(function(a,i){
                    return <div key={i} style={{fontSize:"11px",color:"#4a7090",fontFamily:"monospace",marginBottom:"2px"}}>
                      <span style={{color:"#1a3050"}}>{fmtDateTimeParis(a.ts)}</span> {a.msg}
                    </div>;
                  })}
                </div>}
              </div>
            );
          })}
        </div>

        {/* Légende */}
        {vols.length>0&&<div style={{marginTop:"18px",display:"flex",gap:"8px",flexWrap:"wrap"}}>
          {DELAY_LEVELS.map(function(l){
            return <div key={l.label} style={{display:"flex",alignItems:"center",gap:"6px",padding:"5px 12px",background:l.bg,borderRadius:"10px",border:"1px solid "+l.color,fontSize:"11px",fontWeight:"700",color:l.color}}>
              {l.emoji} {l.label}
            </div>;
          })}
        </div>}

      </div>
    </div>
  );
}

/* ══ DIVERS TAB ══════════════════════════════════════════════════════════ */
const WMO_D={0:"Ciel dégagé",1:"Peu nuageux",2:"Partiellement nuageux",3:"Couvert",45:"Brouillard",48:"Brouillard givrant",51:"Bruine légère",53:"Bruine modérée",55:"Bruine dense",61:"Pluie légère",63:"Pluie modérée",65:"Pluie forte",71:"Neige légère",73:"Neige modérée",75:"Neige forte",80:"Averses légères",81:"Averses modérées",82:"Averses violentes",95:"Orage",96:"Orage avec grêle",99:"Orage violent"};
const WMO_EMJ={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",71:"❄️",73:"❄️",75:"❄️",80:"🌦️",81:"🌧️",82:"⛈️",95:"⛈️",96:"⛈️",99:"⛈️"};
const JOURS_D=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const AT_KEY_D   = localStorage.getItem("taf_at_key_d") || "";
const AT_BASE_D  ="app1jUe90acjaPn6t";
const AT_TABLE_D ="tblC6ejpHonfyZkwf";
const AT_FIELDS_D=["fldVljHC9wm7EdQm0","fldL2J3n8WCOugRTK","fld01sTX3cjEpORJD","fldAcEmpt8ZaT7M7h","fldy8zYn4gdONq2pO","fldmBDdP3tQh3NoQ4","fldNZaJ8ry7FrwuWr","fldnpWlN78v3JSx9o","fldVHE0HKNlbcroKx","fldmTRKsb8W4GcUg9"];
const GMAPS_KEY  ="AIzaSyD6SUkK69jH6FOFkzg7PJkKf62khXa7H6w";
const CDG_ORIGIN ={lat:49.0097,lng:2.5479};
const ESSARTS_DEST={lat:48.7196,lng:1.8349};

/* ══ MODULE DIVERS ══════════════════════════════════════════════════════ */
function DiverTab(){
  /* ── States ── */
  var [meteo,    setMeteo]    = React.useState(null);
  var [atRecs,   setAtRecs]   = React.useState([]);
  var [atFilter, setAtFilter] = React.useState("all");
  var [atLoading,setAtLoading]= React.useState(true);
  var [atSub,    setAtSub]    = React.useState("Chargement…");
  var [trajet,   setTrajet]   = React.useState(null);
  var [mapLoaded,setMapLoaded]= React.useState(false);
  var [mapError, setMapError] = React.useState(false);
  var [trafficState,setTrafficState] = React.useState("loading"); // loading | fluide | modere | dense
  var mapRef = React.useRef(null);
  var mapObj = React.useRef(null);
  var dirSvc = React.useRef(null);
  var dirRdr = React.useRef(null);

  /* ── Météo ── */
  React.useEffect(function(){
    fetch("https://api.open-meteo.com/v1/forecast?latitude=49.0097&longitude=2.5479&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weathercode&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Europe/Paris&forecast_days=5")
      .then(function(r){return r.json();})
      .then(function(d){setMeteo(d);})
      .catch(function(){});
  },[]);

  /* ── Airtable ── */
  React.useEffect(function(){
    (async function(){
      try{
        var records=[],offset=null,page=0;
        do{
          var url="https://api.airtable.com/v0/"+AT_BASE_D+"/"+AT_TABLE_D
            +"?pageSize=100&sort[0][field]=fldVHE0HKNlbcroKx&sort[0][direction]=desc"
            +AT_FIELDS_D.map(function(f){return "&fields[]="+f;}).join("");
          if(offset) url+="&offset="+offset;
          var r=await fetch(url,{headers:{"Authorization":"Bearer "+AT_KEY_D}});
          if(!r.ok) throw new Error("HTTP "+r.status);
          var d=await r.json();
          records=records.concat(d.records||[]);
          offset=d.offset||null; page++;
        }while(offset&&page<10);
        setAtRecs(records);
        setAtSub("Mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+" · "+records.length+" dossiers");
      }catch(e){
        setAtSub("Erreur Airtable : "+e.message);
      }finally{
        setAtLoading(false);
      }
    })();
  },[]);

  /* ── Google Maps ── */
  React.useEffect(function(){
    if(!mapRef.current) return;
    function isActiveWin(){
      var now=new Date(),day=now.getDay(),mins=now.getHours()*60+now.getMinutes();
      return [1,2,3].includes(day)&&mins>=600&&mins<750;
    }
    function initDiverMap(){
      var styles=[
        {elementType:"geometry",stylers:[{color:"#f8f9ff"}]},
        {elementType:"labels.text.fill",stylers:[{color:"#888"}]},
        {featureType:"road",elementType:"geometry",stylers:[{color:"#fff"}]},
        {featureType:"road.highway",elementType:"geometry",stylers:[{color:"#e8eaff"}]},
        {featureType:"road.highway",elementType:"geometry.stroke",stylers:[{color:"#667eea"}]},
        {featureType:"water",elementType:"geometry",stylers:[{color:"#cdd8ff"}]},
        {featureType:"landscape",elementType:"geometry",stylers:[{color:"#f0f4ff"}]},
        {featureType:"poi",stylers:[{visibility:"off"}]},
        {featureType:"transit",stylers:[{visibility:"off"}]},
      ];
      if(isActiveWin()){
        mapObj.current=new window.google.maps.Map(mapRef.current,{center:{lat:48.87,lng:2.19},zoom:9,disableDefaultUI:true,zoomControl:true,styles:styles});
        dirSvc.current=new window.google.maps.DirectionsService();
        dirRdr.current=new window.google.maps.DirectionsRenderer({map:mapObj.current,suppressMarkers:false,polylineOptions:{strokeColor:"#e8601a",strokeWeight:5,strokeOpacity:.9}});
        dirSvc.current.route({
          origin:CDG_ORIGIN,destination:ESSARTS_DEST,
          travelMode:window.google.maps.TravelMode.DRIVING,
          drivingOptions:{departureTime:new Date(),trafficModel:window.google.maps.TrafficModel.BEST_GUESS}
        },function(result,status){
          if(status!=="OK"){setMapError(true);return;}
          dirRdr.current.setDirections(result);
          var leg=result.routes[0].legs[0];
          var ratio=(leg.duration_in_traffic?leg.duration_in_traffic.value:leg.duration.value)/leg.duration.value;
          setTrajet({
            avecTrafic:(leg.duration_in_traffic?leg.duration_in_traffic.text:leg.duration.text),
            sansTrafic:leg.duration.text,
            distance:leg.distance.text,
            ratio:ratio,
          });
          setTrafficState(ratio<1.1?"fluide":ratio<1.3?"modere":"dense");
        });
      }else{
        mapObj.current=new window.google.maps.Map(mapRef.current,{center:{lat:48.86,lng:2.35},zoom:10,disableDefaultUI:true,zoomControl:true,styles:styles});
        new window.google.maps.TrafficLayer().setMap(mapObj.current);
        setTrafficState("hors-plage");
      }
      setMapLoaded(true);
    }
    if(window.google&&window.google.maps){
      initDiverMap();
    }else{
      var cbName="__diverMapInit_"+Date.now();
      window[cbName]=function(){initDiverMap(); delete window[cbName];};
      var existing=document.querySelector("script[data-gmaps]");
      if(existing){
        /* Maps déjà en cours de chargement — attendre */
        var poll=setInterval(function(){if(window.google&&window.google.maps){clearInterval(poll);initDiverMap();}},300);
      }else{
        var s=document.createElement("script");
        s.dataset.gmaps="1";
        s.src="https://maps.googleapis.com/maps/api/js?key="+GMAPS_KEY+"&callback="+cbName+"&libraries=geometry";
        s.async=true; s.defer=true;
        document.head.appendChild(s);
      }
    }
  },[]);

  /* ── Filtrage Airtable ── */
  function filteredRecs(){
    if(atFilter==="afact") return atRecs.filter(function(r){
      var s=(r.cellValuesByFieldId["fld01sTX3cjEpORJD"]||{}).name||"";
      var fa=(r.cellValuesByFieldId["fldNZaJ8ry7FrwuWr"]||{}).name||"";
      return s.toLowerCase().includes("facturer")||fa.toLowerCase().includes("facturer");
    });
    if(atFilter==="import") return atRecs.filter(function(r){return ((r.cellValuesByFieldId["fldnpWlN78v3JSx9o"]||{}).name||"").toLowerCase()==="import";});
    if(atFilter==="export") return atRecs.filter(function(r){return ((r.cellValuesByFieldId["fldnpWlN78v3JSx9o"]||{}).name||"").toLowerCase()==="export";});
    if(atFilter==="periss") return atRecs.filter(function(r){return !!r.cellValuesByFieldId["fldmTRKsb8W4GcUg9"];});
    return atRecs;
  }

  /* ── Stats Airtable ── */
  var aFact=atRecs.filter(function(r){
    var s=(r.cellValuesByFieldId["fld01sTX3cjEpORJD"]||{}).name||"";
    var fa=(r.cellValuesByFieldId["fldNZaJ8ry7FrwuWr"]||{}).name||"";
    return s.toLowerCase().includes("facturer")||fa.toLowerCase().includes("facturer");
  }).length;
  var enCours=atRecs.filter(function(r){return ((r.cellValuesByFieldId["fldNZaJ8ry7FrwuWr"]||{}).name||"").toLowerCase().includes("cours");}).length;
  var nbImp=atRecs.filter(function(r){return ((r.cellValuesByFieldId["fldnpWlN78v3JSx9o"]||{}).name||"").toLowerCase()==="import";}).length;
  var nbExp=atRecs.filter(function(r){return ((r.cellValuesByFieldId["fldnpWlN78v3JSx9o"]||{}).name||"").toLowerCase()==="export";}).length;

  /* ── Traffic banner config ── */
  var trafficConf={
    fluide:    {text:"🟢 Circulation fluide, bonne route !",badge:"Fluide",    bg:"#f0fdf4",border:"#86efac",dot:"#22c55e"},
    modere:    {text:"🟡 Quelques ralentissements…",        badge:"Modéré",    bg:"#fffbf0",border:"#fde68a",dot:"#f59e0b"},
    dense:     {text:"🔴 Trafic dense, prévois du temps !", badge:"Dense",     bg:"#fff5f5",border:"#fecaca",dot:"#ef4444"},
    "hors-plage":{text:"🗺️ Trafic IDF en direct (hors plage Lun-Mer 10h–12h30)",badge:"IDF Live",bg:"#eff6ff",border:"#bfdbfe",dot:"#3b82f6"},
    loading:   {text:"Analyse en cours…",                  badge:"•••",       bg:"#f8fafc",border:"#e2e8f0",dot:"#94a3b8"},
  }[trafficState]||{text:"",badge:"",bg:"#f8fafc",border:"#e2e8f0",dot:"#94a3b8"};

  /* ── Météo actuelle ── */
  var meteoNow=null,meteoForecast=[];
  if(meteo&&meteo.current){
    var cur=meteo.current;
    meteoNow={emoji:WMO_EMJ[cur.weathercode]||"🌡️",desc:WMO_D[cur.weathercode]||"—",temp:Math.round(cur.temperature_2m),hum:cur.relative_humidity_2m,wind:Math.round(cur.wind_speed_10m)};
  }
  if(meteo&&meteo.daily){
    var dd=meteo.daily;
    for(var di=0;di<dd.time.length;di++){
      var dt=new Date(dd.time[di]);
      meteoForecast.push({day:di===0?"Auj.":JOURS_D[dt.getDay()],emoji:WMO_EMJ[dd.weathercode[di]]||"🌡️",desc:WMO_D[dd.weathercode[di]]||"—",rain:dd.precipitation_probability_max[di],max:Math.round(dd.temperature_2m_max[di]),min:Math.round(dd.temperature_2m_min[di]),isToday:di===0});
    }
  }

  /* ── Styles inline partagés ── */
  var cardStyle={background:"#fff",borderRadius:"14px",overflow:"hidden",boxShadow:"0 4px 24px rgba(0,0,0,.10)",border:"1px solid #e5e9f0",marginBottom:"18px"};
  var sectionHeaderStyle=function(bg){return {background:bg,padding:"18px 22px",position:"relative",overflow:"hidden"};};
  var headerTitleStyle={fontSize:"15px",fontWeight:"700",color:"#fff"};
  var headerSubStyle={fontSize:"10px",color:"rgba(255,255,255,.7)",fontFamily:"monospace",marginTop:"2px"};

  /* ── Render ── */
  return (
    <div style={{maxWidth:"1060px",margin:"0 auto"}}>

      {/* ── BANDEAU ── */}
      <div style={{background:"linear-gradient(135deg,#0f3460,#1a2a4a)",borderRadius:"12px",padding:"14px 20px",marginBottom:"20px",display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
        <span style={{fontSize:"22px"}}>🗺️</span>
        <div style={{flex:1}}>
          <div style={{color:"#fff",fontWeight:"800",fontSize:"15px",letterSpacing:".5px"}}>Module Divers — CDG Operations</div>
          <div style={{color:"rgba(255,255,255,.5)",fontSize:"11px",marginTop:"2px",fontFamily:"monospace"}}>Trajet CDG ↔ Les Essarts · Météo · Tableau de bord dossiers</div>
        </div>
        <div style={{background:"rgba(232,96,26,.2)",border:"1px solid rgba(232,96,26,.4)",borderRadius:"8px",padding:"6px 14px",color:"#e8601a",fontSize:"11px",fontWeight:"700",fontFamily:"monospace",letterSpacing:"1px"}}>LIVE</div>
      </div>

      {/* ── GRILLE TRAJET + MÉTÉO ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"20px",marginBottom:"20px"}}>

        {/* CARD TRAJET */}
        <div style={cardStyle}>
          {/* Header trajet */}
          <div style={{...sectionHeaderStyle("linear-gradient(160deg,#0f3460 0%,#16213e 100%)")}}>
            <div style={{position:"absolute",top:"-30px",right:"-30px",width:"120px",height:"120px",background:"rgba(255,255,255,.06)",borderRadius:"50%"}}/>
            <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",position:"relative",zIndex:1}}>
              <span style={{fontSize:"24px"}}>🚗</span>
              <div>
                <div style={headerTitleStyle}>Mon trajet du retour</div>
                <div style={headerSubStyle}>{trajet?"Mis à jour":"Chargement carte…"}</div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",borderRadius:"10px",padding:"12px 14px",position:"relative",zIndex:1}}>
              <div style={{flex:1}}>
                <div style={{fontSize:"9px",textTransform:"uppercase",letterSpacing:".1em",color:"rgba(255,255,255,.6)",fontFamily:"monospace"}}>✈️ Départ</div>
                <div style={{fontSize:"13px",fontWeight:"700",color:"#fff",marginTop:"2px"}}>CDG Fret</div>
              </div>
              <span style={{fontSize:"18px"}}>➡️</span>
              <div style={{textAlign:"right",flex:1}}>
                <div style={{fontSize:"9px",textTransform:"uppercase",letterSpacing:".1em",color:"rgba(255,255,255,.6)",fontFamily:"monospace"}}>🏡 Arrivée</div>
                <div style={{fontSize:"13px",fontWeight:"700",color:"#fff",marginTop:"2px"}}>Les Essarts-le-Roi</div>
              </div>
            </div>
          </div>
          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",borderBottom:"1px solid #f0f0f0"}}>
            {[
              {icon:"🚦",val:trajet?trajet.avecTrafic:"—",label:"Avec trafic",color:"#2563eb"},
              {icon:"⚡",val:trajet?trajet.sansTrafic:"—",label:"Sans trafic",color:"#94a3b8"},
              {icon:"📍",val:trajet?trajet.distance:"—",label:"Distance",color:"#0891b2"},
            ].map(function(s,i){
              return <div key={i} style={{padding:"16px 10px 14px",textAlign:"center",position:"relative",borderLeft:i>0?"1px solid #f0f0f0":"none"}}>
                <span style={{fontSize:"18px",display:"block",marginBottom:"5px"}}>{s.icon}</span>
                <span style={{display:"block",fontFamily:"monospace",fontSize:"17px",fontWeight:"700",color:s.color,lineHeight:1}}>{s.val}</span>
                <span style={{display:"block",fontSize:"10px",color:"#bbb",textTransform:"uppercase",letterSpacing:".06em",marginTop:"4px"}}>{s.label}</span>
              </div>;
            })}
          </div>
          {/* Traffic banner */}
          <div style={{margin:"10px 16px 14px",borderRadius:"12px",padding:"10px 14px",display:"flex",alignItems:"center",gap:"8px",background:trafficConf.bg,border:"1.5px solid "+trafficConf.border,transition:"all .3s"}}>
            <div style={{width:"9px",height:"9px",borderRadius:"50%",background:trafficConf.dot,flexShrink:0,animation:"blink 1.8s ease-in-out infinite"}}/>
            <span style={{flex:1,fontSize:"12px",fontWeight:"600",color:"#444"}}>{trafficConf.text}</span>
            <span style={{fontFamily:"monospace",fontSize:"10px",fontWeight:"600",padding:"3px 9px",borderRadius:"4px",background:trafficConf.dot,color:"#fff"}}>{trafficConf.badge}</span>
          </div>
          {/* Map */}
          <div ref={mapRef} style={{width:"100%",height:"260px",display:"block",background:"#e8eeff"}}/>
          {mapError&&<div style={{padding:"12px 16px",color:"#dc2626",fontSize:"11px",fontFamily:"monospace",background:"#fff5f5",borderTop:"1px solid #fecaca"}}>Impossible de charger Google Maps.</div>}
          <div style={{padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#f8fafc",borderTop:"1px solid #e2e8f0"}}>
            <span style={{fontSize:"10px",color:"#94a3b8",fontFamily:"monospace"}}>{trajet?"Route CDG→Les Essarts":"Hors plage active (Lun-Mer 10h–12h30)"}</span>
          </div>
        </div>

        {/* CARD MÉTÉO */}
        <div style={cardStyle}>
          <div style={{...sectionHeaderStyle("linear-gradient(160deg,#0c4a6e 0%,#0f3460 100%)")}}>
            <div style={{position:"absolute",top:"-20px",right:"-20px",width:"100px",height:"100px",background:"rgba(255,255,255,.08)",borderRadius:"50%"}}/>
            <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",position:"relative",zIndex:1}}>
              <span style={{fontSize:"24px"}}>🌤️</span>
              <div>
                <div style={headerTitleStyle}>Météo CDG</div>
                <div style={headerSubStyle}>{meteoNow?"Coordonnées 49.01°N 2.55°E":"Chargement…"}</div>
              </div>
            </div>
            {meteoNow
              ? <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(255,255,255,.13)",borderRadius:"14px",padding:"14px 16px",position:"relative",zIndex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
                    <span style={{fontSize:"42px",lineHeight:1}}>{meteoNow.emoji}</span>
                    <div>
                      <div style={{fontSize:"36px",fontWeight:"700",color:"#fff",fontFamily:"monospace",lineHeight:1}}>{meteoNow.temp}°C</div>
                      <div style={{fontSize:"12px",color:"rgba(255,255,255,.8)",marginTop:"3px",fontWeight:"600"}}>{meteoNow.desc}</div>
                    </div>
                  </div>
                  <div style={{fontSize:"11px",color:"rgba(255,255,255,.75)",lineHeight:"1.8",fontFamily:"monospace",textAlign:"right"}}>
                    💧 {meteoNow.hum}%<br/>💨 {meteoNow.wind} km/h
                  </div>
                </div>
              : <div style={{color:"rgba(255,255,255,.6)",fontFamily:"monospace",fontSize:"12px",padding:"10px",animation:"shimmer 1.4s ease-in-out infinite"}}>Récupération météo…</div>
            }
          </div>
          {/* Prévisions */}
          <div style={{padding:"14px",display:"flex",flexDirection:"column",gap:"8px"}}>
            {meteoForecast.length===0&&<div style={{color:"#ccc",fontFamily:"monospace",fontSize:"12px",textAlign:"center",padding:"20px",animation:"shimmer 1.4s ease-in-out infinite"}}>Chargement prévisions…</div>}
            {meteoForecast.map(function(fd,i){
              return <div key={i} style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 14px",borderRadius:"8px",background:fd.isToday?"#eff6ff":"#f8fafc",border:"1px solid "+(fd.isToday?"#bfdbfe":"transparent")}}>
                <span style={{fontSize:"22px",flexShrink:0,width:"30px",textAlign:"center"}}>{fd.emoji}</span>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#444",width:"36px",flexShrink:0}}>{fd.day}</span>
                <span style={{fontSize:"11px",color:"#888",flex:1}}>{fd.desc}</span>
                <span style={{fontSize:"10px",color:"#0369a1",fontFamily:"monospace",background:"#e0f2fe",padding:"2px 7px",borderRadius:"4px",flexShrink:0}}>🌂 {fd.rain}%</span>
                <span style={{fontFamily:"monospace",fontSize:"12px",flexShrink:0,minWidth:"70px",textAlign:"right"}}>
                  <span style={{color:"#f5576c",fontWeight:"700"}}>{fd.max}°</span>
                  <span style={{color:"#aaa"}}> / {fd.min}°</span>
                </span>
              </div>;
            })}
          </div>
          <div style={{padding:"8px 16px",background:"#f8fafc",borderTop:"1px solid #e2e8f0",fontSize:"10px",color:"#94a3b8",fontFamily:"monospace",textAlign:"center"}}>Source : Open-Meteo · CDG 49.01°N 2.55°E</div>
        </div>
      </div>

      {/* ── CARTE AIRTABLE ── */}
      <div style={cardStyle}>
        {/* Header */}
        <div style={{background:"linear-gradient(160deg,#1e293b 0%,#0f172a 100%)",padding:"18px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"10px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <span style={{fontSize:"22px"}}>📊</span>
            <div>
              <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9"}}>Tableau de Bord Cargo — Live Airtable</div>
              <div style={{fontSize:"10px",color:"#64748b",fontFamily:"monospace",marginTop:"2px"}}>{atSub}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
            {[["all","Tous"],["afact","À Facturer"],["import","Import"],["export","Export"],["periss","🐟 Périssable"]].map(function(f){
              return <button key={f[0]} onClick={function(){setAtFilter(f[0]);}}
                style={{padding:"6px 12px",borderRadius:"6px",border:"1px solid "+(atFilter===f[0]?"#e8601a":"rgba(255,255,255,.15)"),background:atFilter===f[0]?"#e8601a":"rgba(255,255,255,.06)",color:atFilter===f[0]?"#fff":"#94a3b8",fontSize:"11px",fontWeight:"600",cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>
                {f[1]}
              </button>;
            })}
          </div>
        </div>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",borderBottom:"1px solid #e2e8f0"}}>
          {[
            {val:atRecs.length, label:"Dossiers",   color:"#1e293b"},
            {val:aFact,         label:"À Facturer", color:"#d97706"},
            {val:enCours,       label:"En cours",   color:"#2563eb"},
            {val:nbImp,         label:"Import",     color:"#0891b2"},
            {val:nbExp,         label:"Export",     color:"#7c3aed"},
          ].map(function(s,i){
            return <div key={i} style={{padding:"16px 20px",textAlign:"center",position:"relative",borderLeft:i>0?"1px solid #e2e8f0":"none"}}>
              <span style={{display:"block",fontFamily:"monospace",fontSize:"20px",fontWeight:"600",lineHeight:1,color:s.color}}>{atLoading?"—":s.val}</span>
              <span style={{display:"block",fontSize:"10px",color:"#94a3b8",textTransform:"uppercase",letterSpacing:".06em",marginTop:"4px"}}>{s.label}</span>
            </div>;
          })}
        </div>
        {/* Table */}
        <div style={{overflowX:"auto"}}>
          {atLoading&&<div style={{padding:"32px",textAlign:"center",color:"#64748b",fontSize:"13px",fontStyle:"italic"}}>Connexion Airtable en cours…</div>}
          {!atLoading&&filteredRecs().length===0&&<div style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:"13px"}}>Aucun dossier pour ce filtre.</div>}
          {!atLoading&&filteredRecs().length>0&&(
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"13px"}}>
              <thead>
                <tr style={{background:"#f8fafc"}}>
                  {["N° Dossier","LTA","Flux","Statut","Facturation","Vol","Périss.","Date"].map(function(h){
                    return <th key={h} style={{padding:"10px 14px",textAlign:"left",fontSize:"10px",fontWeight:"600",textTransform:"uppercase",letterSpacing:".07em",color:"#64748b",borderBottom:"1px solid #e2e8f0"}}>{h}</th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {filteredRecs().map(function(r,ri){
                  var f=r.cellValuesByFieldId;
                  var dossier=f["fldVljHC9wm7EdQm0"]||"—";
                  var lta=f["fldmBDdP3tQh3NoQ4"]||"—";
                  var flux=(f["fldnpWlN78v3JSx9o"]||{}).name||"—";
                  var statut=(f["fld01sTX3cjEpORJD"]||{}).name||"—";
                  var factu=(f["fldNZaJ8ry7FrwuWr"]||{}).name||"—";
                  var vol=f["fldy8zYn4gdONq2pO"]||"—";
                  var periss=!!f["fldmTRKsb8W4GcUg9"];
                  var alerte=!!f["fldAcEmpt8ZaT7M7h"];
                  var dateVal=f["fldVHE0HKNlbcroKx"]?new Date(f["fldVHE0HKNlbcroKx"]).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
                  var fluxBg=flux.toLowerCase()==="import"?"#dbeafe":flux.toLowerCase()==="export"?"#fce7f3":"#f1f5f9";
                  var fluxCol=flux.toLowerCase()==="import"?"#1d4ed8":flux.toLowerCase()==="export"?"#9d174d":"#64748b";
                  var statutBg=statut.toLowerCase().includes("facturer")?"#fef3c7":statut.toLowerCase().includes("ok")||statut.toLowerCase().includes("valid")?"#d1fae5":"#f1f5f9";
                  var statutCol=statut.toLowerCase().includes("facturer")?"#d97706":statut.toLowerCase().includes("ok")||statut.toLowerCase().includes("valid")?"#059669":"#64748b";
                  var factuBg=factu.toLowerCase().includes("facturer")?"#fef3c7":"#f1f5f9";
                  var factuCol=factu.toLowerCase().includes("facturer")?"#d97706":"#64748b";
                  return <tr key={ri} style={{background:ri%2===0?"#fff":"#fafafa",borderBottom:"1px solid #f1f5f9"}}>
                    <td style={{padding:"11px 14px",fontWeight:"700",color:"#1e293b"}}>{alerte?"🚨 ":""}{dossier}</td>
                    <td style={{padding:"11px 14px",fontFamily:"monospace",fontSize:"11px",color:"#64748b"}}>{lta}</td>
                    <td style={{padding:"11px 14px"}}><span style={{fontSize:"11px",fontWeight:"600",padding:"2px 8px",borderRadius:"4px",background:fluxBg,color:fluxCol}}>{flux.toLowerCase()==="import"?"📥 Import":flux.toLowerCase()==="export"?"📤 Export":flux}</span></td>
                    <td style={{padding:"11px 14px"}}><span style={{fontSize:"11px",fontWeight:"600",padding:"2px 8px",borderRadius:"4px",background:statutBg,color:statutCol}}>{statut}</span></td>
                    <td style={{padding:"11px 14px"}}><span style={{fontSize:"11px",fontWeight:"600",padding:"2px 8px",borderRadius:"4px",background:factuBg,color:factuCol}}>{factu}</span></td>
                    <td style={{padding:"11px 14px",fontFamily:"monospace",fontSize:"11px"}}>{vol}</td>
                    <td style={{padding:"11px 14px",textAlign:"center"}}>{periss?"🐟":""}</td>
                    <td style={{padding:"11px 14px",fontSize:"11px",color:"#94a3b8"}}>{dateVal}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          )}
        </div>
        <div style={{padding:"10px 16px",background:"#f8fafc",borderTop:"1px solid #e2e8f0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:"10px",color:"#94a3b8",fontFamily:"monospace"}}>{filteredRecs().length} dossier(s) · Filtre : {atFilter}</span>
          <span style={{fontSize:"10px",color:"#94a3b8",fontFamily:"monospace"}}>Source : Airtable · TABLEAU DE BORD Cargo</span>
        </div>
      </div>

    </div>
  );
}




/* ══ App principale ══════════════════════════════════════════════════════ */
function App(){
  const [notif,notify2] = useNotify();
  return(
    <div style={{minHeight:"100vh",background:"#060d1a",color:"#c8d8e8"}}>
      {notif&&<div style={{position:"fixed",top:"16px",right:"16px",background:notif.ok?"#00c853":"#c44010",color:"#fff",padding:"10px 18px",borderRadius:"8px",fontWeight:"700",fontSize:"14px",zIndex:9999,animation:"fadeIn .2s ease"}}>{notif.msg}</div>}
      <div style={{background:"#0a1828",borderBottom:"3px solid #e8601a",padding:"12px 20px",display:"flex",alignItems:"center",gap:"14px"}}>
        <div>
          <div style={{color:"#fff",fontWeight:"800",fontSize:"16px"}}>✈️ Suivi Vols CDG</div>
          <div style={{color:"#8899aa",fontSize:"12px"}}>Trans Air Freight — FlightAware via Apps Script</div>
        </div>
      </div>
      <div style={{maxWidth:"1300px",margin:"0 auto",padding:"20px"}}>
        <FlightView/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
