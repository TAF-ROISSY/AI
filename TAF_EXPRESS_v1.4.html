<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>TAF EXPRESS — Dossiers Chronopost / DHL / Fedex / AERIEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d10;--bg-2:#12151a;--bg-3:#181c22;--bg-4:#1f242c;
  --border:#272d36;--border-2:#343b46;
  --text:#e7eaf0;--text-2:#9aa3b2;--text-3:#60687a;
  --accent:#d4a857;--accent-2:#f0c96b;
  --green:#4caf7a;--green-soft:#2a6f4e;
  --red:#e05d5d;--red-soft:#5a2a2a;
  --blue:#5da8e8;--blue-soft:#27445f;
  --purple:#9b7ad4;--orange:#e59556;--teal:#5fb6b0;
  --radius:10px;--radius-sm:6px;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --serif:"Instrument Serif","Georgia",serif;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 15% -10%,#181d26 0%,transparent 55%),radial-gradient(900px 600px at 110% 110%,#1a1612 0%,transparent 55%),var(--bg);
  color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a303a;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3a4150;background-clip:content-box}

.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
.sidebar{background:linear-gradient(180deg,#0e1116 0%,#0a0c0f 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.brand{padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand h1{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.5px;color:var(--accent-2)}
.brand h1 em{font-style:italic;color:var(--text-2);font-size:22px}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:2px;text-transform:uppercase;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.brand .badge{background:var(--accent);color:#0b0d10;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:1px}
.nav-section{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:2px;padding:12px 10px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-2);font-size:13.5px;font-weight:500;transition:all .15s ease;text-align:left;width:100%}
.nav-btn:hover{background:var(--bg-3);color:var(--text)}
.nav-btn.active{background:linear-gradient(90deg,rgba(212,168,87,.14),rgba(212,168,87,.02));color:var(--accent-2);box-shadow:inset 2px 0 0 var(--accent)}
.nav-btn .ico{width:16px;height:16px;flex-shrink:0;opacity:.8}
.nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--bg-3);padding:1px 7px;border-radius:10px}
.nav-btn.active .count{color:var(--accent);background:rgba(212,168,87,.12)}
.sidebar-footer{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text-3)}
.sidebar-footer a{color:var(--text-2);display:block;padding:4px 0}
.sidebar-footer a:hover{color:var(--accent)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(11,13,16,.65);backdrop-filter:blur(10px)}
.topbar h2{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--text);letter-spacing:-.3px}
.topbar h2 em{color:var(--text-3);font-style:italic}
.topbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid var(--border);padding:7px 12px;border-radius:var(--radius-sm);min-width:280px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,168,87,.1)}
.search input{background:none;border:none;outline:none;width:100%;font-size:13px}
.search .kbd{font-family:var(--mono);font-size:10px;color:var(--text-3);padding:2px 5px;border:1px solid var(--border-2);border-radius:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all .15s ease;border:1px solid transparent}
.btn.primary{background:var(--accent);color:#0b0d10}
.btn.primary:hover{background:var(--accent-2);transform:translateY(-1px)}
.btn.ghost{background:var(--bg-3);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{background:var(--bg-4);border-color:var(--border-2)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.success{background:rgba(76,175,122,.15);color:var(--green);border-color:rgba(76,175,122,.3)}
.btn.success:hover{background:rgba(76,175,122,.22)}
.btn.small{padding:5px 10px;font-size:12px}
.content{flex:1;overflow:auto;padding:22px;position:relative}

.page{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:linear-gradient(160deg,var(--bg-2) 0%,var(--bg-3) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border-2),transparent)}
.kpi .label{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.kpi .value{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1;color:var(--text)}
.kpi .value em{font-style:italic;color:var(--accent-2)}
.kpi .sub{font-size:11.5px;color:var(--text-3);margin-top:6px;font-family:var(--mono)}
.kpi.accent{border-color:rgba(212,168,87,.3)}.kpi.accent .value{color:var(--accent-2)}
.kpi.green .value{color:var(--green)}.kpi.blue .value{color:var(--blue)}.kpi.red .value{color:var(--red)}

.section-title{font-family:var(--serif);font-size:22px;font-weight:400;margin:28px 0 14px;display:flex;align-items:center;gap:12px;letter-spacing:-.3px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.section-title em{font-style:italic;color:var(--text-3)}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.panel{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.panel-header h3{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--text)}
.panel-header .hint{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;margin-left:auto}
.panel-body{padding:8px 0}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.filter{background:var(--bg-2);border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius-sm);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.filter select,.filter input{background:none;border:none;outline:none;font-size:12.5px;color:var(--text)}
.filter label{color:var(--text-3);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px}

.table-wrap{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.dossiers-table{width:100%;border-collapse:collapse;font-size:13px}
.dossiers-table th{text-align:left;padding:11px 12px;background:var(--bg-3);font-weight:500;font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;white-space:nowrap}
.dossiers-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.dossiers-table tbody tr{cursor:pointer;transition:background .12s}
.dossiers-table tbody tr:hover{background:var(--bg-3)}
.dossiers-table .num{font-family:var(--mono);color:var(--accent-2);font-weight:500}
.dossiers-table .small{font-size:11.5px;color:var(--text-3)}
.dossiers-table .col-name{font-weight:500}
.dossiers-table .col-name small{display:block;color:var(--text-3);font-weight:400;font-size:11.5px;margin-top:1px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;font-family:var(--sans);white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.green{background:rgba(76,175,122,.12);color:var(--green);border-color:rgba(76,175,122,.2)}
.chip.blue{background:rgba(93,168,232,.12);color:var(--blue);border-color:rgba(93,168,232,.2)}
.chip.orange{background:rgba(229,149,86,.12);color:var(--orange);border-color:rgba(229,149,86,.2)}
.chip.red{background:rgba(224,93,93,.12);color:var(--red);border-color:rgba(224,93,93,.2)}
.chip.purple{background:rgba(155,122,212,.12);color:var(--purple);border-color:rgba(155,122,212,.2)}
.chip.teal{background:rgba(95,182,176,.12);color:var(--teal);border-color:rgba(95,182,176,.2)}
.chip.gray{background:var(--bg-3);color:var(--text-2);border-color:var(--border)}
.chip.accent{background:rgba(212,168,87,.15);color:var(--accent-2);border-color:rgba(212,168,87,.3)}

.op-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.op-badge.chronopost{background:rgba(228,125,17,.12);color:#ff9f43}
.op-badge.dhl{background:rgba(255,204,0,.12);color:#ffcc00}
.op-badge.fedex{background:rgba(122,64,204,.12);color:#b28dff}
.op-badge.aerien{background:rgba(95,182,176,.12);color:var(--teal)}
.op-badge.default{background:var(--bg-3);color:var(--text-2)}

.workflow-dots{display:inline-flex;gap:3px}
.workflow-dots span{width:7px;height:7px;border-radius:50%;background:var(--border-2)}
.workflow-dots span.done{background:var(--green)}
.workflow-dots span.pending{background:var(--orange)}

.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-backdrop.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,92vw);background:var(--bg-2);border-left:1px solid var(--border);z-index:101;transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.drawer-head h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.3px}
.drawer-head h2 .num{color:var(--accent-2);font-family:var(--mono);font-size:22px;margin-right:10px}
.drawer-head .close{width:34px;height:34px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.drawer-head .close:hover{background:var(--bg-4);color:var(--text)}
.drawer-body{flex:1;overflow:auto;padding:20px 22px}

.tab-strip{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-20px -22px 18px;padding:0 22px;background:var(--bg-2);position:sticky;top:-20px;z-index:2;overflow-x:auto}
.tab-strip button{padding:10px 14px;color:var(--text-3);font-size:12.5px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-strip button:hover{color:var(--text-2)}
.tab-strip button.active{color:var(--accent-2);border-bottom-color:var(--accent)}
.tab-strip button .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:4px;vertical-align:middle}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.form-grid.full{grid-template-columns:1fr}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg-3);border:1px solid var(--border);padding:9px 11px;border-radius:var(--radius-sm);font-size:13px;color:var(--text);transition:border-color .15s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--bg-4)}
.field textarea{min-height:80px;resize:vertical;font-family:var(--sans)}
.field .hint{font-size:11px;color:var(--text-3);margin-top:4px}

.workflow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.wfl-step{background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;user-select:none;transition:all .15s}
.wfl-step:hover{border-color:var(--border-2)}
.wfl-step .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-2);flex-shrink:0;transition:all .15s}
.wfl-step.active{background:rgba(76,175,122,.08);border-color:rgba(76,175,122,.3)}
.wfl-step.active .dot{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(76,175,122,.15)}
.wfl-step .label{font-weight:500}
.wfl-step.active .label{color:var(--green)}

.doc-list{display:flex;flex-direction:column;gap:8px}
.doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px}
.doc-item .doc-ico{width:28px;height:28px;background:var(--bg-4);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--mono);font-size:10px;font-weight:600}
.doc-item .name{flex:1}
.doc-item .name small{display:block;color:var(--text-3);font-size:10.5px}
.doc-item .empty{color:var(--text-3);font-style:italic}

.action-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;border-top:1px solid var(--border);background:var(--bg-2);flex-shrink:0}

.settings-card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.settings-card h3{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:6px}
.settings-card p{color:var(--text-2);font-size:13px;margin-bottom:14px;line-height:1.55}
.settings-card code{font-family:var(--mono);font-size:11.5px;background:var(--bg-3);padding:2px 6px;border-radius:3px;color:var(--accent-2)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tag-list .tag{background:var(--bg-3);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-size:11.5px;display:inline-flex;align-items:center;gap:6px}
.tag-list .tag button{color:var(--text-3);font-size:13px;line-height:1}
.tag-list .tag button:hover{color:var(--red)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg-3);border:1px solid var(--border-2);padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;z-index:1000;box-shadow:var(--shadow);transition:transform .3s;display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.info{border-color:var(--blue);color:var(--blue)}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-3)}
.empty-state h3{font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:6px;color:var(--text-2)}
.empty-state p{font-size:13.5px;margin-bottom:18px;max-width:420px;margin-left:auto;margin-right:auto}

.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.mini-chart{display:flex;align-items:flex-end;gap:3px;height:80px;padding:8px}
.mini-chart .bar{flex:1;background:linear-gradient(180deg,var(--accent) 0%,rgba(212,168,87,.25) 100%);border-radius:2px 2px 0 0;min-height:3px;transition:opacity .15s}
.mini-chart .bar:hover{opacity:.75}

.link-apps{display:flex;gap:10px;padding:6px 0;flex-wrap:wrap}
.link-app{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;transition:all .15s}
.link-app:hover{border-color:var(--accent);color:var(--accent-2);transform:translateY(-1px)}
.link-app .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* Facturation panel */
.fact-card{background:linear-gradient(135deg,rgba(212,168,87,.08) 0%,rgba(212,168,87,.02) 100%);border:1px solid rgba(212,168,87,.25);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.fact-card .fact-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.fact-card .fact-title{font-family:var(--serif);font-size:20px;color:var(--accent-2)}
.fact-card .fact-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.fact-card .fact-amount{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.fact-card .fact-amount .lbl{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.fact-card .fact-amount .val{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--text)}
.fact-card .fact-amount.total .val{color:var(--accent-2)}
.fact-meta{display:flex;gap:16px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.fact-meta span{font-family:var(--mono)}
.fact-empty{background:var(--bg-3);border:1px dashed var(--border-2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text-3);font-size:13px}

/* ====== MODAL ====== */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.modal-bd.open{opacity:1;pointer-events:all}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;z-index:201;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius);width:min(820px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:all .25s cubic-bezier(.3,.9,.3,1)}
.modal.open{opacity:1;pointer-events:all;transform:translate(-50%,-50%)}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-head h3{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.3px;flex:1}
.modal-head h3 em{font-style:italic;color:var(--text-3)}
.modal-head .close{width:32px;height:32px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.modal-head .close:hover{background:var(--bg-4);color:var(--text)}
.modal-body{flex:1;overflow:auto;padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0}

/* ====== PROFORMA EDITOR ====== */
.pf-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.pf-table th{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;text-align:left;padding:8px 8px;border-bottom:1px solid var(--border);font-weight:500}
.pf-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.pf-table input,.pf-table select{background:var(--bg-3);border:1px solid transparent;padding:7px 9px;border-radius:5px;font-size:13px;color:var(--text);width:100%;outline:none;transition:border-color .12s}
.pf-table input:focus,.pf-table select:focus{border-color:var(--accent);background:var(--bg-4)}
.pf-table .qty,.pf-table .tva,.pf-table .pu,.pf-table .total{text-align:right;font-family:var(--mono)}
.pf-table .col-desc{width:42%}
.pf-table .col-qty{width:10%}
.pf-table .col-pu{width:18%}
.pf-table .col-tva{width:12%}
.pf-table .col-total{width:14%}
.pf-table .col-del{width:4%;text-align:center}
.pf-table .del-btn{color:var(--text-3);font-size:16px;cursor:pointer;padding:4px}
.pf-table .del-btn:hover{color:var(--red)}
.pf-totals{display:flex;justify-content:flex-end;margin-top:14px}
.pf-totals-box{min-width:280px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.pf-totals-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--text-2)}
.pf-totals-row.big{font-family:var(--serif);font-size:22px;color:var(--accent-2);border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.pf-totals-row span:last-child{font-family:var(--mono);font-weight:500}

/* ====== CLIENT FORM STATUS ====== */
.cf-card{background:linear-gradient(135deg,rgba(93,168,232,.08) 0%,rgba(93,168,232,.02) 100%);border:1px solid rgba(93,168,232,.25);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.cf-card.done{background:linear-gradient(135deg,rgba(76,175,122,.08) 0%,rgba(76,175,122,.02) 100%);border-color:rgba(76,175,122,.25)}
.cf-card .cf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.cf-card .cf-title{font-family:var(--serif);font-size:18px;color:var(--blue)}
.cf-card.done .cf-title{color:var(--green)}
.cf-url{display:flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid var(--border);padding:8px 10px;border-radius:var(--radius-sm);font-family:var(--mono);font-size:11.5px;color:var(--text-2);word-break:break-all;margin:10px 0}
.cf-url button{color:var(--accent);font-size:11px;white-space:nowrap}
.cf-received{background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-top:10px}
.cf-received h4{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.cf-received-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.cf-received-row:last-child{border-bottom:none}
.cf-received-row .k{color:var(--text-3)}
.cf-received-row .v{color:var(--text);font-family:var(--mono);max-width:60%;text-align:right;word-break:break-word}

.pf-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.pf-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px}
.pf-item .pf-num{font-family:var(--mono);color:var(--accent-2);font-weight:500}
.pf-item .pf-desc{flex:1}
.pf-item .pf-desc small{display:block;color:var(--text-3);font-size:11px;margin-top:2px}
.pf-item .pf-amt{font-family:var(--mono);color:var(--text);font-weight:500}
.pf-item .pf-actions{display:flex;gap:4px}
.pf-item .pf-actions button,.pf-item .pf-actions a{color:var(--text-3);padding:4px 8px;font-size:11px;border-radius:4px}
.pf-item .pf-actions button:hover,.pf-item .pf-actions a:hover{background:var(--bg-4);color:var(--text)}

/* ====== SYNTHÈSE — vue plein écran 360° ====== */
.synth-bd{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
.synth-bd.open{opacity:1;pointer-events:all}
.synth{
  position:fixed;inset:24px;background:var(--bg-2);
  border:1px solid var(--border-2);border-radius:14px;
  z-index:301;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;transform:scale(.98);transition:all .3s cubic-bezier(.3,.9,.3,1);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.synth.open{opacity:1;pointer-events:all;transform:scale(1)}
@media (max-width:900px){.synth{inset:0;border-radius:0;border:none}}

.synth-head{
  padding:18px 26px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;flex-shrink:0;
  background:linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 100%);
}
.synth-head .sh-client{flex:1;min-width:0}
.synth-head h2{
  font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;letter-spacing:-.5px;
  color:var(--text);margin-bottom:4px;
}
.synth-head h2 em{font-style:italic;color:var(--accent-2);margin-right:10px;font-family:var(--mono);font-size:22px}
.synth-head .sh-meta{
  font-family:var(--mono);font-size:11px;color:var(--text-3);
  letter-spacing:.5px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.synth-head .sh-meta span{display:inline-flex;align-items:center;gap:6px}
.synth-head .sh-actions{display:flex;gap:6px;flex-shrink:0}
.synth-head .close-x{
  width:36px;height:36px;border-radius:50%;background:var(--bg-3);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
}
.synth-head .close-x:hover{background:var(--bg-4);color:var(--text)}

.synth-body{
  flex:1;overflow:auto;padding:22px 26px 30px;
  display:grid;grid-template-columns:1.2fr 1fr;gap:24px;
}
@media (max-width:1100px){.synth-body{grid-template-columns:1fr}}

.synth-col{display:flex;flex-direction:column;gap:18px}

.sb-block{
  background:var(--bg-3);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;
}
.sb-block-head{
  padding:12px 16px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);background:var(--bg-4);
}
.sb-block-head h3{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  text-transform:uppercase;letter-spacing:2px;font-weight:500;flex:1;
}
.sb-block-head .hint{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:1px}
.sb-block-head button,.sb-block-head a{
  font-family:var(--mono);font-size:10px;color:var(--accent);
  letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:4px;
}
.sb-block-head button:hover,.sb-block-head a:hover{background:var(--bg-3);color:var(--accent-2)}
.sb-block-body{padding:14px 16px}

.sb-kv{display:grid;grid-template-columns:1fr;gap:0}
.sb-kv-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border)}
.sb-kv-row:last-child{border-bottom:none}
.sb-kv-row .k{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;flex-shrink:0;padding-top:2px}
.sb-kv-row .v{text-align:right;color:var(--text);font-size:13px;max-width:65%;word-break:break-word}
.sb-kv-row .v.mono{font-family:var(--mono);font-size:12.5px;color:var(--accent-2)}
.sb-kv-row .v.num{font-family:var(--mono);font-size:13px;color:var(--accent-2)}
.sb-kv-row .v.empty{color:var(--text-3);font-style:italic}

.sb-amounts{display:grid;grid-template-columns:repeat(4, 1fr);gap:10px}
.sb-amount{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.sb-amount .lbl{font-family:var(--mono);font-size:9.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.sb-amount .val{font-family:var(--mono);font-size:16px;color:var(--text);font-weight:500}
.sb-amount.total .val{color:var(--accent-2);font-size:18px}

/* Timeline */
.tl{position:relative;padding-left:20px}
.tl::before{
  content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--border-2);
}
.tl-item{position:relative;padding:0 0 22px 18px}
.tl-item:last-child{padding-bottom:4px}
.tl-item .tl-dot{
  position:absolute;left:-20px;top:2px;width:11px;height:11px;border-radius:50%;
  background:var(--bg-3);border:2px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  z-index:1;transition:all .2s;
}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(76,175,122,.15)}
.tl-item.current .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,168,87,.2);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 3px rgba(212,168,87,.2)}50%{box-shadow:0 0 0 6px rgba(212,168,87,.08)}}
.tl-item.future .tl-dot{opacity:.4}
.tl-item.manual .tl-dot{background:var(--purple);border-color:var(--purple)}
.tl-item .tl-title{font-size:13.5px;color:var(--text);font-weight:500;margin-bottom:3px;line-height:1.35}
.tl-item.future .tl-title{color:var(--text-3);font-weight:400}
.tl-item .tl-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.tl-item .tl-note{margin-top:6px;padding:8px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-2);line-height:1.5}
.tl-item .tl-actions{margin-top:4px;display:flex;gap:4px}
.tl-item .tl-actions button{font-family:var(--mono);font-size:9px;color:var(--text-3);padding:2px 6px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.tl-item .tl-actions button:hover{color:var(--red)}
.tl-add{margin-top:10px}
.tl-add-form{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:12px;display:none;margin-top:10px}
.tl-add-form.open{display:block;animation:fadeIn .2s}
.tl-add-form input,.tl-add-form textarea,.tl-add-form select{
  width:100%;background:var(--bg-3);border:1px solid var(--border);
  padding:7px 10px;border-radius:5px;font-size:12.5px;color:var(--text);outline:none;margin-bottom:8px;
}
.tl-add-form textarea{min-height:50px;resize:vertical;font-family:var(--sans)}
.tl-add-form input:focus,.tl-add-form textarea:focus,.tl-add-form select:focus{border-color:var(--accent)}
.tl-add-form .actions{display:flex;gap:6px}

.sb-docs-list{display:flex;flex-direction:column;gap:6px}
.sb-doc{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;font-size:12px}
.sb-doc .ico{width:26px;height:26px;border-radius:5px;background:var(--bg-4);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:600;flex-shrink:0}
.sb-doc .name{flex:1;min-width:0;color:var(--text);word-break:break-word}
.sb-doc .name small{display:block;color:var(--text-3);font-size:10.5px}
.sb-doc a{color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase}

.sb-status-bar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--bg-4);border:1px solid var(--border);border-radius:8px;
  margin-bottom:14px;
}
.sb-status-bar .sbb-k{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:1.2px;text-transform:uppercase}

/* Dashboard — "À traiter" section */
.urgent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:24px}
.urgent-block{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.urgent-block .ub-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg-3)}
.urgent-block .ub-head h3{font-family:var(--serif);font-size:17px;font-weight:400;flex:1;color:var(--text)}
.urgent-block .ub-head .count{font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--bg-2);padding:2px 8px;border-radius:10px;letter-spacing:.5px}
.urgent-block.red .ub-head{border-left:3px solid var(--red);background:linear-gradient(90deg,rgba(224,93,93,.08) 0%, var(--bg-3) 40%)}
.urgent-block.blue .ub-head{border-left:3px solid var(--blue);background:linear-gradient(90deg,rgba(93,168,232,.08) 0%, var(--bg-3) 40%)}
.urgent-block.orange .ub-head{border-left:3px solid var(--orange);background:linear-gradient(90deg,rgba(229,149,86,.08) 0%, var(--bg-3) 40%)}
.urgent-block.purple .ub-head{border-left:3px solid var(--purple);background:linear-gradient(90deg,rgba(155,122,212,.08) 0%, var(--bg-3) 40%)}
.urgent-list{max-height:400px;overflow:auto}
.urgent-row{
  display:grid;grid-template-columns:60px 1fr 90px;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:12.5px;cursor:pointer;transition:background .12s;align-items:center;
}
.urgent-row:hover{background:var(--bg-3)}
.urgent-row:last-child{border-bottom:none}
.urgent-row .ur-num{font-family:var(--mono);color:var(--accent-2);font-weight:500}
.urgent-row .ur-client{min-width:0}
.urgent-row .ur-client b{color:var(--text);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urgent-row .ur-client small{color:var(--text-3);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urgent-row .ur-right{text-align:right;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.urgent-empty{padding:20px;text-align:center;color:var(--text-3);font-size:12px;font-style:italic}

/* Click hint on client names */
.client-clickable{cursor:pointer;transition:color .15s;border-bottom:1px dashed transparent}
.client-clickable:hover{color:var(--accent-2);border-bottom-color:var(--accent)}

/* ====== BELL / NOTIFICATION (BAE inbox) ====== */
.topbar-bell{
  position:relative;width:38px;height:38px;border-radius:50%;
  background:var(--bg-3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
  transition:all .15s;margin-right:4px;
}
.topbar-bell:hover{background:var(--bg-4);color:var(--accent-2);border-color:var(--accent)}
.topbar-bell.has-pending{color:var(--accent-2);border-color:var(--accent);animation:bell-glow 2.4s ease-in-out infinite}
@keyframes bell-glow{0%,100%{box-shadow:0 0 0 0 rgba(212,168,87,.4)}50%{box-shadow:0 0 0 6px rgba(212,168,87,0)}}
.topbar-bell .count-pill{
  position:absolute;top:-3px;right:-3px;
  min-width:18px;height:18px;padding:0 5px;border-radius:10px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);border:2px solid var(--bg);
}

/* Inbox panel dropdown */
.inbox-panel{
  position:fixed;top:62px;right:22px;
  width:min(440px,95vw);max-height:70vh;overflow:auto;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:12px;
  box-shadow:var(--shadow);z-index:180;padding:0;
  opacity:0;pointer-events:none;transform:translateY(-6px);
  transition:all .2s cubic-bezier(.3,.9,.3,1);
}
.inbox-panel.open{opacity:1;pointer-events:all;transform:translateY(0)}
.inbox-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.inbox-head h3{font-family:var(--serif);font-weight:400;font-size:18px;flex:1}
.inbox-head h3 em{font-style:italic;color:var(--text-3);font-size:13px;margin-left:8px}
.inbox-list{padding:6px 0}
.inbox-empty{padding:30px 18px;text-align:center;color:var(--text-3);font-size:12.5px;font-style:italic}
.inbox-item{
  padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .12s;display:flex;gap:12px;align-items:flex-start;
}
.inbox-item:hover{background:var(--bg-3)}
.inbox-item:last-child{border-bottom:none}
.inbox-item .ii-ico{
  width:32px;height:32px;border-radius:50%;background:var(--bg-3);
  display:flex;align-items:center;justify-content:center;color:var(--accent-2);
  flex-shrink:0;font-size:14px;
}
.inbox-item.matched .ii-ico{background:rgba(76,175,122,.15);color:var(--green)}
.inbox-item.ambiguous .ii-ico{background:rgba(229,149,86,.15);color:var(--orange)}
.inbox-item.unmatched .ii-ico{background:rgba(224,93,93,.15);color:var(--red)}
.inbox-item .ii-body{flex:1;min-width:0}
.inbox-item .ii-subj{font-size:13px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox-item .ii-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.inbox-item .ii-tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.inbox-item .ii-tag.matched{background:rgba(76,175,122,.15);color:var(--green)}
.inbox-item .ii-tag.ambiguous{background:rgba(229,149,86,.15);color:var(--orange)}
.inbox-item .ii-tag.unmatched{background:rgba(224,93,93,.15);color:var(--red)}

/* Candidate list in matching modal */
.match-cand-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.match-cand{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:all .15s;
}
.match-cand:hover{border-color:var(--accent);background:var(--bg-4)}
.match-cand.selected{border-color:var(--accent);background:rgba(212,168,87,.08);box-shadow:0 0 0 2px rgba(212,168,87,.2)}
.match-cand .mc-num{font-family:var(--mono);color:var(--accent-2);font-weight:500;font-size:14px}
.match-cand .mc-body{flex:1;min-width:0}
.match-cand .mc-title{font-size:13px;color:var(--text);font-weight:500}
.match-cand .mc-meta{font-size:11.5px;color:var(--text-3);margin-top:2px}
.match-cand .mc-score{font-family:var(--mono);font-size:10.5px;color:var(--text-3);padding:3px 8px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border)}
.match-cand .mc-score.high{color:var(--green);border-color:rgba(76,175,122,.3)}
.match-cand .mc-score.med{color:var(--orange);border-color:rgba(229,149,86,.3)}

.mail-preview{background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.55}
.mail-preview .mp-row{display:flex;gap:10px;padding:3px 0}
.mail-preview .mp-k{font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;min-width:70px;padding-top:2px}
.mail-preview .mp-v{flex:1;color:var(--text);word-break:break-word}
.mail-preview .mp-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text-2);white-space:pre-wrap;font-size:12px;max-height:160px;overflow:auto}
.mail-preview .mp-pdf{display:inline-flex;align-items:center;gap:6px;color:var(--accent-2);font-family:var(--mono);font-size:11px;padding:4px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;margin-top:6px}

/* Toast stack for new BAE */
.bae-popup{
  position:fixed;top:20px;right:20px;z-index:190;
  background:var(--bg-2);border:1px solid var(--accent);border-radius:12px;
  padding:14px 18px;box-shadow:0 12px 40px rgba(212,168,87,.25);
  min-width:320px;max-width:440px;
  transform:translateX(calc(100% + 30px));transition:transform .4s cubic-bezier(.3,.9,.3,1);
  display:flex;align-items:flex-start;gap:12px;
}
.bae-popup.show{transform:translateX(0)}
.bae-popup .bp-ico{
  width:40px;height:40px;border-radius:50%;background:rgba(212,168,87,.15);
  color:var(--accent-2);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
}
.bae-popup .bp-body{flex:1;min-width:0}
.bae-popup .bp-title{font-family:var(--serif);font-size:16px;color:var(--text);line-height:1.2;margin-bottom:4px}
.bae-popup .bp-title em{font-style:italic;color:var(--accent-2)}
.bae-popup .bp-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-bottom:8px;letter-spacing:.5px}
.bae-popup .bp-actions{display:flex;gap:6px;flex-wrap:wrap}
.bae-popup .bp-close{position:absolute;top:6px;right:10px;color:var(--text-3);font-size:16px;padding:2px 6px}
.bae-popup .bp-close:hover{color:var(--text)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .drawer{width:100%}
  .fact-card .fact-amounts{grid-template-columns:1fr}
  .synth-body{padding:16px;gap:14px}
  .sb-amounts{grid-template-columns:repeat(2, 1fr)}
}

</style>

/* ---------- Firebase REST + SSE streaming ---------- */
const fb = {
  base(){ return `${CONFIG.firebase.url}/${CONFIG.firebase.sharedNode}`; },
  async get(path=""){ const r=await fetch(`${this.base()}${path}.json`); if(!r.ok) throw new Error(`GET ${path}: ${r.status}`); return r.json(); },
  async set(path,data){ const r=await fetch(`${this.base()}${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}); if(!r.ok) throw new Error(`PUT ${path}: ${r.status}`); return r.json(); },
  async update(path,patch){ const r=await fetch(`${this.base()}${path}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)}); if(!r.ok) throw new Error(`PATCH ${path}: ${r.status}`); return r.json(); },
  async del(path){ const r=await fetch(`${this.base()}${path}.json`,{method:"DELETE"}); if(!r.ok) throw new Error(`DELETE ${path}: ${r.status}`); return r.json(); },

  // Streaming via EventSource (REST /.json?... with Accept:text/event-stream → EventSource)
  subscribe(path, onChange, onError){
    const url = `${this.base()}${path}.json`;
    try{
      const es = new EventSource(url);
      es.addEventListener("put",(e)=>{
        try{ const d=JSON.parse(e.data); onChange("put", d.path, d.data); }catch(err){}
      });
      es.addEventListener("patch",(e)=>{
        try{ const d=JSON.parse(e.data); onChange("patch", d.path, d.data); }catch(err){}
      });
      es.addEventListener("keep-alive",()=>{ app.setLiveStatus(true); });
      es.onerror = (e)=>{ app.setLiveStatus(false); if (onError) onError(e); };
      es.onopen  = ()=>{ app.setLiveStatus(true); };
      return es;
    }catch(e){
      if (onError) onError(e);
      return null;
    }
  }
};

/* ---------- App ---------- */
const app = {

  async boot(){
    console.log("🚀 TAF EXPRESS v1.14 - Boot starting...");
    this.bindNav();
    this.bindSearch();
    this.bindKeyboard();
    console.log("✅ Event bindings done");
    await this.loadAll();
    console.log("✅ Data loaded, subscribing to live updates...");
    this.subscribeLive();
    console.log("✅ Live subscriptions done, rendering...");
    this.render();
    console.log("✅ Initial render complete");
  },

  async loadAll(){
    console.log("📦 Loading data from Firebase...");
    try{
      const shared = await fb.get("");
      console.log("📥 Firebase response:", shared);
      state.dossiers = (shared && shared.dossiers) || {};
      state.factures = (shared && shared.factures) || {};
      state.proformas = (shared && shared.proformas) || {};
      state.clientForms = (shared && shared.client_forms) || {};
      state.baeInbox = (shared && shared.bae_inbox) || {};
      console.log(`✅ Loaded: ${Object.keys(state.dossiers).length} dossiers, ${Object.keys(state.factures).length} factures`);
      if (shared && shared.config && shared.config.notifications){
        state.notifSettings = Object.assign(state.notifSettings, shared.config.notifications);
      }
      // Marquer tous les BAE existants comme "vus" pour éviter un flot de popups au chargement
      Object.keys(state.baeInbox).forEach(id=>state.seenBaeIds.add(id));
      const nat = shared && shared.config && shared.config.natures;
      if (Array.isArray(nat) && nat.length) state.natures = nat;
      state.loaded = true;
      this.updateNavCount();
      this.updateBellCount();
    }catch(e){
      console.error("❌ Firebase loading error:", e);
      toast("Firebase indisponible","error");
    }
  },

  setLiveStatus(ok){
    state.live.connected = ok;
    const dot = $("#liveDot"); const txt = $("#fbStatus");
    if (!dot || !txt) return;
    if (ok){ dot.style.background="var(--green)"; txt.textContent="temps réel"; }
    else   { dot.style.background="var(--red)";   txt.textContent="reconnexion…"; }
  },

  subscribeLive(){
    // Dossiers : sync multi-utilisateurs (au cas où 2 personnes ouvrent l'app)
    state.live.dossiers = fb.subscribe("/dossiers", (op, path, data)=>{
      if (path === "/" || path === null){
        state.dossiers = data || {};
      } else {
        // path = "/{dossierId}" ou "/{dossierId}/{field}"
        const parts = path.replace(/^\//,"").split("/");
        const id = parts[0];
        if (parts.length === 1){
          if (data === null) delete state.dossiers[id];
          else state.dossiers[id] = data;
        } else {
          state.dossiers[id] = state.dossiers[id] || {};
          setDeep(state.dossiers[id], parts.slice(1), data);
        }
      }
      this.updateNavCount();
      if (["dashboard","dossiers","facturation"].includes(state.currentPage)) this.render();
    });
    // Factures : les changements côté PERAC se propagent ici
    state.live.factures = fb.subscribe("/factures", (op, path, data)=>{
      if (path === "/" || path === null){
        state.factures = data || {};
      } else {
        const parts = path.replace(/^\//,"").split("/");
        const id = parts[0];
        if (parts.length === 1){
          if (data === null) delete state.factures[id];
          else state.factures[id] = data;
        } else {
          state.factures[id] = state.factures[id] || {};
          setDeep(state.factures[id], parts.slice(1), data);
        }
      }
      this.updateNavCount();
      // Refresh UI si la facture concerne le dossier ouvert
      if (state.currentDossierId && state.factures[state.currentDossierId]){
        if (state.currentTab === "facturation") this.renderTab(state.dossiers[state.currentDossierId]);
      }
      if (["dashboard","facturation"].includes(state.currentPage)) this.render();
      if (state.synthDossierId) this.renderSynth();
    });

    // Proformas : synchro temps réel des envois/statuts
    state.live.proformas = fb.subscribe("/proformas", (op, path, data)=>{
      if (path === "/" || path === null){ state.proformas = data || {}; }
      else { const parts=path.replace(/^\//,"").split("/"); const id=parts[0];
        if (parts.length===1){ if (data===null) delete state.proformas[id]; else state.proformas[id]=data; }
        else { state.proformas[id]=state.proformas[id]||{}; setDeep(state.proformas[id], parts.slice(1), data); }
      }
      if (state.currentDossierId && state.currentTab==="facturation") this.renderTab(state.dossiers[state.currentDossierId]);
      if (state.synthDossierId) this.renderSynth();
    });

    // Formulaires clients : remonte les saisies + soumissions du client
    state.live.clientForms = fb.subscribe("/client_forms", (op, path, data)=>{
      if (path === "/" || path === null){ state.clientForms = data || {}; }
      else { const parts=path.replace(/^\//,"").split("/"); const id=parts[0];
        if (parts.length===1){ if (data===null) delete state.clientForms[id]; else state.clientForms[id]=data; }
        else { state.clientForms[id]=state.clientForms[id]||{}; setDeep(state.clientForms[id], parts.slice(1), data); }
      }
      if (state.currentDossierId && state.currentTab==="facturation") this.renderTab(state.dossiers[state.currentDossierId]);
      if (state.synthDossierId) this.renderSynth();
      if (data && data.status==="SUBMITTED" && data.dossierId){
        const num = state.dossiers[data.dossierId]?.numDossier||"?";
        toast(`✓ Le client a soumis ses infos — #${num}`,"success");
      }
    });

    // BAE Inbox : réception des déclarations douane via le mailhook Make
    state.live.baeInbox = fb.subscribe("/bae_inbox", (op, path, data)=>{
      const wasInitial = !state.loaded || path === "/" || path === null;
      if (path === "/" || path === null){ state.baeInbox = data || {}; }
      else { const parts=path.replace(/^\//,"").split("/"); const id=parts[0];
        if (parts.length===1){
          if (data===null) delete state.baeInbox[id];
          else {
            state.baeInbox[id] = data;
            // Popup ET auto-matching UNIQUEMENT pour un BAE qu'on n'a jamais vu
            if (!wasInitial && !state.seenBaeIds.has(id) && data.status!=="MATCHED" && data.status!=="DISMISSED"){
              state.seenBaeIds.add(id);
              this.handleNewBae(id, data);
            }
          }
        }
        else { state.baeInbox[id]=state.baeInbox[id]||{}; setDeep(state.baeInbox[id], parts.slice(1), data); }
      }
      this.updateBellCount();
      if (state.inboxPanelOpen) this.renderInboxPanel();
    });
  },

  updateNavCount(){
    $("#navCount").textContent = Object.keys(state.dossiers||{}).length;
    $("#navFactCount").textContent = Object.keys(state.factures||{}).length || "—";
  },

  bindNav(){
    $$(".nav-btn[data-page]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        $$(".nav-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        state.currentPage = btn.dataset.page;
        this.render();

    });
  },
  bindSearch(){
    $("#globalSearch").addEventListener("input",(e)=>{
      state.filters.search = e.target.value.toLowerCase();
      if (state.currentPage === "dossiers") this.renderDossiers();

    });

  bindKeyboard(){
    document.addEventListener("keydown",(e)=>{
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#globalSearch").focus(); }
      if (e.key==="Escape"){
        if (state.synthDossierId) this.closeSynth();
        else if (state.modal.open) this.closeModal();
        else this.closeDrawer();

    });

    const enDedouanement = active.filter(d => {
      if (d.okDouane) return false;
      if (d.status==="REGLE"||d.status==="ANNULE"||d.status==="TROP_CHER"||d.status==="RETOUR") return false;

  renderDossiers(){

      list = list.filter(d=>[d.nom,d.prenom,d.numColis,d.numDossier,d.ville,d.mail,(d.natureMarchandise||[]).join(" ")].filter(Boolean).join(" ").toLowerCase().includes(q));

  rowHtml(d, full=false){
    const s = STATUTS.find(x=>x.id===d.status) || {label:d.status||"—",color:"gray"};
    const op = OPERATEURS.find(o=>o.id===d.operateur) || {label:d.operateur||"—",class:"default"};
    const total = d.totalFacture || ((d.dd||0)+(d.tva||0)+(d.montantIntervention||0));
    const f = state.factures[d.id];
    const factChip = f
      ? (f.status==="PAYE"||f.paye ? `<span class="chip green">Payée</span>` : `<span class="chip accent">${esc(f.numFacture||"émise")}</span>`)
      : `<span class="chip gray">—</span>`;
    return `
      <tr data-id="${d.id}">
        <td class="num">#${d.numDossier||"—"}</td>
        <td><span class="op-badge ${op.class}">${op.label}</span></td>
        <td class="col-name">${esc(d.nom||"—")}${d.prenom?`<small>${esc(d.prenom)}${d.ville?" · "+esc(d.ville):""}</small>`:(d.ville?`<small>${esc(d.ville)}</small>`:"")}</td>
        <td class="small">${esc((d.natureMarchandise||[]).join(", ")||"—")}${full&&d.numColis?`<br><span class="small" style="font-family:var(--mono)">${esc(d.numColis)}</span>`:""}</td>
        ${full?`<td class="small" style="font-family:var(--mono)">${d.tauxDD||"—"}/${d.tauxTVA||"—"}</td>`:""}
        <td><span class="chip ${s.color}">${s.label}</span></td>
        <td>${factChip}</td>
        <td style="text-align:right;font-family:var(--mono)">${total?fmtEuro(total):'<span class="small">—</span>'}</td>
        ${full?`<td>${this.wflDotsHtml(d)}</td>`:""}
      </tr>
    `;
  },
  wflDotsHtml(d){
    const f = state.factures[d.id];
    const steps = [
      d.okDevis,
      (d.status==="ATTENTE_DOC" || !!d.okDouane),
      !!d.okDouane,
      !!f,                                // facture émise (par PERAC)
      (f && (f.status==="PAYE"||f.paye)) || !!d.reglementRecu
    ];
    return `<div class="workflow-dots">${steps.map(s=>`<span class="${s?"done":""}"></span>`).join("")}</div>`;
  },

            <table class="dossiers-table">
              <thead><tr><th>N°</th><th>Opérateur</th><th>Client</th><th>Demandé le</th><th>Montant prévu</th><th></th></tr></thead>

        <div class="settings-card"><h3>Export</h3><p>Backup JSON complet du nœud <code>/taf_shared</code>.</p><button class="btn ghost" onclick="app.exportJson()">💾 Télécharger firebase-backup.json</button></div>
      </div>`;
  },

  logImport(msg, cls=""){ const el=$("#importLog"); if(!el) return; el.style.display="block"; const color=cls==="ok"?"var(--green)":cls==="err"?"var(--red)":cls==="warn"?"var(--orange)":"var(--text-2)"; el.insertAdjacentHTML("beforeend",`<div style="color:${color}">${esc(msg)}</div>`); el.scrollTop=el.scrollHeight; },
  async dryRun(){ const pat=$("#airtablePAT").value.trim(); if(!pat){toast("PAT requis","error");return;} $("#importLog").innerHTML=""; this.logImport("→ Lecture Airtable…"); try{const all=await this.fetchAllAirtableRecords(pat); this.logImport(`✓ ${all.length} dossiers`,"ok"); all.slice(0,3).forEach(r=>this.logImport(JSON.stringify(this.mapAirtable(r),null,2))); this.logImport("✓ Simulation OK","ok");}catch(e){this.logImport("✗ "+e.message,"err");} },
  async runImport(){ const pat=$("#airtablePAT").value.trim(); if(!pat){toast("PAT requis","error");return;} if(!confirm("Lancer l'import Airtable → Firebase ?")) return; $("#importLog").innerHTML=""; $("#btnImport").innerHTML=`<span class="loader"></span> Import…`;
    try{ const all=await this.fetchAllAirtableRecords(pat); this.logImport(`✓ ${all.length} dossiers lus`,"ok"); const batch={}; all.forEach(r=>{const d=this.mapAirtable(r); batch[d.id]=d;}); await fb.set("/dossiers",batch); this.logImport(`✓ ${Object.keys(batch).length} écrits`,"ok"); const nat=new Set(state.natures); all.forEach(r=>{(r.fields?.["Nature de Marchandise"]||[]).forEach(n=>nat.add(String(n).trim()));}); state.natures=[...nat].sort(); await fb.set("/config/natures",state.natures); this.logImport(`✓ ${state.natures.length} natures`,"ok"); toast("Import réussi ✓","success"); await this.loadAll(); }
    catch(e){ this.logImport("✗ "+e.message,"err"); toast("Import échoué","error"); }
    finally{ $("#btnImport").innerHTML="Lancer l'import"; }
  },
  async fetchAllAirtableRecords(pat){
    const url=`https://api.airtable.com/v0/${CONFIG.airtable.baseId}/${CONFIG.airtable.tableDossiers}`; const records=[]; let offset="";
    do{ const u=url+"?pageSize=100"+(offset?`&offset=${encodeURIComponent(offset)}`:""); const r=await fetch(u,{headers:{Authorization:`Bearer ${pat}`}}); if(!r.ok) throw new Error("Airtable "+r.status); const j=await r.json(); records.push(...(j.records||[]).map(rec=>({id:rec.id,createdTime:rec.createdTime,fields:rec.fields}))); offset=j.offset||"";}while(offset);
    return records;
  },
  mapAirtable(rec){
    const f=rec.fields||{};
    const rawStatus=f["Status"]||""; const statusId=STATUS_MAP[rawStatus]||STATUS_MAP[rawStatus?.trim?.()]||"DEVIS";
    let opId="CHRONOPOST"; const opName=(f["Opérateur"]||f["Operateur"]||[])[0];
    if(opName){const n=String(opName).toUpperCase(); if(n.includes("DHL"))opId="DHL";else if(n.includes("CHRONO"))opId="CHRONOPOST";else if(n.includes("FEDEX"))opId="FEDEX";else if(n.includes("AERIEN"))opId="AERIEN";}
    const natures=Array.isArray(f["Nature de Marchandise"])?f["Nature de Marchandise"].map(s=>s.trim?.()||s):[];
    const tauxDD=Array.isArray(f["Intervention"])?parseInt(f["Intervention"][0])||null:null;
    const tauxTVA=Array.isArray(f[" TAUX TVA"])?parseInt(f[" TAUX TVA"][0])||null:(Array.isArray(f["TAUX TVA"])?parseInt(f["TAUX TVA"][0])||null:null);
    const archiveVal=typeof f["Archivé"]==="string"?f["Archivé"]:"actif";
    const archive=(archiveVal||"").toLowerCase().includes("archiv")?"archive":"actif";
    const num=f["Numéro de dossier"]||null;
    const id=num?`D${String(num).padStart(5,"0")}`:rec.id;
    const createdAt=rec.createdTime?new Date(rec.createdTime).getTime():Date.now();
    return {
      id, numDossier:num, operateur:opId, module:CONFIG.moduleId,
      nom:(f["Nom"]||"").toString().trim(), prenom:(f["Prénom"]||"").toString().trim(),
      adresse:(f["Adresse"]||"").toString().trim(), ville:(f["Ville"]||"").toString().trim(),
      telephone:f["Phone"]||"", mail:(f["Mail"]||"").toString().replace(/^.*<([^>]+)>.*$/,"$1").trim(),
      numColis:(f["N° de colis"]||"").toString().trim(), origine:(f["Origine"]||"").toString().trim(),
      natureMarchandise:natures, valeur:num2(f["Valeur"]),
      montantIntervention:tauxDD||null, tauxDD:Array.isArray(f["Taux De DD"])?parseInt(f["Taux De DD"][0])||null:null, tauxTVA,
      dd:num2(f["DD"]), tva:num2(f["TVA"]), ima:num2(f["IMA"]),
      totalFacture:(num2(f["DD"])||0)+(num2(f["TVA"])||0)+(tauxDD||0),
      status:statusId, archive, numDeclaration:(f["Numéro de Déclaration"]||"").toString().trim(),
      numCheque:(f["Numéro de Chèque"]||"").toString().trim(), dossierMalta:num2(f["Dossier Malta"]),
      notes:(f["notes"]||"").toString(),
      okDouane:!!f["OK douane"], okDevis:!!f["Confirmation de DEVIS"],
      proformaEnvoyee:!!f["Envoi Proforma "]||!!f["Envoi Proforma"], factureDefEnvoyee:!!f["envoi facture Déf"],
      chequeDemande:!!f["Chéque démandé"]||!!f["Cheque demande"], facturePayee:!!f["Facture payée"],
      reglementRecu:!!f["Règlement  reçu"]||!!f["Règlement reçu"], mailOperateur:!!f["Mail Opérateur "]||!!f["Mail Operateur"],
      airtableId:rec.id, createdAt, updatedAt:createdAt
    };
  },

  exportCsv(){
    const rows=Object.values(state.dossiers); if(!rows.length){toast("Rien à exporter","info");return;}
    const cols=["numDossier","operateur","nom","prenom","ville","mail","numColis","natureMarchandise","tauxDD","tauxTVA","dd","tva","ima","totalFacture","status","archive","numDeclaration","createdAt"];
    const body=rows.map(r=>cols.map(c=>{let v=r[c]; if(Array.isArray(v))v=v.join("|"); if(v==null)v=""; return String(v).replace(/"/g,'""').replace(/\n/g," ");}).map(v=>`"${v}"`).join(";")).join("\n");
    const blob=new Blob(["\uFEFF"+cols.join(";")+"\n"+body],{type:"text/csv;charset=utf-8;"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`taf-express-${new Date().toISOString().slice(0,10)}.csv`; a.click(); toast("Export CSV","success");
  },
  async exportJson(){ const data=await fb.get(""); const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`taf-shared-${new Date().toISOString().slice(0,10)}.json`; a.click(); toast("Backup JSON","success"); },

  /* -------- DRAWER -------- */

    if (isNew) {
      state.tempDossier = d;

    }

    return { id:`D${String(next).padStart(5,"0")}`, numDossier:next, operateur:"CHRONOPOST", status:"DEVIS", archive:"actif", natureMarchandise:[], nom:"",prenom:"",ville:"",mail:"",telephone:"",numColis:"",adresse:"",origine:"",valeur:0,tauxDD:110,tauxTVA:20,dd:0,tva:0,ima:0,montantIntervention:110,totalFacture:0,notes:"",okDouane:false,okDevis:false,proformaEnvoyee:false,factureDefEnvoyee:false,chequeDemande:false,facturePayee:false,reglementRecu:false,mailOperateur:false,numDeclaration:"",numCheque:"",dossierMalta:null, module:CONFIG.moduleId, createdAt:Date.now(),updatedAt:Date.now() };

            <div style="flex:1"></div>

    `;

  tabNotes(d){ return `<div class="field full"><label>Notes internes</label><textarea data-k="notes" rows="12">${esc(d.notes||"")}</textarea></div>`; },

  readDrawer(){
    const d = state.tempDossier ? Object.assign({},state.tempDossier) : (state.currentDossierId ? Object.assign({},state.dossiers[state.currentDossierId]) : this.blankDossier());
    $("#drawerBody").querySelectorAll("[data-k]").forEach(el=>{let v=el.value; if(el.type==="number")v=v===""?null:Number(v); d[el.dataset.k]=v;});
    const nat=$("#drawerBody").querySelector("#natSelect");
    if (nat) d.natureMarchandise=Array.from(nat.querySelectorAll(".tag.selected")).map(x=>x.dataset.nat);
    return d;
  },
  recomputeTotal(){ const b=$("#drawerBody"); const g=k=>Number(b.querySelector(`[data-k="${k}"]`)?.value||0); const total=g("dd")+g("tva")+g("ima")+g("montantIntervention"); const tf=b.querySelector('[data-k="totalFacture"]'); if(tf) tf.value=total.toFixed(2); },

  async toggleFlag(k){
    if(!state.currentDossierId){toast("Enregistre d'abord","info");return;}
    const d=state.dossiers[state.currentDossierId]; d[k]=!d[k]; d.updatedAt=Date.now();
    await fb.update(`/dossiers/${d.id}`,{[k]:d[k],updatedAt:d.updatedAt});
    this.renderTab(d); toast(`${k}: ${d[k]?"✓":"—"}`,"info");
  },

  async saveDossier(){
    const d=this.readDrawer(); d.updatedAt=Date.now(); d.module=CONFIG.moduleId;
    if(!d.nom?.trim()){toast("Le nom est requis","error");return;}
    try{ 
      await fb.set(`/dossiers/${d.id}`,d); 
      state.dossiers[d.id]=d; 
      state.tempDossier=null; // Nettoyer le dossier temporaire
      this.updateNavCount(); 
      toast("Enregistré ✓","success"); 
      this.closeDrawer(); 
      this.render(); 
    }
    catch(e){ toast("Erreur : "+e.message,"error"); }
  },

  async deleteDossier(id){
    if(!confirm("Supprimer ce dossier ?")) return;
    try{ await fb.del(`/dossiers/${id}`); delete state.dossiers[id]; this.updateNavCount(); toast("Supprimé","info"); this.closeDrawer(); this.render(); }
    catch(e){ toast("Erreur : "+e.message,"error"); }
  },

  /* ---- Intégration TAF PERAC ---- */
  async sendToPerac(dossierId){
    const d = state.dossiers[dossierId]; if (!d){toast("Dossier introuvable","error");return;}
    if (!confirm(`Envoyer le dossier #${d.numDossier} à TAF PERAC ?\n\nMontant prévu : ${fmtEuro(d.totalFacture||0)}\n\nPERAC sera notifié en temps réel.`)) return;
    d.facturationRequested = true;
    d.facturationRequestedAt = Date.now();
    d.facturationSource = CONFIG.moduleId;
    d.updatedAt = Date.now();
    await fb.update(`/dossiers/${d.id}`, { facturationRequested:true, facturationRequestedAt:d.facturationRequestedAt, facturationSource:CONFIG.moduleId, updatedAt:d.updatedAt });
    // Queue entry pour PERAC
    await fb.set(`/facturation_queue/${d.id}`, {
      dossierId:d.id, numDossier:d.numDossier, operateur:d.operateur,
      client:{ nom:d.nom, prenom:d.prenom, mail:d.mail, telephone:d.telephone, adresse:d.adresse, ville:d.ville },
      marchandise:{ nature:d.natureMarchandise, valeur:d.valeur, numColis:d.numColis, origine:d.origine },
      montants:{ totalFacture:d.totalFacture, dd:d.dd, tva:d.tva, ima:d.ima, intervention:d.montantIntervention, tauxDD:d.tauxDD, tauxTVA:d.tauxTVA },
      status:"pending", requestedAt:Date.now(), source:CONFIG.moduleId
    });
    toast("Dossier envoyé à TAF PERAC ✓","success");
    this.renderTab(d);
  },

  async cancelFacturationRequest(dossierId){
    if (!confirm("Annuler la demande de facturation ?")) return;
    const d = state.dossiers[dossierId];
    d.facturationRequested = false; d.facturationRequestedAt = null; d.updatedAt=Date.now();
    await fb.update(`/dossiers/${d.id}`, { facturationRequested:false, facturationRequestedAt:null, updatedAt:d.updatedAt });
    await fb.del(`/facturation_queue/${d.id}`);
    toast("Demande annulée","info"); this.renderTab(d);
  },

  async markFacturePayee(dossierId){
    await fb.update(`/factures/${dossierId}`, { status:"PAYE", paye:true, paidAt:Date.now() });
    // Mise à jour côté dossier
    await fb.update(`/dossiers/${dossierId}`, { reglementRecu:true, facturePayee:true, status:"REGLE", updatedAt:Date.now() });
    toast("Facture marquée payée ✓","success");
  },

  async unmarkFacturePayee(dossierId){
    await fb.update(`/factures/${dossierId}`, { status:"EMIS", paye:false, paidAt:null });
    toast("Facture dépayée","info");
  },

  async uploadDoc(k){
    // Vérifier qu'on a bien un dossier (sauvegardé ou temporaire)
    const dossierId = state.currentDossierId;
    if(!dossierId){toast("Enregistre d'abord le dossier","info");return;}
    
    const d = state.dossiers[dossierId] || state.tempDossier;
    if(!d){toast("Enregistre d'abord le dossier","info");return;}
    
    // Si c'est un dossier temporaire non sauvegardé, demander de sauvegarder d'abord
    if(!state.dossiers[dossierId]){
      toast("Enregistre d'abord le dossier avant d'uploader des documents","info");
      return;
    }
    
    const input=document.createElement("input"); input.type="file";
    input.onchange=async()=>{ const file=input.files[0]; if(!file) return; toast("Upload…","info");
      try{ const b64=await fileToBase64(file);
        const res=await fetch(CONFIG.drive.uploadUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({folderId:CONFIG.drive.folder,filename:`${dossierId}_${k}_${file.name}`,mimeType:file.type,data:b64})});
        const j=await res.json(); if(!j.url) throw new Error("Drive");
        d.docs=d.docs||{}; d.docs[k]={url:j.url,name:file.name,uploadedAt:Date.now()};
        await fb.update(`/dossiers/${d.id}/docs`,{[k]:d.docs[k]}); 
        state.dossiers[dossierId].docs = d.docs; // Mettre à jour dans state
        this.renderTab(d); 
        toast("Document chargé ✓","success");
      }catch(e){
        console.error("Upload error:", e);
        toast("Upload échoué : "+e.message,"error");
      }
    };
    input.click();
  },
  async removeDoc(k){ 
    if(!state.currentDossierId){toast("Dossier introuvable","error");return;}
    const d=state.dossiers[state.currentDossierId]; 
    if(!d){toast("Enregistre d'abord le dossier","info");return;}
    if(!confirm("Retirer ce document ?")) return; 
    d.docs=d.docs||{}; 
    delete d.docs[k]; 
    await fb.set(`/dossiers/${d.id}/docs`,d.docs); 
    this.renderTab(d); 
    toast("Document retiré","info"); 
  },

    const d = state.dossiers[dossierId]; if (!d){ toast("Dossier introuvable","error"); return; }
    state.synthDossierId = dossierId;

    $("#synth").classList.add("open");

                  <button class="btn primary small" onclick="app.addHistoryEvent()">Ajouter</button>
                </div>
              </div>
            </div>
            <div class="tl">${timelineHtml}</div>
          </div>
        </div>
      </div>
    `;
  },

  /* ----- Timeline builder -----
     Combine les événements automatiques (dérivés des flags/timestamps existants)
     avec les entrées manuelles stockées dans d.history */
  buildTimeline(d, f, proformas, clientForm){
    const events = [];

    // 1. Création du dossier
    events.push({ at: d.createdAt, title: "Dossier créé — premier contact", source: d.operateur, cls:"done" });

    // 2. Événements manuels stockés dans d.history
    const hist = d.history ? Object.values(d.history) : [];
    hist.forEach(h=>{
      const iconMap = { phone:"📞", email:"✉", message:"💬", visit:"🛃", bae:"📄", note:"📝", other:"◆" };
      events.push({
        id: h.id,
        at: h.at,
        title: `${iconMap[h.type]||"◆"} ${h.title||"Événement"}`,
        note: h.note,
        author: h.author,
        cls: "manual done"
      });
    });

    // 3. Demande d'infos au client
    if (clientForm){
      if (clientForm.sentAt || clientForm.createdAt){
        events.push({ at: clientForm.sentAt || clientForm.createdAt, title: "📨 Formulaire envoyé au client", source: clientForm.clientMail, cls:"done" });
      }
      if (clientForm.submittedAt){
        events.push({ at: clientForm.submittedAt, title: "✅ Client a rempli le formulaire", note: clientForm.data?.description ? clientForm.data.description.slice(0,200) : null, cls:"done" });
      } else if (clientForm.status === "IN_PROGRESS" && clientForm.updatedAt){
        events.push({ at: clientForm.updatedAt, title: "⏳ Client remplit le formulaire…", cls:"current" });
      }
    }

    // 4. Proformas
    proformas.forEach(p=>{
      if (p.createdAt) events.push({ at: p.createdAt, title: `📄 Proforma ${p.numProforma||""} créée`, source: p.totalTTC?fmtEuro(p.totalTTC):"", cls:"done" });
      if (p.sentAt)    events.push({ at: p.sentAt,    title: `✉ Proforma ${p.numProforma||""} envoyée au client`, source: p.sentTo, cls:"done" });
    });

    // 5. Devis confirmé
    if (d.okDevis){
      events.push({ at: d.updatedAt, title: "✓ Devis confirmé par le client", cls:"done" });
    }

    // 6. OK douane
    if (d.okDouane){
      events.push({ at: d.updatedAt, title: "🛃 OK douane (dédouanement accepté)", cls:"done" });
    }

    // 7. Statut livraison
    if (d.status === "EN_LIVRAISON"){
      events.push({ at: d.updatedAt, title: "🚚 Colis en livraison chez le transporteur", cls:"current" });
    } else if (d.status === "LIVRE"){
      events.push({ at: d.updatedAt, title: "📦 Colis livré", cls:"done" });
    }

    // 8. Envoi à PERAC
    if (d.facturationRequestedAt){
      events.push({ at: d.facturationRequestedAt, title: "↗ Dossier envoyé à TAF PERAC pour facturation", cls:"done" });
    }

    // 9. Facture
    if (f){
      if (f.emittedAt) events.push({ at: f.emittedAt, title: `💰 Facture ${f.numFacture||""} émise`, source: fmtEuro(f.totalTTC||f.montantTTC||0), cls:"done" });
      if (f.paidAt)    events.push({ at: f.paidAt,    title: `🎉 Règlement reçu`, source: fmtEuro(f.totalTTC||f.montantTTC||0), cls:"done" });
    }

    // 10. Étape future (si pas encore payé)
    if (!f || !(f.status==="PAYE"||f.paye)){
      events.push({ at: null, title: "⏳ En attente de règlement", cls:"future" });
    }

    // Trier par timestamp (null à la fin)
    events.sort((a,b)=>{
      if (!a.at && !b.at) return 0;
      if (!a.at) return 1;
      if (!b.at) return -1;
      return a.at - b.at;
    });
    return events;
  },

      body.innerHTML = `<div class="inbox-empty">Aucune déclaration reçue pour l'instant.<br><br>Les PDFs envoyés à <code style="font-family:var(--mono);color:var(--accent-2)">${esc(CONFIG.bae.inboxEmail)}</code> arriveront ici.</div>`;

      const tag = b.status==="MATCHED" ? `<span class="ii-tag matched">✓ rattachée #${b.matchedNumDossier||"?"}</span>` :
                  (b.candidates && b.candidates.length>1 ? `<span class="ii-tag ambiguous">${b.candidates.length} correspondances</span>` :
                  (b.candidates && b.candidates.length===1 ? `<span class="ii-tag ambiguous">à valider #${state.dossiers[b.candidates[0]]?.numDossier||"?"}</span>` :
                  `<span class="ii-tag unmatched">non rattachée</span>`));
      return `
        <div class="inbox-item ${cls}" onclick="app.openBaeMatch('${b.id}')">

  /* Détection automatique à l'arrivée d'un nouveau BAE */
  handleNewBae(baeId, bae){
    const candidates = this.findBaeCandidates(bae);
    bae.candidates = candidates.map(c=>c.dossierId);
    // Écrit les candidats en base pour cohérence multi-tabs
    fb.update(`/bae_inbox/${baeId}`, { candidates: bae.candidates }).catch(()=>{});

    if (candidates.length === 1 && candidates[0].score >= 80){
      // Match certain → popup "auto-rattachée" avec confirmation 1-clic
      this.showBaePopup(baeId, bae, candidates[0], "auto");
    } else if (candidates.length >= 1){
      // Match probable / ambigu → popup choisir
      this.showBaePopup(baeId, bae, candidates[0], "choose");
    } else {
      // Aucun → popup manuel
      this.showBaePopup(baeId, bae, null, "manual");
    }
  },

  /* Cherche des dossiers qui matchent un BAE reçu
     Score : numDossier exact=100, numColis exact=90, numDeclaration exact=85, nom contient=40, email contient=30 */
  findBaeCandidates(bae){
    const searchText = [(bae.subject||""), (bae.bodyText||""), (bae.filename||"")].join(" ").toLowerCase();
    if (!searchText.trim()) return [];
    const dossiers = Object.values(state.dossiers||{}).filter(d=>d.archive!=="archive");
    const scored = [];

    dossiers.forEach(d=>{
      let score = 0; const reasons = [];
      // 1. numDossier (le plus fort)
      const numDossStr = String(d.numDossier||"");
      if (numDossStr){
        // Match D00866 / #866 / dossier 866 / ref 866
        const patterns = [
          new RegExp(`\\b[dD]0*${numDossStr}\\b`),
          new RegExp(`#\\s*0*${numDossStr}\\b`),
          new RegExp(`dossier[\\s:]+0*${numDossStr}\\b`, "i"),
          new RegExp(`r[eé]f[\\s:.]+0*${numDossStr}\\b`, "i"),
          new RegExp(`\\b0*${numDossStr}\\b`)
        ];
        for (const p of patterns){
          if (p.test(searchText)){ score = Math.max(score, p.source.includes("\\b0*") ? 60 : 100); reasons.push(`N° dossier #${numDossStr}`); break; }
        }
      }
      // 2. numColis
      if (d.numColis && d.numColis.length >= 5){
        const colisLower = d.numColis.trim().toLowerCase();
        if (searchText.includes(colisLower)){ score = Math.max(score, 90); reasons.push(`N° colis ${d.numColis}`); }
      }
      // 3. numDeclaration
      if (d.numDeclaration && d.numDeclaration.length >= 5){
        const declLower = d.numDeclaration.trim().toLowerCase();
        if (searchText.includes(declLower)){ score = Math.max(score, 85); reasons.push(`N° déclaration`); }
      }
      // 4. Nom client (si unique)
      if (d.nom && d.nom.length >= 4){
        const nomLower = d.nom.trim().toLowerCase();
        if (searchText.includes(nomLower)){ score = Math.max(score, 40); reasons.push(`Nom "${d.nom}"`); }
      }
      // 5. Email
      if (d.mail && d.mail.length >= 5){
        const mailLower = d.mail.trim().toLowerCase();
        if (searchText.includes(mailLower)){ score = Math.max(score, 30); reasons.push("Email"); }
      }
      if (score > 0) scored.push({ dossierId:d.id, score, reasons });
    });

    scored.sort((a,b)=>b.score-a.score);
    return scored.slice(0, 5);
  },

  showBaePopup(baeId, bae, topCandidate, kind){
    $("#bpTitle").innerHTML = `Nouvelle <em>déclaration BAE</em>`;
    const metaParts = [ bae.subject?esc(bae.subject).slice(0,60):"(sans objet)" ];
    if (bae.from) metaParts.push(esc(bae.from));
    $("#bpMeta").textContent = metaParts.join(" · ");
    const actions = $("#bpActions");
    if (kind==="auto" && topCandidate){
      const d = state.dossiers[topCandidate.dossierId];
      actions.innerHTML = `
        <button class="btn primary small" onclick="app.confirmBaeAttach('${baeId}','${topCandidate.dossierId}')">✓ Rattacher #${d?.numDossier||"?"} — ${esc((d?.nom||"").slice(0,25))}</button>
        <button class="btn ghost small" onclick="app.openBaeMatch('${baeId}')">Choisir…</button>
      `;
    } else if (kind==="choose" && topCandidate){
      actions.innerHTML = `<button class="btn primary small" onclick="app.openBaeMatch('${baeId}')">Choisir le dossier</button>`;
    } else {
      actions.innerHTML = `<button class="btn primary small" onclick="app.openBaeMatch('${baeId}')">Rattacher manuellement</button>`;
    }
    const popup = $("#baePopup");
    popup.classList.add("show");
    clearTimeout(this._baePopupTimer);
    this._baePopupTimer = setTimeout(()=>popup.classList.remove("show"), kind==="auto"?12000:18000);
  },

  dismissBaePopup(){ $("#baePopup").classList.remove("show"); clearTimeout(this._baePopupTimer); },

  async confirmBaeAttach(baeId, dossierId){
    this.dismissBaePopup();
    await this.attachBaeToDossier(baeId, dossierId);
  },

        </div>

      `;
    } else {
      body = preview + `

          Aucune correspondance automatique trouvée. Cherche le bon dossier :
        </div>
        <input id="matchSearch" placeholder="Chercher par nom, n° colis, ou #dossier" style="width:100%;background:var(--bg-3);border:1px solid var(--border);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--text);outline:none">
        <div id="matchSearchResults" style="margin-top:10px"></div>
      `;
    }

    state.modal.context = { kind:"baeMatch", baeId, selectedDossierId: candidates[0]?.dossierId || null };

    this.openModal(

      `
