  tabInfos(d){
    const opOpts=OPERATEURS.map(o=>`<option value="${o.id}" ${d.operateur===o.id?"selected":""}>${o.label}</option>`).join("");
    const stOpts=STATUTS.map(s=>`<option value="${s.id}" ${d.status===s.id?"selected":""}>${s.label}</option>`).join("");
    const natChips=state.natures.map(n=>{const sel=(d.natureMarchandise||[]).includes(n)?"selected":""; return `<span class="tag ${sel}" data-nat="${esc(n)}" style="cursor:pointer;${sel?"background:var(--accent);color:#0b0d10;border-color:var(--accent)":""}">${esc(n)}</span>`;}).join("");
    return `
      <div class="form-grid">
        <div class="field"><label>N° de dossier</label><input value="${esc(d.numDossier||"")}" data-k="numDossier" type="number" ${d.numDossier?"readonly":""}></div>
        <div class="field"><label>Opérateur</label><select data-k="operateur">${opOpts}</select></div>
        <div class="field"><label>Nom / Société</label><input value="${esc(d.nom||"")}" data-k="nom"></div>
        <div class="field"><label>Prénom / Contact</label><input value="${esc(d.prenom||"")}" data-k="prenom"></div>

        <div class="field"><label>Téléphone</label><input value="${esc(d.telephone||"")}" data-k="telephone"></div>
        <div class="field"><label>Adresse</label><input value="${esc(d.adresse||"")}" data-k="adresse"></div>
        <div class="field"><label>Ville / CP</label><input value="${esc(d.ville||"")}" data-k="ville"></div>
        <div class="field"><label>N° de colis / AWB</label><input value="${esc(d.numColis||"")}" data-k="numColis"></div>

    let factBlock = "";

      factBlock = `
        <div class="fact-card">
          <div class="fact-head">

            <div class="fact-amount total"><div class="lbl">Total TTC</div><div class="val">${fmtEuro(f.totalTTC||f.montantTTC||0)}</div></div>
          </div>

            ${f.emittedAt?`<span>Émise le ${fmtDate(f.emittedAt)}</span>`:""}
            ${f.paidAt?`<span>Payée le ${fmtDate(f.paidAt)}</span>`:""}
            ${f.dueDate?`<span>Échéance ${fmtDate(f.dueDate)}</span>`:""}
            ${f.mode?`<span>Mode: ${esc(f.mode)}</span>`:""}
          </div>
          <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
            ${f.pdfUrl?`<a class="btn ghost small" href="${f.pdfUrl}" target="_blank">📄 Ouvrir PDF</a>`:""}

            ${!paye?`<button class="btn success small" onclick="app.markFacturePayee('${d.id}')">Marquer comme payée</button>`:`<button class="btn ghost small" onclick="app.unmarkFacturePayee('${d.id}')">Dépayer</button>`}
          </div>

    } else if (d.facturationRequested){
      factBlock = `
        <div class="fact-card" style="border-color:rgba(229,149,86,.35);background:rgba(229,149,86,.05)">

            <div class="fact-title" style="color:var(--orange)">Demande envoyée à PERAC</div>

            <span>Envoyée le ${d.facturationRequestedAt?fmtDate(d.facturationRequestedAt):"—"}</span>

          </div>
          <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">

            <button class="btn ghost small" onclick="app.cancelFacturationRequest('${d.id}')">Annuler la demande</button>
          </div>

      factBlock = `
        <div class="fact-empty">
          Aucune facture n'a encore été générée pour ce dossier.<br>
          <span style="font-size:11.5px">Clique sur <strong>« Envoyer à TAF PERAC »</strong> ci-dessous pour demander la facturation. PERAC générera la facture et l'écrira automatiquement ici.</span>
        </div>
      `;
    }

    // Proformas existantes pour ce dossier
    const dossierProformas = Object.values(state.proformas||{}).filter(p=>p.dossierId===d.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const pfBlock = dossierProformas.length ? `
      <div class="pf-list">
        ${dossierProformas.map(p=>`
          <div class="pf-item">
            <div class="pf-num">${esc(p.numProforma||"P—")}</div>
            <div class="pf-desc">${esc((p.lignes&&p.lignes[0]?.description)||"Prestation douane")}${p.sentAt?`<small>Envoyée le ${fmtDate(p.sentAt)} à ${esc(p.sentTo||"—")}</small>`:`<small>Brouillon — non envoyée</small>`}</div>
            <div class="pf-amt">${fmtEuro(p.totalTTC||0)}</div>
            <div class="pf-actions">
              ${p.pdfUrl?`<a href="${p.pdfUrl}" target="_blank" title="PDF">📄</a>`:""}
              <button onclick="app.openProformaModal('${d.id}','${p.id}')" title="Éditer">✎</button>
              <button onclick="app.deleteProforma('${p.id}')" title="Supprimer">×</button>
            </div>
          </div>
        `).join("")}
      </div>
    ` : "";

    // Formulaire client
    const clientForm = Object.values(state.clientForms||{}).find(cf=>cf.dossierId===d.id);
    let cfBlock = "";
    if (clientForm){
      const submitted = clientForm.status === "SUBMITTED";
      const clientUrl = `${CONFIG.links.clientForm}?token=${clientForm.token}`;
      cfBlock = `
        <div class="cf-card ${submitted?"done":""}">
          <div class="cf-head">
            <div class="cf-title">${submitted?"✓ Formulaire rempli par le client":"⏳ Formulaire envoyé — en attente"}</div>

              ${Object.entries(clientForm.data).filter(([k,v])=>v && k!=="docs" && typeof v!=="object").map(([k,v])=>`<div class="cf-received-row"><span class="k">${esc(this.labelForKey(k))}</span><span class="v">${esc(String(v))}</span></div>`).join("")}

              <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
                ${Object.entries(clientForm.data.docs).map(([k,doc])=>`<a href="${doc.url}" target="_blank" style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg-3);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-2)"><span style="color:var(--accent)">📎</span> ${esc(doc.name||k)}</a>`).join("")}
              </div>
            `:""}
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn primary small" onclick="app.importClientData('${d.id}','${clientForm.token}')">↓ Importer dans le dossier</button>
              <button class="btn ghost small" onclick="app.openClientFormModal('${d.id}')">Renvoyer</button>
            </div>
          ` : `
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn ghost small" onclick="app.openClientFormModal('${d.id}')">Renvoyer</button>
              <button class="btn danger small" onclick="app.cancelClientForm('${clientForm.token}')">Révoquer le lien</button>
            </div>
          `}
        </div>
      `;
    }

    return `
      ${factBlock}

      ${cfBlock}

      <div class="section-title" style="font-size:16px;margin:22px 0 10px">Proformas <em>— ${dossierProformas.length}</em></div>
      ${pfBlock}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn primary small" onclick="app.openProformaModal('${d.id}')">+ Créer une proforma</button>
        ${!clientForm ? `<button class="btn ghost small" onclick="app.openClientFormModal('${d.id}')">↗ Demander infos au client</button>` : ""}
      </div>

      <div class="section-title" style="font-size:16px;margin:22px 0 12px">Calcul du dossier <em>— données de base</em></div>
      <div class="form-grid">
        <div class="field"><label>Valeur marchandise (€)</label><input type="number" value="${d.valeur||0}" data-k="valeur" data-money step="0.01"></div>
        <div class="field"><label>Intervention / frais (€)</label><select data-k="montantIntervention" data-money>${ddOpt}</select></div>
        <div class="field"><label>Taux douane</label><select data-k="tauxDD">${ddOpt}</select></div>
        <div class="field"><label>Taux TVA</label><select data-k="tauxTVA">${tvaOpt}</select></div>
        <div class="field"><label>Droits douane (€)</label><input type="number" value="${d.dd||0}" data-k="dd" data-money step="0.01"></div>
        <div class="field"><label>TVA (€)</label><input type="number" value="${d.tva||0}" data-k="tva" data-money step="0.01"></div>
        <div class="field"><label>IMA (€)</label><input type="number" value="${d.ima||0}" data-k="ima" data-money step="0.01"></div>
        <div class="field"><label>Total facture (€)</label><input type="number" value="${d.totalFacture||0}" data-k="totalFacture" readonly style="background:var(--bg-4);color:var(--accent-2);font-weight:600"></div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        ${!f && !d.facturationRequested ? `<button class="btn primary" onclick="app.sendToPerac('${d.id}')">↗ Envoyer à TAF PERAC</button>` : ""}
        <a class="btn ghost" href="${CONFIG.links.perac}" target="_blank">Ouvrir TAF PERAC</a>
      </div>
    `;
  },
  tabDocs(d){
    const types=[{k:"proforma",l:"Facture proforma"},{k:"factureDef",l:"Facture définitive"},{k:"bae",l:"BAE"},{k:"declaration",l:"Déclaration douane"},{k:"factureOp",l:"Facture opérateur"},{k:"autre",l:"Autre"}];
    d.docs=d.docs||{};
    
    // Trouver la dernière proforma pour ce dossier
    const proformasDossier = Object.values(state.proformas||{}).filter(p=>p.dossierId===d.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const latestProforma = proformasDossier[0];
    
    let proformaSection = '';
    if (latestProforma && latestProforma.pdfUrl) {
      // Afficher la miniature cliquable
      proformaSection = `
        <div style="background:linear-gradient(135deg,rgba(212,168,87,.08) 0%,rgba(212,168,87,.02) 100%);border:1px solid rgba(212,168,87,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <div style="font-family:var(--serif);font-size:16px;color:var(--accent-2)">Pro Forma ${esc(latestProforma.numProforma||"")}</div>
            <div style="flex:1"></div>
            <button class="btn ghost small" onclick="app.viewPdfPopup('${latestProforma.pdfUrl}','${esc(latestProforma.numProforma||"Pro Forma")}')">👁 Agrandir</button>
            <a href="${latestProforma.pdfUrl}" target="_blank" class="btn ghost small">↗ Ouvrir</a>
          </div>
          <div onclick="app.viewPdfPopup('${latestProforma.pdfUrl}','${esc(latestProforma.numProforma||"Pro Forma")}')" style="cursor:pointer;background:white;border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:180px;position:relative;overflow:hidden">
            <iframe src="${latestProforma.pdfUrl}" style="width:100%;height:180px;border:none;pointer-events:none;transform:scale(0.7);transform-origin:top left"></iframe>
            <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(11,13,16,0.05) 100%)"></div>
          </div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:8px;text-align:center">
            ${latestProforma.totalTTC?fmtEuro(latestProforma.totalTTC):""} · ${fmtDate(latestProforma.createdAt)}
          </div>
        </div>

    }
    
    return `
      <p style="color:var(--text-2);font-size:13px;margin-bottom:16px">Documents stockés sur Google Drive TAF.</p>
      
      ${!latestProforma||!latestProforma.pdfUrl?`
        <div style="margin-bottom:18px">
          <button class="btn primary small" onclick="app.generateAndSaveProformaPDF('${d.id}')">📄 Générer Pro Forma PDF</button>
          <span style="font-size:11px;color:var(--text-3);margin-left:8px">Génère automatiquement le PDF selon le template et le sauvegarde dans Drive</span>
        </div>
      `:''}
      
      ${proformaSection}
      
      <div class="doc-list">${types.map(t=>{const doc=d.docs[t.k]; return `<div class="doc-item"><div class="doc-ico">${t.k.slice(0,3).toUpperCase()}</div><div class="name">${t.l}${doc?`<small><a href="${doc.url}" target="_blank">${esc(doc.name)}</a></small>`:`<small class="empty">aucun fichier</small>`}</div><button class="btn ghost small" onclick="app.uploadDoc('${t.k}')">${doc?"Remplacer":"Charger"}</button>${doc?`<button class="btn danger small" onclick="app.removeDoc('${t.k}')">×</button>`:""}</div>`;}).join("")}</div>
    `;
  },
  tabNotes(d){ return `<div class="field full"><label>Notes internes</label><textarea data-k="notes" rows="12">${esc(d.notes||"")}</textarea></div>`; },

  readDrawer(){
    const d = state.tempDossier ? Object.assign({},state.tempDossier) : (state.currentDossierId ? Object.assign({},state.dossiers[state.currentDossierId]) : this.blankDossier());
    $("#drawerBody").querySelectorAll("[data-k]").forEach(el=>{let v=el.value; if(el.type==="number")v=v===""?null:Number(v); d[el.dataset.k]=v;});
    const nat=$("#drawerBody").querySelector("#natSelect");
    if (nat) d.natureMarchandise=Array.from(nat.querySelectorAll(".tag.selected")).map(x=>x.dataset.nat);
    return d;
  },
  recomputeTotal(){ const b=$("#drawerBody"); const g=k=>Number(b.querySelector(`[data-k="${k}"]`)?.value||0); const total=g("dd")+g("tva")+g("ima")+g("montantIntervention"); const tf=b.querySelector('[data-k="totalFacture"]'); if(tf) tf.value=total.toFixed(2); },

  async toggleFlag(k){
    if(!state.currentDossierId){toast("Enregistre d'abord","info");return;}
    const d=state.dossiers[state.currentDossierId]; d[k]=!d[k]; d.updatedAt=Date.now();
    await fb.update(`/dossiers/${d.id}`,{[k]:d[k],updatedAt:d.updatedAt});
    this.renderTab(d); toast(`${k}: ${d[k]?"✓":"—"}`,"info");
  },

  async saveDossier(){
    const d=this.readDrawer(); d.updatedAt=Date.now(); d.module=CONFIG.moduleId;
    if(!d.nom?.trim()){toast("Le nom est requis","error");return;}
    try{ 
      await fb.set(`/dossiers/${d.id}`,d); 
      state.dossiers[d.id]=d; 
      state.tempDossier=null; // Nettoyer le dossier temporaire
      this.updateNavCount(); 
      toast("Enregistré ✓","success"); 
      this.closeDrawer(); 
      this.render(); 
    }
    catch(e){ toast("Erreur : "+e.message,"error"); }
  },

  async deleteDossier(id){
    if(!confirm("Supprimer ce dossier ?")) return;
    try{ await fb.del(`/dossiers/${id}`); delete state.dossiers[id]; this.updateNavCount(); toast("Supprimé","info"); this.closeDrawer(); this.render(); }
    catch(e){ toast("Erreur : "+e.message,"error"); }
  },

  /* ---- Intégration TAF PERAC ---- */
  async sendToPerac(dossierId){
    const d = state.dossiers[dossierId]; if (!d){toast("Dossier introuvable","error");return;}
    if (!confirm(`Envoyer le dossier #${d.numDossier} à TAF PERAC ?\n\nMontant prévu : ${fmtEuro(d.totalFacture||0)}\n\nPERAC sera notifié en temps réel.`)) return;
    d.facturationRequested = true;
    d.facturationRequestedAt = Date.now();
    d.facturationSource = CONFIG.moduleId;
    d.updatedAt = Date.now();
    await fb.update(`/dossiers/${d.id}`, { facturationRequested:true, facturationRequestedAt:d.facturationRequestedAt, facturationSource:CONFIG.moduleId, updatedAt:d.updatedAt });
    // Queue entry pour PERAC
    await fb.set(`/facturation_queue/${d.id}`, {
      dossierId:d.id, numDossier:d.numDossier, operateur:d.operateur,
      client:{ nom:d.nom, prenom:d.prenom, mail:d.mail, telephone:d.telephone, adresse:d.adresse, ville:d.ville },
      marchandise:{ nature:d.natureMarchandise, valeur:d.valeur, numColis:d.numColis, origine:d.origine },
      montants:{ totalFacture:d.totalFacture, dd:d.dd, tva:d.tva, ima:d.ima, intervention:d.montantIntervention, tauxDD:d.tauxDD, tauxTVA:d.tauxTVA },
      status:"pending", requestedAt:Date.now(), source:CONFIG.moduleId
    });
    toast("Dossier envoyé à TAF PERAC ✓","success");
    this.renderTab(d);
  },

  async cancelFacturationRequest(dossierId){
    if (!confirm("Annuler la demande de facturation ?")) return;
    const d = state.dossiers[dossierId];
    d.facturationRequested = false; d.facturationRequestedAt = null; d.updatedAt=Date.now();
    await fb.update(`/dossiers/${d.id}`, { facturationRequested:false, facturationRequestedAt:null, updatedAt:d.updatedAt });
    await fb.del(`/facturation_queue/${d.id}`);
    toast("Demande annulée","info"); this.renderTab(d);
  },

  async markFacturePayee(dossierId){
    await fb.update(`/factures/${dossierId}`, { status:"PAYE", paye:true, paidAt:Date.now() });
    // Mise à jour côté dossier
    await fb.update(`/dossiers/${dossierId}`, { reglementRecu:true, facturePayee:true, status:"REGLE", updatedAt:Date.now() });
    toast("Facture marquée payée ✓","success");
  },

  async unmarkFacturePayee(dossierId){
    await fb.update(`/factures/${dossierId}`, { status:"EMIS", paye:false, paidAt:null });
    toast("Facture dépayée","info");
  },

  async uploadDoc(k){
    if(!state.currentDossierId){toast("Enregistre d'abord","info");return;}
    const input=document.createElement("input"); input.type="file";
    input.onchange=async()=>{ const file=input.files[0]; if(!file) return; toast("Upload…","info");
      try{ const b64=await fileToBase64(file);
        const res=await fetch(CONFIG.drive.uploadUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({folderId:CONFIG.drive.folder,filename:`${state.currentDossierId}_${k}_${file.name}`,mimeType:file.type,data:b64})});
        const j=await res.json(); if(!j.url) throw new Error("Drive");
        const d=state.dossiers[state.currentDossierId]; d.docs=d.docs||{}; d.docs[k]={url:j.url,name:file.name,uploadedAt:Date.now()};
        await fb.update(`/dossiers/${d.id}/docs`,{[k]:d.docs[k]}); this.renderTab(d); toast("Document chargé ✓","success");
      }catch(e){toast("Upload échoué","error");}
    };
    input.click();
  },
  async removeDoc(k){ if(!confirm("Retirer ?")) return; const d=state.dossiers[state.currentDossierId]; d.docs=d.docs||{}; delete d.docs[k]; await fb.set(`/dossiers/${d.id}/docs`,d.docs); this.renderTab(d); toast("Retiré","info"); },

  /* ==========================================================================
     SYNTHÈSE — vue 360° plein écran (ouverture sur clic nom client)
     ========================================================================== */
  openSynth(dossierId){
    const d = state.dossiers[dossierId]; if (!d){ toast("Dossier introuvable","error"); return; }
    state.synthDossierId = dossierId;
    this.renderSynth();
    $("#synth").classList.add("open");
    $("#synthBd").classList.add("open");
  },
  closeSynth(){
    $("#synth").classList.remove("open");
    $("#synthBd").classList.remove("open");
    state.synthDossierId = null;
  },
  editFromSynth(){
    const id = state.synthDossierId;
    this.closeSynth();
    if (id) this.openDrawer(id);
  },

  renderSynth(){
    const d = state.dossiers[state.synthDossierId]; if (!d) return;
    const op = OPERATEURS.find(o=>o.id===d.operateur) || {label:d.operateur||"—",class:"default"};
    const s = STATUTS.find(x=>x.id===d.status) || {label:d.status||"—",color:"gray"};
    const f = state.factures[d.id];
    const proformasDossier = Object.values(state.proformas||{}).filter(p=>p.dossierId===d.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const clientForm = Object.values(state.clientForms||{}).find(cf=>cf.dossierId===d.id);

    // Header
    $("#synthNum").textContent = `#${d.numDossier||"?"}`;
    $("#synthName").textContent = d.nom || "—";
    $("#synthMeta").innerHTML = `
      <span class="op-badge ${op.class}">${esc(op.label)}</span>
      <span class="chip ${s.color}">${esc(s.label)}</span>
      ${d.numColis?`<span>📦 ${esc(d.numColis)}</span>`:""}

  /* ----- Timeline builder -----
     Combine les événements automatiques (dérivés des flags/timestamps existants)
     avec les entrées manuelles stockées dans d.history */
  buildTimeline(d, f, proformas, clientForm){
    const events = [];

    // 1. Création du dossier
    events.push({ at: d.createdAt, title: "Dossier créé — premier contact", source: d.operateur, cls:"done" });

    // 2. Événements manuels stockés dans d.history
    const hist = d.history ? Object.values(d.history) : [];
    hist.forEach(h=>{
      const iconMap = { phone:"📞", email:"✉", message:"💬", visit:"🛃", bae:"📄", note:"📝", other:"◆" };
      events.push({
        id: h.id,
        at: h.at,
        title: `${iconMap[h.type]||"◆"} ${h.title||"Événement"}`,
        note: h.note,
        author: h.author,
        cls: "manual done"
      });
    });

    // 3. Demande d'infos au client
    if (clientForm){
      if (clientForm.sentAt || clientForm.createdAt){
        events.push({ at: clientForm.sentAt || clientForm.createdAt, title: "📨 Formulaire envoyé au client", source: clientForm.clientMail, cls:"done" });
      }
      if (clientForm.submittedAt){
        events.push({ at: clientForm.submittedAt, title: "✅ Client a rempli le formulaire", note: clientForm.data?.description ? clientForm.data.description.slice(0,200) : null, cls:"done" });
      } else if (clientForm.status === "IN_PROGRESS" && clientForm.updatedAt){
        events.push({ at: clientForm.updatedAt, title: "⏳ Client remplit le formulaire…", cls:"current" });
      }
    }

    // 4. Proformas
    proformas.forEach(p=>{
      if (p.createdAt) events.push({ at: p.createdAt, title: `📄 Proforma ${p.numProforma||""} créée`, source: p.totalTTC?fmtEuro(p.totalTTC):"", cls:"done" });
      if (p.sentAt)    events.push({ at: p.sentAt,    title: `✉ Proforma ${p.numProforma||""} envoyée au client`, source: p.sentTo, cls:"done" });
    });

    // 5. Devis confirmé
    if (d.okDevis){
      events.push({ at: d.updatedAt, title: "✓ Devis confirmé par le client", cls:"done" });
    }

    // 6. OK douane
    if (d.okDouane){
      events.push({ at: d.updatedAt, title: "🛃 OK douane (dédouanement accepté)", cls:"done" });
    }

    // 7. Statut livraison
    if (d.status === "EN_LIVRAISON"){
      events.push({ at: d.updatedAt, title: "🚚 Colis en livraison chez le transporteur", cls:"current" });
    } else if (d.status === "LIVRE"){
      events.push({ at: d.updatedAt, title: "📦 Colis livré", cls:"done" });
    }

    // 8. Envoi à PERAC
    if (d.facturationRequestedAt){
      events.push({ at: d.facturationRequestedAt, title: "↗ Dossier envoyé à TAF PERAC pour facturation", cls:"done" });
    }

    // 9. Facture
    if (f){
      if (f.emittedAt) events.push({ at: f.emittedAt, title: `💰 Facture ${f.numFacture||""} émise`, source: fmtEuro(f.totalTTC||f.montantTTC||0), cls:"done" });
      if (f.paidAt)    events.push({ at: f.paidAt,    title: `🎉 Règlement reçu`, source: fmtEuro(f.totalTTC||f.montantTTC||0), cls:"done" });
    }

    // 10. Étape future (si pas encore payé)
    if (!f || !(f.status==="PAYE"||f.paye)){
      events.push({ at: null, title: "⏳ En attente de règlement", cls:"future" });
    }

    // Trier par timestamp (null à la fin)
    events.sort((a,b)=>{
      if (!a.at && !b.at) return 0;
      if (!a.at) return 1;
      if (!b.at) return -1;
      return a.at - b.at;
    });
    return events;
  },

  toggleAddHistoryForm(){
    const f = $("#tlAddForm"); if (!f) return;
    f.classList.toggle("open");
    if (f.classList.contains("open")){
      setTimeout(()=>{ const ti=$("#tlTitle"); if(ti) ti.focus(); }, 50);

  async addHistoryEvent(){
    const d = state.dossiers[state.synthDossierId]; if (!d) return;
    const type  = $("#tlType").value;
    const title = $("#tlTitle").value.trim();
    const note  = $("#tlNote").value.trim();
    if (!title){ toast("Ajoute un titre","error"); return; }
    const id = "h_" + Date.now() + "_" + Math.random().toString(36).slice(2,6);
    const entry = { id, type, title, note, at: Date.now(), author: "Christophe" };
    d.history = d.history || {};
    d.history[id] = entry;
    d.updatedAt = Date.now();
    await fb.update(`/dossiers/${d.id}/history`, { [id]: entry });
    await fb.update(`/dossiers/${d.id}`, { updatedAt: d.updatedAt });
    toast("Événement ajouté ✓","success");
    this.renderSynth();
  },

  async deleteHistoryEvent(eventId){
    if (!confirm("Retirer cet événement ?")) return;
    const d = state.dossiers[state.synthDossierId]; if (!d) return;
    d.history = d.history || {};
    delete d.history[eventId];
    d.updatedAt = Date.now();
    await fb.del(`/dossiers/${d.id}/history/${eventId}`);
    await fb.update(`/dossiers/${d.id}`, { updatedAt: d.updatedAt });
    toast("Événement retiré","info");
    this.renderSynth();
  },

  updateBellCount(){

    const bell = $("#bellBtn"); const count = $("#bellCount");
    if (pending.length){

      count.style.display = "flex";

      count.style.display = "none";
      bell.classList.remove("has-pending");

  toggleInboxPanel(ev){
    if (ev) ev.stopPropagation();
    state.inboxPanelOpen = !state.inboxPanelOpen;
    const panel = $("#inboxPanel");
    panel.classList.toggle("open", state.inboxPanelOpen);
    if (state.inboxPanelOpen){
      this.renderInboxPanel();
      // click outside to close
      setTimeout(()=>{
        const closer = (e)=>{
          if (!panel.contains(e.target) && e.target.id!=="bellBtn" && !$("#bellBtn").contains(e.target)){
            panel.classList.remove("open"); state.inboxPanelOpen=false;
            document.removeEventListener("click", closer);
          }
        };
        document.addEventListener("click", closer);
      },0);
    }
  },

  renderInboxPanel(){
    const list = Object.values(state.baeInbox||{}).sort((a,b)=>(b.receivedAt||0)-(a.receivedAt||0));
    const body = $("#inboxList");
    if (!list.length){
      body.innerHTML = `<div class="inbox-empty">Aucune déclaration reçue pour l'instant.<br><br>Les PDFs envoyés à <code style="font-family:var(--mono);color:var(--accent-2)">${esc(CONFIG.bae.inboxEmail)}</code> arriveront ici.</div>`;
      return;
    }
    body.innerHTML = list.map(b=>{
      const cls = b.status==="MATCHED" ? "matched" : (b.candidates && b.candidates.length>1 ? "ambiguous" : (b.candidates && b.candidates.length===1 ? "matched" : "unmatched"));
      const tag = b.status==="MATCHED" ? `<span class="ii-tag matched">✓ rattachée #${b.matchedNumDossier||"?"}</span>` :
                  (b.candidates && b.candidates.length>1 ? `<span class="ii-tag ambiguous">${b.candidates.length} correspondances</span>` :
                  (b.candidates && b.candidates.length===1 ? `<span class="ii-tag ambiguous">à valider #${state.dossiers[b.candidates[0]]?.numDossier||"?"}</span>` :
                  `<span class="ii-tag unmatched">non rattachée</span>`));
      return `
        <div class="inbox-item ${cls}" onclick="app.openBaeMatch('${b.id}')">
          <div class="ii-ico">📄</div>
          <div class="ii-body">
            <div class="ii-subj">${esc(b.subject||"(sans objet)")}</div>
            <div class="ii-meta">
              ${tag}
              ${b.from?`<span>de ${esc(b.from)}</span>`:""}
              ${b.receivedAt?`<span>· ${fmtRelativeDate(b.receivedAt)}</span>`:""}
            </div>
          </div>
        </div>
      `;
    }).join("");
  },

  /* Détection automatique à l'arrivée d'un nouveau BAE */
  handleNewBae(baeId, bae){
    const candidates = this.findBaeCandidates(bae);
    bae.candidates = candidates.map(c=>c.dossierId);
    // Écrit les candidats en base pour cohérence multi-tabs
    fb.update(`/bae_inbox/${baeId}`, { candidates: bae.candidates }).catch(()=>{});

    if (candidates.length === 1 && candidates[0].score >= 80){
      // Match certain → popup "auto-rattachée" avec confirmation 1-clic
      this.showBaePopup(baeId, bae, candidates[0], "auto");
    } else if (candidates.length >= 1){
      // Match probable / ambigu → popup choisir
      this.showBaePopup(baeId, bae, candidates[0], "choose");
    } else {
      // Aucun → popup manuel
      this.showBaePopup(baeId, bae, null, "manual");
    }
  },

  /* Cherche des dossiers qui matchent un BAE reçu
     Score : numDossier exact=100, numColis exact=90, numDeclaration exact=85, nom contient=40, email contient=30 */
  findBaeCandidates(bae){
    const searchText = [(bae.subject||""), (bae.bodyText||""), (bae.filename||"")].join(" ").toLowerCase();
    if (!searchText.trim()) return [];
    const dossiers = Object.values(state.dossiers||{}).filter(d=>d.archive!=="archive");
    const scored = [];

    dossiers.forEach(d=>{
      let score = 0; const reasons = [];
      // 1. numDossier (le plus fort)
      const numDossStr = String(d.numDossier||"");
      if (numDossStr){
        // Match D00866 / #866 / dossier 866 / ref 866
        const patterns = [
          new RegExp(`\\b[dD]0*${numDossStr}\\b`),
          new RegExp(`#\\s*0*${numDossStr}\\b`),
          new RegExp(`dossier[\\s:]+0*${numDossStr}\\b`, "i"),
          new RegExp(`r[eé]f[\\s:.]+0*${numDossStr}\\b`, "i"),
          new RegExp(`\\b0*${numDossStr}\\b`)
        ];
        for (const p of patterns){
          if (p.test(searchText)){ score = Math.max(score, p.source.includes("\\b0*") ? 60 : 100); reasons.push(`N° dossier #${numDossStr}`); break; }
        }
      }
      // 2. numColis
      if (d.numColis && d.numColis.length >= 5){
        const colisLower = d.numColis.trim().toLowerCase();
        if (searchText.includes(colisLower)){ score = Math.max(score, 90); reasons.push(`N° colis ${d.numColis}`); }
      }
      // 3. numDeclaration
      if (d.numDeclaration && d.numDeclaration.length >= 5){
        const declLower = d.numDeclaration.trim().toLowerCase();
        if (searchText.includes(declLower)){ score = Math.max(score, 85); reasons.push(`N° déclaration`); }
      }
      // 4. Nom client (si unique)
      if (d.nom && d.nom.length >= 4){
        const nomLower = d.nom.trim().toLowerCase();
        if (searchText.includes(nomLower)){ score = Math.max(score, 40); reasons.push(`Nom "${d.nom}"`); }
      }
      // 5. Email
      if (d.mail && d.mail.length >= 5){
        const mailLower = d.mail.trim().toLowerCase();
        if (searchText.includes(mailLower)){ score = Math.max(score, 30); reasons.push("Email"); }
      }
      if (score > 0) scored.push({ dossierId:d.id, score, reasons });
    });

    scored.sort((a,b)=>b.score-a.score);
    return scored.slice(0, 5);
  },

  showBaePopup(baeId, bae, topCandidate, kind){
    $("#bpTitle").innerHTML = `Nouvelle <em>déclaration BAE</em>`;
    const metaParts = [ bae.subject?esc(bae.subject).slice(0,60):"(sans objet)" ];
    if (bae.from) metaParts.push(esc(bae.from));
    $("#bpMeta").textContent = metaParts.join(" · ");
    const actions = $("#bpActions");
    if (kind==="auto" && topCandidate){
      const d = state.dossiers[topCandidate.dossierId];
      actions.innerHTML = `
        <button class="btn primary small" onclick="app.confirmBaeAttach('${baeId}','${topCandidate.dossierId}')">✓ Rattacher #${d?.numDossier||"?"} — ${esc((d?.nom||"").slice(0,25))}</button>
        <button class="btn ghost small" onclick="app.openBaeMatch('${baeId}')">Choisir…</button>
      `;
    } else if (kind==="choose" && topCandidate){
      actions.innerHTML = `<button class="btn primary small" onclick="app.openBaeMatch('${baeId}')">Choisir le dossier</button>`;
    } else {
      actions.innerHTML = `<button class="btn primary small" onclick="app.openBaeMatch('${baeId}')">Rattacher manuellement</button>`;
    }
    const popup = $("#baePopup");
    popup.classList.add("show");
    clearTimeout(this._baePopupTimer);
    this._baePopupTimer = setTimeout(()=>popup.classList.remove("show"), kind==="auto"?12000:18000);
  },

  dismissBaePopup(){ $("#baePopup").classList.remove("show"); clearTimeout(this._baePopupTimer); },

  async confirmBaeAttach(baeId, dossierId){
    this.dismissBaePopup();
    await this.attachBaeToDossier(baeId, dossierId);
  },

  openBaeMatch(baeId){
    const bae = state.baeInbox[baeId]; if (!bae){ toast("BAE introuvable","error"); return; }
    this.dismissBaePopup();
    if (state.inboxPanelOpen) this.toggleInboxPanel();

    // Refresh candidats (au cas où la data a changé)
    const candidates = this.findBaeCandidates(bae);

    const preview = `
      <div class="mail-preview">
        <div class="mp-row"><span class="mp-k">De</span><span class="mp-v">${esc(bae.from||"—")}</span></div>
        <div class="mp-row"><span class="mp-k">Objet</span><span class="mp-v">${esc(bae.subject||"(sans objet)")}</span></div>
        <div class="mp-row"><span class="mp-k">Reçu</span><span class="mp-v">${bae.receivedAt?fmtDateLong(bae.receivedAt):"—"}</span></div>
        ${bae.pdfUrl?`<div class="mp-row"><span class="mp-k">PDF</span><span class="mp-v"><a class="mp-pdf" href="${bae.pdfUrl}" target="_blank">📄 ${esc(bae.filename||"déclaration.pdf")} — ouvrir</a></span></div>`:""}
        ${bae.bodyText?`<div class="mp-body">${esc(bae.bodyText.slice(0,500))}${bae.bodyText.length>500?"…":""}</div>`:""}
      </div>
    `;

    let body;
    if (candidates.length){
      body = preview + `
        <div style="font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">Dossiers proposés</div>
        <div class="match-cand-list" id="matchCandList">
          ${candidates.map((c,i)=>{
            const d = state.dossiers[c.dossierId]; if (!d) return "";
            const scoreCls = c.score>=80?"high":(c.score>=50?"med":"");
            return `
              <div class="match-cand ${i===0?"selected":""}" data-id="${c.dossierId}" onclick="app.selectMatchCand('${c.dossierId}')">
                <div class="mc-num">#${d.numDossier||"?"}</div>
                <div class="mc-body">
                  <div class="mc-title">${esc(d.nom||"—")}${d.numColis?` · ${esc(d.numColis)}`:""}</div>
                  <div class="mc-meta">${esc(c.reasons.join(" · "))}</div>
                </div>
                <div class="mc-score ${scoreCls}">${c.score}%</div>
              </div>
            `;
          }).join("")}
        </div>
        <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
          <input id="matchSearch" placeholder="…ou chercher un autre dossier (nom, colis, #)" style="flex:1;background:var(--bg-3);border:1px solid var(--border);padding:9px 12px;border-radius:6px;font-size:13px;color:var(--text);outline:none">
        </div>
        <div id="matchSearchResults" style="margin-top:10px"></div>
      `;
    } else {
      body = preview + `
        <div style="padding:18px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;text-align:center;color:var(--text-2);font-size:13px;margin-bottom:14px">
          Aucune correspondance automatique trouvée. Cherche le bon dossier :
        </div>
        <input id="matchSearch" placeholder="Chercher par nom, n° colis, ou #dossier" style="width:100%;background:var(--bg-3);border:1px solid var(--border);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--text);outline:none">
        <div id="matchSearchResults" style="margin-top:10px"></div>
      `;
    }

    state.modal.context = { kind:"baeMatch", baeId, selectedDossierId: candidates[0]?.dossierId || null };

    this.openModal(
      `Rattacher une <em>déclaration BAE</em>`,
      body,
      `
        <button class="btn ghost small" onclick="app.dismissBae('${baeId}')">Ignorer cette déclaration</button>
        <div style="flex:1"></div>
        <button class="btn ghost small" onclick="app.closeModal()">Fermer</button>
        <button class="btn primary small" onclick="app.confirmBaeMatch()">Rattacher au dossier sélectionné</button>
      `
    );

    // Bind search
    const searchInput = $("#matchSearch");
    if (searchInput){
      searchInput.addEventListener("input",(e)=>this.searchDossiersForMatch(e.target.value));
    }
  },

  selectMatchCand(dossierId){
    state.modal.context.selectedDossierId = dossierId;
    $$("#matchCandList .match-cand").forEach(el=>el.classList.toggle("selected", el.dataset.id===dossierId));
    // Clear search selection visuals
    $$("#matchSearchResults .match-cand").forEach(el=>el.classList.toggle("selected", el.dataset.id===dossierId));
  },

  searchDossiersForMatch(q){
    const res = $("#matchSearchResults"); if (!res) return;
    q = (q||"").toLowerCase().trim();
    if (!q){ res.innerHTML = ""; return; }
    const matches = Object.values(state.dossiers||{}).filter(d=>{
      const hay = [d.nom,d.prenom,d.numColis,d.numDossier,d.mail,d.ville,d.numDeclaration].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }).slice(0, 8);
    if (!matches.length){ res.innerHTML = `<div style="padding:12px;color:var(--text-3);font-size:12px;font-style:italic;text-align:center">Aucun dossier trouvé</div>`; return; }
    res.innerHTML = matches.map(d=>`
      <div class="match-cand" data-id="${d.id}" onclick="app.selectMatchCand('${d.id}')">
        <div class="mc-num">#${d.numDossier||"?"}</div>
        <div class="mc-body">
          <div class="mc-title">${esc(d.nom||"—")}${d.numColis?` · ${esc(d.numColis)}`:""}</div>
          <div class="mc-meta">${esc(d.ville||"")}${d.mail?" · "+esc(d.mail):""}</div>
        </div>
      </div>
    `).join("");
  },

  async confirmBaeMatch(){
    const ctx = state.modal.context;
    if (!ctx.selectedDossierId){ toast("Sélectionne un dossier","error"); return; }
    await this.attachBaeToDossier(ctx.baeId, ctx.selectedDossierId);
    this.closeModal();
  },

  async attachBaeToDossier(baeId, dossierId){
    const bae = state.baeInbox[baeId]; const d = state.dossiers[dossierId];
    if (!bae || !d){ toast("Données introuvables","error"); return; }

    // 1. Ajoute le PDF aux docs du dossier
    d.docs = d.docs || {};
    d.docs.bae = {
      url: bae.pdfUrl,
      name: bae.filename || `BAE_${d.numDossier||""}.pdf`,
      uploadedAt: Date.now(),
      source: "mailhook_bae",
      fromEmail: bae.from,
      subject: bae.subject
    };
    // 2. Active le flag OK douane
    d.okDouane = true;
    d.updatedAt = Date.now();
    // 3. Ajoute un événement historique
    const histId = "h_" + Date.now() + "_bae";
    d.history = d.history || {};
    d.history[histId] = {
      id: histId, type: "bae", at: Date.now(),
      title: `🛃 BAE reçu — OK douane`,
      note: `Déclaration "${bae.subject||"(sans objet)"}" reçue de ${bae.from||"—"}`,
      author: "Mailhook BAE"
    };
    // 4. Persist
    await fb.update(`/dossiers/${d.id}`, { docs: d.docs, okDouane: true, updatedAt: d.updatedAt });
    await fb.update(`/dossiers/${d.id}/history`, { [histId]: d.history[histId] });
    // 5. Marque le BAE comme traité
    await fb.update(`/bae_inbox/${baeId}`, {
      status: "MATCHED",
      matchedDossierId: d.id,
      matchedNumDossier: d.numDossier,
      matchedAt: Date.now()
    });
    state.baeInbox[baeId].status = "MATCHED";

    this.updateBellCount();
    toast(`✓ BAE rattachée au dossier #${d.numDossier||"?"} — ${d.nom||""}`,"success");
    if (state.synthDossierId === d.id) this.renderSynth();
    if (state.inboxPanelOpen) this.renderInboxPanel();
  },

  async dismissBae(baeId){
    if (!confirm("Ignorer cette déclaration ? (Elle restera consultable dans la boîte)")) return;
    await fb.update(`/bae_inbox/${baeId}`, { status:"DISMISSED", dismissedAt: Date.now() });
    state.baeInbox[baeId].status = "DISMISSED";
    this.updateBellCount();
    if (state.inboxPanelOpen) this.renderInboxPanel();
    this.closeModal();
    toast("Déclaration ignorée","info");
  },

  /* ===== Upload manuel d'une déclaration BAE ===== */
  uploadBaeManual(){
    if (state.inboxPanelOpen) this.toggleInboxPanel();
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/pdf";
    input.onchange = async ()=>{
      const file = input.files[0]; if (!file) return;
      toast("Upload du PDF…","info");
      try{
        const b64 = await fileToBase64(file);
        const res = await fetch(CONFIG.drive.uploadUrl, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ folderId: CONFIG.drive.folder, filename: `BAE_manual_${Date.now()}_${file.name}`, mimeType:"application/pdf", data:b64 })
        });
        const j = await res.json();
        if (!j.url) throw new Error("Upload échoué");
        // Crée une entrée bae_inbox comme si elle venait du mailhook
        const baeId = "bae_" + Date.now() + "_" + Math.random().toString(36).slice(2,6);
        const entry = {
          id: baeId, source:"manual_upload",
          pdfUrl: j.url, filename: file.name,
          subject: `[Upload manuel] ${file.name}`, from: "Christophe (manuel)",
          bodyText: "",
          receivedAt: Date.now(), status:"PENDING"
        };
        await fb.set(`/bae_inbox/${baeId}`, entry);
        state.baeInbox[baeId] = entry;
        state.seenBaeIds.add(baeId);
        toast("BAE chargée — choisir le dossier","success");
        this.updateBellCount();
        this.openBaeMatch(baeId);
      }catch(e){ toast("Upload échoué","error"); }
    };
    input.click();
  },

  /* Upload manuel rattaché directement à un dossier (sans passage par l'inbox) */
  uploadBaeManualForDossier(dossierId){
    const d = state.dossiers[dossierId]; if (!d) return;
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/pdf";
    input.onchange = async ()=>{
      const file = input.files[0]; if (!file) return;
      if (!confirm(`Charger cette déclaration BAE pour le dossier #${d.numDossier||"?"} — ${d.nom||""} ?\nLe dossier passera en "OK douane".`)) return;
      toast("Upload du PDF…","info");
      try{
        const b64 = await fileToBase64(file);
        const res = await fetch(CONFIG.drive.uploadUrl, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ folderId: CONFIG.drive.folder, filename: `BAE_${d.numDossier||""}_${file.name}`, mimeType:"application/pdf", data:b64 })
        });
        const j = await res.json();
        if (!j.url) throw new Error("Upload échoué");
        d.docs = d.docs || {};
        d.docs.bae = { url: j.url, name: file.name, uploadedAt: Date.now(), source: "manual_upload_direct" };
        d.okDouane = true;
        d.updatedAt = Date.now();
        const histId = "h_" + Date.now() + "_bae";
        d.history = d.history || {};
        d.history[histId] = { id:histId, type:"bae", at:Date.now(), title:`🛃 BAE chargée manuellement — OK douane`, note:`Fichier : ${file.name}`, author:"Christophe" };
        await fb.update(`/dossiers/${d.id}`, { docs: d.docs, okDouane: true, updatedAt: d.updatedAt });
        await fb.update(`/dossiers/${d.id}/history`, { [histId]: d.history[histId] });
        toast(`✓ BAE rattachée — OK douane`,"success");
        if (state.synthDossierId === d.id) this.renderSynth();
      }catch(e){ toast("Upload échoué","error"); }
    };
    input.click();
  },

  /* ==========================================================================
     RÈGLEMENT REÇU — envoi email avec BAE + facture au contact du dossier
     ========================================================================== */
  async sendPaymentReceivedEmail(dossierId){
    const d = state.dossiers[dossierId]; if (!d){ toast("Dossier introuvable","error"); return; }
    if (!d.mail){ toast("Aucun email client sur le dossier","error"); return; }

    const bcc = state.notifSettings?.bccEmail || CONFIG.notifications.defaultBcc;
    const f = state.factures[d.id];
    const baePdfUrl = d.docs?.bae?.url;
    const facturePdfUrl = f?.pdfUrl;

    const subject = `Dossier ${d.numDossier||""} — Règlement reçu · Merci`;
    const body = this.paymentReceivedEmailBody(d, f);
    const attachments = [];
    if (baePdfUrl)     attachments.push({ url: baePdfUrl,     name: d.docs.bae.name || `BAE_${d.numDossier}.pdf` });
    if (facturePdfUrl) attachments.push({ url: facturePdfUrl, name: `Facture_${f.numFacture||d.numDossier}.pdf` });

    if (!confirm(`Envoyer l'email "Règlement reçu" ?\n\nÀ : ${d.mail}\nBCC : ${bcc}\nPièces jointes : ${attachments.length} (${attachments.map(a=>a.name).join(", ")||"aucune"})`)) return;

    try{
      await fetch(CONFIG.webhooks.email, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          type: "facture_payee",
          to: d.mail,
          bcc,
          from: CONFIG.company.email,
          subject,
          body,
          attachments,
          dossier: {
            id: d.id, numDossier: d.numDossier, nom: d.nom, prenom: d.prenom,
            numColis: d.numColis, origine: d.origine, ville: d.ville,
            operateur: d.operateur, numDeclaration: d.numDeclaration
          },
          facture: f ? { numFacture: f.numFacture, totalHT: f.totalHT, totalTVA: f.totalTVA, totalTTC: f.totalTTC, paidAt: f.paidAt } : null
        })
      });
      // Ajoute à l'historique
      const histId = "h_" + Date.now() + "_pay";
      await fb.update(`/dossiers/${d.id}/history`, {
        [histId]: { id:histId, type:"email", at:Date.now(), title:`✉ Email "Règlement reçu" envoyé à ${d.mail}`, note:`BCC: ${bcc}. ${attachments.length} pièce(s) jointe(s).`, author:"TAF Express" }
      });
      await fb.update(`/dossiers/${d.id}`, { paymentEmailSent: true, paymentEmailSentAt: Date.now(), updatedAt: Date.now() });
      toast("Email envoyé ✓","success");
      if (state.synthDossierId === d.id) this.renderSynth();
    }catch(e){
      console.error(e); toast("Envoi échoué : "+e.message,"error");
    }
  },

  paymentReceivedEmailBody(d, f){
    const totalTTC = f ? (f.totalTTC||f.montantTTC||0) : (d.totalFacture||0);
    return `Bonjour${d.prenom?" "+d.prenom:""},

Nous vous confirmons la bonne réception de votre règlement pour le dossier n°${d.numDossier||""}.

Récapitulatif du dossier :
— Client : ${d.nom||""}${d.prenom?` (${d.prenom})`:""}
— N° colis / AWB : ${d.numColis||"—"}
— Origine : ${d.origine||"—"}
— Transporteur : ${d.operateur||"—"}
${d.numDeclaration?`— N° de déclaration douane : ${d.numDeclaration}\n`:""}${f?.numFacture?`— N° de facture : ${f.numFacture}\n`:""}— Montant réglé : ${fmtEuro(totalTTC)}

Votre dossier est désormais clos. Vous trouverez en pièces jointes la déclaration douane (BAE) ainsi que la facture acquittée.

Nous vous remercions pour votre confiance et restons à votre disposition pour vos prochains envois.

Cordialement,
L'équipe TAF ROISSY
${CONFIG.company.email}
${CONFIG.company.website}`;
  },

  /* ==========================================================================
     MODULE PARAMÈTRES — enrichi pour BCC email + templates
     ========================================================================== */

  /* ==========================================================================
     MODAL générique (proforma / client form)
     ========================================================================== */
  openModal(title, bodyHtml, footerHtml){
    $("#modalTitle").innerHTML = title;
    $("#modalBody").innerHTML = bodyHtml;
    $("#modalFoot").innerHTML = footerHtml;
    $("#modal").classList.add("open");
    $("#modalBd").classList.add("open");
    state.modal.open = true;
  },
  closeModal(){
    $("#modal").classList.remove("open");
    $("#modalBd").classList.remove("open");
    state.modal.open = false;
    state.modal.context = null;
  },

  /* ==========================================================================
     PROFORMA — création, PDF, envoi
     ========================================================================== */
  openProformaModal(dossierId, proformaId=null){
    const d = state.dossiers[dossierId]; if (!d){ toast("Dossier introuvable","error"); return; }
    // Pré-remplissage : existant ou nouveau à partir du dossier
    let pf;
    if (proformaId && state.proformas[proformaId]){
      pf = JSON.parse(JSON.stringify(state.proformas[proformaId]));
    } else {
      const next = Object.values(state.proformas).reduce((m,p)=>{const n=parseInt(String(p.numProforma||"").replace(/\D/g,""))||0; return n>m?n:m;},0)+1;
      const num = `PF${new Date().getFullYear()}-${String(next).padStart(4,"0")}`;
      // Lignes pré-remplies selon les données du dossier
      const lignes = [];
      if (d.montantIntervention) lignes.push({ description:`Intervention douane — ${(d.natureMarchandise||[]).join(", ")||"marchandise"}`, qty:1, pu:d.montantIntervention||0, tva:d.tauxTVA||20 });
      if (d.dd) lignes.push({ description:"Avance droits de douane", qty:1, pu:d.dd||0, tva:0 });
      if (d.tva) lignes.push({ description:"Avance TVA", qty:1, pu:d.tva||0, tva:0 });
      if (d.ima) lignes.push({ description:"IMA", qty:1, pu:d.ima||0, tva:0 });
      if (!lignes.length) lignes.push({ description:"Prestation douane", qty:1, pu:0, tva:20 });
      pf = {
        id: "pf_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
        dossierId: d.id, numDossier: d.numDossier, numProforma: num,
        client: { nom:d.nom||"", prenom:d.prenom||"", mail:d.mail||"", adresse:d.adresse||"", ville:d.ville||"" },
        lignes, status:"DRAFT",
        createdAt: Date.now(), updatedAt: Date.now(),
        numColis:d.numColis, origine:d.origine, operateur:d.operateur
      };
    }
    state.modal.context = { kind:"proforma", dossierId, pf };

    const body = `
      <div class="form-grid" style="margin-bottom:16px">
        <div class="field"><label>N° Proforma</label><input value="${esc(pf.numProforma)}" id="pfNum"></div>
        <div class="field"><label>Date</label><input type="date" value="${new Date(pf.createdAt).toISOString().slice(0,10)}" id="pfDate"></div>
        <div class="field"><label>Client — Société</label><input value="${esc(pf.client.nom||"")}" id="pfClientNom"></div>
        <div class="field"><label>Client — Contact</label><input value="${esc(pf.client.prenom||"")}" id="pfClientPrenom"></div>
        <div class="field"><label>Email client</label><input type="email" value="${esc(pf.client.mail||"")}" id="pfClientMail"></div>
        <div class="field"><label>Ville</label><input value="${esc(pf.client.ville||"")}" id="pfClientVille"></div>
      </div>

      <div style="margin-bottom:6px;font-family:var(--mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px">Prestations</div>
      <table class="pf-table">
        <thead><tr><th class="col-desc">Description</th><th class="col-qty qty">Qté</th><th class="col-pu pu">P.U. HT</th><th class="col-tva tva">TVA %</th><th class="col-total total">Total HT</th><th class="col-del"></th></tr></thead>
        <tbody id="pfLignes">${pf.lignes.map((l,i)=>this.pfLineHtml(l,i)).join("")}</tbody>
      </table>
      <div><button class="btn ghost small" onclick="app.addProformaLine()">+ Ajouter une ligne</button></div>

      <div class="pf-totals"><div class="pf-totals-box" id="pfTotals"></div></div>

      <div class="field full" style="margin-top:16px"><label>Note / conditions</label><textarea id="pfNote" rows="3" placeholder="Règlement sous 8 jours. TVA sur encaissements…">${esc(pf.note||"Règlement sous 8 jours par virement bancaire.")}</textarea></div>
    `;

    const foot = `
      <button class="btn ghost small" onclick="app.closeModal()">Fermer</button>
      <div style="flex:1"></div>
      <button class="btn ghost small" onclick="app.saveProforma()">💾 Enregistrer brouillon</button>
      <button class="btn ghost small" onclick="app.downloadProformaPDF()">📥 Télécharger PDF</button>
      <button class="btn primary small" onclick="app.sendProformaToClient()">✉ Envoyer au client</button>
    `;

    this.openModal(`Proforma <em>— dossier #${d.numDossier||"?"}</em>`, body, foot);

    // Bind live computation
    $("#modalBody").addEventListener("input",(e)=>{ if (e.target.closest("#pfLignes")||e.target.closest(".pf-table")) this.recomputeProforma(); });
    this.recomputeProforma();
  },

  pfLineHtml(l, idx){
    return `<tr data-idx="${idx}">
      <td class="col-desc"><input class="l-desc" value="${esc(l.description||"")}"></td>
      <td class="col-qty qty"><input class="l-qty" type="number" step="0.01" value="${l.qty||1}"></td>
      <td class="col-pu pu"><input class="l-pu" type="number" step="0.01" value="${l.pu||0}"></td>
      <td class="col-tva tva"><input class="l-tva" type="number" step="0.5" value="${l.tva==null?20:l.tva}"></td>
      <td class="col-total total"><span class="l-total">${fmtEuro((l.qty||0)*(l.pu||0))}</span></td>
      <td class="col-del"><span class="del-btn" onclick="app.removeProformaLine(${idx})">×</span></td>
    </tr>`;
  },

  addProformaLine(){
    const tb = $("#pfLignes"); const idx = tb.children.length;
    tb.insertAdjacentHTML("beforeend", this.pfLineHtml({description:"",qty:1,pu:0,tva:20}, idx));
    this.recomputeProforma();
  },
  removeProformaLine(idx){
    const tr = $("#pfLignes").querySelector(`tr[data-idx="${idx}"]`); if (tr) tr.remove();
    // Re-index
    Array.from($("#pfLignes").children).forEach((r,i)=>{ r.dataset.idx=i; r.querySelector(".del-btn").setAttribute("onclick",`app.removeProformaLine(${i})`); });
    this.recomputeProforma();
  },
  readProformaLines(){
    return Array.from($("#pfLignes").children).map(tr=>({
      description: tr.querySelector(".l-desc").value,
      qty: Number(tr.querySelector(".l-qty").value)||0,
      pu:  Number(tr.querySelector(".l-pu").value)||0,
      tva: Number(tr.querySelector(".l-tva").value)||0
    }));
  },
  recomputeProforma(){
    const lignes = this.readProformaLines();
    let totalHT = 0, totalTVA = 0;
    lignes.forEach((l,i)=>{
      const ht = l.qty * l.pu;
      totalHT += ht;
      totalTVA += ht * (l.tva/100);
      const tot = $("#pfLignes").children[i]?.querySelector(".l-total");
      if (tot) tot.textContent = fmtEuro(ht);
    });
    const totalTTC = totalHT + totalTVA;
    $("#pfTotals").innerHTML = `
      <div class="pf-totals-row"><span>Total HT</span><span>${fmtEuro(totalHT)}</span></div>
      <div class="pf-totals-row"><span>TVA</span><span>${fmtEuro(totalTVA)}</span></div>
      <div class="pf-totals-row big"><span>Total TTC</span><span>${fmtEuro(totalTTC)}</span></div>
    `;
    state.modal.context.totals = { totalHT, totalTVA, totalTTC };
  },

  readProformaFromModal(){
    const ctx = state.modal.context;
    const pf = ctx.pf;
    pf.numProforma = $("#pfNum").value;
    pf.dateIso = $("#pfDate").value;
    pf.client = {
      nom:    $("#pfClientNom").value.trim(),
      prenom: $("#pfClientPrenom").value.trim(),
      mail:   $("#pfClientMail").value.trim(),

  generateProformaPDF(pf){
    // Génère un jsPDF selon le template Excel fourni
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"mm", format:"a4" });
    const W = 210, M = 20;

    // Header — logo zone
    doc.setTextColor(40,40,40); 
    doc.setFont("helvetica","bold"); 
    doc.setFontSize(11);
    doc.text("COMMISSIONNAIRE EN TRANSPORT INTERNATIONAL", M, 15);
    doc.setFontSize(10);
    doc.text("IMPORT", M, 20);

    // Titre FACTURE PROFORMA
    doc.setFillColor(212,168,87); 
    doc.rect(M+70, 25, 90, 8, "F");
    doc.setTextColor(255,255,255); 
    doc.setFont("helvetica","bold"); 
    doc.setFontSize(12);
    doc.text("FACTURE PROFORMA | PROFORMA INVOICE n° :", M+72, 30);
    doc.text(pf.numProforma||"", W-M-5, 30, { align:"right" });

    // Date
    doc.setTextColor(40,40,40); 
    doc.setFont("helvetica","normal"); 
    doc.setFontSize(10);
    const dateStr = pf.dateIso || new Date().toISOString().slice(0,10);
    doc.text(`Date : ${dateStr}`, M+70, 38);

    // Coordonnées TAF ROISSY (gauche)
    doc.setFont("helvetica","normal"); 
    doc.setFontSize(9);
    doc.setTextColor(60,60,60);
    let y = 50;
    doc.text("4 rue du Té, Zone Cargo 6, Bâtiment 3451 A/B/C", M, y); y+=5;
    doc.text("93290 Tremblay en France, France", M, y); y+=5;
    doc.text("+33 1 41 84 04 40", M, y); y+=5;
    doc.text("contact@taftrans.fr", M, y);

    // Destinataire (droite)
    doc.setFont("helvetica","bold"); 
    doc.setFontSize(10);
    doc.text("MR/MME " + (pf.client.nom||""), W-M-70, 50);
    doc.setFont("helvetica","normal"); 
    doc.setFontSize(9);
    y = 55;
    if (pf.client.adresse) { doc.text(pf.client.adresse, W-M-70, y); y+=5; }
    if (pf.client.ville)   { doc.text(pf.client.ville, W-M-70, y); y+=5; }

    // Infos opérateur et colis
    doc.setDrawColor(200,200,200); 
    doc.line(M, 75, W-M, 75);
    doc.setFontSize(9); 
    doc.setTextColor(80,80,80);
    doc.text("Opérateur", M, 82);
    doc.text("Lieu de destination", M+50, 82);
    doc.text("Numéro de colis", W-M-40, 82);
    
    doc.setFont("helvetica","bold");
    doc.text(pf.operateur||"—", M, 87);
    doc.text(pf.client.ville||"—", M+50, 87);
    doc.text(pf.numColis||"—", W-M-40, 87);

    // Taux
    doc.setFont("helvetica","normal");
    const dossier = state.dossiers[pf.dossierId];
    const tauxDD = dossier?.tauxDD || 0;
    const valeur = dossier?.valeur || 0;
    const tauxTVA = dossier?.tauxTVA || 20;
    
    doc.text(`Taux de Droit de douane: ${tauxDD}%`, M, 95);
    doc.text(`Valeur: ${fmtMoneyPdf(valeur)} €`, M+60, 95);
    doc.text(`TVA: ${tauxTVA}%`, M+120, 95);

    // Table header
    const tY = 105;
    doc.setFillColor(240,240,240); 
    doc.rect(M, tY, W-2*M, 8, "F");
    doc.setTextColor(40,40,40); 
    doc.setFontSize(9); 
    doc.setFont("helvetica","bold");
    doc.text("Libellé", M+2, tY+5);
    doc.text("DOUANE", M+90, tY+5, { align:"right" });
    doc.text("TAXABLE", M+120, tY+5, { align:"right" });
    doc.text("EXONERE", W-M-2, tY+5, { align:"right" });

    // Lignes selon template Excel
    doc.setFont("helvetica","normal"); 
    doc.setFontSize(9);
    let ly = tY + 13;
    
    // Calculs automatiques selon template
    const dd = (valeur * tauxDD) / 100;
    const tvaDd = (dd + valeur) * tauxTVA / 100;
    const montantInter = dossier?.montantIntervention || 110;
    
    const lignesTemplate = [
      { lib: "AUTRES TAXES", douane: 0, taxable: 0, exonere: 0 },
      { lib: "DROITS DE DOUANE", douane: dd, taxable: 0, exonere: 0 },
      { lib: "TVA DOUANE", douane: tvaDd, taxable: 0, exonere: 0 },
      { lib: "FRAIS DE TRANSFERT", douane: 0, taxable: 50, exonere: 0 },
      { lib: "TAXE DOUANE", douane: 0, taxable: 20, exonere: 0 },
      { lib: "DEDOUANEMENT", douane: 0, taxable: montantInter, exonere: 0 }
    ];

    lignesTemplate.forEach(l=>{
      doc.text(l.lib, M+2, ly);
      if (l.douane) doc.text(fmtMoneyPdf(l.douane), M+90, ly, { align:"right" });
      if (l.taxable) doc.text(fmtMoneyPdf(l.taxable), M+120, ly, { align:"right" });
      if (l.exonere) doc.text(fmtMoneyPdf(l.exonere), W-M-2, ly, { align:"right" });
      ly += 6;
      doc.setDrawColor(230,230,230); 
      doc.line(M, ly-1, W-M, ly-1);
    });

    // Sous-totaux
    ly += 3;
    doc.setFont("helvetica","bold");
    doc.text("SOUS-TOTAL", M+2, ly);
    const totalDouane = lignesTemplate.reduce((s,l)=>s+l.douane, 0);
    const totalTaxable = lignesTemplate.reduce((s,l)=>s+l.taxable, 0);
    const totalExonere = lignesTemplate.reduce((s,l)=>s+l.exonere, 0);
    
    doc.text(fmtMoneyPdf(totalDouane), M+90, ly, { align:"right" });
    doc.text(fmtMoneyPdf(totalTaxable), M+120, ly, { align:"right" });
    doc.text(fmtMoneyPdf(totalExonere), W-M-2, ly, { align:"right" });

    // TVA sur taxable
    ly += 10;
    doc.setFont("helvetica","normal");
    doc.text("Devise : EUR (€)", M+50, ly);
    ly += 6;
    const tvaSurTaxable = totalTaxable * 0.2;
    doc.text("T.V.A (€)", M+50, ly);
    doc.text(fmtMoneyPdf(tvaSurTaxable), W-M-2, ly, { align:"right" });

    // Total final
    ly += 8;
    doc.setFont("helvetica","bold"); 
    doc.setFontSize(12); 
    doc.setTextColor(212,168,87);
    doc.setDrawColor(212,168,87); 
    doc.setLineWidth(0.5); 
    doc.line(M+40, ly-2, W-M, ly-2);
    
    const totalFinal = totalDouane + totalTaxable + totalExonere + tvaSurTaxable;
    doc.text("TOTAL TTC", M+50, ly);
    doc.text(fmtMoneyPdf(totalFinal) + " €", W-M-2, ly, { align:"right" });

    // Note
    ly += 15;
    doc.setFont("helvetica","italic"); 
    doc.setFontSize(8); 
    doc.setTextColor(90,90,90);
    const note = pf.note || "Règlement sous 8 jours par virement bancaire.";
    const noteLines = doc.splitTextToSize(note, W-2*M);
    doc.text(noteLines, M, ly);

    // Footer
    doc.setFont("helvetica","normal"); 
    doc.setFontSize(7); 
    doc.setTextColor(140,140,140);
    doc.text("Document proforma — non valable comme facture", W/2, 285, { align:"center" });
    doc.text(`Généré le ${new Date().toLocaleString("fr-FR")} par TAF EXPRESS v1.5`, W/2, 290, { align:"center" });

    return doc;
  },

  async sendProformaToClient(){
    const pf = this.readProformaFromModal();
    if (!pf.client.mail){ toast("Email du client requis","error"); return; }
    if (!confirm(`Envoyer la proforma ${pf.numProforma} à ${pf.client.mail} ?`)) return;

    try{
      toast("Génération du PDF…","info");
      const doc = this.generateProformaPDF(pf);
      const pdfB64 = doc.output("datauristring").split(",")[1];

      // Upload Drive
      toast("Upload Drive…","info");
      const up = await fetch(CONFIG.drive.uploadUrl,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ folderId: CONFIG.drive.folder, filename: `${pf.numProforma}.pdf`, mimeType:"application/pdf", data: pdfB64 })
      });
      const upJson = await up.json();
      if (!upJson.url) throw new Error("Drive upload échoué");
      pf.pdfUrl = upJson.url;

      // Persister la proforma
      pf.status = "SENT";
      pf.sentAt = Date.now();
      pf.sentTo = pf.client.mail;
      await fb.set(`/proformas/${pf.id}`, pf);
      state.proformas[pf.id] = pf;

      // Envoi email via webhook Make.com
      toast("Envoi email…","info");
      await fetch(CONFIG.webhooks.email, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          type: "proforma",
          to: pf.client.mail,
          subject: `Votre proforma ${pf.numProforma} — TAF ROISSY`,
          client_name: pf.client.nom || pf.client.prenom || "",
          numProforma: pf.numProforma,
          numDossier: pf.numDossier,
          totalTTC: pf.totalTTC,
          pdfUrl: pf.pdfUrl,
          dossierId: pf.dossierId,

      toast("Proforma envoyée au client ✓","success");
      this.closeModal();
      if (state.currentDossierId) this.renderTab(state.dossiers[state.currentDossierId]);
    }catch(e){
      console.error(e); toast("Erreur : "+e.message,"error");
    }

  async generateAndSaveProformaPDF(dossierId){

      toast("Génération du PDF Pro Forma…","info");

      const next = Object.values(state.proformas||{}).reduce((m,p)=>{const n=parseInt(String(p.numProforma||"").replace(/\D/g,""))||0; return n>m?n:m;},0)+1;
      const num = `PF${new Date().getFullYear()}-${String(next).padStart(4,"0")}`;
      
      const pf = {
        id: "pf_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
        dossierId: d.id,
        numDossier: d.numDossier,
        numProforma: num,
        client: {
          nom: d.nom||"",
          prenom: d.prenom||"",
          mail: d.mail||"",
          adresse: d.adresse||"",
          ville: d.ville||""
        },
        lignes: [],
        status: "DRAFT",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        numColis: d.numColis,
        origine: d.origine,
        operateur: d.operateur,
        note: "Règlement sous 8 jours par virement bancaire.",
        dateIso: new Date().toISOString().slice(0,10)
      };
      
      // Calculer les totaux selon template
      const valeur = d.valeur || 0;
      const tauxDD = d.tauxDD || 0;
      const tauxTVA = d.tauxTVA || 20;
      const montantInter = d.montantIntervention || 110;
      
      const dd = (valeur * tauxDD) / 100;
      const tvaDd = (dd + valeur) * tauxTVA / 100;
      const totalDouane = dd + tvaDd;
      const totalTaxable = 50 + 20 + montantInter;
      const tvaSurTaxable = totalTaxable * 0.2;
      const totalFinal = totalDouane + totalTaxable + tvaSurTaxable;
      
      pf.totalHT = totalDouane + totalTaxable;
      pf.totalTVA = tvaDd + tvaSurTaxable;
      pf.totalTTC = totalFinal;
      
      // Générer le PDF
      const doc = this.generateProformaPDF(pf);
      const pdfB64 = doc.output("datauristring").split(",")[1];
      
      // Upload vers Drive
      toast("Upload vers Drive…","info");
      const up = await fetch(CONFIG.drive.uploadUrl,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          folderId: CONFIG.drive.folder,
          filename: `${pf.numProforma}_${d.nom||d.id}.pdf`,
          mimeType: "application/pdf",
          data: pdfB64
        })
      });
      
      const upJson = await up.json();
      if (!upJson.url) throw new Error("Upload Drive échoué");
      
      pf.pdfUrl = upJson.url;

      await fb.set(`/proformas/${pf.id}`, pf);

      toast("Pro Forma PDF créée et sauvegardée ✓","success");

  async sendClientFormEmail(){
    const ctx = state.modal.context;
    const d = state.dossiers[ctx.dossierId];
    const mail = $("#cfMail").value.trim();
    const subject = $("#cfSubject").value.trim();
    const body = $("#cfBody").value;
    if (!mail){ toast("Email requis","error"); return; }
    const clientUrl = `${CONFIG.links.clientForm}?token=${ctx.token}`;

    // Créer / mettre à jour l'entrée
    const cf = ctx.existing || {
      token: ctx.token, dossierId: d.id, numDossier: d.numDossier,
      createdAt: Date.now()
    };
    cf.status = "PENDING";
    cf.clientMail = mail;
    cf.sentAt = Date.now();
    cf.updatedAt = Date.now();
    cf.clientUrl = clientUrl;
    await fb.set(`/client_forms/${cf.token}`, cf);
    state.clientForms[cf.token] = cf;
    await fb.update(`/dossiers/${d.id}`, { clientFormToken:cf.token, clientFormStatus:"PENDING", updatedAt:Date.now() });

    // Envoi email via webhook Make
    try{
      await fetch(CONFIG.webhooks.email, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          type:"client_form_request",
          to: mail,
          subject,
          body,
          clientUrl,
          token: cf.token,
          dossierId: d.id,
          numDossier: d.numDossier,
          numColis: d.numColis||""
        })
      });
      toast("Email envoyé ✓","success");
    }catch(e){

  async importClientData(dossierId, token){
    const cf = state.clientForms[token]; if (!cf || !cf.data){ toast("Aucune donnée à importer","error"); return; }
    if (!confirm("Importer les infos du client dans le dossier ?\n(Les champs existants seront écrasés.)")) return;
    const d = state.dossiers[dossierId];
    const patch = {};
    const m = cf.data;
    if (m.nom)       patch.nom = m.nom;
    if (m.prenom)    patch.prenom = m.prenom;
    if (m.mail)      patch.mail = m.mail;
    if (m.telephone) patch.telephone = m.telephone;
    if (m.adresse)   patch.adresse = m.adresse;
    if (m.ville)     patch.ville = m.ville;
    if (m.numColis)  patch.numColis = m.numColis;
    if (m.origine)   patch.origine = m.origine;
    if (m.valeur)    patch.valeur = Number(m.valeur)||0;
    if (m.description) patch.notes = (d.notes?d.notes+"\n\n":"") + "Infos client : " + m.description;

    // Documents : ajouter aux docs du dossier
    if (m.docs && typeof m.docs === "object"){
      d.docs = d.docs || {};
      Object.entries(m.docs).forEach(([k,doc])=>{
        d.docs["client_"+k] = { url: doc.url, name: doc.name, uploadedAt: doc.uploadedAt||Date.now(), source:"client" };
      });
      patch.docs = d.docs;
    }
    patch.updatedAt = Date.now();
    await fb.update(`/dossiers/${d.id}`, patch);
    Object.assign(state.dossiers[d.id], patch);
    toast("Infos client importées ✓","success");
    this.renderTab(state.dossiers[d.id]);
  },

  copyToClipboard(text){
    navigator.clipboard.writeText(text).then(()=>toast("Copié dans le presse-papier","success")).catch(()=>toast("Impossible de copier","error"));

  labelForKey(k){

/* Helper pour format money dans jsPDF (sans symbole) */

/* ---------- Utils ---------- */
function $(s){return document.querySelector(s);}
function $$(s){return Array.from(document.querySelectorAll(s));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function num2(v){if(v==null||v==="")return 0;const n=Number(v);return isNaN(n)?0:n;}
function fmtEuro(n){if(!n)return"0 €";return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);}
function fmtDate(ts){ if(!ts)return"—"; const d=new Date(ts); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtDateLong(ts){ if(!ts)return"—"; const d=new Date(ts); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function fmtRelativeDate(ts){
  if (!ts) return "—";
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if (mins < 1) return "à l'instant";
  if (mins < 60) return `il y a ${mins} min`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `il y a ${hrs}h`;
  const days = Math.floor(hrs/24);
  if (days < 7) return `il y a ${days}j`;
  return fmtDate(ts);
}
function toast(msg,type="info"){const t=$("#toast");t.className="toast "+type+" show";t.textContent=msg;clearTimeout(toast._to);toast._to=setTimeout(()=>t.classList.remove("show"),3200);}
function fileToBase64(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=ko;r.readAsDataURL(f);});}
function setDeep(obj, path, value){
  let o = obj;
  for (let i=0;i<path.length-1;i++){ const k=path[i]; if (!o[k] || typeof o[k]!=="object") o[k]={}; o=o[k]; }
  if (value===null) delete o[path[path.length-1]]; else o[path[path.length-1]]=value;
}

/* Bridge snippet à coller dans TAF PERAC */
const BRIDGE_SNIPPET = `// ============================================================
// BRIDGE TAF PERAC ↔ TAF EXPRESS (Firebase shared namespace)
// À inclure dans TAF_PERAC.html
// ============================================================
const TAF_SHARED = {
  url: "https://taf-ops-default-rtdb.europe-west1.firebasedatabase.app/taf_shared",

  // --- Lire un dossier EXPRESS ---
  async getDossier(dossierId){
    const r = await fetch(\`\${this.url}/dossiers/\${dossierId}.json\`);
    return r.json();
  },

  // --- Lire la file des demandes de facturation ---
  async getQueue(){
    const r = await fetch(\`\${this.url}/facturation_queue.json\`);
    return r.json() || {};
  },

  // --- Écrire une facture (dossierId = clé) ---
  async writeFacture(dossierId, facture){
    // facture = { numFacture, numDossier, totalHT, totalTTC, totalTVA, status, emittedAt, pdfUrl, dueDate, ... }
    await fetch(\`\${this.url}/factures/\${dossierId}.json\`, {
      method:"PUT", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ ...facture, dossierId, emittedAt: facture.emittedAt || Date.now() })
    });
    // Enlever la demande de la queue
    await fetch(\`\${this.url}/facturation_queue/\${dossierId}.json\`, { method:"DELETE" });
    // Mettre à jour le dossier
    await fetch(\`\${this.url}/dossiers/\${dossierId}.json\`, {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ facturationRequested:false, factureNumero:facture.numFacture, updatedAt:Date.now() })
    });
  },

  // --- Marquer une facture comme payée ---
  async markPaid(dossierId){
    await fetch(\`\${this.url}/factures/\${dossierId}.json\`, {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ status:"PAYE", paye:true, paidAt:Date.now() })
    });
    await fetch(\`\${this.url}/dossiers/\${dossierId}.json\`, {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ status:"REGLE", facturePayee:true, reglementRecu:true, updatedAt:Date.now() })
    });
  },

  // --- Écoute temps réel de la queue (SSE) ---
  subscribeQueue(onChange){
    const es = new EventSource(\`\${this.url}/facturation_queue.json\`);
    es.addEventListener("put",   e => { try{ const d=JSON.parse(e.data); onChange("put",   d.path, d.data); }catch{} });
    es.addEventListener("patch", e => { try{ const d=JSON.parse(e.data); onChange("patch", d.path, d.data); }catch{} });
    return es;
  }
};
