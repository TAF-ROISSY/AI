<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF TV v4.1 — Hub Média</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--panel:#0c1220;--card:#111827;--card2:#1a2435;--cyan:#00d4ff;--cd:rgba(0,212,255,.15);--amber:#ffaa00;--ad:rgba(255,170,0,.15);--green:#00ff88;--gd:rgba(0,255,136,.15);--red:#ff3366;--rd:rgba(255,51,102,.15);--purple:#a78bfa;--pd:rgba(167,139,250,.15);--txt:#e8ecf4;--t2:#8892a4;--t3:#4a5568;--bd:rgba(255,255,255,.06);--bc:rgba(0,212,255,.2);--ui:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;--cols:2;--rows:2}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body *::-webkit-scrollbar{display:none}body *{-ms-overflow-style:none;scrollbar-width:none}
body{font-family:var(--ui);background:var(--bg);color:var(--txt)}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:9999}

/* TOP */
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--bd);z-index:100}
.logo{font-weight:800;font-size:22px;letter-spacing:2px;background:linear-gradient(135deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--t2);letter-spacing:3px;text-transform:uppercase}
.clock{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--cyan);letter-spacing:2px}
.dt{font-size:13px;color:var(--t2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pg 2s ease-in-out infinite}
@keyframes pg{0%,100%{box-shadow:0 0 4px var(--green);opacity:1}50%{box-shadow:0 0 12px var(--green);opacity:.6}}
.rtm{font-family:var(--mono);font-size:11px;color:var(--t3)}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--bc);background:transparent;color:var(--cyan);cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:500;transition:.2s}
.btn:hover{background:var(--cd)}.btn-on{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.btn-a{border-color:rgba(255,170,0,.3);color:var(--amber)}.btn-a:hover{background:var(--ad)}

/* LAYOUT */
.main{display:flex;height:calc(100vh - 56px)}
.side{width:360px;min-width:360px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:.4s;overflow:hidden}
.side.hide{width:0;min-width:0;opacity:0;pointer-events:none}
.side-h{padding:16px 20px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--t2);letter-spacing:2px;text-transform:uppercase}
.cat{flex:1;overflow-y:auto;padding:12px}
.cat::-webkit-scrollbar{width:4px}.cat::-webkit-scrollbar-thumb{background:var(--t3);border-radius:2px}

/* Sources */
.src-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.src-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:.2s}
.src-h:hover{background:var(--card2)}
.src-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.src-nm{font-size:14px;font-weight:600}.src-ds{font-size:10px;color:var(--t3);margin-top:2px}
.src-body{padding:0 16px 14px;display:none}
.src-card.open .src-body{display:block}
.field-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.field-row:last-child{border-bottom:none}
.field-cb{width:16px;height:16px;accent-color:var(--cyan)}
.field-nm{font-size:12px;flex:1}.field-tp{font-size:9px;color:var(--t3);font-family:var(--mono)}
.add-btn{width:100%;padding:10px;border-radius:8px;border:1px dashed var(--bc);background:transparent;color:var(--cyan);cursor:pointer;font-family:var(--ui);font-size:12px;font-weight:500;margin-top:8px;transition:.2s}
.add-btn:hover{background:var(--cd);border-style:solid}

/* Config widget */
.cfg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cfg-row label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;display:block}
.cfg-row select,.cfg-row input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-family:var(--ui);font-size:12px}

/* GRID */
.grid-area{flex:1;padding:16px;overflow:hidden;background:linear-gradient(rgba(0,212,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.02) 1px,transparent 1px);background-size:40px 40px}
.tv-grid{height:100%;display:grid;gap:14px;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr)}

/* WIDGET CARDS */
.wc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;display:flex;flex-direction:column;overflow:hidden;transition:.3s;animation:wi .5s ease-out}
@keyframes wi{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1}}
.wc:hover{border-color:var(--bc)}.wc.alert{border-color:var(--red);box-shadow:0 0 20px var(--rd)}
.wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wt{font-size:11px;font-weight:600;color:var(--t2);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.wa{display:flex;gap:4px;opacity:0;transition:.2s}.wc:hover .wa{opacity:1}
.wa-b{width:24px;height:24px;border-radius:4px;border:none;background:var(--panel);color:var(--t3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.2s}
.wa-b:hover{color:var(--cyan);background:var(--cd)}.wa-b.del:hover{color:var(--red);background:var(--rd)}
.wb{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.wm{font-family:var(--mono);font-weight:700;line-height:1}
.m-xl{font-size:48px}.m-lg{font-size:36px}.m-md{font-size:28px}
.ml{font-size:12px;color:var(--t3);margin-top:6px}
.mc{color:var(--cyan)}.ma{color:var(--amber)}.mg{color:var(--green)}.mr{color:var(--red)}.mp{color:var(--purple)}
.wl{list-style:none}.wl li{padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px;display:flex;align-items:center;justify-content:space-between}.wl li:last-child{border-bottom:none}
.sd{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
.sg{background:var(--green)}.sa{background:var(--amber)}.sr{background:var(--red)}.sc{background:var(--cyan)}
.tag{padding:2px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);font-weight:500}
.tc{background:var(--cd);color:var(--cyan)}.ta{background:var(--ad);color:var(--amber)}.tg{background:var(--gd);color:var(--green)}.tr{background:var(--rd);color:var(--red)}.tp{background:var(--pd);color:var(--purple)}
.ft{width:100%;border-collapse:collapse}.ft th{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:4px 6px;text-align:left;border-bottom:1px solid var(--bd)}.ft td{font-size:11px;padding:4px 6px;font-family:var(--mono);border-bottom:1px solid var(--bd)}.ft tr:last-child td{border-bottom:none}
.wld{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3);font-size:12px}
.spin{width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--cyan);border-radius:50%;animation:sp .8s linear infinite;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
.ge{border:2px dashed var(--bd);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:12px;cursor:pointer;transition:.3s}.ge:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.03)}
.plan-g{display:grid;grid-template-columns:80px repeat(5,1fr);gap:2px}.plan-h{text-align:center;font-size:10px;font-weight:600;padding:4px;border-radius:4px}.plan-c{text-align:center;padding:4px;border-radius:4px;font-size:9px;font-weight:600}
.cdots{display:flex;gap:6px;justify-content:center;margin-top:6px}.cdot{width:6px;height:6px;border-radius:50%;background:var(--t3);transition:.3s}.cdot.on{background:var(--cyan);width:18px;border-radius:3px}
.wsrc{font-size:9px;color:var(--t3);margin-top:6px;text-align:right;font-style:italic}
.ver{position:fixed;bottom:8px;right:12px;font-size:10px;color:var(--t3);font-family:var(--mono);z-index:9998}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--t3);border-radius:3px}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;align-items:center;gap:16px"><div><div class="logo">TAF TV</div><div class="logo-sub">Hub Média v3</div></div></div>
  <div style="display:flex;align-items:center;gap:24px"><div class="clock" id="clk">--:--:--</div><div class="dt" id="dt">--</div></div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="pulse" id="pls"></div><span class="rtm" id="rtm">30s</span>
    <button class="btn btn-a" id="bcfg" onclick="toggleCfg()">⚙ CONFIG</button>
    <button class="btn" onclick="refreshAll()">⟳ REFRESH</button>
  </div>
</div>
<div class="main">
  <div class="side hide" id="sidebar">
    <div class="side-h">📡 Sources de données</div>
    <div class="cat" id="catalog"></div>
    <div style="padding:12px;border-top:1px solid var(--bd)">
      <!-- Thèmes / Polices / Taille -->
      <div style="margin-bottom:10px">
        <label style="font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px">🎨 Thème</label>
        <select id="themeSelect" onchange="applyTheme(this.value);saveCfg()" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:12px"></select>
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px">🔤 Police</label>
        <select id="fontSelect" onchange="applyFont(this.value);saveCfg()" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:12px"></select>
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px">📐 Taille police</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="range" id="fontSizeRange" min="10" max="20" value="13" step="1" oninput="applyFontSize(this.value);document.getElementById('fontSizeVal').textContent=this.value+'px';saveCfg()" style="flex:1;accent-color:var(--cyan)">
          <span id="fontSizeVal" style="font-family:var(--mono);font-size:11px;color:var(--cyan);min-width:30px">13px</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label style="font-size:10px;color:var(--t2)">COL</label>
        <input type="number" min="1" max="6" value="2" id="gcols" onchange="updGrid()" style="width:46px;padding:5px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-family:var(--mono);font-size:12px">
        <label style="font-size:10px;color:var(--t2)">LIG</label>
        <input type="number" min="1" max="5" value="2" id="grows" onchange="updGrid()" style="width:46px;padding:5px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-family:var(--mono);font-size:12px">
        <label style="font-size:10px;color:var(--t2)">⏱</label>
        <select id="rint" onchange="countdown=+this.value" style="flex:1;padding:5px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-family:var(--mono);font-size:12px">
          <option value="30" selected>30s</option><option value="45">45s</option><option value="60">60s</option><option value="120">2m</option>
        </select>
      </div>
      <button class="btn" onclick="saveCfg()" style="width:100%">💾 Sauvegarder</button>
    </div>
  </div>
  <div class="grid-area"><div class="tv-grid" id="grid"></div></div>
</div>
<div class="ver">TAF TV v4.1</div>

<script>
/* ═══ FIREBASE ═══ */
const FB="https://taf-ops-default-rtdb.europe-west1.firebasedatabase.app";
async function fbGet(p){try{const r=await fetch(`${FB}/${p}.json`);return r.ok?await r.json():null}catch{return null}}

/* ═══ 20 THÈMES ═══ */
const THEMES={
  'midnight':     {n:'🌑 Midnight',      bg:'#060a14',panel:'#0c1220',card:'#111827',card2:'#1a2435',accent:'#00d4ff',accent2:'#00ff88',txt:'#e8ecf4',t2:'#8892a4',t3:'#4a5568',bd:'rgba(255,255,255,.06)'},
  'ocean':        {n:'🌊 Océan',         bg:'#0a1628',panel:'#0f1d35',card:'#132744',card2:'#1a3358',accent:'#00bcd4',accent2:'#26c6da',txt:'#e0f7fa',t2:'#80cbc4',t3:'#4db6ac',bd:'rgba(0,188,212,.1)'},
  'forest':       {n:'🌲 Forêt',         bg:'#0a1a0a',panel:'#0f250f',card:'#1a331a',card2:'#204020',accent:'#4caf50',accent2:'#81c784',txt:'#e8f5e9',t2:'#a5d6a7',t3:'#66bb6a',bd:'rgba(76,175,80,.1)'},
  'sunset':       {n:'🌅 Coucher Soleil', bg:'#1a0a0a',panel:'#251010',card:'#331a1a',card2:'#402020',accent:'#ff6b35',accent2:'#ffa726',txt:'#fff3e0',t2:'#ffcc80',t3:'#ff8a65',bd:'rgba(255,107,53,.1)'},
  'aurora':       {n:'🌌 Aurore',        bg:'#0a0a1a',panel:'#101025',card:'#1a1a33',card2:'#202040',accent:'#a78bfa',accent2:'#818cf8',txt:'#ede9fe',t2:'#c4b5fd',t3:'#8b5cf6',bd:'rgba(167,139,250,.1)'},
  'arctic':       {n:'❄️ Arctique',      bg:'#f0f4f8',panel:'#e2e8f0',card:'#ffffff',card2:'#f7fafc',accent:'#2563eb',accent2:'#3b82f6',txt:'#1e293b',t2:'#64748b',t3:'#94a3b8',bd:'rgba(0,0,0,.08)'},
  'sand':         {n:'🏜 Sable',         bg:'#faf5ef',panel:'#f0e6d3',card:'#ffffff',card2:'#faf5ef',accent:'#d97706',accent2:'#f59e0b',txt:'#292524',t2:'#78716c',t3:'#a8a29e',bd:'rgba(0,0,0,.06)'},
  'slate':        {n:'🪨 Ardoise',       bg:'#1e293b',panel:'#0f172a',card:'#334155',card2:'#3b4963',accent:'#38bdf8',accent2:'#7dd3fc',txt:'#e2e8f0',t2:'#94a3b8',t3:'#64748b',bd:'rgba(255,255,255,.08)'},
  'rose':         {n:'🌹 Rose',          bg:'#1a0a14',panel:'#250f1c',card:'#331a28',card2:'#402030',accent:'#ec4899',accent2:'#f472b6',txt:'#fce7f3',t2:'#f9a8d4',t3:'#ec4899',bd:'rgba(236,72,153,.1)'},
  'gold':         {n:'🏆 Or',            bg:'#1a1400',panel:'#252000',card:'#332c00',card2:'#403800',accent:'#eab308',accent2:'#facc15',txt:'#fefce8',t2:'#fde047',t3:'#ca8a04',bd:'rgba(234,179,8,.1)'},
  'cyber':        {n:'🤖 Cyberpunk',     bg:'#0d0221',panel:'#1a0533',card:'#290a4a',card2:'#350d5e',accent:'#f637ec',accent2:'#00f0ff',txt:'#e8e0ff',t2:'#c084fc',t3:'#7c3aed',bd:'rgba(246,55,236,.1)'},
  'nordic':       {n:'🧊 Nordic',        bg:'#0b1622',panel:'#101e30',card:'#17293e',card2:'#1e3450',accent:'#6ee7b7',accent2:'#a7f3d0',txt:'#d1fae5',t2:'#86efac',t3:'#4ade80',bd:'rgba(110,231,183,.08)'},
  'carbon':       {n:'⚫ Carbon',        bg:'#111111',panel:'#1a1a1a',card:'#222222',card2:'#2a2a2a',accent:'#e0e0e0',accent2:'#ffffff',txt:'#e0e0e0',t2:'#888888',t3:'#555555',bd:'rgba(255,255,255,.06)'},
  'matrix':       {n:'💻 Matrix',        bg:'#000a00',panel:'#001200',card:'#001a00',card2:'#002200',accent:'#00ff41',accent2:'#00cc33',txt:'#00ff41',t2:'#00cc33',t3:'#009922',bd:'rgba(0,255,65,.1)'},
  'ocean_light':  {n:'🐚 Océan Clair',   bg:'#f0fdfa',panel:'#ccfbf1',card:'#ffffff',card2:'#f0fdfa',accent:'#0d9488',accent2:'#14b8a6',txt:'#134e4a',t2:'#2dd4bf',t3:'#5eead4',bd:'rgba(0,0,0,.06)'},
  'blood':        {n:'🩸 Sang',          bg:'#1a0000',panel:'#250000',card:'#330000',card2:'#400000',accent:'#dc2626',accent2:'#ef4444',txt:'#fef2f2',t2:'#f87171',t3:'#b91c1c',bd:'rgba(220,38,38,.1)'},
  'terminal':     {n:'📟 Terminal',      bg:'#1e1e1e',panel:'#252526',card:'#2d2d30',card2:'#363639',accent:'#569cd6',accent2:'#4ec9b0',txt:'#d4d4d4',t2:'#808080',t3:'#666666',bd:'rgba(255,255,255,.06)'},
  'lavender':     {n:'💜 Lavande',       bg:'#faf5ff',panel:'#f3e8ff',card:'#ffffff',card2:'#faf5ff',accent:'#7c3aed',accent2:'#8b5cf6',txt:'#1e1b4b',t2:'#6d28d9',t3:'#a78bfa',bd:'rgba(0,0,0,.06)'},
  'taf_blue':     {n:'✈️ TAF Bleu',     bg:'#0a1628',panel:'#0e1f3d',card:'#132744',card2:'#1a3358',accent:'#2a9fff',accent2:'#60b0ff',txt:'#e8f0ff',t2:'#7eb8e0',t3:'#4a7090',bd:'rgba(42,159,255,.1)'},
  'neon':         {n:'🔮 Néon',          bg:'#0a0012',panel:'#12001f',card:'#1a002e',card2:'#22003d',accent:'#ff00ff',accent2:'#00ffff',txt:'#f0e6ff',t2:'#cc66ff',t3:'#9933ff',bd:'rgba(255,0,255,.1)'},
};

/* ═══ 20 POLICES (Google Fonts) ═══ */
const FONTS={
  'Outfit':        {n:'Outfit',         url:'Outfit:wght@300;400;500;600;700;800'},
  'Inter':         {n:'Inter',          url:'Inter:wght@300;400;500;600;700'},
  'Roboto':        {n:'Roboto',         url:'Roboto:wght@300;400;500;700'},
  'Poppins':       {n:'Poppins',        url:'Poppins:wght@300;400;500;600;700'},
  'Montserrat':    {n:'Montserrat',     url:'Montserrat:wght@300;400;500;600;700'},
  'Nunito':        {n:'Nunito',         url:'Nunito:wght@300;400;600;700'},
  'Raleway':       {n:'Raleway',        url:'Raleway:wght@300;400;500;600;700'},
  'OpenSans':      {n:'Open Sans',      url:'Open+Sans:wght@300;400;600;700'},
  'Lato':          {n:'Lato',           url:'Lato:wght@300;400;700'},
  'SourceSansPro': {n:'Source Sans 3',  url:'Source+Sans+3:wght@300;400;600;700'},
  'WorkSans':      {n:'Work Sans',      url:'Work+Sans:wght@300;400;500;600;700'},
  'DM_Sans':       {n:'DM Sans',        url:'DM+Sans:wght@400;500;700'},
  'Quicksand':     {n:'Quicksand',      url:'Quicksand:wght@300;400;500;600;700'},
  'Rubik':         {n:'Rubik',          url:'Rubik:wght@300;400;500;600;700'},
  'Manrope':       {n:'Manrope',        url:'Manrope:wght@300;400;500;600;700;800'},
  'Exo2':          {n:'Exo 2',          url:'Exo+2:wght@300;400;500;600;700'},
  'Rajdhani':      {n:'Rajdhani',       url:'Rajdhani:wght@300;400;500;600;700'},
  'Orbitron':      {n:'Orbitron',       url:'Orbitron:wght@400;500;600;700;800;900'},
  'ShareTechMono': {n:'Share Tech Mono',url:'Share+Tech+Mono'},
  'Oxanium':       {n:'Oxanium',        url:'Oxanium:wght@300;400;500;600;700'},
};

/* ═══ APPLY THEME / FONT / SIZE ═══ */
let curTheme='midnight', curFont='Outfit', curFontSize=13;

function applyTheme(id){
  const t=THEMES[id]||THEMES.midnight; curTheme=id;
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--panel',t.panel);
  r.setProperty('--card',t.card); r.setProperty('--card2',t.card2);
  r.setProperty('--cyan',t.accent); r.setProperty('--cd',t.accent+'22');

function addW(srcId, modId){
  const src=SOURCES.find(s=>s.id===srcId);
  const mod=src.modules.find(m=>m.id===modId);
  const checks=document.querySelectorAll(`#fields-${modId} .field-cb:checked`);
  const fields=Array.from(checks).map(cb=>cb.dataset.key);
  if(!fields.length){alert('Sélectionnez au moins un champ');return;}

  widgets.push({
    id:Date.now().toString(), srcId, modId,
    title:mod.name, icon:src.icon,
    fields, viz:document.getElementById(`viz-${modId}`).value,
    mode:document.getElementById(`mode-${modId}`).value,
    colSpan:+document.getElementById(`col-${modId}`).value,
    rowSpan:+document.getElementById(`row-${modId}`).value,
    color:document.getElementById(`clr-${modId}`).value,
    data:null, ci:0, srcName:src.name
  });
  renderGrid(); refreshW(widgets[widgets.length-1]); saveCfg();
}

/* ═══ RENDER DATA ═══ */
function tr(s,m){if(!s)return'—';s=String(s);return s.length>m?s.slice(0,m)+'…':s;}
function fmt(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}catch{return d}}
function fv(v){if(v===null||v===undefined)return'—';if(typeof v==='object'){if(Array.isArray(v))return v.join(', ');if(v.name)return v.name;return JSON.stringify(v)}return String(v)}

function renderData(w){
  const b=document.getElementById(`b-${w.id}`);if(!b)return;
  const d=w.data||[];
  if(w.mode==='carousel'&&d.length>4){renderCarousel(w,b,d);return;}
  switch(w.viz){
    case'metric':renderMetric(b,w,d);break;
    case'table':renderTable(b,w,d);break;
    case'list':renderList(b,w,d);break;
    case'bars':renderBars(b,w,d);break;
    case'planning':renderPlanning(b,w,d);break;
    case'vols_card':renderVolsCard(b,w,d);break;
    case'export_dashboard':renderExportDashboard(b,w,d);break;
    case'absences_semaine':renderAbsencesSemaine(b,w,d);break;
    default:renderTable(b,w,d);
  }
}

function renderMetric(b,w,d){
  const c=w.color||'cyan';
  const numF=w.fields.find(f=>d.some(r=>typeof r[f]==='number'));
  const val=numF?d.reduce((s,r)=>s+(parseFloat(r[numF])||0),0):d.length;
  b.innerHTML=`<div class="wm m-xl m${c[0]}">${typeof val==='number'&&numF?Math.round(val).toLocaleString('fr-FR'):d.length}</div><div class="ml">${numF||'enregistrements'}</div><div class="wsrc">${w.srcName}</div>`;
}

function renderTable(b,w,d){
  const cols=w.fields.slice(0,6);
  const rows=d.slice(0,12).map(r=>'<tr>'+cols.map(c=>`<td>${tr(fv(r[c]),18)}</td>`).join('')+'</tr>').join('');
  b.innerHTML=`<div style="overflow:hidden;flex:1"><table class="ft"><thead><tr>${cols.map(c=>`<th>${tr(c,12)}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--t3)">Aucune donnée</td></tr>'}</tbody></table></div><div class="wsrc">${w.srcName} • ${d.length} lignes</div>`;
}

function renderList(b,w,d){
  const f1=w.fields[0],f2=w.fields[1];
  const items=d.slice(0,10).map(r=>`<li><span><span class="sd s${(w.color||'c')[0]}"></span>${tr(fv(r[f1]),25)}</span>${f2?`<span class="tag t${(w.color||'c')[0]}">${tr(fv(r[f2]),15)}</span>`:''}</li>`).join('');
  b.innerHTML=`<div style="margin-bottom:8px"><span class="wm m-md m${(w.color||'c')[0]}">${d.length}</span> <span class="ml">${w.title}</span></div><ul class="wl">${items}</ul><div class="wsrc">${w.srcName}</div>`;
}

function renderBars(b,w,d){
  const f1=w.fields[0],c=w.color||'cyan';
  const counts={};d.forEach(r=>{const v=fv(r[f1])||'N/A';counts[v]=(counts[v]||0)+1});
  const bars=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>{
    const pct=Math.round(v/d.length*100);
    return`<div style="margin-bottom:5px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px"><span>${tr(k,20)}</span><span style="font-family:var(--mono);color:var(--${c})">${v}</span></div><div style="height:4px;background:var(--bd);border-radius:2px"><div style="height:100%;width:${pct}%;background:var(--${c});border-radius:2px"></div></div></div>`;
  }).join('');
  b.innerHTML=(bars||'<div class="ml">Aucune donnée</div>')+`<div class="wsrc">${w.srcName}</div>`;
}

/* ═══ RENDU VOLS — FORMAT TABLEAU AÉROPORT (10+ vols par page) ═══ */
let volsCarTimer=null;
function renderVolsCard(b,w,d){
  if(!d.length){b.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%"><div style="text-align:center;color:var(--t3)"><div style="font-size:64px;opacity:.3;margin-bottom:16px">✈️</div><div style="font-size:20px">Aucun vol suivi</div></div></div>';return;}

  /* Hauteur dispo — lignes compactes de 38px pour 10+ vols */
  const wEl=document.getElementById(`w-${w.id}`);
  const availH=wEl?wEl.offsetHeight-80:600;
  const rowH=38, counterH=44, legendH=30, headerH=24;
  const maxShow=Math.max(3,Math.floor((availH-counterH-legendH-headerH)/rowH));
  const totalPages=Math.ceil(d.length/maxShow);
  if(!w._carPage) w._carPage=0;
  const page=w._carPage % totalPages;
  const showVols=d.slice(page*maxShow,(page+1)*maxShow);

  /* Compteurs compacts */
  const onTime=d.filter(v=>{const dd=v.lastData;return dd&&!dd.error&&(dd.delayMin||0)<30}).length;
  const delayed=d.filter(v=>{const dd=v.lastData;return dd&&!dd.error&&(dd.delayMin||0)>=30}).length;
  const landed=d.filter(v=>v.lastData&&v.lastData.status==='Atterri').length;
  const alerts=d.filter(v=>v.alerts&&v.alerts.length>0).length;

  const counters=`<div style="display:flex;gap:6px;margin-bottom:6px;flex-shrink:0">
    <div style="flex:1;text-align:center;padding:4px;background:var(--card2);border-radius:6px;border:1px solid var(--bd)"><span style="font-family:var(--mono);font-weight:700;font-size:16px;color:var(--cyan)">${d.length}</span> <span style="font-size:8px;color:var(--t3)">VOLS</span></div>
    <div style="flex:1;text-align:center;padding:4px;background:var(--card2);border-radius:6px;border:1px solid var(--bd)"><span style="font-family:var(--mono);font-weight:700;font-size:16px;color:#1a7a3a">${onTime}</span> <span style="font-size:8px;color:var(--t3)">OK</span></div>
    <div style="flex:1;text-align:center;padding:4px;background:var(--card2);border-radius:6px;border:1px solid ${delayed?'#c06000':'var(--bd)'}"><span style="font-family:var(--mono);font-weight:700;font-size:16px;color:#c06000">${delayed}</span> <span style="font-size:8px;color:var(--t3)">RETARD</span></div>
    <div style="flex:1;text-align:center;padding:4px;background:var(--card2);border-radius:6px;border:1px solid var(--bd)"><span style="font-family:var(--mono);font-weight:700;font-size:16px;color:var(--t2)">${landed}</span> <span style="font-size:8px;color:var(--t3)">ATTERRIS</span></div>
    <div style="flex:1;text-align:center;padding:4px;background:var(--card2);border-radius:6px;border:1px solid ${alerts?'#c00020':'var(--bd)'}"><span style="font-family:var(--mono);font-weight:700;font-size:16px;color:#c00020">${alerts}</span> <span style="font-size:8px;color:var(--t3)">ALERTES</span></div>
  </div>`;

  /* En-tête tableau */
  const header=`<div style="display:grid;grid-template-columns:32px 80px 1fr 80px 80px 80px 100px 90px;gap:2px;padding:2px 6px;border-bottom:1px solid var(--bd);flex-shrink:0">
    <span></span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">VOL</span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">STATUT</span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">PRÉVUE</span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">RÉELLE</span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">RETARD</span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">TRAJET</span><span style="font-size:7px;color:var(--t3);letter-spacing:1px">MÀJ</span>
  </div>`;

  /* Lignes vols compactes */
  const rows=showVols.map(vol=>{
    const dd=vol.lastData||{};
    const level=dd.delayMin!=null?getDelayLevel(dd.delayMin):null;
    const statusCol=dd.status==='Atterri'?'#00c853':dd.status==='En route'?'#2a9fff':dd.status==='Annulé'?'#ff2020':'#8ab0d0';
    const borderCol=dd.delayMin!=null?(dd.delayMin<0?'#2a7fff':dd.delayMin===0?'#00c853':dd.delayMin<60?'#ff8c00':dd.delayMin<120?'#ff5500':'#ff0030'):'#1a3050';
    const logo=(()=>{const lg=getAirlineLogo(vol.flightNum);return lg?`<img src="${lg}" alt="" style="height:16px;max-width:30px;object-fit:contain">`:'✈';})();
    const retardVal=dd.delayMin!=null?(dd.delayMin===0?'0':dd.delayMin<0?dd.delayMin+'':'+'+dd.delayMin):'—';
    const retardCol=dd.delayMin!=null?(dd.delayMin<0?'#2a9fff':level?level.color:'#00c853'):'var(--t3)';
    const stBadge=dd.status?`<span style="font-size:8px;font-weight:700;font-family:var(--mono);color:${statusCol};background:${statusCol}15;padding:1px 5px;border-radius:3px;border:1px solid ${statusCol}35">${dd.status.toUpperCase()}</span>`:'';
    const dlBadge=level?`<span style="font-size:8px;font-weight:700;color:${level.color};background:${level.color}15;padding:1px 5px;border-radius:3px;border:1px solid ${level.color}40">${level.emoji}${dd.delayMin!==0?' '+(dd.delayMin>0?'+':'')+dd.delayMin+'min':''}</span>`:'';

    return`<div style="display:grid;grid-template-columns:32px 80px 1fr 80px 80px 80px 100px 90px;gap:2px;padding:3px 6px;border-left:3px solid ${borderCol};border-bottom:1px solid var(--bd);align-items:center">
      <div style="display:flex;align-items:center;justify-content:center;font-size:12px">${logo}</div>
      <div style="font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:1px">${vol.flightNum||'—'}</div>
      <div style="display:flex;gap:3px;align-items:center">${stBadge}${dlBadge}</div>
      <div style="font-family:var(--mono);font-size:12px;color:#c8d8e8">${vol.scheduledArr||fmtTimeParis(dd.schArr)}</div>
      <div style="font-family:var(--mono);font-size:12px;font-weight:600;color:${level&&level.code>0?level.color:'#00c853'}">${fmtTimeParis(dd.actArr||dd.estArr)}</div>
      <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:${retardCol}">${retardVal}</div>
      <div style="font-size:11px;color:#8ab0d0">${(vol.origin||dd.origin||'?')} → ${dd.dest||'CDG'}</div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--t3)">${vol.lastFetch?fmtDateTimeParis(vol.lastFetch):'—'}</div>
    </div>`;
  }).join('');

  /* Dots + légende */
  const dots=totalPages>1?'<div style="display:flex;gap:4px;justify-content:center">'+Array.from({length:totalPages},(_,i)=>`<div style="width:${i===page?'14px':'5px'};height:4px;border-radius:2px;background:${i===page?'var(--cyan)':'var(--t3)'};transition:.3s"></div>`).join('')+'</div>':'';
  const legend=`<div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-top:3px">
    <div style="display:flex;gap:3px"><span style="padding:1px 4px;border-radius:2px;font-size:7px;font-weight:600;background:#1a7a3a15;color:#1a7a3a;border:1px solid #1a7a3a30">✅ OK</span><span style="padding:1px 4px;border-radius:2px;font-size:7px;font-weight:600;background:#c0600015;color:#c06000;border:1px solid #c0600030">⚠️ +30</span><span style="padding:1px 4px;border-radius:2px;font-size:7px;font-weight:600;background:#b0400015;color:#b04000;border:1px solid #b0400030">🔶 +1h</span><span style="padding:1px 4px;border-radius:2px;font-size:7px;font-weight:600;background:#c0002015;color:#c00020;border:1px solid #c0002030">🚨 +2h</span></div>
    ${dots}
    <span style="font-size:8px;color:var(--t3)">${totalPages>1?'p.'+(page+1)+'/'+totalPages+' · ':''}TAF Suivi des Vols</span>
  </div>`;

  b.innerHTML=`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">${counters}${header}<div style="display:flex;flex-direction:column;flex:1;min-height:0">${rows}</div>${legend}</div>`;

  /* Auto-carrousel si plusieurs pages */
  if(totalPages>1){
    if(volsCarTimer) clearInterval(volsCarTimer);
    volsCarTimer=setInterval(()=>{w._carPage=((w._carPage||0)+1)%totalPages;renderVolsCard(b,w,d);},8000);
  }
}

/* ═══ DASHBOARD EXPORT — Déclarations en attente + temps moyen ═══ */
function renderExportDashboard(b,w,d){
  const dossiers=Array.isArray(d)?d:[];
  if(!dossiers.length){b.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3)">Aucun dossier export</div>';return;}

  const STATUTS_ARCHIVES=['Livré','Livré ✓','livré','À facturer','a_facturer','Terminé','Clôturé'];
  const actifs=dossiers.filter(x=>x&&!STATUTS_ARCHIVES.includes(x.statut));
  const enAttente=actifs.filter(x=>x.statut==='En attente'||x.statut==='Demande reçue'||x.statut==='Nouveau');
  const enCours=actifs.filter(x=>x.statut==='En cours'||x.statut==='Prise en charge'||x.statut==='BM reçu');
  const okDouane=actifs.filter(x=>x.statut==='OK douane');

  /* Temps moyen de prise en charge (created_at → updated_at pour les dossiers traités) */
  let tempsMoyenMin=0,nbAvecTemps=0;
  dossiers.forEach(x=>{
    if(x.created_at&&x.updated_at&&x.statut!=='En attente'&&x.statut!=='Demande reçue'){
      const diff=(new Date(x.updated_at)-new Date(x.created_at))/60000;
      if(diff>0&&diff<10000){tempsMoyenMin+=diff;nbAvecTemps++;}
    }
  });
  const moy=nbAvecTemps>0?Math.round(tempsMoyenMin/nbAvecTemps):0;
  const moyH=Math.floor(moy/60);const moyM=moy%60;
  const moyTxt=moyH>0?moyH+'h'+String(moyM).padStart(2,'0'):moyM+'min';

  /* Compteurs par statut */
  const statCounts={};actifs.forEach(x=>{const s=x.statut||'Autre';statCounts[s]=(statCounts[s]||0)+1;});

  const counters=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
    <div style="text-align:center;padding:12px;background:var(--card2);border-radius:8px;border:1px solid ${enAttente.length?'#ff880040':'var(--bd)'}"><div style="font-family:var(--mono);font-weight:800;font-size:28px;color:#ff8800">${enAttente.length}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">EN ATTENTE</div></div>
    <div style="text-align:center;padding:12px;background:var(--card2);border-radius:8px;border:1px solid var(--bd)"><div style="font-family:var(--mono);font-weight:800;font-size:28px;color:var(--cyan)">${enCours.length}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">EN COURS</div></div>
    <div style="text-align:center;padding:12px;background:var(--card2);border-radius:8px;border:1px solid var(--bd)"><div style="font-family:var(--mono);font-weight:800;font-size:28px;color:var(--green)">${okDouane.length}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">OK DOUANE</div></div>
  </div>`;

  const tempsWidget=`<div style="text-align:center;padding:10px;background:var(--card2);border-radius:8px;border:1px solid var(--bd);margin-bottom:12px"><div style="font-size:10px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">⏱ Temps moyen de prise en charge</div><div style="font-family:var(--mono);font-weight:800;font-size:24px;color:${moy>120?'#ff3366':moy>60?'#ff8800':'var(--green)'}">${nbAvecTemps?moyTxt:'—'}</div>${nbAvecTemps?'<div style="font-size:9px;color:var(--t3);margin-top:2px">sur '+nbAvecTemps+' dossier(s)</div>':''}</div>`;

  /* Liste des dossiers en attente */
  const liste=enAttente.slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--txt)">${tr(x.client||'—',20)}</span><span style="font-family:var(--mono);color:var(--t3)">${x.lta||x.ref||'—'}</span></div>`).join('');

  b.innerHTML=`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">${counters}${tempsWidget}<div style="flex:1;overflow:hidden">${enAttente.length?'<div style="font-size:10px;color:var(--t2);margin-bottom:4px;font-weight:600">Dossiers en attente :</div>'+liste:'<div style="text-align:center;color:var(--green);font-size:12px;margin-top:8px">✅ Aucun dossier en attente</div>'}</div><div style="font-size:9px;color:var(--t3);text-align:right;margin-top:4px">TAF OPS • ${dossiers.length} export(s) total</div></div>`;
}

/* ═══ ABSENCES SEMAINE — Qui est en CP/RTT cette semaine ═══ */
function renderAbsencesSemaine(b,w,d){
  const data=d||{};const collabs=data.collabs||[];const demandes=data.demandes||[];
  if(!collabs.length){b.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3)">Aucun collaborateur</div>';return;}

  const today=new Date();const dow=today.getDay();
  const monday=new Date(today);monday.setDate(today.getDate()-(dow===0?6:dow-1));monday.setHours(0,0,0,0);
  const friday=new Date(monday);friday.setDate(monday.getDate()+4);friday.setHours(23,59,59);
  const jours=['LUN','MAR','MER','JEU','VEN'];
  const validDemandes=demandes.filter(d=>d&&d.statut==='Validée');

  /* Trouver les absents de la semaine */
  const absWeek=[];
  const collabArr=Array.isArray(collabs)?collabs:Object.values(collabs);
  collabArr.filter(Boolean).forEach(c=>{
    const jourAbs=[];
    jours.forEach((_,i)=>{
      const cellDate=new Date(monday);cellDate.setDate(monday.getDate()+i);
      const cds=cellDate.toISOString().slice(0,10);
      const abs=validDemandes.find(d=>d.collaborateurId===c.id&&d.dateDebut<=cds&&d.dateFin>=cds);
      jourAbs.push(abs||null);
    });
    absWeek.push({collab:c,jours:jourAbs,hasAbs:jourAbs.some(j=>j!==null)});
  });

  const presents=absWeek.filter(a=>!a.hasAbs).length;
  const absents=absWeek.filter(a=>a.hasAbs);

  /* Header */
  const header=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><span style="font-family:var(--mono);font-weight:700;font-size:22px;color:var(--green)">${presents}/${collabArr.length}</span><span style="font-size:12px;color:var(--t2)">présents cette semaine</span></div>`;

  /* Grille planning */
  const gHeader=`<div style="display:grid;grid-template-columns:100px repeat(5,1fr);gap:2px;margin-bottom:2px">${[''].concat(jours.map((j,i)=>{const dd=new Date(monday);dd.setDate(monday.getDate()+i);const isT=dd.toDateString()===today.toDateString();return j+' '+dd.getDate();})).map((t,i)=>`<div style="text-align:${i?'center':'left'};font-size:9px;font-weight:600;padding:3px;border-radius:3px;${i&&t.includes(today.getDate())?'background:var(--cd);color:var(--cyan)':'color:var(--t3)'}">${t}</div>`).join('')}</div>`;

  const cm={CP:'var(--cyan)',RTT:'var(--purple)',Maladie:'var(--red)',Formation:'var(--green)'};
  const rows=absWeek.map(a=>{
    const cols=a.jours.map(abs=>{
      if(!abs) return`<div style="text-align:center;padding:3px;border-radius:3px;background:rgba(0,255,136,.06);color:var(--green);font-size:9px;font-weight:600">✓</div>`;
      const co=cm[abs.type]||'var(--amber)';
      return`<div style="text-align:center;padding:3px;border-radius:3px;background:${co}18;border:1px solid ${co}30;color:${co};font-size:9px;font-weight:700">${abs.type||'ABS'}</div>`;
    }).join('');
    return`<div style="display:grid;grid-template-columns:100px repeat(5,1fr);gap:2px;margin-bottom:1px"><div style="font-size:11px;font-weight:500;padding:3px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:${a.hasAbs?'var(--amber)':'var(--txt)'}">${a.hasAbs?'🏖 ':''}${a.collab.prenom||a.collab.nom||'—'}</div>${cols}</div>`;
  }).join('');

  /* Résumé absents si il y en a */
  const resume=absents.length?`<div style="margin-top:8px;padding:6px 8px;background:rgba(255,170,0,.08);border:1px solid rgba(255,170,0,.15);border-radius:6px"><div style="font-size:10px;font-weight:600;color:var(--amber);margin-bottom:4px">🏖 ${absents.length} absence(s) cette semaine :</div>${absents.map(a=>{const types=[...new Set(a.jours.filter(Boolean).map(j=>j.type))].join(', ');return`<div style="font-size:11px;color:var(--txt);padding:1px 0">${a.collab.prenom||''} ${a.collab.nom||''} — <span style="color:var(--amber)">${types}</span></div>`;}).join('')}</div>`:'<div style="margin-top:8px;text-align:center;color:var(--green);font-size:12px">✅ Toute l\'équipe présente cette semaine</div>';

  b.innerHTML=`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">${header}${gHeader}<div style="flex:1;overflow:hidden">${rows}</div>${resume}<div style="font-size:9px;color:var(--t3);text-align:right;margin-top:4px">TAF CP-RTT</div></div>`;
}

function renderPlanning(b,w,d){
  /* Planning semaine — spécifique CP/RTT */
  const today=new Date(),dow=today.getDay();
  const monday=new Date(today);monday.setDate(today.getDate()-(dow===0?6:dow-1));monday.setHours(0,0,0,0);
  const jours=['LUN','MAR','MER','JEU','VEN'];

  if(w.modId==='collabs'){
    /* Planning avec collabs + demandes */
    const header=`<div class="plan-g"><div></div>${jours.map((j,i)=>{const dd=new Date(monday);dd.setDate(monday.getDate()+i);const isT=dd.toDateString()===today.toDateString();return`<div class="plan-h" style="${isT?'background:var(--cd);color:var(--cyan)':'color:var(--t3)'}">${j} ${dd.getDate()}</div>`}).join('')}</div>`;
    const rows=d.map(c=>`<div class="plan-g"><div style="font-size:11px;font-weight:500;padding:4px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${c.prenom||c.nom||'—'}</div>${jours.map(()=>`<div class="plan-c" style="background:var(--gd);color:var(--green)">OK</div>`).join('')}</div>`).join('');
    b.innerHTML=`<div style="margin-bottom:8px"><span class="wm m-md mg">${d.length}</span> <span class="ml">collaborateurs</span></div>${header}${rows}<div class="wsrc">${w.srcName}</div>`;
  } else {
    renderTable(b,w,d);
  }
}

function renderCarousel(w,b,d){
  const ps=4,pages=[];for(let i=0;i<d.length;i+=ps)pages.push(d.slice(i,i+ps));
  w.ci=w.ci%pages.length;
  const tmp={...w,mode:'fixed',data:pages[w.ci]};renderData(tmp);
  const inner=document.getElementById(`b-${w.id}`).innerHTML;
  const dots='<div class="cdots">'+pages.map((_,i)=>`<div class="cdot ${i===w.ci?'on':''}"></div>`).join('')+'</div>';
  document.getElementById(`b-${w.id}`).innerHTML=inner+dots;
  if(carI[w.id])clearInterval(carI[w.id]);
  carI[w.id]=setInterval(()=>{w.ci=(w.ci+1)%pages.length;const bd=document.getElementById(`b-${w.id}`);if(bd)renderCarousel(w,bd,d)},6000);
}

/* ═══ CONFIG ═══ */
function toggleCfg(){document.getElementById('sidebar').classList.toggle('hide');document.getElementById('bcfg').classList.toggle('btn-on')}
function updGrid(){document.documentElement.style.setProperty('--cols',document.getElementById('gcols').value);document.documentElement.style.setProperty('--rows',document.getElementById('grows').value);saveCfg()}

function saveCfg(){
  const cfg={widgets:widgets.map(w=>({id:w.id,srcId:w.srcId,modId:w.modId,title:w.title,icon:w.icon,fields:w.fields,viz:w.viz,mode:w.mode,colSpan:w.colSpan,rowSpan:w.rowSpan,color:w.color,srcName:w.srcName})),cols:+document.getElementById('gcols').value,rows:+document.getElementById('grows').value,rint:+document.getElementById('rint').value,theme:curTheme,font:curFont,fontSize:curFontSize};
  localStorage.setItem('TAF_TV_CFG',JSON.stringify(cfg));
}

function loadCfg(){
  const s=localStorage.getItem('TAF_TV_CFG');if(!s)return;
  try{
    const c=JSON.parse(s);
    widgets=(c.widgets||[]).map(w=>({...w,data:null,ci:0}));
    if(c.cols){document.getElementById('gcols').value=c.cols;document.documentElement.style.setProperty('--cols',c.cols)}
    if(c.rows){document.getElementById('grows').value=c.rows;document.documentElement.style.setProperty('--rows',c.rows)}
    if(c.rint){document.getElementById('rint').value=c.rint;countdown=c.rint}
    if(c.theme){applyTheme(c.theme);document.getElementById('themeSelect').value=c.theme}
    if(c.font){applyFont(c.font);document.getElementById('fontSelect').value=c.font}
    if(c.fontSize){applyFontSize(c.fontSize);document.getElementById('fontSizeRange').value=c.fontSize;document.getElementById('fontSizeVal').textContent=c.fontSize+'px'}
    renderGrid();refreshAll();
  }catch(e){console.error(e)}
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select'))return;
  if(e.key==='c')toggleCfg();
  if(e.key==='r')refreshAll();
  if(e.key==='f'||e.key==='F11'){e.preventDefault();if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
});

/* ═══ REFRESH QUOTIDIEN 06h30 ═══ */
let lastDailyRefresh = '';
function checkDailyRefresh() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const today = now.toDateString();
  if (h === 6 && m === 30 && lastDailyRefresh !== today) {
    lastDailyRefresh = today;
    console.log('🔄 Refresh quotidien 06h30 déclenché');
    refreshAll();
    // Recharger la page pour forcer la synchro complète
    setTimeout(() => location.reload(), 5000);
  }
}

/* ═══ INIT ═══ */
updClock();setInterval(updClock,1000);
initThemeUI();
renderCatalog();
loadCfg();
renderGrid();
setInterval(()=>{countdown--;document.getElementById('rtm').textContent=`${countdown}s`;if(countdown<=0)refreshAll()},1000);
setInterval(checkDailyRefresh, 30000); // Vérifie toutes les 30 secondes
if(!widgets.length)refreshAll();
</script>
</body>
