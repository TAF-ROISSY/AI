  let headers={Authorization:'Bearer '+S.token};
  if(body&&!(body instanceof FormData))headers['Content-Type']='application/json';
  const protectedPost=method==='POST'&&(safePosts.has(path)||/^transfers\/[^/]+\/(dispatch|receive|discrepancy-review|refuse|refusal-decision)$/.test(path)||/^transfer-refusals\/[^/]+\/review$/.test(path)||/^releases\/[^/]+\/complete$/.test(path)||path==='inventory-campaigns'||/^inventory-campaigns\/[^/]+\/count$/.test(path)||path==='release-orders'||/^release-orders\/[^/]+\/complete$/.test(path)||/^counts\/[^/]+\/review$/.test(path))&&body&&!(body instanceof FormData);
  const pending=protectedPost?await idempotentKey(path,body):null;
  if(pending)headers['Idempotency-Key']=pending.key;
  let r;
  try{r=await fetch('/api/'+path,{method,headers,body:body?(body instanceof FormData?body:JSON.stringify(body)):undefined})}
  catch(e){throw Error('Connexion interrompue : opération non confirmée. Réessayez avec les mêmes informations ; la protection anti-doublon conservera la référence.')}
  if(!r.ok){let e=await r.json().catch(()=>({detail:r.statusText}));
    if(pending&&r.status>=400&&r.status<500)sessionStorage.removeItem(pending.slot);
    throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}
  if(pending)sessionStorage.removeItem(pending.slot);
  return r.headers.get('content-type')?.includes('json')?r.json():r.blob();
}

let chip=([state,lab,mgr,auto])=>{let [bg,,,bd]=PLAN_COLORS[state],on=B&&B.state===state,n=pl.summary[state]||0,dis=auto||(mgr&&!office)||(state==='booked'&&!office);
return `<button class="ghost" ${dis?`disabled title="${auto?'Automatique : vient des ordres de sortie et des blocages des dossiers':'Réservé au responsable'}"`:`onclick="pickBrush('${state}')"`} style="display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;background:${on?'#0B2238':'#fff'};color:${on?'#fff':'#142233'};border:1.5px solid ${on?'#0B2238':'#D3DDE7'};${dis?'opacity:.75;cursor:default':''}"><i style="width:18px;height:18px;border-radius:5px;background:${bg};border:2px solid ${bd}"></i>${lab} <span style="opacity:.7">(${n})</span>${auto?'<span style="font-size:11px;opacity:.7"> auto</span>':''}</button>`};

legend='';
let sel=S.planSel,racks=pl.racks.map(r=>`<section class="panel" style="margin:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0;font-size:18px">${esc(r.label||r.rack)}</h3><span class="small">${r.levels.reduce((n,lv)=>n+lv.cells.filter(c=>c.units).length,0)} / ${r.levels.reduce((n,lv)=>n+lv.cells.length,0)} occupés</span><span style="margin-left:auto" class="actions">${r.kind!=='temp'?(B&&BRUSH_STATUS[B.state]?`<button onclick="brushRack('${esc(r.rack)}')">Tout le rack</button>`:btn('rackStatus',r.rack,'Statut du rack')):''}${btn('signs',r.rack,'Panneaux')}${['superadmin','admin','manager'].includes(S.me.role)&&r.kind!=='temp'?btn('removeStructure',r.rack,'Retirer'):''}</span></div>${r.levels.map(lv=>`<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><span class="small" style="width:56px;font-weight:600">${esc(r.kind==='rack'?'Étage '+lv.level:r.kind==='shelf'?'Niveau '+lv.level:r.kind==='floor'?'Allée '+lv.level:'')}</span>${lv.cells.map(c=>{let [bg,fg,,bd]=PLAN_COLORS[c.state];return `<button class="cellbtn" aria-label="${esc(c.id)} · ${esc(PLAN_COLORS[c.state][2])}" title="${esc(c.id)}" onclick="cellClick('${esc(c.id)}')" style="background:${bg};color:${fg};border:1.5px solid ${bd};${sel===c.id?'box-shadow:0 0 0 3px #fff,0 0 0 6px #0B2238':''}">${esc(c.id.split('-').pop())}</button>`}).join('')}</div>`).join('')}</section>`).join('');
let detail=locDetailView();
return `<div class="panel" style="background:transparent;border:0;padding:0"><div class="top" style="margin-bottom:10px"><h2 style="margin:0">Plan des zones — ${esc(wh)}</h2><div class="actions">${['superadmin','admin','manager'].includes(S.me.role)?btn('removeAll',wh,'Supprimer en bloc…'):''}<button class="ghost" onclick="S.plan=null;S.loc=null;render()">Actualiser</button></div></div><div style="margin:6px 0 12px">${legend}</div>${palette}<div class="cols"><div class="main" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px">${racks}</div>${detail}</div></div>`}
async function openLoc(id){S.planSel=id;S.loc=null;render();try{S.loc=await api('locations/'+encodeURIComponent(id)+'/detail')}catch(e){toast(e.message,true)}render()}
const LOC_ST={ok:'En service',reserve:'Réservé',inspection:'À inspecter',endommage:'Endommagé',maintenance:'En maintenance',ferme:'Emplacement fermé'};
function locDetailView(){if(!S.planSel)return `<aside class="panel" style="margin:0;flex:1 1 320px;min-width:0"><p class="small" style="font-size:14px">Touchez un emplacement pour voir son contenu, déclarer une occupation ou changer son statut.</p></aside>`;
let d=S.loc;if(!d||d.location.id!==S.planSel)return `<aside class="panel" style="margin:0;flex:1 1 320px;min-width:0"><p class="small">Chargement…</p></aside>`;
let l=d.location,office=['superadmin','admin','manager'].includes(S.me.role),st=l.status||'ok',bad=['endommage','maintenance','inspection'].includes(st);
let lab=u=>`${(u.unit_type||'unité').replace(/^./,c=>c.toUpperCase())}${u.unit_index?` ${u.unit_index}/${u.unit_count}`:''}`;
let cap=l.capacity_kg?`<div class="small" style="font-size:14px">Capacité : ${fmt1(l.capacity_kg)} kg · ${fmt1(l.capacity_m3)} m³ ${l.verified?'(validée)':'(à valider)'}</div>`:`<div class="small" style="font-size:14px">Capacité non saisie : rangement impossible.${office?' '+btn('capacity',l.id,'Saisir la capacité'):''}</div>`;
let status=`<div style="background:${bad?'#FDE7E4':'#EEF2F6'};border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px"><b style="font-size:14px;color:#142233">Statut de l’emplacement : <span style="color:${bad?'#A3231A':'#1B6B3E'}">${esc(LOC_ST[st]||st)}</span></b>${l.status_note?`<span class="small" style="font-size:13px">${esc(l.status_note)} — ${esc(l.status_by||'')} ${esc((l.status_at||'').slice(0,16).replace('T',' '))}</span>`:''}<div class="actions">${Object.entries(LOC_ST).filter(([k])=>k!==st&&(office||!['ok','reserve','ferme'].includes(k))).map(([k,v])=>{let [bg,,,bd]=PLAN_COLORS[{ok:'free',reserve:'booked',ferme:'blocked'}[k]||k];return `<button class="ghost" style="display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #D3DDE7" onclick="setLocStatus('${esc(l.id)}','${k}')"><i style="width:16px;height:16px;border-radius:4px;background:${bg};border:2px solid ${bd}"></i>${v}</button>`}).join('')}</div></div>`;
let content=d.units.length?`<b style="font-size:14px;color:#4A5D70">Occupé par (${d.units.length})</b>`+d.units.map(u=>`<button class="m-item" style="padding:12px;background:#EEF5FB;border:0" onclick="openDossier('${esc(u.receipt_id||'')}')"><div><b>${esc(u.receipt_id||'—')} · ${esc(lab(u))}</b><small>${esc(u.client||'')}${u.awb?' · LTA '+esc(u.awb):''} · ${u.quantity} colis · ${fmt1(u.weight)} kg${u.hold?' · bloquée':''}</small></div><span class="small">Ouvrir le dossier ›</span></button>`).join(''):'';
let internal=d.internal?`<div style="background:#E9DDF7;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px"><b style="color:#4C2A85">Stockage interne TAF</b><span><b>${esc(d.internal.description)}</b></span>${d.internal.quantity?`<span class="small" style="font-size:13px">Quantité : ${esc(d.internal.quantity)}</span>`:''}${d.internal.service?`<span class="small" style="font-size:13px">Service : ${esc(d.internal.service)}${d.internal.contact?' · '+esc(d.internal.contact):''}</span>`:''}<span class="small" style="font-size:13px">Depuis le ${esc((d.internal.since||'').slice(0,10).split('-').reverse().join('/'))}${d.internal.until?' · jusqu’au '+esc(d.internal.until.split('-').reverse().join('/')):''} · déclaré par ${esc(d.internal.created_by)}</span>${d.internal.notes?`<span class="small" style="font-size:13px">${esc(d.internal.notes)}</span>`:''}<div class="actions">${btn('internalEdit',l.id,'Modifier')}${btn('internalRelease',l.id,'Libérer l’emplacement')}</div></div>`:'';
let empty=!d.units.length&&!d.internal;
let actions=empty?`<b style="font-size:14px;color:#4A5D70">Emplacement libre</b><label style="min-width:0">Ranger ici une unité<select id="loc-unit"><option value="">Choisir une palette ou un colis…</option>${d.candidates.map(u=>`<option value="${esc(u.id)}|${u.version}">${esc(u.receipt_id||'')} · ${esc(lab(u))} · ${u.quantity} colis${u.status==='awaiting_putaway'?' · à ranger':' · '+esc(u.location_id||'')}</option>`).join('')}</select></label><div class="actions"><button onclick="putHere('${esc(l.id)}')" ${bad?'disabled':''}>Ranger ici</button>${btn('internalEdit',l.id,'Stockage interne TAF…')}</div>`:'';
let hist=d.history.length?`<details><summary class="small" style="font-size:13px">Historique de l’emplacement (${d.history.length})</summary>${d.history.map(h=>`<div class="small" style="padding:4px 0;border-bottom:1px solid #e3e9ef">${esc(h.at.slice(0,16).replace('T',' '))} · ${esc(h.actor)} · ${esc({location_status:'statut → '+(LOC_ST[h.details.to]||h.details.to)+(h.details.note?' ('+h.details.note+')':''),internal_declare:'stockage interne : '+(h.details.description||''),internal_update:'stockage interne modifié',internal_release:'stockage interne libéré',capacity_update:'capacité mise à jour'}[h.action]||h.action)}</div>`).join('')}</details>`:'';
return `<aside class="panel" style="margin:0;flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span class="tag p">EMPLACEMENT</span><button class="ghost" style="margin-left:auto;min-height:36px;padding:4px 10px" aria-label="Fermer" onclick="S.planSel=null;S.loc=null;render()">✕</button></div><div><div class="disp" style="font-size:32px;font-weight:700">${esc(l.id)}</div><span class="small" style="font-size:14px">${esc(l.zone||'')}</span></div>${cap}${status}${content}${internal}${actions}<div class="actions">${btn('signsOne',l.id,'Imprimer le panneau')}</div>${hist}</aside>`}
const BRUSH_STATUS={free:'ok',booked:'reserve',inspection:'inspection',endommage:'endommage',maintenance:'maintenance',blocked:'ferme'};
async function pickBrush(state){if(S.brush&&S.brush.state===state){S.brush=null;return render()}let note='';
if(['inspection','endommage','maintenance','blocked'].includes(state)){let r=await promptForm((state==='blocked'?'Fermeture':'Constat')+' — appliqué à chaque emplacement cliqué',[F('note',state==='blocked'?'Motif de fermeture':'Constat')]);if(!r)return;note=r.note}
if(state==='internal'){let r=await promptForm('Stockage interne TAF — contenu',[F('note','Contenu (matériel, consommables, archives…)')]);if(!r)return;note=r.note}
S.brush={state,note};render()}
function planCell(id){let out=null;(S.plan?.racks||[]).forEach(r=>r.levels.forEach(lv=>lv.cells.forEach(c=>{if(c.id===id)out=c})));return out}
async function cellClick(id){let B=S.brush;if(!B)return openLoc(id);let c=planCell(id)||{};
try{if(B.state==='occupied'){S.brush=null;await openLoc(id);return toast('Choisissez la palette ou le colis à ranger ici, ou déclarez un stockage interne')}
if(B.state==='unverified'){S.brush=null;render();return act('capacity',id)}
if(B.state==='internal'){if(c.units)return toast(id+' contient de la marchandise',true);await api('locations/'+encodeURIComponent(id)+'/internal','POST',{description:B.note});toast(id+' → stockage interne TAF')}
else if(B.state==='free'){if(c.units)return toast(id+' contient de la marchandise : faites d’abord la sortie ou le déplacement',true);if(c.internal)await api('locations/'+encodeURIComponent(id)+'/internal/release','POST',{note:'Libéré depuis le plan'});if((c.status||'ok')!=='ok')await api('locations/'+encodeURIComponent(id)+'/status','PUT',{status:'ok',note:'Remis en service depuis le plan'});toast(c.verified?id+' → libre':id+' : en service, mais capacité à valider avant tout rangement')}
else{await api('locations/'+encodeURIComponent(id)+'/status','PUT',{status:BRUSH_STATUS[B.state],note:B.note});toast(id+' → '+LOC_ST[BRUSH_STATUS[B.state]])}
S.plan=null;if(S.planSel===id)S.loc=null;render()}catch(e){toast(e.message,true);S.plan=null;render()}}
async function brushRack(rack){let st=BRUSH_STATUS[S.brush.state];if(!confirm('Passer tout le rack '+rack+' en « '+LOC_ST[st]+' » ?'))return;try{let r=await api('locations/structure-status','POST',{warehouse:S.plan.warehouse,structure:rack,status:st,note:S.brush.note||(st==='ok'?'Remis en service depuis le plan':'')});toast(`${rack} : ${r.updated} emplacement(s) → ${LOC_ST[st]}`);S.plan=null;S.loc=null;render()}catch(e){toast(e.message,true)}}
async function setLocStatus(id,st){let note='';if(!['ok','reserve'].includes(st)){let r=await promptForm('Emplacement '+id+' : '+LOC_ST[st],[F('note','Constat (obligatoire)')]);if(!r)return;note=r.note}else{let r=await promptForm('Emplacement '+id+' : '+LOC_ST[st],[F('note','Commentaire','', 'text',false)]);if(!r)return;note=r.note}try{await api('locations/'+encodeURIComponent(id)+'/status','PUT',{status:st,note});toast('Statut enregistré');S.plan=null;openLoc(id)}catch(e){toast(e.message,true)}}
async function putHere(id){let v=($('loc-unit')||{}).value;if(!v)return toast('Choisissez une unité',true);let [unit,ver]=v.split('|');try{await api('move','POST',{unit_id:unit,destination:id,expected_version:+ver,reason:'Rangement depuis le plan'});toast('Unité rangée en '+id);S.plan=null;refresh();openLoc(id)}catch(e){toast(e.message,true)}}
function genView(){if(!['superadmin','admin','manager'].includes(S.me.role))return '';let wh=S.warehouse&&S.warehouse!=='all'?S.warehouse:(S.me.warehouses||[])[0];
let f=(k,html)=>`<label data-k="${k}" ${k.split(' ').includes('rack')?'':'hidden'}>${html}</label>`;
return `<div class="panel"><h3 style="margin-top:0">Créer une zone de stockage — ${esc(wh)}</h3><p class="small">Le système numérote automatiquement : rack <b>AFR-G-2-05</b> (rack G, étage 2, emplacement 5) · sol <b>AFR-SOL-A-03</b> (allée A, case 3) · étagère <b>AFR-ET1-2-03</b> (étagère 1, niveau 2, place 3) · coffre <b>AFR-COFFRE</b>. Pour créer plusieurs racks d’un coup, indiquez leurs lettres (ex. A, B, C, D).</p>

${f('rack floor','<span data-k="rack">Racks (lettres, séparées par une virgule)</span><span data-k="floor" hidden>Allées au sol</span><input name="names" value="G, D" placeholder="G, D">')}
${f('shelf','Nombre d’étagères<input name="count" type="number" min="1" max="26" value="3">')}${f('shelf','Numéro de la première<input name="start" type="number" min="1" max="99" value="1">')}
${f('rack shelf','<span data-k="rack">Nombre d’étages</span><span data-k="shelf" hidden>Niveaux par étagère</span><input name="levels" type="number" min="1" max="9" value="3">')}
${f('rack floor shelf vault','<span data-k="rack">Emplacements par étage</span><span data-k="floor" hidden>Cases par allée</span><span data-k="shelf" hidden>Places par niveau</span><span data-k="vault" hidden>Compartiments (1 = coffre unique)</span><input name="positions" type="number" min="1" max="99" value="8">')}
<label>Charge max par emplacement (kg)<input name="capacity_kg" type="number" step="any" min="0" placeholder="facultatif"></label><label>Volume max (m³)<input name="capacity_m3" type="number" step="any" min="0" placeholder="facultatif"></label><label style="grid-column:1/-1">Preuve de la capacité (plaque constructeur, validation…)<input name="proof" placeholder="facultatif — sans preuve, les emplacements restent « à valider »"></label>
<div class="actions" style="grid-column:1/-1"><button class="ghost" name="mode" value="preview">Aperçu</button><button name="mode" value="create">Créer les emplacements</button></div></form></div>`}
function genKind(k){document.querySelectorAll('#genForm [data-k]').forEach(e=>{e.hidden=!e.dataset.k.split(' ').includes(k)})}
function form(id,html,button='Enregistrer'){return `<div class="panel"><form id="${id}">${html}<button>${button}</button></form></div>`}

const STATUS={awaiting_putaway:'À ranger',available:'Disponible',in_transit:'En transit',exited:'Sortie',depleted:'Épuisée',requested:'Demandé',approved:'Validé',received:'Réceptionné',discrepancy:'Écart à trancher',refusal_pending:'Refus à valider',refused:'Refusé — décision exploitation',prepared:'Préparé',open:'En cours',closed:'Clôturée',to_assign:'En attente',assigned:'Affectée',in_progress:'En cours',suspended:'Suspendue',done:'Terminée',partial:'Remise partielle',closed_partial:'Clôturé (reliquat annulé)',returned:'Retourné',received_with_reserves:'Accepté sous réserves',cancelled:'Annulé',authorized:'Autorisée',completed:'Remise',pending:'En attente',validated:'Validé',rejected:'Non validé'};

function wire(){document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();if(f.id==='gsearch')return globalSearch(f.q.value);

case 'label':return downloadFile('labels/'+id,'etiquette-'+id+'.pdf');case 'reportIncident':return downloadFile('reports/incident/'+id,'rapport-'+id+'.pdf');case 'reportClaim':return downloadFile('reports/claim/'+id,'rapport-'+id+'.pdf');
case 'uploadIncident':return uploadFile('incident',id);case 'uploadTransfer':return uploadFile('transfer',id);
case 'refuseTransfer':data=await promptForm('Refus du transfert '+id+' — rapport du magasinier',[F('reason','Motif précis du refus (10 caractères minimum)')]);if(!data)return;path='transfers/'+id+'/refuse';try{await api(path,'POST',data);toast('Rapport créé : ajoutez au moins une photo puis faites valider par le responsable magasin');refresh()}catch(e){toast(e.message,true)}return;
case 'reviewRefusal':{let r=(d['transfer-refusals']||[]).find(x=>x.transfer_id===id&&x.status==='pending');if(!r){toast('Aucun rapport en attente',true);return}let docs=await api('documents?kind=transfer&ref='+encodeURIComponent(id));data=await promptForm('Validation du rapport '+r.id+' (responsable magasin)',[{key:'approve',label:'Motif : '+r.reason+' · constaté par '+r.created_by+' · '+docs.length+' pièce(s) jointe(s)',type:'select',options:'<option value="true">Valider le refus et transmettre à l’exploitation</option><option value="false">Ne pas valider : remettre en transit</option>'},F('note','Avis du responsable')]);if(!data)return;data.approve=data.approve==='true';path='transfer-refusals/'+r.id+'/review';break}
case 'refusalDecision':data=await promptForm('Instruction exploitation après refus — '+id,[{key:'decision',label:'Décision',type:'select',options:'<option value="return">Retour vers l’entrepôt de départ (nouvelle signature transporteur)</option><option value="accept_with_reserves">Accepter à l’arrivée sous réserves</option>'},F('note','Motif / réserves')]);if(!data)return;path='transfers/'+id+'/refusal-decision';break;
case 'refusalPdf':{let r=(d['transfer-refusals']||[]).find(x=>x.transfer_id===id&&x.status==='validated');if(!r?.report_document_id){toast('Rapport introuvable',true);return}return downloadFile('documents/'+r.report_document_id+'/download','rapport-refus-'+r.id+'.pdf')}case 'uploadClaim':return uploadFile('claim',id);
}await api(path,method,data);toast('Opération enregistrée');refresh()}catch(e){toast(e.message,true)}}
async function printLabels(){
  const available=(getRows('units')||[]).map(x=>x.id);
  if(!available.length)return toast('Aucune unité disponible',true);
  const entered=prompt('Identifiants des unités à imprimer, séparés par des virgules (40 maximum) :',available.slice(0,10).join(','));
  if(entered===null)return;
  const ids=[...new Set(entered.split(',').map(x=>x.trim()).filter(Boolean))];
  if(!ids.length||ids.length>40||ids.some(x=>!available.includes(x)))return toast('Choisissez 1 à 40 unités visibles dans votre entrepôt.',true);
  return downloadFile('labels-batch?ids='+encodeURIComponent(ids.join(',')),'etiquettes-TAF-80x130.pdf');
}
async function scanQR(onCode){
  const dlg=document.createElement('dialog');dlg.style='border:0;border-radius:16px;padding:20px;width:min(95vw,540px)';
  dlg.innerHTML='<h3>Scanner une étiquette TAF</h3><p class="small">La caméra nécessite HTTPS ou localhost et un navigateur compatible. Saisie manuelle possible.</p><video autoplay muted playsinline style="width:100%;max-height:300px;background:#142d44;border-radius:9px"></video><label>Identifiant QR<input id="qr-text" placeholder="TAF-U-... ou emplacement"></label><div class="actions"><button id="qr-lookup">Rechercher</button><button class="ghost" id="qr-close">Fermer</button></div><p id="qr-status" class="small"></p>';
  document.body.append(dlg);dlg.showModal();let stream=null,closed=false,detector=null;
  function close(){closed=true;stream?.getTracks().forEach(t=>t.stop());dlg.close();dlg.remove()}
  function lookup(value){let id=value.trim();if(id.startsWith('TAF:UNIT:'))id=id.slice(9);if(id.startsWith('TAF:LOC:'))id=id.slice(8);if(onCode){close();return onCode(id)}let unit=(S.data.units||[]).find(x=>x.id===id);let loc=(S.data.locations||[]).find(x=>x.id===id);if(unit){close();showTimeline(unit.id)}else if(loc){close();S.page='locations';S.warehouse=loc.warehouse;render();toast('Emplacement trouvé : '+id)}else dlg.querySelector('#qr-status').textContent='QR inconnu ou non accessible : '+id}
  dlg.querySelector('#qr-lookup').onclick=()=>lookup(dlg.querySelector('#qr-text').value);
  dlg.querySelector('#qr-close').onclick=close;dlg.addEventListener('cancel',e=>{e.preventDefault();close()});
  try{if(!navigator.mediaDevices?.getUserMedia)throw Error('caméra non accessible (HTTPS requis)');
    // Chrome/Android : BarcodeDetector natif. Safari iPhone/iPad : décodeur jsQR intégré.
    if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=null}}
    if(!detector&&!window.jsQR){dlg.querySelector('#qr-status').textContent='Chargement du lecteur…';await new Promise((ok,ko)=>{let sc=document.createElement('script');sc.src='vendor/jsQR.js';sc.onload=ok;sc.onerror=()=>ko(Error('lecteur QR indisponible'));document.head.append(sc)})}
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(closed){stream.getTracks().forEach(t=>t.stop());return}const video=dlg.querySelector('video');video.srcObject=stream;await video.play();
    dlg.querySelector('#qr-status').textContent='Visez l’étiquette : la lecture est automatique.';
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    async function frame(){if(closed)return;try{if(detector){const codes=await detector.detect(video);if(codes.length){lookup(codes[0].rawValue);return}}else if(video.videoWidth){let w=Math.min(640,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);cv.width=w;cv.height=h;cx.drawImage(video,0,0,w,h);const code=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(code&&code.data){lookup(code.data);return}}}catch(e){}if(!closed)setTimeout(frame,250)}frame()
  }catch(e){if(!closed)dlg.querySelector('#qr-status').textContent='Caméra indisponible : '+e.message+'. Utilisez la saisie manuelle.'}
}
async function captureSignature(releaseId,drivers,kind="sortie"){
  if(!drivers?.length){toast('Ajoutez d’abord un chauffeur dans le registre.',true);return null}
  const dialog=document.createElement('dialog');dialog.style='border:0;border-radius:16px;padding:22px;width:min(95vw,660px);box-shadow:0 20px 80px #0006';
  dialog.innerHTML=`<h3>Signature du transporteur</h3><p class="small">${kind === "transfert" ? "Transfert" : "Sortie"} ${esc(releaseId)} · Remise physique uniquement après autorisation exploitation.</p><form id="handover-sign"><label>Chauffeur enregistré<select name="driver_id" required>${opts(drivers,'id','name')}</select></label><label>Nom du signataire<input name="signature_name" required minlength="2" maxlength="150" autocomplete="name"></label><label style="margin-top:12px">Signer avec le doigt, la souris ou le stylet</label><canvas id="signature-pad" style="width:100%;height:190px;border:2px solid #c5d4e0;border-radius:10px;background:white;touch-action:none;display:block"></canvas><p class="small">La signature et l'heure de remise seront conservées avec la sortie. Ne faites signer qu'au moment de la remise effective.</p><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" name="consent" required style="width:auto">Le transporteur confirme la remise physique des colis indiqués.</label><div class="actions" style="margin-top:14px"><button type="button" id="clear-sign" class="ghost">Effacer</button><button type="submit">Valider la remise signée</button><button type="button" id="cancel-sign" class="ghost">Annuler</button></div></form>`;
  document.body.append(dialog);dialog.showModal();
  const canvas=dialog.querySelector('canvas'),ctx=canvas.getContext('2d');canvas.width=900;canvas.height=285;ctx.fillStyle='#fff';ctx.fillRect(0,0,900,285);ctx.strokeStyle='#142d44';ctx.lineWidth=3.8;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,marked=false;
  function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);let a=point(e);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+.1,a.y+.1);ctx.stroke();marked=true});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const a=point(e);ctx.lineTo(a.x,a.y);ctx.stroke()});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drawing=false);
  dialog.querySelector('#clear-sign').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,900,285);marked=false};
  return new Promise(resolve=>{let settled=false;function finish(v){if(settled)return;settled=true;dialog.close();dialog.remove();resolve(v)}
    dialog.querySelector('#cancel-sign').onclick=()=>finish(null);
    dialog.addEventListener('cancel',e=>{e.preventDefault();finish(null)});
    dialog.querySelector('form').onsubmit=e=>{e.preventDefault();if(!marked){toast('Le chauffeur doit signer dans le cadre.',true);return}const f=new FormData(e.target);if(!f.get('driver_id')){toast('Choisissez le chauffeur.',true);return}finish({driver_id:f.get('driver_id'),signature_name:f.get('signature_name').trim(),signature_data:canvas.toDataURL('image/png'),signature_consent:true})};
  })
}
// Impression : ouvre directement la boîte d'impression (impression silencieuse sur un poste Chrome lancé avec --kiosk-printing).
async function printPdf(path,name){try{let b=await api(path),url=URL.createObjectURL(b);
if(/iPhone|iPad|iPod/.test(navigator.userAgent)||/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1){let w=window.open(url,'_blank');if(!w){let a=document.createElement('a');a.href=url;a.download=name||'document.pdf';a.click()}return}
let f=document.createElement('iframe');f.style='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';f.src=url;document.body.append(f);
f.onload=()=>setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(url,'_blank')}setTimeout(()=>{f.remove();URL.revokeObjectURL(url)},60000)},400)}catch(e){toast(e.message,true)}}
async function downloadFile(path,name){try{let b=await api(path),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast(e.message,true)}}
async function uploadFile(kind,id){let input=document.createElement('input');input.type='file';input.accept='.pdf,.png,.jpg,.jpeg';input.onchange=async()=>{if(!input.files[0])return;let form=new FormData();form.append('file',input.files[0]);try{await api('documents/'+kind+'/'+id,'POST',form);toast('Document ajouté')}catch(e){toast(e.message,true)}};input.click()}
if(S.token)refresh();else loginView();
</script></body></html>
