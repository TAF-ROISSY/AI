<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAF WAREHOUSE</title><style>
:root{font:15px system-ui,-apple-system,sans-serif;color:#142d44;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;background:#176da4;color:white;padding:11px 15px;border-radius:9px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#e8eff6;color:#183953}.danger{background:#a53b3b}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#102c46;color:white;padding:20px}aside h1{font-size:23px;margin:0 0 8px}aside small{color:#a9c5d8}nav{margin-top:25px;display:grid;gap:4px}nav button{background:transparent;text-align:left;padding:12px}nav button.active,nav button:hover{background:#24516e}main{padding:25px;min-width:0}h2{margin-top:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid #dce6ef;border-radius:14px;padding:18px}.card b{display:block;font-size:28px;margin-top:8px}.panel{margin:16px 0;overflow:auto}form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:grid;gap:5px;font-size:12px;font-weight:650;min-width:155px;flex:1}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d4e0;border-radius:8px;background:white;color:#142d44}textarea{min-height:60px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#eff4f8}td,th{padding:10px;border-bottom:1px solid #e5edf3;vertical-align:top}td{max-width:280px;overflow-wrap:anywhere}.small{font-size:12px;color:#637789}.pill{border-radius:20px;padding:4px 9px;background:#eaf1f6;font-size:12px}.warn{color:#a15408}.error{color:#b32626}.ok{color:#147049}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{padding:6px 9px;font-size:12px}.login{max-width:420px;margin:12vh auto;background:white;padding:32px;border-radius:18px;box-shadow:0 10px 45px #142d4420}.login label{margin:15px 0}#toast{position:fixed;bottom:18px;right:18px;background:#142d44;color:white;padding:14px;border-radius:10px;display:none;max-width:420px;z-index:20}a{color:#166ca6}#scan video{width:100%;max-height:250px}pre{white-space:pre-wrap} @media(max-width:800px){.shell{display:block}aside{padding:12px}nav{display:flex;overflow-x:auto;margin-top:10px}nav button{white-space:nowrap}main{padding:13px}.panel{padding:12px}td,th{padding:7px}}
@media(max-width:800px){button,input,select,textarea{min-height:44px;font-size:16px}nav{scroll-snap-type:x proximity}nav button{scroll-snap-align:start;min-height:46px}.top{align-items:stretch}.top>button{flex:1}.top>select{max-width:100%;flex:1}.actions button{min-height:44px;font-size:14px}.panel{overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:640px}dialog{max-width:calc(100vw - 20px)!important;max-height:calc(100dvh - 20px);overflow:auto}#signature-pad{touch-action:none}main{padding-bottom:env(safe-area-inset-bottom,16px)}}@media print{aside,.top button,.actions{display:none!important}main{padding:0}.panel{border:0}}
</style></head><body><div id="root"></div><div id="toast"></div><script>
const S={token:sessionStorage.getItem('taf_token')||'',me:null,page:'dashboard',data:{},warehouse:'all'};
const sections=['dashboard','receipts','units','locations','movements','transfers','counts','releases','drivers','missions','incidents','claims','documents','users','audit','notifications','discrepancies'];
const titles={dashboard:'Tableau de bord',receipts:'Réceptions',units:'Unités et stock',locations:'Emplacements',movements:'Mouvements',transfers:'Transferts',counts:'Inventaires',releases:'Sorties',drivers:'Chauffeurs',missions:'Missions',incidents:'Incidents',claims:'Litiges',documents:'Documents',users:'Utilisateurs',audit:'Journal d’audit',notifications:'Notifications',discrepancies:'Écarts de réception'};
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,err=false){const t=$('toast');t.textContent=msg;t.style.background=err?'#9b2929':'#142d44';t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',4800)}
// Idempotency keys survive a browser refresh when a request outcome is unknown.
// Never persist payloads or signatures in sessionStorage.
const safePosts=new Set(['move','counts','releases','transfers','units','receipts']);
async function idempotentKey(path,body){
  const raw=new TextEncoder().encode(path+'|'+JSON.stringify(body));
  const digest=await crypto.subtle.digest('SHA-256',raw);
  const fingerprint=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');
  const slot='taf_pending_'+fingerprint;
  let key=sessionStorage.getItem(slot);
  if(!key){key=crypto.randomUUID();sessionStorage.setItem(slot,key)}
  return {key,slot};
}
async function api(path,method='GET',body=null){
  let headers={Authorization:'Bearer '+S.token};
  if(body&&!(body instanceof FormData))headers['Content-Type']='application/json';
  const protectedPost=method==='POST'&&(safePosts.has(path)||/^transfers\/[^/]+\/(dispatch|receive|discrepancy-review|refuse)$/.test(path)||/^transfer-refusals\/[^/]+\/review$/.test(path)||/^releases\/[^/]+\/complete$/.test(path)||/^counts\/[^/]+\/review$/.test(path))&&body&&!(body instanceof FormData);
  const pending=protectedPost?await idempotentKey(path,body):null;
  if(pending)headers['Idempotency-Key']=pending.key;
  let r;
  try{r=await fetch('/api/'+path,{method,headers,body:body?(body instanceof FormData?body:JSON.stringify(body)):undefined})}
  catch(e){throw Error('Connexion interrompue : opération non confirmée. Réessayez avec les mêmes informations ; la protection anti-doublon conservera la référence.')}
  if(!r.ok){let e=await r.json().catch(()=>({detail:r.statusText}));
    if(pending&&r.status>=400&&r.status<500)sessionStorage.removeItem(pending.slot);
    throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}
  if(pending)sessionStorage.removeItem(pending.slot);
  return r.headers.get('content-type')?.includes('json')?r.json():r.blob();
}
async function refresh(){if(!S.token)return loginView();try{S.me=await api('me');let keys=['dashboard','clients','locations','receipts','units','movements','transfers','counts','drivers','releases','missions','tasks','incidents','claims','notifications','discrepancies','rack-rules','claim-actions','task-events','transfer-refusals'];if(['users','audit'].includes(S.page))keys.push(S.page);let vals=await Promise.all(keys.map(k=>api(k).catch(()=>[])));keys.forEach((k,i)=>S.data[k]=vals[i]);render()}catch(e){if(e.message.includes('Session')||e.message.includes('Connexion')){S.token='';sessionStorage.removeItem('taf_token');loginView()}else toast(e.message,true)}}
function loginView(){$('root').innerHTML=`<div class="login"><h1>TAF WAREHOUSE</h1><p class="small">Environnement TEST · Serveur local</p><form id="login"><label>Identifiant<input name="username" required autocomplete="username"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><label>Code Authenticator (si activé)<input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 chiffres"></label><label>Code de secours (uniquement si Authenticator indisponible)<input name="recovery_code" autocomplete="off" placeholder="Code de secours à usage unique"></label><button>Se connecter</button></form><p class="small">Mot de passe initial : fichier data/INITIAL_ADMIN_PASSWORD.txt</p></div>`;$('login').onsubmit=async e=>{e.preventDefault();try{let x=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await x.json();if(!x.ok)throw Error(d.detail);S.token=d.token;sessionStorage.setItem('taf_token',S.token);refresh()}catch(e){toast(e.message,true)}}}
function opts(items,val='id',label='name',empty='Choisir'){return `<option value="">${empty}</option>`+(items||[]).map(x=>`<option value="${esc(x[val])}">${esc(x[label])}</option>`).join('')}
function warehouses(){return S.me?.warehouses||[]}
function whopts(){return warehouses().map(x=>`<option>${esc(x)}</option>`).join('')}
function field(name,label,type='text',required=true,extra=''){return `<label>${label}<input name="${name}" type="${type}" ${required?'required':''} ${extra}></label>`}
function select(name,label,html){return `<label>${label}<select name="${name}" ${/^(unit_id|incident_id|client_id)$/.test(name)&&label.includes("facultatif")?"":"required"}>${html}</select></label>`}
function form(id,html,button='Enregistrer'){return `<div class="panel"><form id="${id}">${html}<button>${button}</button></form></div>`}
const STATUS={awaiting_putaway:'À ranger',available:'Disponible',in_transit:'En transit',exited:'Sortie',depleted:'Épuisée',requested:'Demandé',approved:'Validé',received:'Réceptionné',discrepancy:'Écart à trancher',refusal_pending:'Refus à valider',refused:'Refusé',cancelled:'Annulé',authorized:'Autorisée',completed:'Remise',pending:'En attente',validated:'Validé',rejected:'Non validé'};
function table(rows,cols,action){return `<div class="panel"><table><thead><tr>${cols.map(x=>`<th>${x[1]}</th>`).join('')}${action?'<th>Actions</th>':''}</tr></thead><tbody>${(rows||[]).map(r=>`<tr>${cols.map(([k])=>`<td>${esc(k==='status'?(STATUS[r[k]]||r[k]):r[k])}</td>`).join('')}${action?`<td><div class="actions">${action(r)}</div></td>`:''}</tr>`).join('')}</tbody></table>${!rows?.length?'<p class="small">Aucune donnée.</p>':''}</div>`}
function btn(action,id,label){return `<button class="ghost" onclick="act('${action}','${esc(id)}')">${label}</button>`}
function getRows(k){let rows=S.data[k]||[];return S.warehouse==='all'?rows:rows.filter(r=>r.warehouse===S.warehouse||r.source===S.warehouse||r.destination===S.warehouse)}
function render(){let nav=sections.filter(k=>k!=='users'||['superadmin','admin'].includes(S.me.role)).map(k=>`<button class="${S.page===k?'active':''}" onclick="go('${k}')">${titles[k]}</button>`).join('');$('root').innerHTML=`<div class="shell"><aside><h1>TAF <span style="color:#69b8eb">WAREHOUSE</span></h1><small>TEST V4.7 · ${esc(S.me.username)} (${esc(S.me.role)})</small><nav>${nav}</nav><p class="small" style="color:#9bb8c9">Données réelles de test · ne pas utiliser en production</p><button class="ghost" onclick="logout()">Déconnexion</button></aside><main><div class="top"><h2>${titles[S.page]}</h2><button class="ghost" onclick="scanQR()">📷 Scanner QR</button><select style="width:auto" onchange="S.warehouse=this.value;render()"><option value="all">Tous les entrepôts</option>${warehouses().map(w=>`<option ${S.warehouse===w?'selected':''}>${esc(w)}</option>`).join('')}</select></div><div id="content">${view()}</div></main></div>`;wire()}
function go(k){S.page=k;refresh()}
function logout(){S.token='';sessionStorage.removeItem('taf_token');loginView()}
function view(){let d=S.data,u=getRows('units'),clients=d.clients||[],loc=getRows('locations');switch(S.page){
case 'notifications':return table((d.notifications||[]).filter(n=>S.warehouse==='all'||n.warehouse===S.warehouse),[['created','Date'],['warehouse','Entrepôt'],['title','Événement'],['message','Détail'],['is_read','Lu']],n=>n.is_read?'':btn('readNotification',n.id,'Marquer lu'));
case 'dashboard':return `<div class="cards">${Object.entries(d.dashboard||{}).map(([k,v])=>`<div class="card">${esc(({units:'Unités',receipts:'Réceptions',holds:'Blocages',incidents:'Incidents ouverts',claims:'Litiges ouverts',transfers:'En transit',releases:'Sorties en attente'})[k]||k)}<b>${esc(typeof v==='object'?v.quantity:v)}</b></div>`).join('')}</div><div class="panel"><h3>État des stocks</h3><p>Les mouvements de stock sont enregistrés sur le serveur avec contrôle de concurrence. Les capacités des racks restent non validées tant que les documents techniques ne sont pas saisis.</p></div>`;
case 'discrepancies':return table(getRows('receipt-discrepancies'),[['id','Écart'],['receipt_id','Réception'],['kind','Nature'],['expected','Prévus'],['observed','Constatés'],['description','Description'],['status','Statut'],['reported_by','Déclarant'],['reviewed_by','Validateur']],r=>r.status==='open'?btn('reviewDiscrepancy',r.id,'Examiner'):'' );
case 'receipts':return form('createReceipt',select('warehouse','Entrepôt',whopts())+select('client_id','Client',opts(clients))+field('awb','LTA')+field('expected','Colis prévus','number')+field('actual','Colis constatés','number')+field('weight','Poids brut kg','number',true,'step="0.01" min="0"')+field('notes','Observations','text',false),'Créer la réception')+table(getRows('receipts'),[['id','Référence'],['warehouse','Entrepôt'],['client','Client'],['awb','LTA'],['expected','Prévus'],['actual','Reçus'],['status','Statut']],r=>btn('addUnit',r.id,'Ajouter unité')+btn('reportDiscrepancy',r.id,'Signaler écart'));
case 'units':return `<div class="panel"><button type="button" onclick="printLabels()">🖨️ Imprimer une sélection d’étiquettes (80 × 130 mm)</button><p class="small">Sélectionnez les unités par identifiant QR. Le PDF contient une page par étiquette, à imprimer à taille réelle (100 %).</p></div>`+table(u,[['id','QR unité'],['warehouse','Entrepôt'],['client','Client'],['description','Description'],['quantity','Qté'],['weight','kg'],['location_id','Emplacement'],['unit_type','Type'],['status','Statut'],['hold','Blocage'],['version','Version']],r=>btn('label',r.id,'Étiquette PDF')+btn('move',r.id,r.status==='awaiting_putaway'?'Ranger':'Déplacer')+btn('hold',r.id,'Bloquer')+(r.hold?btn('holds',r.id,'Lever un blocage'):'')+btn('release',r.id,'Sortie')+btn('count',r.id,'Compter'));
case 'locations':return `<p class="small">Les emplacements ne deviennent compatibles qu'après saisie de charges/volumes validés par la documentation technique.</p>`+table(loc,[['id','QR emplacement'],['warehouse','Entrepôt'],['zone','Zone'],['capacity_kg','Charge kg'],['capacity_m3','Volume m³'],['verified','Vérifié'],['blocked','Bloqué'],['notes','Preuve']],r=>btn('capacity',r.id,'Configurer')+btn('rackRule',r.id,'Règles rack'));
case 'movements':return table(d.movements,[['at','Date'],['unit_id','Unité'],['kind','Type'],['source','Départ'],['destination','Arrivée'],['quantity','Qté'],['actor','Auteur']]);
case 'transfers':return form('createTransfer',select('unit_id','Unité',opts(u,'id','id'))+select('destination','Entrepôt destination',whopts()),'Demander transfert')+table(getRows('transfers'),[['id','Transfert'],['unit_id','Unité'],['source','Départ'],['destination','Arrivée'],['unit_quantity','Qté'],['received_quantity','Reçu'],['received_condition','État'],['status','Statut']],r=>r.status==='requested'?btn('approveTransfer',r.id,'Valider')+btn('cancelTransfer',r.id,'Annuler'):r.status==='approved'?btn('dispatchTransfer',r.id,'Expédier')+btn('cancelTransfer',r.id,'Annuler'):r.status==='in_transit'?btn('receiveTransfer',r.id,'Réceptionner')+btn('refuseTransfer',r.id,'Refuser')+btn('transferPdf',r.id,'Bon signé PDF'):r.status==='refusal_pending'?btn('uploadTransfer',r.id,'📷 Photo / document')+btn('reviewRefusal',r.id,'Valider le rapport (responsable)')+btn('transferPdf',r.id,'Bon signé PDF'):r.status==='refused'?btn('refusalPdf',r.id,'Rapport de refus PDF')+btn('transferPdf',r.id,'Bon signé PDF'):r.status==='discrepancy'?btn('decideTransfer',r.id,'Décider l’écart')+btn('transferPdf',r.id,'Bon signé PDF'):r.status==='received'?btn('transferPdf',r.id,'Bon signé PDF'):'');
case 'counts':return table(getRows('counts'),[['id','Inventaire'],['unit_id','Unité'],['expected','Attendu'],['observed','Constaté'],['status','Statut'],['actor','Compteur'],['reviewer','Contrôleur']],r=>r.status==='pending'?(btn('recount',r.id,'Recompter')+btn('reviewCount',r.id,'Contrôler')):'')+`<div class="panel"><h3>Historique des recomptages</h3></div>`+table((d.recounts||[]),[['count_id','Inventaire'],['observed','Recompté'],['actor','Intervenant'],['created','Date']]);
case 'drivers':return form('createDriver',field('name','Nom')+field('company','Société','text',false)+field('plate','Immatriculation','text',false)+field('phone','Téléphone','text',false),'Ajouter chauffeur')+table(d.drivers,[['id','Référence'],['name','Chauffeur'],['company','Société'],['plate','Plaque']]);
case 'releases':return table(getRows('releases'),[['id','Sortie'],['unit_id','Unité'],['quantity','Quantité'],['status','Statut'],['requested_by','Demandé par'],['authorized_by','Autorisé par'],['signature_name','Signataire']],r=>r.status==='requested'?btn('authorizeRelease',r.id,'Autoriser')+btn('cancelRelease',r.id,'Annuler'):r.status==='authorized'?btn('completeRelease',r.id,'Faire signer le chauffeur')+btn('cancelRelease',r.id,'Annuler'):r.status==='completed'?btn('handoverPdf',r.id,'Bon signé PDF'):'');
case 'missions':return form('createMission',select('warehouse','Entrepôt',whopts())+field('title','Mission')+field('leader','Chef de mission','text',false),'Créer mission')+table(getRows('missions'),[['id','Mission'],['warehouse','Entrepôt'],['title','Objet'],['leader','Chef'],['status','Statut']],r=>btn('task',r.id,'Ajouter tâche')+btn('missionPlan',r.id,'Planifier')+btn('closeMission',r.id,'Clôturer'))+table(d.tasks,[['mission_id','Mission'],['title','Tâche'],['assignee','Attribuée à'],['status','Statut']],r=>r.status!=='done'?btn('taskPlan',r.id,'Affecter')+btn('taskStart',r.id,'Démarrer')+btn('doneTask',r.id,'Terminer'):'');
case 'incidents':return form('createIncident',select('warehouse','Entrepôt',whopts())+select('unit_id','Unité concernée (facultatif)',opts(u,'id','id'))+select('category','Catégorie',`<option value="damage">Dommage</option><option value="handling">Manutention</option><option value="seal">Scellé</option><option value="quantity">Quantité</option><option value="rack">Rack</option>`)+select('severity','Gravité','<option value="minor">Mineur</option><option value="major">Majeur</option><option value="critical">Critique</option>')+field('description','Constat'),'Déclarer incident')+table(getRows('incidents'),[['id','Incident'],['unit_id','Unité'],['severity','Gravité'],['description','Constat'],['status','Statut'],['owner','Responsable']],r=>btn('incidentUpdate',r.id,'Traiter')+btn('reportIncident',r.id,'PDF')+btn('uploadIncident',r.id,'Photo / pièce'));
case 'claims':return form('createClaim',select('warehouse','Entrepôt',whopts())+select('incident_id','Incident (facultatif)',opts(getRows('incidents'),'id','id'))+select('client_id','Client (facultatif)',opts(clients))+field('description','Réclamation')+field('deadline','Échéance','date',false)+field('owner','Responsable','text',false),'Ouvrir litige')+table(getRows('claims'),[['id','Litige'],['incident_id','Incident'],['description','Réclamation'],['deadline','Échéance'],['status','Statut'],['decision','Décision']],r=>btn('claimUpdate',r.id,'Traiter')+btn('reportClaim',r.id,'PDF')+btn('uploadClaim',r.id,'Ajouter pièce')+btn('claimAction',r.id,'Action / clôture'));
case 'documents':return `<div class="panel"><h3>Documents sécurisés</h3><p>Ajoutez les PDF et photos directement depuis une réception, un incident ou un litige. Les fichiers sont conservés côté serveur et contrôlés par les habilitations. Aucun envoi externe automatique.</p><p>Formats acceptés : PDF, JPG, PNG · 10 Mo maximum.</p></div>`;
case 'users':return form('createUser',field('username','Identifiant')+field('password','Mot de passe','password',true,'minlength="12"')+select('role','Rôle',`<option>worker</option><option>leader</option><option>manager</option><option>exploitation</option><option>admin</option>`)+select('warehouses','Entrepôt',whopts()),'Créer utilisateur (Super Admin uniquement)')+table(d.users,[['username','Identifiant'],['role','Rôle'],['warehouses','Entrepôts'],['active','Actif'],['can_lift_holds','Lève blocages']],r=>btn('userStatus',r.id,r.active?'Désactiver':'Réactiver')+btn('userLift',r.id,r.can_lift_holds?'Retirer levée blocages':'Autoriser levée blocages')+btn('userReset',r.id,'Réinitialiser mot de passe'))+form('password',field('old','Ancien mot de passe','password')+field('new','Nouveau mot de passe','password',true,'minlength="12"'),'Changer mon mot de passe');
case 'audit':return table(d.audit,[['at','Date'],['actor','Auteur'],['action','Action'],['kind','Objet'],['ref','Référence'],['details','Détails']]);default:return ''}}
function wire(){document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f));let path={createReceipt:'receipts',createDriver:'drivers',createTransfer:'transfers',createMission:'missions',createIncident:'incidents',createClaim:'claims',createUser:'users',password:'password'}[f.id];if(!path)return;try{if(f.id==='createUser')data.warehouses=[data.warehouses];if(f.id==='createReceipt')for(let k of ['expected','actual','weight'])data[k]=Number(data[k]);if(f.id==='createIncident'&&!data.unit_id)delete data.unit_id;if(f.id==='createClaim'){if(!data.client_id)delete data.client_id;if(!data.incident_id)delete data.incident_id;if(!data.deadline)delete data.deadline}await api(path,'POST',data);toast('Enregistré');if(f.id==='password')logout();else refresh()}catch(e){toast(e.message,true)}})}
async function promptForm(title,fields){let box=document.createElement('dialog');box.style='border:0;border-radius:15px;padding:25px;max-width:600px;width:95%;box-shadow:0 15px 65px #0005';box.innerHTML=`<h3>${esc(title)}</h3><form method="dialog" id="quick">${fields.map(f=>`<label style="margin:9px 0">${esc(f.label)}${f.type==='select'?`<select name="${f.key}">${f.options}</select>`:`<input name="${f.key}" type="${f.type||'text'}" ${f.type==='number'?'step="any" min="0"':''} ${f.required?'required':''} value="${esc(f.value??'')}">`}</label>`).join('')}<div class="actions"><button value="ok">Confirmer</button><button value="cancel" class="ghost" formnovalidate>Annuler</button></div></form>`;document.body.append(box);box.showModal();return new Promise(resolve=>{box.addEventListener('close',()=>{let out=box.returnValue==='ok'?Object.fromEntries(new FormData(box.querySelector('form'))):null;box.remove();resolve(out)},{once:true})})}
const F=(key,label,value='',type='text',required=true)=>({key,label,value,type,required});
async function act(action,id){try{let data=null,path='',method='POST',d=S.data,unit=(d.units||[]).find(x=>x.id===id);switch(action){
case 'rackRule':data=await promptForm('Règles techniques du rack',[F('max_unit_kg','Poids maximal par unité (kg)',100,'number'),F('max_unit_m3','Volume maximal par unité (m³)',1,'number'),F('max_units','Nombre maximal d’unités',1,'number'),F('allowed_categories','Catégories autorisées (virgules)','', 'text',false),F('forbidden_categories','Catégories interdites (virgules)','', 'text',false),F('technical_reference','Référence du contrôle technique')]);if(!data)return;for(let k of ['max_unit_kg','max_unit_m3','max_units'])data[k]=+data[k];for(let k of ['allowed_categories','forbidden_categories'])data[k]=data[k].split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);path='rack-rules/'+id;method='PUT';break;

case 'userStatus':{let r=(d.users||[]).find(x=>x.id===id);if(!r||!confirm('Modifier le statut du compte '+r.username+' ?'))return;data={active:!r.active};path='users/'+id+'/status';break}
case 'userLift':{let r=(d.users||[]).find(x=>x.id===id);if(!r||!confirm((r.can_lift_holds?'Retirer à ':'Accorder à ')+r.username+' le droit de lever les blocages ?'))return;data={can_lift_holds:!r.can_lift_holds};path='users/'+id+'/permissions';break}

case 'readNotification':path='notifications/'+id+'/read';break;
case 'addUnit':data=await promptForm('Nouvelle unité physique',[{key:'unit_type',label:'Type d’unité',type:'select',options:'<option value="palette">Palette</option><option value="colis">Colis (1 colis)</option>'},F('description','Description'),F('quantity','Nombre de colis',1,'number'),F('weight','Poids total kg',0,'number'),F('volume','Volume m³',0,'number'),{key:'dimensions_ok',label:'Dimensions validées ?',type:'select',options:'<option value="false">Non</option><option value="true">Oui</option>'}]);if(!data)return;data={...data,receipt_id:id,quantity:+data.quantity,weight:+data.weight,volume:+data.volume,dimensions_ok:data.dimensions_ok==='true'};path='units';break;

case 'move':data=await promptForm('Déplacer unité '+id,[{key:'destination',label:'Destination',type:'select',options:opts((d.locations||[]).filter(x=>x.warehouse===unit.warehouse),'id','id')},F('reason','Motif','Rangement interne')]);if(!data)return;data={...data,unit_id:id,expected_version:unit.version};path='move';break;

case 'count':data=await promptForm('Inventaire physique',[F('observed','Quantité constatée',unit.quantity,'number'),F('reason','Observation','', 'text',false)]);if(!data)return;data={...data,unit_id:id,observed:+data.observed};path='counts';break;

case 'reportDiscrepancy':data=await promptForm('Signaler un écart de réception',[{key:'kind',label:'Nature',type:'select',options:'<option value="missing">Colis manquants</option><option value="excess">Excédent</option><option value="damage">Avarie</option><option value="documentation">Documents</option><option value="other">Autre</option>'},F('description','Description précise des faits')]);if(!data)return;path='receipts/'+id+'/discrepancy';break;
case 'reviewDiscrepancy':data=await promptForm('Décision indépendante sur écart',[{key:'approve',label:'Décision',type:'select',options:'<option value="false">Refuser</option><option value="true">Accepter</option>'},F('decision','Décision motivée')]);if(!data)return;data.approve=data.approve==='true';path='receipt-discrepancies/'+id+'/review';break;
case 'reviewCount':data=await promptForm('Relecture indépendante',[{key:'approve',label:'Décision',type:'select',options:'<option value="false">Refuser / recompter</option><option value="true">Approuver</option>'},F('reason','Justification')]);if(!data)return;data.approve=data.approve==='true';path='counts/'+id+'/review';break;
case 'cancelTransfer':if(!confirm('Annuler ce transfert et libérer le stock ?'))return;path='transfers/'+id+'/cancel';break;
case 'cancelRelease':if(!confirm('Annuler cette sortie et libérer la réservation ?'))return;path='releases/'+id+'/cancel';break;
case 'approveTransfer':if(!confirm('Valider ce transfert ? Un autre utilisateur doit avoir demandé le transfert.'))return;path='transfers/'+id+'/approve';break;
case 'dispatchTransfer':{let sign=await captureSignature(id,d.drivers,'transfert');if(!sign)return;let note=prompt('Référence véhicule / document de transport :');if(!note)return;try{await api('transfers/'+id+'/dispatch','POST',{confirmation:true,note,...sign});toast('Transfert expédié et signé');refresh()}catch(e){toast(e.message,true)}return;}
case 'transferPdf':return downloadFile('transfers/'+id+'/dispatch-pdf','transfert-'+id+'.pdf');
case 'receiveTransfer':{let t=(d.transfers||[]).find(x=>x.id===id)||{};data=await promptForm('Réception physique du transfert '+id,[F('observed_quantity','Colis réellement reçus (expédiés : '+(t.unit_quantity??'?')+')',t.unit_quantity??'','number'),{key:'condition',label:'État constaté',type:'select',options:'<option value="conforme">Conforme</option><option value="manquant">Marchandise manquante</option><option value="excedent">Marchandise supplémentaire</option><option value="avarie">Avarie</option><option value="erreur_identification">Erreur d’identification</option>'},F('note','Observations (obligatoires en cas d’écart)','', 'text',false)]);if(!data)return;data.observed_quantity=Number(data.observed_quantity);path='transfers/'+id+'/receive';break}
case 'decideTransfer':{let t=(d.transfers||[]).find(x=>x.id===id)||{};data=await promptForm('Décision indépendante — écart transfert '+id,[{key:'accept_observed',label:'Reçu '+(t.received_quantity??'?')+' / expédié '+(t.unit_quantity??'?')+' ('+(t.received_condition||'')+')',type:'select',options:'<option value="true">Retenir la quantité constatée (correction du stock)</option><option value="false">Maintenir la quantité expédiée</option>'},F('decision','Décision motivée')]);if(!data)return;data.accept_observed=data.accept_observed==='true';path='transfers/'+id+'/discrepancy-review';break}
case 'authorizeRelease':if(!confirm('Confirmer votre autorisation exploitation ?'))return;path='releases/'+id+'/authorize';break;
case 'completeRelease':data=await captureSignature(id,d.drivers);if(!data)return;path='releases/'+id+'/complete';break;
case 'handoverPdf':return downloadFile('releases/'+id+'/handover-pdf','remise-'+id+'.pdf');
case 'task':data=await promptForm('Ajouter tâche',[F('title','Tâche'),F('assignee','Responsable','', 'text',false)]);if(!data)return;path='missions/'+id+'/tasks';break;
case 'doneTask':path='tasks/'+id+'/done';break;
case 'closeMission':path='missions/'+id+'/close';break;
case 'incidentUpdate':data=await promptForm('Traiter incident',[{key:'status',label:'Statut',type:'select',options:'<option>open</option><option>investigating</option><option>resolved</option><option>closed</option>'},F('owner','Responsable','', 'text',false),F('resolution','Résolution','', 'text',false)]);if(!data)return;path='incidents/'+id+'/update';break;
case 'claimUpdate':data=await promptForm('Traiter litige',[{key:'status',label:'Statut',type:'select',options:'<option>open</option><option>investigating</option><option>pending</option><option>resolved</option><option>closed</option>'},F('owner','Responsable','', 'text',false),F('decision','Décision motivée','', 'text',false)]);if(!data)return;path='claims/'+id+'/update';break;
case 'label':return downloadFile('labels/'+id,'etiquette-'+id+'.pdf');case 'reportIncident':return downloadFile('reports/incident/'+id,'rapport-'+id+'.pdf');case 'reportClaim':return downloadFile('reports/claim/'+id,'rapport-'+id+'.pdf');
case 'uploadIncident':return uploadFile('incident',id);case 'uploadTransfer':return uploadFile('transfer',id);
case 'refuseTransfer':data=await promptForm('Refus du transfert '+id+' — rapport du magasinier',[F('reason','Motif précis du refus (10 caractères minimum)')]);if(!data)return;path='transfers/'+id+'/refuse';try{await api(path,'POST',data);toast('Rapport créé : ajoutez au moins une photo puis faites valider par le responsable magasin');refresh()}catch(e){toast(e.message,true)}return;
case 'reviewRefusal':{let r=(d['transfer-refusals']||[]).find(x=>x.transfer_id===id&&x.status==='pending');if(!r){toast('Aucun rapport en attente',true);return}let docs=await api('documents?kind=transfer&ref='+encodeURIComponent(id));data=await promptForm('Validation du rapport '+r.id+' (responsable magasin)',[{key:'approve',label:'Motif : '+r.reason+' · constaté par '+r.created_by+' · '+docs.length+' pièce(s) jointe(s)',type:'select',options:'<option value="true">Valider le refus et transmettre à l’exploitation</option><option value="false">Ne pas valider : remettre en transit</option>'},F('note','Avis du responsable')]);if(!data)return;data.approve=data.approve==='true';path='transfer-refusals/'+r.id+'/review';break}
case 'refusalPdf':{let r=(d['transfer-refusals']||[]).find(x=>x.transfer_id===id&&x.status==='validated');if(!r?.report_document_id){toast('Rapport introuvable',true);return}return downloadFile('documents/'+r.report_document_id+'/download','rapport-refus-'+r.id+'.pdf')}case 'uploadClaim':return uploadFile('claim',id);
}await api(path,method,data);toast('Opération enregistrée');refresh()}catch(e){toast(e.message,true)}}
async function printLabels(){
  const available=(getRows('units')||[]).map(x=>x.id);
  if(!available.length)return toast('Aucune unité disponible',true);
  const entered=prompt('Identifiants des unités à imprimer, séparés par des virgules (40 maximum) :',available.slice(0,10).join(','));
  if(entered===null)return;
  const ids=[...new Set(entered.split(',').map(x=>x.trim()).filter(Boolean))];
  if(!ids.length||ids.length>40||ids.some(x=>!available.includes(x)))return toast('Choisissez 1 à 40 unités visibles dans votre entrepôt.',true);
  return downloadFile('labels-batch?ids='+encodeURIComponent(ids.join(',')),'etiquettes-TAF-80x130.pdf');
}
async function scanQR(){
  const dlg=document.createElement('dialog');dlg.style='border:0;border-radius:16px;padding:20px;width:min(95vw,540px)';
  dlg.innerHTML='<h3>Scanner une étiquette TAF</h3><p class="small">La caméra nécessite HTTPS ou localhost et un navigateur compatible. Saisie manuelle possible.</p><video autoplay muted playsinline style="width:100%;max-height:300px;background:#142d44;border-radius:9px"></video><label>Identifiant QR<input id="qr-text" placeholder="TAF-U-... ou emplacement"></label><div class="actions"><button id="qr-lookup">Rechercher</button><button class="ghost" id="qr-close">Fermer</button></div><p id="qr-status" class="small"></p>';
  document.body.append(dlg);dlg.showModal();let stream=null,closed=false,detector=null;
  function close(){closed=true;stream?.getTracks().forEach(t=>t.stop());dlg.close();dlg.remove()}
  function lookup(value){let id=value.trim();if(id.startsWith('TAF:UNIT:'))id=id.slice(9);if(id.startsWith('TAF:LOC:'))id=id.slice(8);let unit=(S.data.units||[]).find(x=>x.id===id);let loc=(S.data.locations||[]).find(x=>x.id===id);if(unit){close();S.page='units';S.warehouse=unit.warehouse;render();toast('Unité trouvée : '+id+' · emplacement '+(unit.location_id||'non attribué'))}else if(loc){close();S.page='locations';S.warehouse=loc.warehouse;render();toast('Emplacement trouvé : '+id)}else dlg.querySelector('#qr-status').textContent='QR inconnu ou non accessible : '+id}
  dlg.querySelector('#qr-lookup').onclick=()=>lookup(dlg.querySelector('#qr-text').value);
  dlg.querySelector('#qr-close').onclick=close;dlg.addEventListener('cancel',e=>{e.preventDefault();close()});
  try{if(!('BarcodeDetector' in window))throw Error('Lecture automatique non prise en charge par ce navigateur');
    detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(closed){stream.getTracks().forEach(t=>t.stop());return}const video=dlg.querySelector('video');video.srcObject=stream;await video.play();
    async function frame(){if(closed)return;try{const codes=await detector.detect(video);if(codes.length){lookup(codes[0].rawValue);return}}catch(e){}if(!closed)setTimeout(frame,350)}frame()
  }catch(e){if(!closed)dlg.querySelector('#qr-status').textContent='Caméra indisponible : '+e.message+'. Utilisez la saisie manuelle.'}
}
async function captureSignature(releaseId,drivers,kind="sortie"){
  if(!drivers?.length){toast('Ajoutez d’abord un chauffeur dans le registre.',true);return null}
  const dialog=document.createElement('dialog');dialog.style='border:0;border-radius:16px;padding:22px;width:min(95vw,660px);box-shadow:0 20px 80px #0006';
  dialog.innerHTML=`<h3>Signature du transporteur</h3><p class="small">${kind === "transfert" ? "Transfert" : "Sortie"} ${esc(releaseId)} · Remise physique uniquement après autorisation exploitation.</p><form id="handover-sign"><label>Chauffeur enregistré<select name="driver_id" required>${opts(drivers,'id','name')}</select></label><label>Nom du signataire<input name="signature_name" required minlength="2" maxlength="150" autocomplete="name"></label><label style="margin-top:12px">Signer avec le doigt, la souris ou le stylet</label><canvas id="signature-pad" style="width:100%;height:190px;border:2px solid #c5d4e0;border-radius:10px;background:white;touch-action:none;display:block"></canvas><p class="small">La signature et l'heure de remise seront conservées avec la sortie. Ne faites signer qu'au moment de la remise effective.</p><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" name="consent" required style="width:auto">Le transporteur confirme la remise physique des colis indiqués.</label><div class="actions" style="margin-top:14px"><button type="button" id="clear-sign" class="ghost">Effacer</button><button type="submit">Valider la remise signée</button><button type="button" id="cancel-sign" class="ghost">Annuler</button></div></form>`;
  document.body.append(dialog);dialog.showModal();
  const canvas=dialog.querySelector('canvas'),ctx=canvas.getContext('2d');canvas.width=900;canvas.height=285;ctx.fillStyle='#fff';ctx.fillRect(0,0,900,285);ctx.strokeStyle='#142d44';ctx.lineWidth=3.8;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,marked=false;
  function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);let a=point(e);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+.1,a.y+.1);ctx.stroke();marked=true});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const a=point(e);ctx.lineTo(a.x,a.y);ctx.stroke()});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drawing=false);
  dialog.querySelector('#clear-sign').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,900,285);marked=false};
  return new Promise(resolve=>{let settled=false;function finish(v){if(settled)return;settled=true;dialog.close();dialog.remove();resolve(v)}
    dialog.querySelector('#cancel-sign').onclick=()=>finish(null);
    dialog.addEventListener('cancel',e=>{e.preventDefault();finish(null)});
    dialog.querySelector('form').onsubmit=e=>{e.preventDefault();if(!marked){toast('Le chauffeur doit signer dans le cadre.',true);return}const f=new FormData(e.target);if(!f.get('driver_id')){toast('Choisissez le chauffeur.',true);return}finish({driver_id:f.get('driver_id'),signature_name:f.get('signature_name').trim(),signature_data:canvas.toDataURL('image/png'),signature_consent:true})};
  })
}
async function downloadFile(path,name){try{let b=await api(path),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast(e.message,true)}}
async function uploadFile(kind,id){let input=document.createElement('input');input.type='file';input.accept='.pdf,.png,.jpg,.jpeg';input.onchange=async()=>{if(!input.files[0])return;let form=new FormData();form.append('file',input.files[0]);try{await api('documents/'+kind+'/'+id,'POST',form);toast('Document ajouté')}catch(e){toast(e.message,true)}};input.click()}
if(S.token)refresh();else loginView();
