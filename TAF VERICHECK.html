<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF VERICHECK v3 — WFS Simple</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0d14; --surface:#0f1419; --surface2:#151a21; --surface3:#1a2028;
  --border:#1e2430; --border2:#2a3242; --border3:#364154;
  --amber:#f59e0b; --amber2:#fbbf24; --amber-bg:rgba(245,158,11,0.1);
  --green:#10b981; --green-bg:rgba(16,185,129,0.1);
  --red:#ef4444; --red-bg:rgba(239,68,68,0.1);
  --orange:#f97316; --orange-bg:rgba(249,115,22,0.1);
  --blue:#3b82f6; --blue-bg:rgba(59,130,246,0.1);
  --text:#e2e8f0; --muted:#64748b; --muted2:#94a3b8;
  --mono:'JetBrains Mono',monospace; --sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.nav-logo{display:flex;align-items:center;gap:12px}
.nav-badge{background:var(--amber);color:#000;font-family:var(--mono);font-size:11px;font-weight:800;padding:4px 10px;border-radius:5px;letter-spacing:1.5px}
.nav-title{font-size:16px;font-weight:800;letter-spacing:2px}
.nav-sub{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:1px;margin-top:2px}
.version{font-size:10px;font-family:var(--mono);color:var(--border3);background:var(--surface2);padding:3px 9px;border-radius:4px;border:1px solid var(--border)}

/* TABS */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;gap:4px}
.tab{background:none;border:none;color:var(--muted);padding:14px 22px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.5px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber)}
.tab-badge{background:var(--red-bg);color:var(--red);font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;margin-left:6px;border:1px solid rgba(239,68,68,.3)}

/* LAYOUT */
.page{padding:32px;max-width:1400px;margin:0 auto}
.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.section-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.section-title-icon{font-size:18px}

/* BUTTONS */
.btn{border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);font-weight:700;letter-spacing:.5px;transition:all .15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;padding:11px 20px}
.btn-primary{background:var(--amber);color:#000}
.btn-primary:hover{background:var(--amber2);transform:translateY(-1px)}
.btn-primary:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed;transform:none}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-sec:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.3);font-size:13px;padding:8px 16px}
.btn-sm{font-size:13px;padding:8px 16px}
.btn-xs{font-size:12px;padding:6px 12px}

/* UPLOAD */
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:40px 28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:var(--amber);background:var(--amber-bg)}
.upload-zone.loaded{border-color:var(--green);border-style:solid;background:var(--green-bg)}
.upload-icon{font-size:32px;margin-bottom:12px;opacity:.6}
.upload-title{font-size:14px;font-weight:700;margin-bottom:6px}
.upload-sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.upload-fname{font-family:var(--mono);font-size:11px;color:var(--green);margin-top:10px;background:rgba(16,185,129,.15);padding:4px 12px;border-radius:5px;border:1px solid rgba(16,185,129,.3)}
.upload-clear{position:absolute;top:12px;right:12px;background:var(--red-bg);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:var(--mono);font-weight:600}
.upload-clear:hover{background:rgba(239,68,68,.2)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.stat-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.stat-value{font-size:28px;font-weight:800;font-family:var(--mono);line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.c-green{color:var(--green)}
.c-red{color:var(--red)}
.c-amber{color:var(--amber)}
.c-orange{color:var(--orange)}
.c-blue{color:var(--blue)}
.c-muted{color:var(--muted2)}

/* TABLE */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface2);padding:12px 16px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:12px 16px;font-family:var(--mono);vertical-align:middle}
.td-lta{color:var(--amber);font-weight:600;letter-spacing:.5px}
.td-dossier{color:var(--blue);font-weight:600}
.td-client{color:var(--text);font-weight:600}
.td-num{text-align:right;font-weight:600}
.row-ok td{background:rgba(16,185,129,.03)}
.row-err td{background:rgba(239,68,68,.03)}
.row-warn td{background:rgba(249,115,22,.03)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.b-ok{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.b-err{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.b-warn{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.b-gray{background:rgba(100,116,139,.15);color:var(--muted2);border:1px solid rgba(100,116,139,.3)}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.form-input,.form-select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:13px}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--amber)}
.form-input::placeholder{color:var(--muted)}

/* ALERT */
.alert{border-radius:10px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:flex-start;gap:14px}
.alert-info{background:var(--amber-bg);border:1px solid rgba(245,158,11,.3)}
.alert-success{background:var(--green-bg);border:1px solid rgba(16,185,129,.3)}
.alert-error{background:var(--red-bg);border:1px solid rgba(239,68,68,.3)}
.alert-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.alert-title{font-size:14px;font-weight:700;margin-bottom:6px}
.alert-info .alert-title{color:var(--amber)}
.alert-success .alert-title{color:var(--green)}
.alert-error .alert-title{color:var(--red)}
.alert-body{font-size:13px;color:var(--muted2);line-height:1.6}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:800;letter-spacing:1px}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:all .15s}
.modal-close:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:20px 24px;border-top:1px solid var(--border);display:flex;gap:12px;justify-content:flex-end}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 40px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-title{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--muted2)}
.empty-text{font-size:13px;font-family:var(--mono)}

/* LOADING */
.loading{display:inline-flex;align-items:center;gap:8px;color:var(--amber);font-family:var(--mono);font-size:13px}
.loading-spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--amber);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ═══════════════════════════════════════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  databaseURL: "https://taf-ops-default-rtdb.europe-west1.firebasedatabase.app"
};

const DB_PATH = "taf_vericheck_v3";

// ═══════════════════════════════════════════════════════════════════════════
// FIREBASE HELPERS
// ═══════════════════════════════════════════════════════════════════════════
async function fbGet(path) {
  const url = `${FIREBASE_CONFIG.databaseURL}/${DB_PATH}/${path}.json`;
  const res = await fetch(url);
  return res.json();
}

async function fbSet(path, data) {
  const url = `${FIREBASE_CONFIG.databaseURL}/${DB_PATH}/${path}.json`;
  await fetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
}

async function fbPush(path, data) {
  const url = `${FIREBASE_CONFIG.databaseURL}/${DB_PATH}/${path}.json`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const json = await res.json();
  return json.name;
}

async function fbDelete(path) {
  const url = `${FIREBASE_CONFIG.databaseURL}/${DB_PATH}/${path}.json`;
  await fetch(url, { method: 'DELETE' });
}

// ═══════════════════════════════════════════════════════════════════════════
// PARSERS
// ═══════════════════════════════════════════════════════════════════════════

// Parse CSV facture WFS
function parseFactureCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  
  const headers = lines[0].split(';');
  const rows = [];
  
  for (let i = 1; i < lines.length; i++) {
    const values = lines[i].split(';');
    const row = {};
    headers.forEach((h, idx) => {
      row[h.trim()] = values[idx] || '';
    });
    rows.push(row);
  }
  
  return rows;
}

// Grouper les lignes par LTA et calculer total HT
function groupByLTA(rows) {
  const grouped = {};
  
  rows.forEach(row => {
    const pref = row['Pref'] || '';
    const lta = row['No de LTA'] || '';
    const ltaKey = (pref + lta).replace(/\s/g, '');
    
    if (!ltaKey) return;
    
    if (!grouped[ltaKey]) {
      grouped[ltaKey] = {
        lta: ltaKey,
        pref: pref,
        numeroLTA: lta,
        poids: parseFloat(String(row['Poids'] || '0').replace(',', '.')) || 0,
        lignes: [],
        totalHT: 0
      };
    }
    
    const ht = parseFloat(String(row['Total H.T.'] || '0').replace(',', '.')) || 0;
    grouped[ltaKey].totalHT += ht;
    grouped[ltaKey].lignes.push({
      nature: row[' Nature Frais Annexes'] || '',
      montantHT: ht
    });
  });
  
  return Object.values(grouped);
}

// Parse fichier dossiers XLS
function parseDossiersXLS(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      
      // Trouver la ligne avec les headers (chercher "Date", "Dossiers", "Documents")
      let headerRow = -1;
      for (let i = 0; i < Math.min(10, json.length); i++) {
        const row = json[i];
        if (row && row.includes('Date') && row.includes('Dossiers') && row.includes('Documents')) {
          headerRow = i;
          break;
        }
      }
      
      if (headerRow === -1) {
        callback([]);
        return;
      }
      
      const headers = json[headerRow];
      const dossiers = [];
      
      for (let i = headerRow + 1; i < json.length; i++) {
        const row = json[i];
        if (!row || row.length === 0) continue;
        
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = row[idx];
        });
        
        // Extraire LTA du champ Documents
        const docs = String(obj['Documents'] || '').replace(/\s/g, '');
        if (docs && docs.length > 5) {
          obj.ltaClean = docs;
          dossiers.push(obj);
        }
      }
      
      callback(dossiers);
    } catch (err) {
      console.error('Erreur parse XLS:', err);
      callback([]);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Matcher facture avec dossiers
function matchFactureDossiers(factureGroups, dossiers) {
  const dossiersIndex = {};
  dossiers.forEach(d => {
    if (d.ltaClean) {
      dossiersIndex[d.ltaClean] = d;
    }
  });
  
  return factureGroups.map(fg => {
    const dossier = dossiersIndex[fg.lta];
    return {
      ...fg,
      dossierMalta: dossier ? dossier['Dossiers'] : null,
      client: dossier ? dossier['Client'] : null,
      matched: !!dossier
    };
  });
}

// Calculer tarif théorique selon type
function calculerTarifTheorique(poids, typeTarif, tarifs) {
  if (!tarifs[typeTarif]) return null;
  
  const grille = tarifs[typeTarif];
  let total = 0;
  
  if (typeTarif === 'animaux_vivants') {
    // Intervention + Station + Transfert
    total += (grille.intervention || 135);
    total += (grille.station || 140); // 47+45+48 base
    
    // Transfert: 0.10€/kg minimum 120€
    const transfert = Math.max(poids * 0.10, 120);
    total += transfert;
    
    // Sortie compagnie
    total += (grille.sortie || 25);
    
  } else if (typeTarif === 'poissons_frais') {
    // Intervention
    total += (grille.intervention || 132);
    
    // Handling (WFS par défaut)
    total += (grille.handling_base || 118);
    total += poids * (grille.handling_kg || 0.115);
    
    // Mise à dispo selon poids
    if (poids < 500) {
      total += 24;
    } else if (poids <= 1000) {
      total += 39;
    } else if (poids <= 2000) {
      total += 69;
    } else {
      total += (poids / 1000) * 49; // 49€ par tonne
    }
    
  } else if (typeTarif === 'cargo') {
    // Frais d'arrivée selon paliers de poids
    if (poids < 1000) {
      total = 180;
    } else if (poids < 2000) {
      total = 200;
    } else if (poids < 3000) {
      total = 235;
    } else if (poids < 4000) {
      total = 280;
    } else if (poids < 5000) {
      total = 310;
    } else if (poids < 6000) {
      total = 350;
    } else if (poids < 7000) {
      total = 390;
    } else {
      total = 440;
    }
  }
  
  return total;
}

// Vérifier avec tarifs
function verifierAvecTarifs(matchedData, clients, tarifs) {
  // Index clients par nom
  const clientsIndex = {};
  clients.forEach(c => {
    clientsIndex[c.nom.toUpperCase()] = c;
  });
  
  return matchedData.map(item => {
    if (!item.client) return { ...item, verification: 'no_client' };
    
    const clientConfig = clientsIndex[item.client.toUpperCase()];
    if (!clientConfig) return { ...item, verification: 'client_non_config' };
    
    const tarifTheorique = calculerTarifTheorique(item.poids, clientConfig.typeTarif, tarifs);
    if (tarifTheorique === null) return { ...item, verification: 'tarif_non_config', typeTarif: clientConfig.typeTarif };
    
    const ecart = item.totalHT - tarifTheorique;
    const ecartPct = Math.abs(ecart / tarifTheorique * 100);
    
    let statut = 'ok';
    if (ecartPct > 10) statut = 'erreur';
    else if (ecartPct > 2) statut = 'avertissement';
    
    return {
      ...item,
      verification: 'verifie',
      typeTarif: clientConfig.typeTarif,
      tarifTheorique,
      ecart,
      ecartPct,
      statut
    };
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// APP COMPONENT
// ═══════════════════════════════════════════════════════════════════════════
function App() {
  const [activeTab, setActiveTab] = useState('upload');
  
  // Upload
  const [factureFile, setFactureFile] = useState(null);
  const [dossiersFile, setDossiersFile] = useState(null);
  const [factureData, setFactureData] = useState([]);
  const [dossiersData, setDossiersData] = useState([]);
  const [matchedData, setMatchedData] = useState([]);
  const [analyzing, setAnalyzing] = useState(false);
  
  // Paramétrage
  const [clients, setClients] = useState([]);
  const [tarifsWFS, setTarifsWFS] = useState({});
  
  // Load data from Firebase
  useEffect(() => {
    loadClients();
    loadTarifs();
  }, []);
  
  async function loadClients() {
    const data = await fbGet('clients');
    setClients(data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : []);
  }
  
  async function loadTarifs() {
    const data = await fbGet('tarifs');
    setTarifsWFS(data || {});
  }
  
  // Analyse facture
  async function analyzeFacture() {
    if (!factureFile || !dossiersFile) return;
    
    setAnalyzing(true);
    
    try {
      // Parse facture CSV
      const factureText = await factureFile.text();
      const factureRows = parseFactureCSV(factureText);
      const grouped = groupByLTA(factureRows);
      setFactureData(grouped);
      
      // Parse dossiers XLS
      parseDossiersXLS(dossiersFile, (dossiers) => {
        setDossiersData(dossiers);
        
        // Match
        const matched = matchFactureDossiers(grouped, dossiers);
        
        // Vérifier avec tarifs
        const verified = verifierAvecTarifs(matched, clients, tarifsWFS);
        setMatchedData(verified);
        
        setAnalyzing(false);
        setActiveTab('verification');
      });
    } catch (err) {
      console.error('Erreur analyse:', err);
      setAnalyzing(false);
    }
  }
  
  // Stats
  const stats = useMemo(() => {
    const verified = matchedData.filter(m => m.verification === 'verifie');
    return {
      total: matchedData.length,
      matched: matchedData.filter(m => m.matched).length,
      unmatched: matchedData.filter(m => !m.matched).length,
      totalHT: matchedData.reduce((sum, m) => sum + m.totalHT, 0),
      verifie: verified.length,
      ok: verified.filter(m => m.statut === 'ok').length,
      avertissement: verified.filter(m => m.statut === 'avertissement').length,
      erreur: verified.filter(m => m.statut === 'erreur').length
    };
  }, [matchedData]);
  
  return (
    <>
      <div className="nav">
        <div className="nav-left">
          <div className="nav-logo">
            <div className="nav-badge">TAF</div>
            <div>
              <div className="nav-title">VERICHECK v3</div>
              <div className="nav-sub">WFS SIMPLE</div>
            </div>
          </div>
        </div>

// TAB: UPLOAD
// ═══════════════════════════════════════════════════════════════════════════
function TabUpload({ factureFile, setFactureFile, dossiersFile, setDossiersFile, analyzing, onAnalyze }) {
  const [dragFacture, setDragFacture] = useState(false);
  const [dragDossiers, setDragDossiers] = useState(false);
  
  function handleFactureFile(file) {
    if (file && (file.name.endsWith('.csv') || file.name.endsWith('.CSV'))) {
      setFactureFile(file);
    }
  }
  
  function handleDossiersFile(file) {
    if (file && (file.name.endsWith('.xls') || file.name.endsWith('.xlsx'))) {
      setDossiersFile(file);
    }
  }
  
  const canAnalyze = factureFile && dossiersFile && !analyzing;
  
  return (
    <>
      <div className="section">
        <div className="section-title">
          <span className="section-title-icon">📄</span>
          Facture WFS (CSV)
        </div>
        
        <div
          className={`upload-zone ${factureFile ? 'loaded' : ''} ${dragFacture ? 'drag' : ''}`}
          onDragOver={(e) => { e.preventDefault(); setDragFacture(true); }}
          onDragLeave={() => setDragFacture(false)}
          onDrop={(e) => {
            e.preventDefault();
            setDragFacture(false);
            handleFactureFile(e.dataTransfer.files[0]);
          }}
          onClick={() => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = (e) => handleFactureFile(e.target.files[0]);
            input.click();
          }}
        >
          <div className="upload-icon">{factureFile ? '✓' : '📥'}</div>
          <div className="upload-title">
            {factureFile ? 'Fichier chargé' : 'Cliquez ou déposez le CSV de la facture'}
          </div>
          <div className="upload-sub">
            {factureFile ? factureFile.name : 'Fichier CSV exporté depuis WFS'}
          </div>
          {factureFile && (
            <div className="upload-clear" onClick={(e) => { e.stopPropagation(); setFactureFile(null); }}>
              ✕
            </div>
          )}
        </div>
      </div>
      
      <div className="section">
        <div className="section-title">
          <span className="section-title-icon">📊</span>
          Dossiers Malta 2026 (XLS)
        </div>
        
        <div
          className={`upload-zone ${dossiersFile ? 'loaded' : ''} ${dragDossiers ? 'drag' : ''}`}
          onDragOver={(e) => { e.preventDefault(); setDragDossiers(true); }}
          onDragLeave={() => setDragDossiers(false)}
          onDrop={(e) => {
            e.preventDefault();
            setDragDossiers(false);
            handleDossiersFile(e.dataTransfer.files[0]);
          }}
          onClick={() => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xls,.xlsx';
            input.onchange = (e) => handleDossiersFile(e.target.files[0]);
            input.click();
          }}
        >
          <div className="upload-icon">{dossiersFile ? '✓' : '📥'}</div>
          <div className="upload-title">
            {dossiersFile ? 'Fichier chargé' : 'Cliquez ou déposez le fichier des dossiers'}
          </div>
          <div className="upload-sub">
            {dossiersFile ? dossiersFile.name : 'Fichier Excel avec tous vos dossiers 2026'}
          </div>
          {dossiersFile && (
            <div className="upload-clear" onClick={(e) => { e.stopPropagation(); setDossiersFile(null); }}>
              ✕
            </div>
          )}
        </div>
      </div>
      
      <div className="section">
        <button 
          className="btn btn-primary" 
          style={{ width: '100%', fontSize: '15px', padding: '14px' }}
          disabled={!canAnalyze}
          onClick={onAnalyze}
        >
          {analyzing ? (
            <><div className="loading-spinner"></div> Analyse en cours...</>
          ) : (
            <>🚀 Analyser & Matcher</>
          )}
        </button>
      </div>
      
      {!canAnalyze && !analyzing && (
        <div className="alert alert-info">
          <div className="alert-icon">💡</div>
          <div>
            <div className="alert-title">Prêt à vérifier vos factures</div>
            <div className="alert-body">
              Uploadez le CSV de la facture WFS et le fichier XLS des dossiers Malta, puis cliquez sur "Analyser & Matcher".
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function TabClients({ clients, onReload }) {
  const [showModal, setShowModal] = useState(false);
  const [editClient, setEditClient] = useState(null);
  
  async function saveClient(data) {
    if (editClient) {
      await fbSet(`clients/${editClient.id}`, data);
    } else {
      await fbPush('clients', data);
    }
    setShowModal(false);
    setEditClient(null);
    onReload();
  }
  
  async function deleteClient(id) {
    if (!confirm('Supprimer ce client ?')) return;
    await fbDelete(`clients/${id}`);
    onReload();
  }
  
  return (
    <>
      <div className="alert alert-info">
        <div className="alert-icon">💡</div>
        <div>
          <div className="alert-title">À quoi sert ce module ?</div>
          <div className="alert-body">
            Pour chaque client TAF, on définit le <strong>type de marchandise</strong> qu'il expédie. 
            Cela permet d'appliquer la bonne grille tarifaire WFS lors de la vérification.
            <br/><br/>
            <strong>Exemple :</strong> URBAN FISH → Animaux vivants → Grille WFS "Animaux vivants"
          </div>
        </div>
      </div>
      
      <div className="section">
        <div className="section-title">
          <span className="section-title-icon">👥</span>
          Mapping Clients → Type de marchandise
        </div>
        
        <button className="btn btn-primary btn-sm" onClick={() => { setEditClient(null); setShowModal(true); }}>
          + Ajouter client
        </button>
      </div>
      
      {clients.length === 0 ? (
        <div className="section">
          <div className="empty">
            <div className="empty-icon">📋</div>
            <div className="empty-title">Aucun client configuré</div>
            <div className="empty-text">Ajoutez vos clients TAF avec leur type de marchandise</div>
          </div>
        </div>
      ) : (
        <div className="section">
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Client TAF</th>
                  <th>Code Compta</th>
                  <th>Type Marchandise</th>
                  <th style={{ width: '120px' }}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {clients.map(c => (
                  <tr key={c.id}>
                    <td className="td-client">{c.nom}</td>
                    <td><span className="badge b-gray">{c.codeCompta}</span></td>
                    <td><span className={`badge ${c.typeTarif === 'animaux_vivants' ? 'b-warn' : c.typeTarif === 'poissons_frais' ? 'b-ok' : 'b-gray'}`}>
                      {c.typeTarif === 'animaux_vivants' ? '🐾 Animaux vivants' : 
                       c.typeTarif === 'poissons_frais' ? '🐟 Poissons frais' : 
                       '📦 Cargo général'}
                    </span></td>
                    <td>
                      <button className="btn btn-sec btn-xs" onClick={() => { setEditClient(c); setShowModal(true); }}>✏️</button>
                      {' '}
                      <button className="btn btn-danger btn-xs" onClick={() => deleteClient(c.id)}>🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      
      {showModal && <ClientModal 
        client={editClient}
        onSave={saveClient}
        onClose={() => { setShowModal(false); setEditClient(null); }}
      />}
    </>
  );
}

// TAB: VERIFICATION
// ═══════════════════════════════════════════════════════════════════════════
function TabVerification({ data, stats, clients, tarifs }) {
  const [filter, setFilter] = useState('all');
  
  const filtered = useMemo(() => {
    if (filter === 'matched') return data.filter(d => d.matched);
    if (filter === 'unmatched') return data.filter(d => !d.matched);
    if (filter === 'ok') return data.filter(d => d.statut === 'ok');
    if (filter === 'erreur') return data.filter(d => d.statut === 'erreur');
    if (filter === 'avertissement') return data.filter(d => d.statut === 'avertissement');
    return data;
  }, [data, filter]);
  
  function fmtEur(n) {
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);
  }
  
  function getRowClass(item) {
    if (!item.matched) return 'row-warn';
    if (item.statut === 'ok') return 'row-ok';
    if (item.statut === 'erreur') return 'row-err';
    if (item.statut === 'avertissement') return 'row-warn';
    return '';
  }
  
  return (
    <>
      {data.length > 0 && (
        <div className="alert alert-info" style={{ marginBottom: 20 }}>
          <div className="alert-icon">ℹ️</div>
          <div>
            <div className="alert-title">Vérification de la facturation WFS</div>
            <div className="alert-body">
              Cette vérification compare <strong>ce que WFS a facturé</strong> avec <strong>ce que WFS devrait facturer</strong> selon ses grilles tarifaires.
              <br/><br/>
              • <strong>Facturé HT</strong> : montant réel sur la facture WFS
              <br/>
              • <strong>Théorique HT</strong> : montant calculé selon les grilles WFS
              <br/>
              • <strong>Écart</strong> : différence entre les deux (positif = surfacturation)
            </div>
          </div>
        </div>
      )}
      
      <div className="stats-grid">
        <div className="stat">
          <div className="stat-label">Total LTA</div>
          <div className="stat-value c-blue">{stats.total}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Matchés</div>
          <div className="stat-value c-green">{stats.matched}</div>
          <div className="stat-sub">{stats.total > 0 ? Math.round(stats.matched / stats.total * 100) : 0}%</div>
        </div>
        <div className="stat">
          <div className="stat-label">Vérifiés</div>
          <div className="stat-value c-amber">{stats.verifie}</div>
        </div>
        <div className="stat">
          <div className="stat-label">✓ OK</div>
          <div className="stat-value c-green">{stats.ok}</div>
        </div>
        <div className="stat">
          <div className="stat-label">⚠ Avertissements</div>
          <div className="stat-value c-orange">{stats.avertissement}</div>
        </div>
        <div className="stat">
          <div className="stat-label">✕ Erreurs</div>
          <div className="stat-value c-red">{stats.erreur}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Total HT</div>
          <div className="stat-value c-blue">{fmtEur(stats.totalHT)}</div>
        </div>
      </div>
      
      {data.length === 0 ? (
        <div className="section">
          <div className="empty">
            <div className="empty-icon">📊</div>
            <div className="empty-title">Aucune donnée à vérifier</div>
            <div className="empty-text">Uploadez et analysez une facture d'abord</div>
          </div>
        </div>
      ) : (
        <div className="section">
          <div style={{ marginBottom: 16, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <button className={`btn ${filter === 'all' ? 'btn-primary' : 'btn-sec'} btn-sm`} onClick={() => setFilter('all')}>
              Tous ({data.length})
            </button>
            <button className={`btn ${filter === 'matched' ? 'btn-primary' : 'btn-sec'} btn-sm`} onClick={() => setFilter('matched')}>
              Matchés ({stats.matched})
            </button>
            <button className={`btn ${filter === 'ok' ? 'btn-primary' : 'btn-sec'} btn-sm`} onClick={() => setFilter('ok')}>
              ✓ OK ({stats.ok})
            </button>
            <button className={`btn ${filter === 'avertissement' ? 'btn-primary' : 'btn-sec'} btn-sm`} onClick={() => setFilter('avertissement')}>
              ⚠ Avertissement ({stats.avertissement})
            </button>
            <button className={`btn ${filter === 'erreur' ? 'btn-primary' : 'btn-sec'} btn-sm`} onClick={() => setFilter('erreur')}>
              ✕ Erreur ({stats.erreur})
            </button>
          </div>
          
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>LTA</th>
                  <th>Dossier</th>
                  <th>Client</th>
                  <th>Type</th>
                  <th>Poids</th>
                  <th>Facturé HT</th>
                  <th>Théorique HT</th>
                  <th>Écart</th>
                  <th>Statut</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((item, idx) => (
                  <tr key={idx} className={getRowClass(item)}>
                    <td className="td-lta">{item.numeroLTA}</td>
                    <td className="td-dossier" style={{ fontSize: 11 }}>{item.dossierMalta || '—'}</td>
                    <td className="td-client" style={{ fontSize: 12 }}>{item.client || '—'}</td>
                    <td>
                      {item.typeTarif && (
                        <span className={`badge ${
                          item.typeTarif === 'animaux_vivants' ? 'b-warn' : 
                          item.typeTarif === 'poissons_frais' ? 'b-ok' : 
                          'b-gray'
                        }`} style={{ fontSize: 9 }}>
                          {item.typeTarif === 'animaux_vivants' ? 'AVI' : 
                           item.typeTarif === 'poissons_frais' ? 'SF' : 
                           'CARGO'}
                        </span>
                      )}
                    </td>
                    <td className="td-num" style={{ fontSize: 12 }}>{item.poids.toFixed(1)} kg</td>
                    <td className="td-num" style={{ fontWeight: 700 }}>{fmtEur(item.totalHT)}</td>
                    <td className="td-num" style={{ color: 'var(--muted2)' }}>
                      {item.tarifTheorique !== undefined ? fmtEur(item.tarifTheorique) : '—'}
                    </td>
                    <td className="td-num" style={{ 
                      fontWeight: 700,
                      color: item.ecart > 0 ? 'var(--red)' : item.ecart < 0 ? 'var(--green)' : 'var(--muted)'
                    }}>
                      {item.ecart !== undefined ? (
                        <>
                          {item.ecart > 0 ? '+' : ''}{fmtEur(item.ecart)}
                          <div style={{ fontSize: 10, marginTop: 2, opacity: 0.7 }}>
                            {item.ecartPct.toFixed(1)}%
                          </div>
                        </>
                      ) : '—'}
                    </td>
                    <td>
                      {!item.matched ? (
                        <span className="badge b-warn">⚠ Non matché</span>
                      ) : item.verification === 'client_non_config' ? (
                        <span className="badge b-gray">Client non config</span>
                      ) : item.verification === 'tarif_non_config' ? (
                        <span className="badge b-gray">Tarif non config</span>
                      ) : item.statut === 'ok' ? (
                        <span className="badge b-ok">✓ OK</span>
                      ) : item.statut === 'avertissement' ? (
                        <span className="badge b-warn">⚠ Avertissement</span>
                      ) : item.statut === 'erreur' ? (
                        <span className="badge b-err">✕ Erreur</span>
                      ) : (
                        <span className="badge b-gray">—</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          
          {stats.erreur > 0 && (
            <div className="alert alert-error" style={{ marginTop: 16 }}>
              <div className="alert-icon">⚠️</div>
              <div>
                <div className="alert-title">{stats.erreur} erreur{stats.erreur > 1 ? 's' : ''} détectée{stats.erreur > 1 ? 's' : ''}</div>
                <div className="alert-body">
                  Écarts tarifaires supérieurs à 10%. Vérifiez la configuration des tarifs ou contactez le service facturation.
                </div>
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
