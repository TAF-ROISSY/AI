<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF VERICHECK v3.3 — Contrôle & Vérification Factures Handlers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b0e17; --surface:#111420; --surface2:#181c2e; --surface3:#1e2238;
  --border:#1f2440; --border2:#2a304f; --border3:#353d66;
  --amber:#f59e0b; --amber2:#fbbf24; --amber-bg:rgba(245,158,11,0.08);
  --green:#10b981; --green-bg:rgba(16,185,129,0.08);
  --red:#ef4444; --red-bg:rgba(239,68,68,0.08);
  --orange:#f97316; --orange-bg:rgba(249,115,22,0.08);
  --blue:#3b82f6; --blue-bg:rgba(59,130,246,0.08);
  --text:#e2e8f0; --muted:#64748b; --muted2:#94a3b8;
  --mono:'JetBrains Mono',monospace; --sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* NAV */
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:56px;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0}
.nav-badge-logo{background:var(--amber);color:#000;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1.5px}
.nav-title{font-size:15px;font-weight:800;letter-spacing:2px}
.nav-sub{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:1.5px;margin-top:1px}
.nav-links{display:flex;gap:2px;flex:1}
.nbtn{background:none;border:none;color:var(--muted2);cursor:pointer;padding:8px 16px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.5px;transition:all .15s;display:flex;align-items:center;gap:7px}
.nbtn:hover{background:var(--surface2);color:var(--text)}
.nbtn.active{background:var(--surface2);color:var(--amber)}
.nbadge{background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-right{display:flex;align-items:center;gap:14px}
.drive-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.drive-lbl{font-size:11px;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.version-tag{font-size:10px;font-family:var(--mono);color:var(--border3);background:var(--surface2);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}

/* LAYOUT */
.page{padding:28px 32px;max-width:1500px;margin:0 auto}
.page-hdr{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start}
.page-title{font-size:22px;font-weight:800;letter-spacing:1px}
.page-sub{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* BUTTONS */
.btn{border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);font-weight:700;letter-spacing:.5px;transition:all .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary{background:var(--amber);color:#000;padding:11px 22px;font-size:14px}
.btn-primary:hover{background:var(--amber2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,.3)}
.btn-primary:disabled{background:var(--border2);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none}
.btn-sec{background:var(--surface2);color:var(--text);padding:9px 18px;font-size:13px;border:1px solid var(--border2)}
.btn-sec:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--red-bg);color:var(--red);padding:6px 12px;font-size:12px;border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-ghost{background:none;color:var(--muted2);padding:7px 12px;font-size:12px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-orange{background:var(--orange-bg);color:var(--orange);padding:6px 12px;font-size:12px;border:1px solid rgba(249,115,22,.3)}

/* UPLOAD */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:28px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);position:relative;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.upload-zone:hover,.upload-zone.drag{border-color:var(--amber);background:var(--amber-bg)}
.upload-zone.loaded{border-color:var(--green);border-style:solid;background:var(--green-bg)}
.upload-icon{font-size:28px;margin-bottom:10px}
.upload-title{font-size:13px;font-weight:700;margin-bottom:4px}
.upload-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.upload-fname{font-family:var(--mono);font-size:11px;color:var(--green);margin-top:8px;background:rgba(16,185,129,.12);padding:3px 10px;border-radius:4px}
.upload-clear{position:absolute;top:10px;right:10px;background:var(--red-bg);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:4px;padding:2px 7px;font-size:11px;cursor:pointer;font-family:var(--mono)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.card-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:border-color .15s}
.stat:hover{border-color:var(--border2)}
.stat-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-val{font-size:24px;font-weight:800;font-family:var(--mono);line-height:1}
.stat-sub{font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.c-green{color:var(--green)} .c-red{color:var(--red)} .c-amber{color:var(--amber)} .c-orange{color:var(--orange)} .c-blue{color:var(--blue)} .c-muted{color:var(--muted2)}

/* ALERT PANELS */
.alert-panel{border-radius:10px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:flex-start;gap:14px}
.alert-err{background:var(--red-bg);border:1px solid rgba(239,68,68,.3)}
.alert-warn{background:var(--orange-bg);border:1px solid rgba(249,115,22,.3)}
.alert-info{background:var(--amber-bg);border:1px solid rgba(245,158,11,.3)}
.alert-ok{background:var(--green-bg);border:1px solid rgba(16,185,129,.3)}
.alert-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.alert-title{font-size:13px;font-weight:700;margin-bottom:4px}
.alert-err .alert-title{color:var(--red)}
.alert-warn .alert-title{color:var(--orange)}
.alert-info .alert-title{color:var(--amber)}
.alert-ok .alert-title{color:var(--green)}
.alert-body{font-size:12px;color:var(--muted2);font-family:var(--mono);line-height:1.6}
.alert-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alert-tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.alert-tag-warn{background:rgba(249,115,22,.15);color:var(--orange);border-color:rgba(249,115,22,.25)}

/* TABS */
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tbtn{background:none;border:none;padding:10px 18px;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tbtn:hover{color:var(--text)}
.tbtn.active{color:var(--amber);border-bottom-color:var(--amber)}

/* TABLE */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:var(--surface2);padding:10px 14px;text-align:left;font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--text)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:9px 14px;font-family:var(--mono);vertical-align:middle}
.td-lta{color:var(--amber2);font-weight:600;letter-spacing:.5px}
.td-dossier{color:var(--blue);font-weight:600}
.td-client{color:var(--muted2)}
.td-num{text-align:right}
.row-err td{background:rgba(239,68,68,.03)}
.row-nf td{background:rgba(249,115,22,.03)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.b-ok{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.b-err{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.b-nf{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.b-imp{background:rgba(100,116,139,.15);color:var(--muted2);border:1px solid rgba(100,116,139,.3)}
.b-warn{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,.3)}

/* FILTERS */
.fbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.fsel{background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:7px;font-family:var(--sans);font-size:13px;cursor:pointer}
.fsel:focus{outline:none;border-color:var(--amber)}
.fsearch{background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:8px 14px;border-radius:7px;font-family:var(--mono);font-size:12px;width:200px}
.fsearch:focus{outline:none;border-color:var(--amber)}
.fsearch::placeholder{color:var(--muted)}
.flbl{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* SYNTHESE */
.synth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:20px}
.synth-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;transition:border-color .15s}
.synth-card:hover{border-color:var(--border2)}
.synth-handler{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.synth-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.synth-row:last-child{border-bottom:none}
.synth-key{font-size:11px;color:var(--muted);font-family:var(--mono)}
.synth-val{font-size:13px;font-family:var(--mono);font-weight:600}
.conformite-bar{height:5px;border-radius:3px;background:var(--border2);margin-top:10px;overflow:hidden}
.conformite-fill{height:100%;border-radius:3px;transition:width .5s}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto}
.modal-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-ttl{font-size:16px;font-weight:800}
.modal-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:2px 6px}
.modal-x:hover{color:var(--text)}
.modal-body{padding:22px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* FORM */
.fg{margin-bottom:14px}
.flabel{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.finput{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:9px 12px;border-radius:7px;font-family:var(--mono);font-size:13px;width:100%;transition:border .15s}
.finput:focus{outline:none;border-color:var(--amber)}
.ftextarea{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:7px;font-family:var(--mono);font-size:12px;width:100%;min-height:140px;resize:vertical}
.ftextarea:focus{outline:none;border-color:var(--amber)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* TARIFF */
.trow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:7px}
.tinput{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:6px;font-family:var(--mono);font-size:12px;width:100%}
.tinput:focus{outline:none;border-color:var(--amber)}
.thdr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 34px;gap:8px;margin-bottom:5px}
.thdr-lbl{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:1px}

/* TOGGLE */
.tog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tog{width:36px;height:20px;background:var(--border2);border-radius:10px;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--amber)}
.tog::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.tog.on::after{left:19px}
.tog-lbl{font-size:12px;font-family:var(--mono);color:var(--text)}

/* HANDLER CARD PARAM */
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;transition:border-color .15s}
.hcard:hover{border-color:var(--border2)}
.hcard-hdr{display:flex;justify-content:space-between;align-items:center}
.hcard-name{font-size:14px;font-weight:700}
.hcard-meta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.prefix-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.ptag{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-size:11px;font-family:var(--mono);color:var(--amber)}

/* MISC */
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-gap{display:flex;gap:10px;align-items:center}
.mt-8{margin-top:8px} .mt-14{margin-top:14px} .mt-20{margin-top:20px}
.mb-14{margin-bottom:14px}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:tin .25s ease;min-width:260px}
.toast-s{border-left:3px solid var(--green)} .toast-e{border-left:3px solid var(--red)} .toast-i{border-left:3px solid var(--amber)}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* PROGRESS */
.prog-wrap{margin-bottom:20px}
.prog-lbl{font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.prog-bar{background:var(--border);border-radius:4px;height:5px;overflow:hidden}
.prog-fill{background:var(--amber);height:100%;border-radius:4px;transition:width .3s}
.prog-step{font-size:11px;color:var(--amber);font-family:var(--mono);margin-top:6px;min-height:16px}

/* EMPTY */
.empty{text-align:center;padding:50px 20px}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-ttl{font-size:15px;font-weight:700;color:var(--muted2);margin-bottom:6px}
.empty-sub{font-size:12px;color:var(--muted);font-family:var(--mono)}

/* PREVIEW MALTA */
.preview-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.preview-item{background:var(--surface2);border-radius:6px;padding:8px 14px;border:1px solid var(--border)}
.preview-item-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.preview-item-val{font-size:16px;font-weight:800;font-family:var(--mono);color:var(--amber)}

/* NON CORRESPONDANCES */
.nc-section{margin-bottom:24px}
.nc-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.nc-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.nc-row:hover{border-color:var(--border2)}
.nc-lta{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--orange);margin-bottom:4px}
.nc-raw{font-family:var(--mono);font-size:10px;color:var(--muted);line-break:anywhere;max-width:600px}
.nc-nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.nc-num{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-size:10px;font-family:var(--mono);color:var(--muted2)}

/* MOBILE RESPONSIVE */
@media (max-width:768px) {
  .nav{padding:0 12px;height:52px}
  .nav-sub{display:none}
  .nbtn{padding:6px 10px;font-size:12px;gap:4px}
  .nav-right{display:none}
  .page{padding:16px}
  .upload-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .fbar{gap:6px}
  .fsearch{width:140px}
  table{font-size:11px}
  thead th,tbody td{padding:7px 8px}
  .synth-grid{grid-template-columns:1fr}
}
@media (max-width:480px) {
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .nbtn span:not(.nbadge){display:none}
}
/* Fix: loaded upload zone stays green on hover */
.upload-zone.loaded:hover{border-color:var(--green);background:var(--green-bg)}
.ld{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.ld-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.ld-row:last-child{border-bottom:none}
.ld-k{font-size:11px;color:var(--muted);font-family:var(--mono)}
.ld-v{font-size:13px;font-family:var(--mono);font-weight:600}

/* CALQUE */
.calque-handler{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden}
.calque-hdr{background:var(--surface2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.calque-hdr-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.calque-hdr-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.calque-tbl{width:100%;border-collapse:collapse;font-size:12px}
.calque-tbl th{padding:8px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface)}
.calque-tbl td{padding:7px 12px;font-family:var(--mono);border-bottom:1px solid var(--border);vertical-align:middle}
.calque-tbl tr:last-child td{border-bottom:none}
.calque-tbl tr:hover td{background:var(--surface2)}
.calque-row-ok td{border-left:3px solid var(--green)}

// Garantit qu'un handler possède la structure `modules` (migration depuis `lignesT` legacy)
function migrateHandler(h) {
  if (!h) return h;
  if (!h.modules || typeof h.modules !== 'object') {
    const mods = { cargo: [], seafood: [], avi: [], fl: [] };

    // S'assurer que tous les modules existent
    for (const id of MODULE_IDS) {
      if (!Array.isArray(h.modules[id])) h.modules[id] = [];
    }
  }
  return h;
}

// Migration de tous les handlers d'un objet params
function migrateParams(params) {
  if (!params || !Array.isArray(params.handlers)) return params;
  params.handlers = params.handlers.map(h => migrateHandler({ ...h }));
  return params;
}

// Compte total de lignes tarifaires sur tous les modules
function countHandlerLignes(h) {
  if (!h) return 0;
  if (h.modules) return MODULE_IDS.reduce((s, id) => s + (h.modules[id]?.length || 0), 0);

}

// Récupère les lignes tarifaires du module correspondant au type produit
function getLignesForProductType(handler, productType) {
  if (!handler) return [];

  }
  return handler.lignesT || [];
}

const fmtEur = v => v == null || isNaN(Number(v)) ? '—' : new Intl.NumberFormat('fr-FR', {
  style: 'currency',
  currency: 'EUR',
  minimumFractionDigits: 2
}).format(v);
const fmtKg = v => v == null || isNaN(Number(v)) ? '—' : `${Number(v).toLocaleString('fr-FR')} kg`;
const fmtPct = v => isNaN(v) || !isFinite(v) ? '0%' : `${Math.round(v)}%`;
const escHTML = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function normalizeAWB(raw) {
  if (!raw) return '';
  const d = raw.replace(/[^0-9]/g, '');
  if (d.length === 11) return `${d.slice(0, 3)}-${d.slice(3)}`;
  if (d.length === 8) return d; // serial seul
  return raw.trim();
}
function calcLigneTarif(lt, poids) {
  let jours = arguments.length > 2 && arguments[2] !== undefined ? arguments[2] : 1;
  if (!lt?.actif || !lt.params || !poids || poids <= 0) return null;
  const p = lt.params;
  switch (lt.type) {
    case 'fixe':
      return p.montant != null ? Number(p.montant) : null;
    case 'kg_brut':
      {
        if (p.taux == null) return null;
        const v = Number(p.taux) * poids;
        return p.mini ? Math.max(v, Number(p.mini)) : v;
      }
    case 'mise_dispo':
      {
        const g = (p.grille || []).find(g => poids >= g.min && poids <= g.max);
        return g ? Number(g.montant) : null;
      }
    case 'frais_station':
      return p.montant != null ? Number(p.montant) : null;
    case 'uc_tranche':
      {
        if (p.taux_uc == null) return null;
        const tranche = Number(p.tranche) || 150;
        const nUC = Math.ceil(poids / tranche);
        return nUC * Number(p.taux_uc);
      }
    case 'uc_tranche_fixe':
      {
        if (p.taux_uc == null && p.montant == null) return null;
        const tranche = Number(p.tranche) || 150;
        const nUC = Math.ceil(poids / tranche);
        const uc = p.taux_uc != null ? nUC * Number(p.taux_uc) : 0;
        const fixe = p.montant != null ? Number(p.montant) : 0;
        return uc + fixe;
      }
    case 'magasinage':
      {
        // Grille progressive par tranches de jours
        // params.grille = [{from:2, to:4, taux:0.15}, {from:5, to:10, taux:0.17}, {from:11, to:null, taux:0.20}]
        if (!p.grille?.length) return null;
        let total = 0,
          hasCalc = false;
        for (const tr of p.grille) {
          const from = Number(tr.from) || 1;
          const to = tr.to != null ? Number(tr.to) : Infinity;
          const daysInRange = Math.min(to, jours) - from + 1;
          if (daysInRange > 0) {
            total += daysInRange * Number(tr.taux || 0) * poids;
            hasCalc = true;
          }
        }
        return hasCalc ? total : null;
      }
    case 'phyto':
    case 'douane':
      return p.montant != null ? Number(p.montant) : null;
    case 'transfert':
      {
        if (p.taux == null) return null;
        const v = Number(p.taux) * poids;
        return p.mini ? Math.max(v, Number(p.mini)) : v;
      }
    case 'custom':
      return p.montant != null ? Number(p.montant) : null;
    default:
      return null;
  }
}
function calcTarif(handler, poids) {
  let jours = arguments.length > 2 && arguments[2] !== undefined ? arguments[2] : 1;
  let productType = arguments.length > 3 ? arguments[3] : null;
  if (!handler || !poids || poids <= 0) return null;

  // ── Format NOUVEAU (modules par type de marchandise) ──
  if (handler.modules) {
    const lignes = getLignesForProductType(handler, productType);
    if (lignes.length) {
      let total = 0, hasCalc = false;
      for (const lt of lignes) {
        if (!lt.actif) continue;
        const v = calcLigneTarif(lt, poids, jours);
        if (v != null) { total += v; hasCalc = true; }
      }
      return hasCalc ? Math.round(total * 100) / 100 : null;
    }
    return null;
  }

  // ── Format intermédiaire (lignesT) — rétrocompatibilité ──
  if (handler.lignesT?.length) {
    let total = 0, hasCalc = false;
    for (const lt of handler.lignesT) {
      if (!lt.actif) continue;
      const v = calcLigneTarif(lt, poids, jours);
      if (v != null) { total += v; hasCalc = true; }
    }
    return hasCalc ? Math.round(total * 100) / 100 : null;
  }

  // ── Format LEGACY (grille) — rétrocompatibilité ──
  const t = handler.grille?.find(g => poids >= g.min && poids <= g.max);
  if (!t) return null;
  let total = t.forfait + poids * t.taux;
  if (handler.taxeMiseADispo && handler.dispoGrille?.length) {
    const d = handler.dispoGrille.find(g => poids >= g.min && poids <= g.max);
    if (d) total += d.montant;
  }
  return Math.round(total * 100) / 100;
}

// ═══════════════════════════════════════════════════════════════════
// PDF PARSING — robuste, reconstruction par position Y
// ═══════════════════════════════════════════════════════════════════
async function parsePDF(file, handlers, onProgress) {
  const lib = window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({
    data: buf
  }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    onProgress && onProgress(p, pdf.numPages);
    const pg = await pdf.getPage(p);
    const tc = await pg.getTextContent();

    // ── Reconstruction lignes par proximité Y (tolérance 5 unités) ──
    const groups = [];
    for (const item of tc.items) {
      if (!item.str.trim()) continue;
      const y = item.transform[5],
        x = item.transform[4];
      const g = groups.find(g => Math.abs(g.y - y) <= 5);
      if (g) g.items.push({
        t: item.str,
        x
      });else groups.push({
        y,
        items: [{
          t: item.str,
          x
        }]
      });
    }
    groups.sort((a, b) => b.y - a.y); // haut → bas

    const lines = groups.map(g => ({
      text: g.items.sort((a, b) => a.x - b.x).map(i => i.t).join(' ').trim(),
      items: g.items.sort((a, b) => a.x - b.x)
    })).filter(l => l.text.length > 2);

    // ── Identification handler via préfixe AWB ──
    const allTxt = lines.map(l => l.text).join(' ');
    const AWB_RE = /\b(\d{3})[-\s]?(\d{8})\b/g;
    const allAWBs = [...allTxt.matchAll(AWB_RE)];
    const pagePrefix = allAWBs[0]?.[1] ?? null;

    // Trouver le handler → priorité : correspondance préfixe exact
    const handler = handlers.find(h => h.prefixesAWB?.includes(pagePrefix)) ?? null;

    // ── Extraction lignes facture ──
    const invoiceLines = [];
    for (const line of lines) {
      const awbMatches = [...line.text.matchAll(AWB_RE)];
      if (!awbMatches.length) continue;
      const awb = normalizeAWB(awbMatches[0][0]);
      const prefix = awbMatches[0][1];

      // Extraire tous les nombres de la ligne dans l'ordre X
      const nums = line.items.map(i => {
        const v = parseFloat(i.t.replace(/\s/g, '').replace(',', '.'));
        return isNaN(v) ? null : {
          x: i.x,
          v
        };
      }).filter(Boolean).filter(n => n.v > 0).sort((a, b) => a.x - b.x).map(n => n.v);

      // ── Résolution poids & montant ──
      // Priorité 1 : index configuré dans le handler
      // Priorité 2 : heuristique intelligente
      const colP = handler?.colPoids;
      const colM = handler?.colMontant;
      let poids = null,
        montant = null;
      if (colP !== null && colP !== undefined && nums[colP] !== undefined) {
        poids = nums[colP];
      }
      if (colM !== null && colM !== undefined && nums[colM] !== undefined) {
        montant = nums[colM];
      }

      // Auto-détection poids : premier nombre entre 0.5 et 50000 (plage poids fret)
      if (poids === null) {

// PRODUCT TYPES CONFIG (from VerifFacture)
// ═══════════════════════════════════════════════════════════════════
function ProductTypesConfig({ params, setParams, toast }) {
  const types = params.productTypes || {};
  const [newClient, setNewClient] = useState({});
  const addClient = (typeKey) => {
    const val = (newClient[typeKey] || '').trim().toUpperCase();
    if (!val) return;
    setParams(p => {
      const pt = { ...(p.productTypes || {}) };
      if (!pt[typeKey]) return p;
      if (pt[typeKey].clients.includes(val)) { toast('Client déjà ajouté', 'error'); return p; }
      pt[typeKey] = { ...pt[typeKey], clients: [...pt[typeKey].clients, val] };
      return { ...p, productTypes: pt };
    });
    setNewClient(nc => ({ ...nc, [typeKey]: '' }));
    toast(`Client ${val} → ${types[typeKey]?.label}`, 'success');
  };
  const removeClient = (typeKey, client) => {
    setParams(p => {
      const pt = { ...(p.productTypes || {}) };
      pt[typeKey] = { ...pt[typeKey], clients: pt[typeKey].clients.filter(c => c !== client) };
      return { ...p, productTypes: pt };
    });
  };
  return React.createElement('div', null,
    React.createElement('div', { style:{ fontSize:12, color:'var(--muted2)', marginBottom:16, fontFamily:'var(--mono)' } },
      'Associez vos clients Malta à un type de produit pour classifier automatiquement les LTA lors de l\'analyse.'
    ),
    React.createElement('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))', gap:14 } },
      Object.entries(types).map(([key, pt]) =>
        React.createElement('div', { key, className:'card' },
          React.createElement('div', { className:'card-title', style:{ display:'flex', alignItems:'center', gap:8 } },
            React.createElement('span', { style:{fontSize:16} }, pt.icon),
            pt.label,
            React.createElement('span', { style:{fontSize:10, fontWeight:400, color:'var(--muted)'} }, `${pt.clients?.length || 0} client(s)`)
          ),
          React.createElement('div', { style:{ minHeight:40, display:'flex', flexWrap:'wrap', gap:4, marginBottom:10 } },
            (pt.clients || []).map(c =>
              React.createElement('span', { key:c, className:'client-tag' },
                c,
                React.createElement('button', { onClick: () => removeClient(key, c) }, '×')
              )
            ),
            (pt.clients || []).length === 0 && React.createElement('span', { style:{fontSize:11, color:'var(--muted)', fontStyle:'italic'} }, 'Aucun client associé')
          ),
          React.createElement('div', { style:{ display:'flex', gap:8 } },
            React.createElement('input', {
              className:'finput', style:{ flex:1 },
              value: newClient[key] || '',
              onChange: e => setNewClient(nc => ({ ...nc, [key]: e.target.value })),
              placeholder: 'Code client Malta',
              onKeyDown: e => { if (e.key === 'Enter') addClient(key); }
            }),
            React.createElement('button', { className:'btn btn-sec btn-sm', onClick: () => addClient(key) }, '+ Ajouter')
          )
        )
      )
    )
  );
}

// CALQUE FACTURE TAB (from VerifFacture)
// ═══════════════════════════════════════════════════════════════════
function CalqueTab({ results, params }) {
  const byHandler = {};
  for (const r of results) {
    const k = r.handlerId || '__inc__';
    if (!byHandler[k]) byHandler[k] = { nom: r.handlerNom, rows: [] };
    byHandler[k].rows.push(r);
  }
  const getStatusInfo = (s) => {
    if (s === 'ok') return { ico: '✅', cls: 'calque-row-ok' };
    if (s === 'erreur') return { ico: '❌', cls: 'calque-row-err' };
    if (s === 'non_trouve') return { ico: '⚠️', cls: 'calque-row-nf' };
    return { ico: '?', cls: 'calque-row-imp' };
  };
  const exportCalqueCSV = () => {
    let csv = 'Statut;LTA;Dossier;Client;Type;Handler;Poids;Facturé;Calculé;Écart\n';
    results.forEach(r => {
      csv += `${r.statut};${r.awb};${r.dossier||''};${r.client||''};${r.productLabel||''};${r.handlerNom};${r.poidsMalta||''};${r.montantFacture||''};${r.montantCalcule||''};${r.ecart||''}\n`;
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'}));
    a.download = `vericheck_calque_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };
  return React.createElement('div', null,
    React.createElement('div', { style: { display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 } },
      React.createElement('div', null,
        React.createElement('div', { style: { fontSize:10, color:'var(--muted)', fontFamily:'var(--mono)', letterSpacing:1 } },
          '✅ Conforme · ❌ Écart · ⚠️ Non trouvé · ? Non calculé'
        )
      ),
      React.createElement('div', { className:'flex-gap' },
        React.createElement('button', { className:'btn btn-sec btn-sm', onClick: exportCalqueCSV }, '📥 CSV'),
        React.createElement('button', { className:'btn btn-ghost btn-sm', onClick: () => window.print() }, '🖨 Imprimer')
      )
    ),
    Object.entries(byHandler).map(([hId, hData]) => {
      const totalHT = hData.rows.reduce((s,r) => s + (r.montantFacture||0), 0);
      return React.createElement('div', { key: hId, className:'calque-handler' },
        React.createElement('div', { className:'calque-hdr' },
          React.createElement('span', { className:'calque-hdr-title' }, '🏢 ', hData.nom, ' — ', hData.rows.length, ' LTA'),
          React.createElement('span', { className:'calque-hdr-sub' }, 'Total HT : ', fmtEur(totalHT))
        ),
        React.createElement('table', { className:'calque-tbl' },
          React.createElement('thead', null,
            React.createElement('tr', null,
              React.createElement('th', { style:{width:40} }, 'St.'),
              React.createElement('th', null, 'N° LTA'),
              React.createElement('th', null, 'Dossier Malta'),
              React.createElement('th', null, 'Client'),
              React.createElement('th', null, 'Type'),
              React.createElement('th', null, 'Poids'),
              React.createElement('th', { style:{textAlign:'right'} }, 'Facturé'),
              React.createElement('th', { style:{textAlign:'right'} }, 'Calculé'),
              React.createElement('th', { style:{textAlign:'right'} }, 'Écart')
            )
          ),
          React.createElement('tbody', null,
            hData.rows.map(r => {
              const si = getStatusInfo(r.statut);
              return React.createElement('tr', { key: r.id, className: si.cls },
                React.createElement('td', { style:{fontSize:15} }, si.ico),
                React.createElement('td', { className:'td-lta' }, r.awb),
                React.createElement('td', { className:'td-dossier' }, r.dossier || '—'),
                React.createElement('td', null, r.client || '—',
                  r.productIcon ? React.createElement('span', { style:{marginLeft:4}, title:r.productLabel }, r.productIcon) : null),
                React.createElement('td', null,
                  r.productType ? React.createElement('span', { className:`pt-badge pt-${r.productType}` }, r.productLabel) :
                  React.createElement('span', { style:{fontSize:10, color:'var(--muted)'} }, '—')
                ),
                React.createElement('td', null, fmtKg(r.poidsMalta)),
                React.createElement('td', { className:'td-num' }, fmtEur(r.montantFacture)),
                React.createElement('td', { className:'td-num' }, fmtEur(r.montantCalcule)),
                React.createElement('td', { className:'td-num', style:{
                  color: r.ecart > 0 ? 'var(--red)' : r.ecart < 0 ? 'var(--green)' : 'var(--muted2)',
                  fontWeight: 600
                } }, r.ecart != null ? (r.ecart>0?'+':'') + fmtEur(r.ecart) : '—')
              );
            })
          )
        )
      );
    })
  );
}

function PageIntegrations({ params, session, toast, litiges }) {
  const [litigeUrl, setLitigeUrl] = useState(() => {
    try { return localStorage.getItem('taf_vc3_litige_url') || ''; } catch { return ''; }
  });
  const [makeUrl, setMakeUrl] = useState(() => {
    try { return localStorage.getItem('taf_vc3_make_url') || ''; } catch { return ''; }
  });
  const [sending, setSending] = useState(false);
  const saveLitigeUrl = () => {
    localStorage.setItem('taf_vc3_litige_url', litigeUrl);
    toast('URL TAF Litige sauvegardée', 'success');
  };
  const saveMakeUrl = () => {
    localStorage.setItem('taf_vc3_make_url', makeUrl);
    toast('URL Make.com sauvegardée', 'success');
  };
  const sendToFacturation = async () => {
    if (!session?.results?.length) { toast('Aucune donnée à transmettre', 'error'); return; }
    const okResults = session.results.filter(r => r.statut === 'ok');
    if (!okResults.length) { toast('Aucune LTA conforme à transmettre', 'error'); return; }
    const payload = {
      source: 'TAF_VERICHECK_v3',
      sentAt: new Date().toISOString(),
      ltas: okResults.map(r => ({
        lta: r.awb, dossier: r.dossier, client: r.client,
        productType: r.productType, montant: r.montantFacture,
        handlerId: r.handlerId
      }))
    };
    localStorage.setItem('taf_vc3_to_facturation', JSON.stringify(payload));
    await driveUpload('vericheck_to_facturation.json', payload);
    toast(`✅ ${okResults.length} LTA conformes transmises à TAF Facturation`, 'success');
  };
  const sendLitiges = async () => {
    if (!litigeUrl) { toast('URL webhook non configurée', 'error'); return; }
    const activeLitiges = litiges.filter(l => l.statut === 'ouvert');
    if (!activeLitiges.length) { toast('Aucun litige ouvert', 'error'); return; }
    setSending(true);
    try {
      await fetch(litigeUrl, {
        method: 'POST', mode: 'no-cors',
        body: JSON.stringify({
          source: 'TAF_VERICHECK_v3',
          sentAt: new Date().toISOString(),
          litiges: activeLitiges
        })
      });
      toast(`📤 ${activeLitiges.length} dossier(s) litige envoyé(s)`, 'success');
    } catch(e) { toast('Erreur envoi: ' + e.message, 'error'); }
    setSending(false);
  };
  const sendMake = async () => {
    if (!makeUrl) { toast('URL webhook non configurée', 'error'); return; }
    if (!session?.results?.length) { toast('Aucune analyse', 'error'); return; }
    setSending(true);
    try {
      const stats = {
        total: session.results.length,
        ok: session.results.filter(r => r.statut === 'ok').length,
        err: session.results.filter(r => r.statut === 'erreur').length,
        nf: session.results.filter(r => r.statut === 'non_trouve').length,
        totalFact: session.results.reduce((s,r) => s + (r.montantFacture||0), 0)
      };
      await fetch(makeUrl, {
        method: 'POST', mode: 'no-cors',
        body: JSON.stringify({
          source: 'TAF_VERICHECK_v3', sentAt: new Date().toISOString(),
          pdfName: session.pdfName, stats, alertes: session.results.filter(r => r.statut !== 'ok')
        })
      });
      toast('✅ Synthèse envoyée à Make.com', 'success');
    } catch(e) { toast('Erreur Make: ' + e.message, 'error'); }
    setSending(false);
  };
  const litOuverts = litiges.filter(l => l.statut === 'ouvert').length;
  return React.createElement('div', { className:'page' },
    React.createElement('div', { className:'page-hdr' },
      React.createElement('div', null,
        React.createElement('div', { className:'page-title' }, '🔗 Intégrations TAF'),
        React.createElement('div', { className:'page-sub' }, 'Connexion avec les autres modules de l\'écosystème TAF')
      )
    ),
    // TAF Facturation
    React.createElement('div', { className:'integ-card active' },
      React.createElement('div', { style:{display:'flex', alignItems:'center', gap:10, marginBottom:10} },
        React.createElement('span', { style:{fontSize:18} }, '🧾'),
        React.createElement('span', { style:{fontSize:14, fontWeight:700} }, 'TAF Facturation'),
        React.createElement('span', { className:'integ-status integ-on' }, '✅ Prêt')
      ),
      React.createElement('div', { style:{fontSize:12, color:'var(--muted2)', marginBottom:14} },
        'Transmet les débours vérifiés (LTA conformes) à TAF Facturation. Lecture du bridge FACTURATION pour croisement des références.'
      ),
      React.createElement('div', { className:'flex-gap' },
        React.createElement('button', { className:'btn btn-primary btn-sm', onClick: sendToFacturation },
          '📤 Envoyer débours validés'),
        React.createElement('span', { style:{fontSize:11, color:'var(--muted)', fontFamily:'var(--mono)'} },
          session?.results ? `${session.results.filter(r=>r.statut==='ok').length} LTA conformes` : 'Aucune analyse')
      )
    ),
    // TAF Litige
    React.createElement('div', { className: `integ-card ${litigeUrl ? 'active' : ''}` },
      React.createElement('div', { style:{display:'flex', alignItems:'center', gap:10, marginBottom:10} },
        React.createElement('span', { style:{fontSize:18} }, '⚖'),
        React.createElement('span', { style:{fontSize:14, fontWeight:700} }, 'TAF Litige'),
        React.createElement('span', { className: `integ-status ${litigeUrl ? 'integ-on' : 'integ-off'}` },
          litigeUrl ? '✅ Configuré' : 'À configurer')
      ),
      React.createElement('div', { style:{fontSize:12, color:'var(--muted2)', marginBottom:14} },
        'Crée un dossier litige pour chaque erreur confirmée via webhook Make.com.'
      ),
      React.createElement('div', { style:{display:'grid', gridTemplateColumns:'1fr auto', gap:10, alignItems:'end', maxWidth:500, marginBottom:12} },
        React.createElement('div', { className:'fg', style:{marginBottom:0} },
          React.createElement('label', { className:'flabel' }, 'URL Webhook TAF Litige'),
          React.createElement('input', { className:'finput', value:litigeUrl, onChange:e=>setLitigeUrl(e.target.value),
            placeholder:'https://hook.eu2.make.com/...' })
        ),
        React.createElement('button', { className:'btn btn-sec btn-sm', onClick:saveLitigeUrl }, 'Enregistrer')
      ),
      React.createElement('div', { className:'flex-gap' },

        React.createElement('span', { style:{fontSize:18} }, '🔄'),
        React.createElement('span', { style:{fontSize:14, fontWeight:700} }, 'Make.com'),
        React.createElement('span', { className: `integ-status ${makeUrl ? 'integ-on' : 'integ-off'}` },
