<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAF — Écosystème Applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --bg-warm: #f5f3f0;
      --bg-card: #ffffff;
      --bg-hover: #f8f7f5;
      --border: #e8e5e0;
      --border-hover: #d4d0c8;
      --text: #1a1a1a;
      --text-secondary: #5c5c5c;
      --text-muted: #9a9a9a;
      --accent: #1a1a1a;
      --accent-warm: #8b7355;
      --gold: #c9a962;
      --gold-soft: #d4bc7c;
      --success: #2d8a5f;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════════════════════════════
       SUBTLE BACKGROUND
    ═══════════════════════════════════════════════════════════════ */
    .bg-pattern {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.015) 1px, transparent 0);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════════════ */
    .header {
      position: relative;
      padding: 80px 32px 60px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, var(--bg-warm) 0%, var(--bg) 100%);
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    }

    .logo-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .logo-mark::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--accent) 50%, var(--gold-soft) 100%);
      z-index: -1;
      opacity: 0.4;
    }

    .logo-mark span {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .logo-sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 24px;
      font-weight: 400;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 36px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      padding: 10px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 100px;
      box-shadow: var(--shadow-sm);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid var(--success);
      opacity: 0.3;
      animation: statusPulse 2.5s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.4); opacity: 0; }
    }

    .status-value {
      font-weight: 600;
      color: var(--text);
    }

    /* ═══════════════════════════════════════════════════════════════
       MAIN CONTENT
    ═══════════════════════════════════════════════════════════════ */
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 32px 100px;
      position: relative;
      z-index: 10;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }

    .section-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      padding: 6px 14px;
      background: var(--bg-warm);
      border-radius: 100px;
    }

    /* ═══════════════════════════════════════════════════════════════
       APP GRID
    ═══════════════════════════════════════════════════════════════ */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .app-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transform: translateY(20px);
      animation: cardFadeIn 0.5s ease forwards;
    }

    .app-card:nth-child(1) { animation-delay: 0.05s; }
    .app-card:nth-child(2) { animation-delay: 0.1s; }
    .app-card:nth-child(3) { animation-delay: 0.15s; }
    .app-card:nth-child(4) { animation-delay: 0.2s; }
    .app-card:nth-child(5) { animation-delay: 0.25s; }
    .app-card:nth-child(6) { animation-delay: 0.3s; }
    .app-card:nth-child(7) { animation-delay: 0.35s; }
    .app-card:nth-child(8) { animation-delay: 0.4s; }
    .app-card:nth-child(9) { animation-delay: 0.45s; }
    .app-card:nth-child(n+10) { animation-delay: 0.5s; }

    @keyframes cardFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .app-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 28px;
      right: 28px;
      height: 3px;
      background: var(--card-accent, var(--accent));
      border-radius: 0 0 3px 3px;
      opacity: 0;
      transform: scaleX(0);
      transition: all 0.35s;
    }

    .app-card:hover::before {
      opacity: 1;
      transform: scaleX(1);
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .app-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-warm);
      border-radius: var(--radius-sm);
      font-size: 24px;
      transition: all 0.35s;
    }

    .app-card:hover .app-icon {
      background: var(--card-accent, var(--accent));
      transform: scale(1.05);
    }

    .app-card:hover .app-icon-inner {
      filter: grayscale(1) brightness(10);
    }

    .app-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge-ops { background: #e8f4f0; color: #1a6b50; }
    .badge-commercial { background: #e5f0ff; color: #2a5599; }
    .badge-factu { background: #fff4e5; color: #a66a1a; }
    .badge-tool { background: #f3f0ff; color: #5a4a9a; }
    .badge-rh { background: #ffe5f0; color: #99355a; }
    .badge-douane { background: #fff0e5; color: #995a2a; }
    .badge-admin { background: #f0f0f0; color: #555555; }

    .app-name {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    .app-card:hover .app-name {
      color: var(--card-accent, var(--accent));
    }

    .app-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .app-arrow {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-warm);
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 14px;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.35s;
    }

    .app-card:hover .app-arrow {
      opacity: 1;
      transform: translateX(0);
      background: var(--card-accent, var(--accent));
      color: #fff;
    }

    /* ═══════════════════════════════════════════════════════════════
       LOADING
    ═══════════════════════════════════════════════════════════════ */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ═══════════════════════════════════════════════════════════════
       FOOTER
    ═══════════════════════════════════════════════════════════════ */
    .footer {
      position: relative;
      text-align: center;
      padding: 60px 32px;
      background: var(--bg-warm);
      z-index: 10;
    }

    .footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    }

    .footer-brand {
      margin-bottom: 24px;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.06em;
    }

    .footer-tagline {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .footer-credits {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .footer-credits .name {
      font-weight: 600;
      color: var(--text);
    }

    .footer-credits .divider {
      color: var(--border-hover);
    }

    .footer-credits .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .footer-credits .ai-badge::before {
      content: '✦';
      color: var(--gold);
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 12px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 100px;
      transition: all 0.3s;
    }

    .footer-link:hover {
      color: var(--text);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
    }

    .footer-link svg {
      width: 16px;
      height: 16px;
    }

    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .header { padding: 60px 20px 48px; }
      .logo-text { font-size: 36px; }
      .main { padding: 32px 20px 80px; }
      .apps-grid { grid-template-columns: 1fr; gap: 16px; }
      .status-bar { gap: 12px; }
      .status-item { padding: 8px 16px; font-size: 12px; }
      .footer { padding: 48px 20px; }
      .footer-credits { flex-direction: column; gap: 12px; }
    }

    @media (max-width: 480px) {
      .logo-mark { width: 60px; height: 60px; border-radius: 14px; }
      .logo-mark span { font-size: 22px; }
      .logo-text { font-size: 28px; letter-spacing: 0.04em; }
      .section-title { font-size: 18px; }
      .app-card { padding: 22px; }
      .app-name { font-size: 15px; }
    }

    /* ═══════════════════════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="bg-pattern"></div>

  <!-- Header -->
  <header class="header">
    <div class="logo-mark">
      <span>TAF</span>
    </div>
    <h1 class="logo-text">TAF</h1>
    <p class="logo-sub">Transit Air Fret</p>
    <p class="tagline">Écosystème d'applications · Paris Charles de Gaulle</p>
    
    <div class="status-bar">
      <div class="status-item">
        <span class="status-dot"></span>
        <span>Système <span class="status-value">Opérationnel</span></span>
      </div>
      <div class="status-item" id="appCount">
        <span>Applications: <span class="status-value">—</span></span>
      </div>
      <div class="status-item" id="lastUpdate">
        <span>Mise à jour: <span class="status-value">—</span></span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="section-header">
      <h2 class="section-title">Applications</h2>
      <span class="section-count" id="sectionCount">—</span>
    </div>
    <div class="apps-grid" id="appsGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Chargement des applications...</div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-brand">
      <div class="footer-logo">TAF</div>
      <div class="footer-tagline">Excellence opérationnelle depuis 1980</div>
    </div>
    <div class="footer-credits">
      <span>By <span class="name">Christophe</span></span>
      <span class="divider">·</span>
      <span>Powered by <span class="ai-badge">Claude AI</span></span>
    </div>
    <a href="https://github.com/TAF-ROISSY/AI" target="_blank" class="footer-link">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      GitHub
    </a>
  </footer>

  <script>
    const REPO = 'TAF-ROISSY/AI';
    const GITHUB_PAGES_BASE = 'https://taf-roissy.github.io/AI/';

    // Couleurs d'accent par catégorie
    const ACCENT_COLORS = {
      ops: '#1a6b50',
      commercial: '#2a5599',
      factu: '#a66a1a',
      tool: '#5a4a9a',
      rh: '#99355a',
      douane: '#995a2a',
      admin: '#555555'
    };

    // Métadonnées des apps
    const APP_META = {
      // OPS & Dashboard
      'TAF OPS': { icon: '📡', desc: 'Dashboard opérations — Import/Export/Seafood', badge: 'ops', badgeClass: 'badge-ops' },
      'TAF STAT': { icon: '📊', desc: 'Statistiques et KPIs opérationnels', badge: 'ops', badgeClass: 'badge-ops' },
      'TAF SUIVI DES VOLS': { icon: '✈️', desc: 'Tracking temps réel des vols cargo', badge: 'ops', badgeClass: 'badge-ops' },
      'TAF CAPTURE': { icon: '📸', desc: 'Capture et documentation terrain', badge: 'ops', badgeClass: 'badge-ops' },
      
      // Commercial & CRM
      'TAF COMMERCIAL': { icon: '💼', desc: 'CRM — Prospects, cotations, suivi commercial', badge: 'commercial', badgeClass: 'badge-commercial' },
      'TAF CONTACT': { icon: '📇', desc: 'Gestion des contacts et annuaire', badge: 'commercial', badgeClass: 'badge-commercial' },
      'TAF COTATION': { icon: '💰', desc: 'Élaboration et suivi des cotations', badge: 'commercial', badgeClass: 'badge-commercial' },
      'TAF COMPAGNIE': { icon: '🏢', desc: 'Base compagnies aériennes partenaires', badge: 'commercial', badgeClass: 'badge-commercial' },
      'TAF LITIGE': { icon: '⚠️', desc: 'Gestion et suivi des litiges', badge: 'commercial', badgeClass: 'badge-commercial' },
      
      // Facturation & Finance
      'TAF FACTURATION': { icon: '🧾', desc: 'Facturation Pro — Génération automatique', badge: 'factu', badgeClass: 'badge-factu' },
      'TAF_FACTURATION_ding': { icon: '🔔', desc: 'Notifications facturation temps réel', badge: 'factu', badgeClass: 'badge-factu' },
      'TAF RECOUVREMENT': { icon: '💳', desc: 'Suivi impayés et relances automatiques', badge: 'factu', badgeClass: 'badge-factu' },
      'TAF VERICHECK': { icon: '✓', desc: 'Vérification factures multi-handler v3.0', badge: 'factu', badgeClass: 'badge-factu' },
      'TAF NOTE DE FRAIS': { icon: '📝', desc: 'Saisie et validation notes de frais', badge: 'factu', badgeClass: 'badge-factu' },
      'TAF RAHAND': { icon: '🤝', desc: 'Rapprochement handling et facturation', badge: 'factu', badgeClass: 'badge-factu' },
      
      // Outils & Config
      'TAF Config Manager': { icon: '⚙️', desc: 'Configuration centralisée des clés API', badge: 'tool', badgeClass: 'badge-tool' },
      'TAF DEPLOY': { icon: '🚀', desc: 'Déploiement GitHub & backup Drive', badge: 'tool', badgeClass: 'badge-tool' },
      'TAFCOFFREFORT': { icon: '🔐', desc: 'Coffre-fort sécurisé documents', badge: 'tool', badgeClass: 'badge-tool' },
      'taf-ps': { icon: '🔧', desc: 'PowerShell & Scripts automation', badge: 'tool', badgeClass: 'badge-tool' },
      
      // RH & Admin
      'TAF CP-RTT': { icon: '🗓', desc: 'Gestion congés payés et RTT', badge: 'rh', badgeClass: 'badge-rh' },
      'TAF Formulaire CP RTT': { icon: '📋', desc: 'Formulaire demande CP/RTT', badge: 'rh', badgeClass: 'badge-rh' },
      'TAF-TEAM': { icon: '👥', desc: 'Gestion équipe et planning', badge: 'rh', badgeClass: 'badge-rh' },
      
      // Douane & EUR1
      'TAF Courrier Douane': { icon: '📨', desc: 'Génération courriers douaniers', badge: 'douane', badgeClass: 'badge-douane' },
      'TAF EUR1': { icon: '🇪🇺', desc: 'Certificats EUR1 & origine', badge: 'douane', badgeClass: 'badge-douane' },
      'TAF_Douane IntelligencE': { icon: '🔍', desc: 'Intelligence douanière avancée', badge: 'douane', badgeClass: 'badge-douane' },
    };

    // Charger les apps
    async function loadApps() {
      const grid = document.getElementById('appsGrid');
      
      try {
        const resp = await fetch(`https://api.github.com/repos/${REPO}/contents`);
        if (!resp.ok) throw new Error('Erreur API GitHub');
        const files = await resp.json();

        const htmlFiles = files.filter(f => 
          f.name.endsWith('.html') && 
          f.name.toLowerCase() !== 'index.html' &&
          f.type === 'file'
        );

        if (htmlFiles.length === 0) {
          grid.innerHTML = '<div class="loading"><div class="loading-text">Aucune application trouvée</div></div>';
          return;
        }

        // Mettre à jour les compteurs
        document.getElementById('appCount').innerHTML = `Applications: <span class="status-value">${htmlFiles.length}</span>`;
        document.getElementById('lastUpdate').innerHTML = `Mise à jour: <span class="status-value">${new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}</span>`;
        document.getElementById('sectionCount').textContent = `${htmlFiles.length} applications`;

        // Générer les cartes
        grid.innerHTML = htmlFiles.map(file => {
          const name = file.name.replace('.html', '');
          const meta = APP_META[name] || { 
            icon: '📄', 
            desc: 'Application TAF', 
            badge: 'tool', 
            badgeClass: 'badge-tool'
          };
          const url = GITHUB_PAGES_BASE + encodeURIComponent(file.name);
          const displayName = name.replace(/_/g, ' ').replace(/-/g, ' ');
          const accentColor = ACCENT_COLORS[meta.badge] || ACCENT_COLORS.tool;

          return `
            <article class="app-card" onclick="window.open('${url}', '_blank')" style="--card-accent: ${accentColor}">
              <div class="app-header">
                <div class="app-icon">
                  <span class="app-icon-inner">${meta.icon}</span>
                </div>
                <span class="app-badge ${meta.badgeClass}">${meta.badge}</span>
              </div>
              <h3 class="app-name">${displayName}</h3>
              <p class="app-desc">${meta.desc}</p>
              <div class="app-arrow">→</div>
            </article>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        grid.innerHTML = `
          <div class="loading">
            <div class="loading-text" style="color: #995a2a;">
              Erreur de connexion: ${err.message}
            </div>
          </div>
        `;
      }
    }

    // Initialiser
    loadApps();
  </script>
</body>
</html>
