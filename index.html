<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TAF ROISSY - Applications Web</title>
  <meta name="description" content="Suite d'applications web TAF pour la gestion des opérations, CRM, facturation et suivi des vols">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
      color: #e8f0f8;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    .header {
      background: linear-gradient(135deg, #1e2a3a 0%, #2a3441 100%);
      border-bottom: 2px solid #e8601a;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-text {
      font-size: 28px;
      font-weight: 900;
      color: #e8f0f8;
      letter-spacing: 1px;
    }
    
    .logo-subtitle {
      font-size: 12px;
      color: #e8601a;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    
    .stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .stat-value {
      font-weight: 900;
      color: #e8601a;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    
    .search-bar {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }
    
    .search-bar:focus-within {
      border-color: #e8601a;
      box-shadow: 0 0 0 3px rgba(232,96,26,0.1);
    }
    
    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e8f0f8;
      font-size: 15px;
      outline: none;
    }
    
    .search-bar input::placeholder {
      color: #64748b;
    }
    
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: 8px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .filter-btn:hover {
      background: rgba(232,96,26,0.1);
      border-color: #e8601a;
      color: #e8601a;
    }
    
    .filter-btn.active {
      background: #e8601a;
      border-color: #e8601a;
      color: white;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .card {
      background: linear-gradient(135deg, #1e2a3a 0%, #2a3441 100%);
      border: 1px solid #3a4451;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #e8601a;
      transform: scaleX(0);
      transition: transform 0.3s;
    }
    
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(232,96,26,0.2);
      border-color: #e8601a;
    }
    
    .card:hover::before {
      transform: scaleX(1);
    }
    
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #e8f0f8;
      margin-bottom: 4px;
    }
    
    .card-version {
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
    }
    
    .card-badge {
      padding: 4px 10px;
      background: rgba(232,96,26,0.15);
      border: 1px solid rgba(232,96,26,0.3);
      border-radius: 6px;
      font-size: 10px;
      color: #e8601a;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .card-size {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    
    .card-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .card-date {
      font-size: 11px;
      color: #64748b;
    }
    
    .card-link {
      color: #e8601a;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .skeleton {
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    .skeleton-text {
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin-bottom: 8px;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 20px;
      color: #fca5a5;
      text-align: center;
    }
    
    .cache-info {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #86efac;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .refresh-btn {
      padding: 6px 12px;
      background: rgba(34,197,94,0.2);
      border: 1px solid rgba(34,197,94,0.4);
      border-radius: 6px;
      color: #86efac;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .refresh-btn:hover {
      background: rgba(34,197,94,0.3);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <div class="logo">
        <div>
          <div class="logo-text">TAF ROISSY</div>
          <div class="logo-subtitle">Applications Web</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span>📂</span>
          <span class="stat-value" id="fileCount">—</span>
          <span>fichiers</span>
        </div>
        <div class="stat">
          <span>⚡</span>
          <span class="stat-value" id="loadTime">—</span>
          <span>ms</span>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Cache info -->
    <div id="cacheInfo" style="display: none;" class="cache-info">
      <div>
        <span>⚡ Cache actif</span>
        <span style="opacity: 0.7; margin-left: 8px; font-size: 12px;" id="cacheDate"></span>
      </div>
      <button class="refresh-btn" onclick="refreshCache()">🔄 Actualiser</button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span>🔍</span>
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Rechercher une application (TAF HUB, TAF COMMERCIAL, VERICHECK...)"
        onkeyup="filterFiles()"
      >
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Tous</button>
      <button class="filter-btn" data-filter=".html" onclick="setFilter('.html')">Applications HTML</button>
      <button class="filter-btn" data-filter=".md" onclick="setFilter('.md')">Documentation</button>
      <button class="filter-btn" data-filter=".json" onclick="setFilter('.json')">Config</button>
    </div>

    <!-- Grid -->
    <div id="fileGrid" class="grid">
      <!-- Loading skeleton -->
      <div class="card skeleton">
        <div class="skeleton-text" style="width: 60%"></div>
        <div class="skeleton-text" style="width: 80%"></div>
        <div class="skeleton-text" style="width: 40%"></div>
      </div>
      <div class="card skeleton">
        <div class="skeleton-text" style="width: 70%"></div>
        <div class="skeleton-text" style="width: 60%"></div>
        <div class="skeleton-text" style="width: 50%"></div>
      </div>
      <div class="card skeleton">
        <div class="skeleton-text" style="width: 55%"></div>
        <div class="skeleton-text" style="width: 75%"></div>
        <div class="skeleton-text" style="width: 45%"></div>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_REPO = 'TAF-ROISSY/AI';
    const GITHUB_BRANCH = 'main';
    const CACHE_KEY = 'taf_files_cache';
    const CACHE_DURATION = 1000 * 60 * 30; // 30 minutes
    
    let allFiles = [];
    let currentFilter = 'all';
    const startTime = performance.now();

    // Descriptions des applications
    const APP_DESCRIPTIONS = {
      'TAF_HUB': 'Tableau de bord central - Passerelle Airtable pour gestion OPS',
      'TAF_COMMERCIAL': 'CRM & Prospection - Tarifs, templates emails, recherche IA',
      'TAF_VERICHECK': 'Vérification documents - Multi-handler, calque facture, intégrations',
      'TAF_FACTURATION': 'Gestion facturation - Envoi automatique, calculs douane',
      'TAF_TEAM': 'Gestion équipe - Absences, congés, plannings',
      'TAF_TV': 'Tableau de bord TV - Compteurs déclarations en temps réel',
      'TAF_SUIVI_DES_VOLS': 'Suivi des vols - Synchronisation Firebase, alertes',
      'TAF_PERAC': 'Facturation PERAC - Gestion des frais et débours',
      'TAF_DEPLOY': 'Gestionnaire de déploiement - GitHub API, backup Drive',
      'TAF_CONFIG': 'Gestionnaire de configuration - Clés API centralisées',
      'VERICHECK': 'Vérification de documents - Version standalone',
      'GUIDE': 'Documentation - Guides d\'intégration et d\'utilisation'
    };

    // Charger les fichiers
    async function loadFiles() {
      try {
        // Vérifier le cache
        const cached = localStorage.getItem(CACHE_KEY);
        const cacheTime = localStorage.getItem(CACHE_KEY + '_time');
        
        if (cached && cacheTime && (Date.now() - parseInt(cacheTime)) < CACHE_DURATION) {
          console.log('📦 Chargement depuis le cache');
          allFiles = JSON.parse(cached);
          displayFiles(allFiles);
          showCacheInfo(new Date(parseInt(cacheTime)));
          updateStats(allFiles.length);
          return;
        }

        // Sinon, charger depuis GitHub
        console.log('🌐 Chargement depuis GitHub');
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`);
        
        if (!response.ok) throw new Error('Erreur GitHub API');
        
        const data = await response.json();
        
        // Filtrer uniquement les fichiers (pas les dossiers)
        allFiles = data.tree
          .filter(item => item.type === 'blob')
          .filter(item => !item.path.startsWith('.'))
          .filter(item => !item.path.includes('node_modules'))
          .filter(item => !item.path.includes('_backups'))
          .map(item => ({
            name: item.path.split('/').pop(),
            path: item.path,
            size: item.size,
            url: `https://taf-roissy.github.io/AI/${item.path}`,
            rawUrl: `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/${item.path}`,
            type: item.path.split('.').pop().toLowerCase()
          }));

        // Sauvegarder dans le cache
        localStorage.setItem(CACHE_KEY, JSON.stringify(allFiles));
        localStorage.setItem(CACHE_KEY + '_time', Date.now().toString());
        
        displayFiles(allFiles);
        updateStats(allFiles.length);
        
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('fileGrid').innerHTML = `
          <div class="error">
            <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
            <div style="font-weight: 700; margin-bottom: 8px;">Erreur de chargement</div>
            <div style="font-size: 13px; opacity: 0.8;">${error.message}</div>
            <button onclick="refreshCache()" style="margin-top: 16px; padding: 8px 16px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); border-radius: 6px; color: #fca5a5; cursor: pointer; font-weight: 700;">
              Réessayer
            </button>
          </div>
        `;
      }
    }

    function displayFiles(files) {
      const grid = document.getElementById('fileGrid');
      
      if (files.length === 0) {
        grid.innerHTML = '<div class="loading">Aucun fichier trouvé</div>';
        return;
      }

      grid.innerHTML = files.map(file => {
        const appName = file.name.replace('.html', '').replace(/_/g, ' ');
        const description = getDescription(file.name);
        const badge = getBadge(file.type);
        const version = extractVersion(file.name);
        
        return `
          <div class="card" onclick="window.open('${file.url}', '_blank')">
            <div class="card-header">
              <div>
                <div class="card-title">${appName}</div>
                ${version ? `<div class="card-version">${version}</div>` : ''}
              </div>
              <div class="card-badge">${badge}</div>
            </div>
            <div class="card-size">📦 ${formatSize(file.size)}</div>
            ${description ? `<div class="card-desc">${description}</div>` : ''}
            <div class="card-footer">
              <div class="card-date">Cliquer pour ouvrir</div>
              <a href="${file.url}" class="card-link" onclick="event.stopPropagation()">
                Ouvrir →
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function getDescription(filename) {
      const nameUpper = filename.toUpperCase();
      for (const [key, desc] of Object.entries(APP_DESCRIPTIONS)) {
        if (nameUpper.includes(key)) return desc;
      }
      return '';
    }

    function getBadge(type) {
      const badges = {
        'html': 'APP',
        'md': 'DOC',
        'json': 'CONFIG',
        'js': 'SCRIPT',
        'css': 'STYLE'
      };
      return badges[type] || type.toUpperCase();
    }

    function extractVersion(filename) {
      const match = filename.match(/v?(\d+\.?\d*\.?\d*)/i);
      return match ? `v${match[1]}` : null;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function filterFiles() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allFiles.filter(file => {
        const matchesSearch = file.name.toLowerCase().includes(search) || 
                             file.path.toLowerCase().includes(search);
        const matchesFilter = currentFilter === 'all' || 
                             file.name.endsWith(currentFilter);
        return matchesSearch && matchesFilter;
      });
      
      displayFiles(filtered);
    }

    function setFilter(filter) {
      currentFilter = filter;
      
      // Update UI
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      
      filterFiles();
    }

    function updateStats(count) {
      const loadTime = Math.round(performance.now() - startTime);
      document.getElementById('fileCount').textContent = count;
      document.getElementById('loadTime').textContent = loadTime;
    }

    function showCacheInfo(date) {
      const info = document.getElementById('cacheInfo');
      const dateEl = document.getElementById('cacheDate');
      info.style.display = 'flex';
      dateEl.textContent = `Mis à jour: ${date.toLocaleString('fr-FR')}`;
    }

    function refreshCache() {
      localStorage.removeItem(CACHE_KEY);
      localStorage.removeItem(CACHE_KEY + '_time');
      location.reload();
    }

    // Charger au démarrage
    loadFiles();
  </script>
</body>
</html>
