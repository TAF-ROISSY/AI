<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAF CP/RTT v4.2 — Gestion des Congés</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const VER = "5.2.0";
const FB = "https://taf-ops-default-rtdb.europe-west1.firebasedatabase.app";
const COLORS = ["#3b82f6","#8b5cf6","#ef4444","#f59e0b","#10b981","#ec4899","#06b6d4","#f97316","#6366f1","#84cc16"];

const fbGet = async (p) => { try { const r = await fetch(`${FB}/${p}.json`); return r.ok ? await r.json() : null; } catch { return null; } };
const fbSet = async (p, d) => { try { const r = await fetch(`${FB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); return r.ok; } catch { return false; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const fmt = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }) : "—";
const fmtS = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) : "—";
const diffDays = (a, b) => Math.max(1, Math.ceil((new Date(b) - new Date(a)) / 86400000) + 1);

const defaultCfg = () => ({
  supervisorPin: "2709",
  webhookMake: "https://hook.eu2.make.com/4th5kwceaitf63o1dt5xfac85vkceiwq",
  webhookSlack: "",
  emailAdmin: "christophe@taftrans.fr",
  emailCC: "sebastien@taftrans.fr,jeanbaptiste@taftrans.fr",
  driveProxy: "",
  driveFolder: ""
});

// ═══ PROFESSIONAL EMAIL TEMPLATES ═══
const EMAILS = {
  demandeReçue: (collab, dem) => ({
    subject: `Demande de ${dem.type} — ${collab.prenom} ${collab.nom}`,
    body: `Bonjour,\n\nUne nouvelle demande de congé a été soumise et nécessite votre validation.\n\nCollaborateur : ${collab.prenom} ${collab.nom}\nType : ${dem.type}\nDu : ${fmt(dem.dateDebut)}\nAu : ${fmt(dem.dateFin)}\nDurée : ${dem.nbJours} jour(s)\nMotif : ${dem.motif || "Non précisé"}\n\nMerci de traiter cette demande dans les meilleurs délais.\n\nCordialement,\nSystème TAF CP/RTT`
  }),
  validee: (collab, dem) => ({
    subject: `Congé validé — ${collab.prenom} ${collab.nom} — ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)}`,
    body: `Bonjour ${collab.prenom},\n\nNous avons le plaisir de vous informer que votre demande de ${dem.type} a été acceptée.\n\nDétails :\n— Type : ${dem.type}\n— Du : ${fmt(dem.dateDebut)}\n— Au : ${fmt(dem.dateFin)}\n— Durée : ${dem.nbJours} jour(s)\n\nVotre solde mis à jour est disponible dans votre espace personnel.\n\nBon repos !\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`
  }),
  refusee: (collab, dem) => ({
    subject: `Demande de congé non retenue — ${collab.prenom} ${collab.nom}`,
    body: `Bonjour ${collab.prenom},\n\nAprès examen, nous ne sommes malheureusement pas en mesure d'accepter votre demande de ${dem.type} du ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)}.\n\nN'hésitez pas à proposer d'autres dates ou à en discuter directement.\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`
  }),
  modification: (collab, dem) => ({
    subject: `Modification de congé — ${collab.prenom} ${collab.nom}`,
    body: `Bonjour,\n\nUne modification de congé a été effectuée.\n\nCollaborateur : ${collab.prenom} ${collab.nom}\nType : ${dem.type}\nNouvelles dates : ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)}\nDurée : ${dem.nbJours} jour(s)\n\nCordialement,\nSystème TAF CP/RTT`
  }),
  confirmationRH: (collab, dem) => ({
    subject: `[CONFIRMATION] Congé validé — ${collab.prenom} ${collab.nom} — ${fmt(dem.dateDebut)}/${fmt(dem.dateFin)}`,
    body: `Bonjour,\n\nPour information, le congé suivant a été validé :\n\nCollaborateur : ${collab.prenom} ${collab.nom}\nPoste : ${collab.poste || "—"}\nType : ${dem.type}\nDu : ${fmt(dem.dateDebut)}\nAu : ${fmt(dem.dateFin)}\nDurée : ${dem.nbJours} jour(s)\nSolde restant CP : ${collab.soldeCP} j / RTT : ${collab.soldeRTT} j\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`
  })
};

function App() {
  const [collabs, setCollabs] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [cfg, setCfg] = useState(defaultCfg());
  const [screen, setScreen] = useState("home");
  const [user, setUser] = useState(null);
  const [pin, setPin] = useState("");
  const [pinTarget, setPinTarget] = useState(null);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [calMonth, setCalMonth] = useState(new Date().getMonth());
  const [calYear, setCalYear] = useState(new Date().getFullYear());
  const [formData, setFormData] = useState({ type: "CP", dateDebut: "", dateFin: "", motif: "" });
  const [editCollab, setEditCollab] = useState(null);
  const [empTab, setEmpTab] = useState("demande");
  const [supTab, setSupTab] = useState("validation");
  const [editDemande, setEditDemande] = useState(null);
  const [editSolde, setEditSolde] = useState(null);
  const [confirmAction, setConfirmAction] = useState(null);
  const [newCollab, setNewCollab] = useState(null);
  
  // Vacations states
  const [vacations, setVacations] = useState({});
  const [vacMonth, setVacMonth] = useState(new Date().getMonth());
  const [vacYear, setVacYear] = useState(new Date().getFullYear());
  const [draggedCollab, setDraggedCollab] = useState(null);

  const show = (m, t = "ok") => { setToast({ m, t }); setTimeout(() => setToast(null), 3000); };

  // ═══ LOAD FROM FIREBASE ═══
  useEffect(() => {
    (async () => {
      const [c, d, cf, v] = await Promise.all([
        fbGet("taf_cprtt/collaborateurs"),
        fbGet("taf_cprtt/demandes"),
        fbGet("taf_cprtt/config"),
        fbGet("taf_cprtt/vacations")
      ]);
      if (c) setCollabs(Array.isArray(c) ? c : Object.values(c));
      if (d) setDemandes(Array.isArray(d) ? d : Object.values(d));
      if (cf) setCfg(prev => ({ ...prev, ...cf }));
      if (v) setVacations(v);
      // Import from TAF TEAM if no collabs exist
      if (!c || (Array.isArray(c) && c.length === 0)) {
        const team = await fbGet("team");
        if (team) {
          const imported = Object.entries(team).map(([id, m], i) => ({
            id, nom: m.nom || m.name || "", prenom: m.prenom || m.firstName || "",
            poste: m.poste || m.role || "", email: m.email || "",
            pin: "", color: COLORS[i % COLORS.length],
            soldeCP: 25, soldeRTT: 10, actif: true
          }));
          if (imported.length > 0) {
            setCollabs(imported);
            await fbSet("taf_cprtt/collaborateurs", imported);
            show(`${imported.length} profils importés depuis TAF TEAM`);
          }
        }
      }
      setLoading(false);
    })();
  }, []);

  // ═══ SAVE ═══
  const saveCollabs = async (newC) => { setCollabs(newC); await fbSet("taf_cprtt/collaborateurs", newC); syncResume(newC, demandes); };
  const saveDemandes = async (newD) => { setDemandes(newD); await fbSet("taf_cprtt/demandes", newD); syncResume(collabs, newD); };
  const saveCfg = async (newCfg) => { setCfg(newCfg); await fbSet("taf_cprtt/config", newCfg); show("Config sauvegardée"); };

  // ═══ CROSS-SYNC RESUME FOR TAF TEAM ═══
  const syncResume = async (c, d) => {
    const approved = (d || []).filter(x => x.statut === "validee");
    const td = today();
    const absents = approved.filter(x => x.dateDebut <= td && x.dateFin >= td);
    await fbSet("taf_cprtt/resume", {
      lastSync: new Date().toISOString(), totalCollabs: (c || []).length,
      demandesEnAttente: (d || []).filter(x => x.statut === "en_attente").length,
      demandesApprouvees: approved.length, nbAbsents: absents.length,
      absentsAujourdhui: absents.map(x => { const col = (c || []).find(cc => cc.id === x.collaborateurId); return col ? `${col.prenom} ${col.nom}` : "?"; }),
      prochaines: approved.filter(x => x.dateDebut > td).sort((a, b) => a.dateDebut.localeCompare(b.dateDebut)).slice(0, 5).map(x => { const col = (c || []).find(cc => cc.id === x.collaborateurId); return { qui: col ? `${col.prenom}` : "?", type: x.type, du: x.dateDebut, au: x.dateFin, jours: x.nbJours }; })
    });
  };

  // ═══ WEBHOOK NOTIFICATIONS ═══
  const notify = async (type, collab, demande, sendCC = false) => {
    const tpl = EMAILS[type]?.(collab, demande);
    if (!tpl) return;
    
    // Helper function with timeout
    const fetchWithTimeout = (url, options, timeout = 5000) => {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeout))
      ]);
    };
    
    // Email via Make - non-blocking
    if (cfg.webhookMake) {
      const payload = { 
        from: cfg.emailAdmin, 
        to: type === "demandeReçue" || type === "modification" ? cfg.emailAdmin : collab.email, 
        cc: sendCC && (type === "validee" || type === "refusee") ? "sebastien@taftrans.fr,jeanbaptiste@taftrans.fr" : "", 
        subject: tpl.subject, 
        body: tpl.body, 
        type: "cp_rtt_" + type 
      };
      
      // Send email without blocking
      fetchWithTimeout(cfg.webhookMake, { 
        method: "POST", 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify(payload) 
      }, 5000).catch(err => console.log("Email error (non-blocking):", err));
      
      // Confirmation RH on validation ONLY if sendCC
      if (type === "validee" && sendCC) {
        const rh = EMAILS.confirmationRH(collab, demande);
        fetchWithTimeout(cfg.webhookMake, { 
          method: "POST", 
          headers: { "Content-Type": "application/json" }, 
          body: JSON.stringify({ 
            from: cfg.emailAdmin, 
            to: "sebastien@taftrans.fr,jeanbaptiste@taftrans.fr", 
            subject: rh.subject, 
            body: rh.body, 
            type: "cp_rtt_confirmation_rh" 
          }) 
        }, 5000).catch(err => console.log("RH email error (non-blocking):", err));
      }
    }
    
    // Slack - non-blocking
    if (cfg.webhookSlack) {
      const icon = type === "validee" ? "✅" : type === "refusee" ? "❌" : "📋";
      fetchWithTimeout(cfg.webhookSlack, { 
        method: "POST", 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify({ 
          text: `${icon} *${tpl.subject}*\n${collab.prenom} ${collab.nom} — ${demande.type} du ${fmtS(demande.dateDebut)} au ${fmtS(demande.dateFin)} (${demande.nbJours}j)` 
        }) 
      }, 5000).catch(err => console.log("Slack error (non-blocking):", err));
    }
  };

  // ═══ CHECK AVAILABILITY ═══
  const isSlotAvailable = (dateDebut, dateFin, excludeId = null) => {
    const approved = demandes.filter(d => d.statut === "validee" && d.id !== excludeId);
    const conflicts = approved.filter(d => d.dateDebut <= dateFin && d.dateFin >= dateDebut);
    // Max 2 absents simultanés (sur 5 personnes)
    if (conflicts.length >= 2) return { ok: false, msg: `Créneau complet — ${conflicts.length} personne(s) déjà absente(s)`, conflicts };
    return { ok: true, conflicts };
  };

  // ═══ SUBMIT REQUEST ═══
  const submitRequest = async () => {
    if (!formData.dateDebut || !formData.dateFin) { show("Dates requises", "err"); return; }
    if (formData.dateDebut > formData.dateFin) { show("Date début > date fin", "err"); return; }
    const avail = isSlotAvailable(formData.dateDebut, formData.dateFin);
    if (!avail.ok) { show(avail.msg, "err"); return; }
    const nbJours = diffDays(formData.dateDebut, formData.dateFin);
    const dem = { id: uid(), collaborateurId: user.id, type: formData.type, dateDebut: formData.dateDebut, dateFin: formData.dateFin, nbJours, motif: formData.motif, statut: "en_attente", dateDemande: new Date().toISOString() };
    const newD = [...demandes, dem];
    await saveDemandes(newD);
    notify("demandeReçue", user, dem); // Non-blocking
    setFormData({ type: "CP", dateDebut: "", dateFin: "", motif: "" });
    show("Demande envoyée — notification en cours d'envoi au superviseur");
  };

  // ═══ VALIDATE / REFUSE ═══
  const handleValidation = async (demId, action, sendCC = false) => {
    const dem = demandes.find(d => d.id === demId);
    if (!dem) return;
    const collab = collabs.find(c => c.id === dem.collaborateurId);
    if (!collab) return;
    const newStatut = action === "valider" ? "validee" : "refusee";
    const newD = demandes.map(d => d.id === demId ? { ...d, statut: newStatut, dateValidation: new Date().toISOString(), validePar: "Christophe Hermann" } : d);
    // Décompter les jours si validé
    if (action === "valider") {
      const field = dem.type === "RTT" ? "soldeRTT" : "soldeCP";
      const newC = collabs.map(c => c.id === collab.id ? { ...c, [field]: Math.max(0, (c[field] || 0) - dem.nbJours) } : c);
      await saveCollabs(newC);
    }
    await saveDemandes(newD);
    // Send notifications without blocking UI
    notify(newStatut === "validee" ? "validee" : "refusee", collab, dem, sendCC);
    show(action === "valider" ? `Congé validé${sendCC ? " — notifications en cours d'envoi (+ CC Seb & JB)" : " — notification en cours d'envoi"}` : "Demande refusée — notification en cours d'envoi");
  };

  // ═══ CANCEL VALIDATED REQUEST ═══
  const handleCancelDemande = async (demId) => {
    const dem = demandes.find(d => d.id === demId);
    if (!dem) return;
    const collab = collabs.find(c => c.id === dem.collaborateurId);
    if (!collab) return;
    
    // Restore solde if it was validated
    if (dem.statut === "validee") {
      const field = dem.type === "RTT" ? "soldeRTT" : "soldeCP";
      const newC = collabs.map(c => c.id === collab.id ? { ...c, [field]: (c[field] || 0) + dem.nbJours } : c);
      await saveCollabs(newC);
    }
    
    // Mark as cancelled
    const newD = demandes.map(d => d.id === demId ? { ...d, statut: "annulee", dateAnnulation: new Date().toISOString(), annulePar: "Christophe Hermann" } : d);
    await saveDemandes(newD);
    
    // Notify - non-blocking with timeout
    const emailData = {
      from: cfg.emailAdmin,
      to: collab.email,
      cc: "",
      subject: `Congé annulé — ${collab.prenom} ${collab.nom}`,
      body: `Bonjour ${collab.prenom},\n\nVotre congé du ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)} (${dem.type}) a été annulé.\n\nSi besoin, n'hésitez pas à soumettre une nouvelle demande.\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`,
      type: "cp_rtt_annulation"
    };
    if (cfg.webhookMake) {
      Promise.race([
        fetch(cfg.webhookMake, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(emailData) }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 5000))
      ]).catch(err => console.log("Email annulation error (non-blocking):", err));
    }
    
    show("Demande annulée — solde restauré et notification en cours d'envoi");
    setConfirmAction(null);
  };

  // ═══ MODIFY REQUEST ═══
  const handleModifyDemande = async () => {
    if (!editDemande) return;
    const dem = demandes.find(d => d.id === editDemande.id);
    if (!dem) return;
    const collab = collabs.find(c => c.id === dem.collaborateurId);
    if (!collab) return;

    // Calculate difference in days
    const oldNbJours = dem.nbJours;
    const newNbJours = diffDays(editDemande.dateDebut, editDemande.dateFin);
    const diff = newNbJours - oldNbJours;

    // Adjust solde if validated
    if (dem.statut === "validee" && diff !== 0) {
      const field = dem.type === "RTT" ? "soldeRTT" : "soldeCP";
      const newC = collabs.map(c => c.id === collab.id ? { ...c, [field]: Math.max(0, (c[field] || 0) - diff) } : c);
      await saveCollabs(newC);
    }

    // Update demande
    const newD = demandes.map(d => d.id === editDemande.id ? { 
      ...d, 
      dateDebut: editDemande.dateDebut, 
      dateFin: editDemande.dateFin, 
      nbJours: newNbJours,
      motif: editDemande.motif,
      dateModification: new Date().toISOString(),
      modifiePar: "Christophe Hermann"
    } : d);
    await saveDemandes(newD);

    // Notify - non-blocking
    notify("modification", collab, { ...dem, dateDebut: editDemande.dateDebut, dateFin: editDemande.dateFin, nbJours: newNbJours, motif: editDemande.motif });
    
    show("Demande modifiée — notification en cours d'envoi");
    setEditDemande(null);
  };

  // ═══ ADJUST SOLDE ═══
  const handleAdjustSolde = async () => {
    if (!editSolde) return;
    const newC = collabs.map(c => c.id === editSolde.id ? editSolde : c);
    await saveCollabs(newC);
    show("Soldes mis à jour");
    setEditSolde(null);
  };

  // ═══ ADD PROFILE ═══
  const handleAddProfile = async () => {
    if (!newCollab) return;
    if (!newCollab.nom || !newCollab.prenom) { show("Nom et prénom requis", "err"); return; }
    
    const profile = {
      id: uid(),
      nom: newCollab.nom,
      prenom: newCollab.prenom,
      poste: newCollab.poste || "",
      email: newCollab.email || "",
      pin: newCollab.pin || "",
      color: newCollab.color || COLORS[collabs.length % COLORS.length],
      soldeCP: parseInt(newCollab.soldeCP) || 25,
      soldeRTT: parseInt(newCollab.soldeRTT) || 10,
      actif: true
    };
    
    const newC = [...collabs, profile];
    await saveCollabs(newC);
    show(`Profil ${profile.prenom} ${profile.nom} créé`);
    setNewCollab(null);
  };

  // ═══ DELETE PROFILE ═══
  const handleDeleteProfile = async (collabId) => {
    const collab = collabs.find(c => c.id === collabId);
    if (!collab) return;
    
    // Check if has pending or future requests
    const hasRequests = demandes.some(d => d.collaborateurId === collabId && (d.statut === "en_attente" || d.statut === "validee"));
    if (hasRequests) {
      show("Impossible de supprimer : demandes en cours ou à venir", "err");
      return;
    }
    
    const newC = collabs.map(c => c.id === collabId ? { ...c, actif: false } : c);
    await saveCollabs(newC);
    show(`Profil ${collab.prenom} ${collab.nom} désactivé`);
    setConfirmAction(null);
  };

  // ═══ VACATIONS MANAGEMENT ═══
  const saveVacations = async (v) => {
    await fbSet("taf_cprtt/vacations", v);
    setVacations(v);
  };

  const handleDrop = async (dateStr) => {
    if (!draggedCollab) return;
    const monthKey = `${vacYear}-${String(vacMonth + 1).padStart(2, "0")}`;
    const newV = { ...vacations };
    if (!newV[monthKey]) newV[monthKey] = { days: {}, validated: false };
    if (!newV[monthKey].days[dateStr]) newV[monthKey].days[dateStr] = [];
    
    // Toggle: if already assigned, remove; otherwise add
    const idx = newV[monthKey].days[dateStr].indexOf(draggedCollab.id);
    if (idx >= 0) {
      newV[monthKey].days[dateStr].splice(idx, 1);
    } else {
      newV[monthKey].days[dateStr].push(draggedCollab.id);
    }
    
    await saveVacations(newV);
    setDraggedCollab(null);
  };

  const removeVacation = async (dateStr, collabId) => {
    const monthKey = `${vacYear}-${String(vacMonth + 1).padStart(2, "0")}`;
    const newV = { ...vacations };
    if (!newV[monthKey] || !newV[monthKey].days[dateStr]) return;
    
    const idx = newV[monthKey].days[dateStr].indexOf(collabId);
    if (idx >= 0) {
      newV[monthKey].days[dateStr].splice(idx, 1);
      await saveVacations(newV);
      show("Vacation retirée");
    }
  };

  const validateMonthVacations = async () => {
    const monthKey = `${vacYear}-${String(vacMonth + 1).padStart(2, "0")}`;
    if (!vacations[monthKey] || !vacations[monthKey].days) {
      show("Aucune vacation à valider pour ce mois", "err");
      return;
    }

    const newV = { ...vacations };
    newV[monthKey].validated = true;
    newV[monthKey].validatedAt = new Date().toISOString();
    await saveVacations(newV);

    // Send emails to each collaborator
    const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
    const assigned = {};
    
    Object.entries(newV[monthKey].days).forEach(([date, collabIds]) => {
      collabIds.forEach(cid => {
        if (!assigned[cid]) assigned[cid] = [];
        assigned[cid].push(date);
      });
    });

    for (const [collabId, dates] of Object.entries(assigned)) {
      const c = collabs.find(x => x.id === collabId);
      if (!c || !c.email) continue;

      const datesList = dates.sort().map(d => fmt(d)).join(", ");
      const emailData = {
        to: c.email,
        from: cfg.emailAdmin || "christophe@taftrans.fr",
        subject: `Planning vacations ${monthNames[vacMonth]} ${vacYear}`,
        body: `Bonjour ${c.prenom},\n\nVotre planning de vacations pour ${monthNames[vacMonth]} ${vacYear} :\n\n${datesList}\n\nMerci de prendre note.\n\nCordialement,\nTAF ROISSY`
      };

      if (cfg.webhookMake) {
        try {
          await fetch(cfg.webhookMake, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(emailData)
          });
        } catch (e) {

                  cursor: monthData.validated ? "not-allowed" : "grab",
                  fontSize: 13, fontWeight: 700,
                  color: c.color,
                  opacity: monthData.validated ? 0.5 : 1,
                  boxShadow: draggedCollab?.id === c.id ? `0 4px 12px ${c.color}60` : "none"
                }}
              >
                <div style={{ width: 12, height: 12, borderRadius: "50%", background: c.color, boxShadow: `0 0 8px ${c.color}80` }} />
                {c.prenom.toUpperCase()}
              </div>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: S.text3, marginBottom: 16, padding: "10px 14px", background: `${S.orange}15`, borderRadius: 8, border: `1px solid ${S.orange}30` }}>
          <span style={{ fontSize: 16 }}>💡</span>
          <span>Glissez-déposez les collaborateurs sur les jours <strong style={{ color: S.orange }}>fériés et week-ends</strong></span>
        </div>

        {/* Grille du calendrier */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3 }}>
          {["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map(d => (
            <div key={d} style={{ textAlign: "center", fontSize: 11, fontWeight: 800, color: S.text3, padding: "8px 0", textTransform: "uppercase", letterSpacing: "0.5px" }}>{d}</div>
          ))}
          {cells.map((day, i) => {
            if (!day) return <div key={`e${i}`} style={{ padding: 6 }} />;
            
            const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const assigned = monthData.days[dateStr] || [];
            const absents = getAbsents(day);
            const isToday = dateStr === today();
            const isWeekend = (i % 7 >= 5);
            const isFerie = FERIES[dateStr];
            const canDrop = (isWeekend || isFerie) && !monthData.validated;

            return (
              <div
                key={day}
                className={`day-cell ${canDrop ? 'droppable' : ''}`}
                onDragOver={canDrop ? (e) => { e.preventDefault(); e.currentTarget.classList.add('dragging-over'); } : undefined}
                onDragLeave={canDrop ? (e) => { e.currentTarget.classList.remove('dragging-over'); } : undefined}
                onDrop={canDrop ? (e) => { e.currentTarget.classList.remove('dragging-over'); handleDrop(dateStr); } : undefined}
                style={{
                  background: isToday ? `linear-gradient(135deg, ${S.blue}30, ${S.teal}30)` : canDrop ? `${S.orange}12` : `${S.bg3}80`,
                  border: `2px solid ${isToday ? S.blue : canDrop ? S.orange : S.border}`,
                  borderRadius: 10, padding: "8px", minHeight: 100,
                  position: "relative",
                  opacity: canDrop ? 1 : 0.6,
                  cursor: canDrop ? "copy" : "not-allowed",
                  boxShadow: isToday ? `0 0 12px ${S.blue}40` : "none"
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                  <div style={{ fontSize: 14, fontWeight: isToday ? 800 : 600, color: isToday ? S.blue : canDrop ? S.orange : S.text3 }}>
                    {day}
                  </div>
                  {isFerie && (
                    <div style={{ fontSize: 8, color: S.orange, background: `${S.orange}20`, padding: "1px 4px", borderRadius: 3, fontWeight: 700 }}>
                      FÉRIÉ
                    </div>
                  )}
                </div>

                {/* Congés en filigrane */}
                {absents.length > 0 && (
                  <div style={{ fontSize: 8, color: S.text3, opacity: 0.3, marginBottom: 4, fontStyle: "italic" }}>
                    {absents.map((a, j) => (
                      <div key={j}>{a.collab?.prenom}</div>
                    ))}
                  </div>
                )}

                {/* Vacations assignées */}
                <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                  {assigned.map((cid, j) => {
                    const c = collabs.find(x => x.id === cid);
                    if (!c) return null;
                    return (
                      <div key={j} className="vacation-item" style={{
                        padding: "4px 6px", borderRadius: 6, fontSize: 10, fontWeight: 800,
                        background: c.color, color: "#fff",
                        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        boxShadow: `0 2px 6px ${c.color}60`,
                        display: "flex", justifyContent: "space-between", alignItems: "center"
                      }}>
                        <span>{c.prenom.toUpperCase()}</span>
                        {!monthData.validated && (
                          <button
                            className="vacation-remove"
                            onClick={() => removeVacation(dateStr, cid)}
                            style={{
                              background: "rgba(0,0,0,0.3)", border: "none", borderRadius: 4,
                              cursor: "pointer", padding: "2px 4px", fontSize: 9, color: "#fff",
                              fontWeight: 700, marginLeft: 4
                            }}
                          >×</button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ═══ HOME SCREEN ═══
  if (loading) return <div style={{ background: S.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: S.text, fontFamily: "system-ui" }}>Chargement...</div>;

  if (screen === "home") return (
    <div style={{ background: S.bg, minHeight: "100vh", fontFamily: '"Segoe UI", system-ui, sans-serif', color: S.text, padding: "40px 20px" }}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
      <div style={{ maxWidth: 600, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 4 }}>TAF CP / RTT</div>
        <div style={{ fontSize: 12, color: S.text3, marginBottom: 30 }}>v{VER} — Gestion des congés et RTT</div>

        {/* Calendrier public */}
        <div onClick={() => setScreen("calendar")} style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 14, padding: "20px", marginBottom: 24, cursor: "pointer", transition: "all .15s" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📅</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: S.teal }}>Calendrier partagé</div>
          <div style={{ fontSize: 11, color: S.text3 }}>Voir les congés, RTT et vacations de l'équipe</div>
        </div>

        {/* Profils salariés */}
        <div style={{ fontSize: 13, fontWeight: 700, color: S.text2, marginBottom: 12, textAlign: "left" }}>Choisir un profil</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
          {collabs.filter(c => c.actif !== false).map(c => (
            <div key={c.id} style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: "16px", textAlign: "center", transition: "all .15s", borderLeft: `4px solid ${c.color || S.blue}` }}>
              <div onClick={() => { setPinTarget(c); setScreen("pin"); setPin(""); }} style={{ cursor: "pointer" }}>
                <div style={{ width: 40, height: 40, borderRadius: "50%", background: c.color || S.blue, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 8px", fontSize: 16, fontWeight: 800, color: "#fff" }}>{(c.prenom || "?")[0]}</div>
                <div style={{ fontSize: 14, fontWeight: 700 }}>{c.prenom} {c.nom}</div>
                <div style={{ fontSize: 10, color: S.text3 }}>{c.poste || "—"}</div>
              </div>
              <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${S.border}15` }}>
                <button onClick={() => window.open(`TAF_Formulaire_CP_RTT.html?nom=${encodeURIComponent(c.nom + ' ' + c.prenom)}&email=${encodeURIComponent(c.email || '')}&service=${encodeURIComponent(c.poste || '')}`, '_blank')} style={{ width: "100%", padding: "6px 12px", border: "none", borderRadius: 6, background: S.orange, color: "#fff", fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>📝 Formulaire</button>
              </div>
            </div>
          ))}
        </div>

        {/* Superviseur */}
        <div onClick={() => { setPinTarget({ role: "supervisor" }); setScreen("pin"); setPin(""); }} style={{ background: `linear-gradient(135deg, ${S.purple}, ${S.blue})`, borderRadius: 12, padding: "16px", cursor: "pointer", textAlign: "center" }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#fff" }}>Espace Superviseur</div>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,.7)" }}>Validation, gestion, supervision</div>
        </div>
      </div>

      {toast && <div style={{ position: "fixed", bottom: 20, right: 20, padding: "10px 16px", background: S.card, border: `1px solid ${toast.t === "ok" ? `${S.green}30` : `${S.red}30`}`, borderRadius: 8, fontSize: 12, zIndex: 200, color: S.text }}>{toast.t === "ok" ? "✅" : "❌"} {toast.m}</div>}
    </div>
  );

  // ═══ PIN SCREEN ═══
  if (screen === "pin") return (
    <div style={{ background: S.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui", color: S.text }}>
      <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 16, padding: 40, width: 320, textAlign: "center" }}>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>{pinTarget?.role === "supervisor" ? "Superviseur" : `${pinTarget?.prenom || ""} ${pinTarget?.nom || ""}`}</div>
        <div style={{ fontSize: 11, color: S.text3, marginBottom: 24 }}>Entrez votre PIN</div>
        <input type="password" value={pin} onChange={e => setPin(e.target.value)} onKeyDown={e => {
          if (e.key === "Enter") {
            if (pinTarget?.role === "supervisor") {
              if (pin === cfg.supervisorPin) { setUser({ role: "supervisor" }); setScreen("supervisor"); }
              else show("PIN incorrect", "err");
            } else {
              if (pin === pinTarget?.pin) { setUser(pinTarget); setScreen("employee"); }
              else show("PIN incorrect", "err");
            }
          }
        }} placeholder="••••" maxLength={6} style={{ width: "100%", height: 50, fontSize: 28, fontFamily: "monospace", letterSpacing: 10, textAlign: "center", background: S.bg3, border: `2px solid ${S.border}`, borderRadius: 8, color: S.text, outline: "none" }} autoFocus />
        <div style={{ marginTop: 16 }}><Btn onClick={() => setScreen("home")} bg={S.bg3} style={{ color: S.text2 }}>Retour</Btn></div>
        {!pinTarget?.pin && pinTarget?.role !== "supervisor" && <div style={{ fontSize: 10, color: S.red, marginTop: 10 }}>PIN non configuré — demandez au superviseur</div>}
      </div>
    </div>
  );

  // ═══ EMPLOYEE DASHBOARD ═══
  if (screen === "employee" && user) {
    const myDem = demandes.filter(d => d.collaborateurId === user.id).sort((a, b) => (b.dateDemande || "").localeCompare(a.dateDemande || ""));
    const upcoming = myDem.filter(d => d.statut === "validee" && d.dateFin >= today());
    const past = myDem.filter(d => d.statut === "validee" && d.dateFin < today());
    const pending = myDem.filter(d => d.statut === "en_attente");
    const cpPris = past.filter(d => d.type === "CP").reduce((a, d) => a + d.nbJours, 0) + upcoming.filter(d => d.type === "CP").reduce((a, d) => a + d.nbJours, 0);
    const rttPris = past.filter(d => d.type === "RTT").reduce((a, d) => a + d.nbJours, 0) + upcoming.filter(d => d.type === "RTT").reduce((a, d) => a + d.nbJours, 0);

    return (
      <div style={{ background: S.bg, minHeight: "100vh", fontFamily: "system-ui", color: S.text }}>
        <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
        <header style={{ background: S.card, borderBottom: `1px solid ${S.border}`, padding: "0 20px", height: 54, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 32, height: 32, borderRadius: "50%", background: user.color || S.blue, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 800, color: "#fff" }}>{(user.prenom || "?")[0]}</div>
            <span style={{ fontWeight: 700, fontSize: 15 }}>{user.prenom} {user.nom}</span>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <Badge c={S.blue}>CP: {user.soldeCP || 0}j</Badge>
            <Badge c={S.purple}>RTT: {user.soldeRTT || 0}j</Badge>
            <Btn onClick={() => { setUser(null); setScreen("home"); }} bg={S.bg3} style={{ color: S.text2, padding: "4px 10px", fontSize: 11 }}>Déconnexion</Btn>
          </div>
        </header>

        <div style={{ display: "flex", gap: 4, padding: "12px 20px 0", borderBottom: `1px solid ${S.border}` }}>
          {[["demande", "Nouvelle demande"], ["historique", "Historique"], ["compte", "Mon compte"]].map(([k, l]) => (
            <button key={k} onClick={() => setEmpTab(k)} style={{ padding: "8px 16px", borderRadius: "8px 8px 0 0", border: `1px solid ${empTab === k ? S.border : "transparent"}`, borderBottom: empTab === k ? `1px solid ${S.bg}` : "none", background: empTab === k ? S.card : "transparent", color: empTab === k ? S.text : S.text3, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", position: "relative", bottom: -1 }}>{l}</button>
          ))}
        </div>

        <div style={{ padding: 20 }}>
          {empTab === "demande" && (
            <Card title="Nouvelle demande de congé">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Sel label="Type" value={formData.type} onChange={e => setFormData(p => ({ ...p, type: e.target.value }))}><option value="CP">Congé payé (CP)</option><option value="RTT">RTT</option><option value="Sans solde">Sans solde</option><option value="Maladie">Maladie</option></Sel>
                <div />
                <Inp label="Date début" type="date" value={formData.dateDebut} onChange={e => setFormData(p => ({ ...p, dateDebut: e.target.value }))} />
                <Inp label="Date fin" type="date" value={formData.dateFin} onChange={e => setFormData(p => ({ ...p, dateFin: e.target.value }))} />
              </div>
              <Inp label="Motif (optionnel)" value={formData.motif} onChange={e => setFormData(p => ({ ...p, motif: e.target.value }))} placeholder="Vacances, rendez-vous..." />
              {formData.dateDebut && formData.dateFin && (() => {
                const avail = isSlotAvailable(formData.dateDebut, formData.dateFin);
                const nb = diffDays(formData.dateDebut, formData.dateFin);
                return (
                  <div style={{ padding: 10, borderRadius: 8, marginBottom: 12, background: avail.ok ? `${S.green}10` : `${S.red}10`, border: `1px solid ${avail.ok ? `${S.green}30` : `${S.red}30`}`, fontSize: 12 }}>
                    {avail.ok ? <span style={{ color: S.green }}>✅ Créneau disponible — {nb} jour(s)</span> : <span style={{ color: S.red }}>❌ {avail.msg}</span>}
                    {avail.conflicts?.length > 0 && <div style={{ fontSize: 10, color: S.text3, marginTop: 4 }}>Déjà absent(s) : {avail.conflicts.map(c => { const col = collabs.find(x => x.id === c.collaborateurId); return col ? `${col.prenom}` : "?"; }).join(", ")}</div>}
                  </div>
                );
              })()}
              <Btn onClick={submitRequest}>Soumettre la demande</Btn>
            </Card>
          )}

          {empTab === "historique" && (
            <div>
              {/* Compteurs */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
                {[["CP restants", user.soldeCP, S.blue], ["RTT restants", user.soldeRTT, S.purple], ["CP pris", cpPris, S.orange], ["RTT pris", rttPris, S.orange]].map(([l, v, c]) => (
                  <div key={l} style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: 14, textAlign: "center" }}>
                    <div style={{ fontSize: 24, fontWeight: 800, color: c }}>{v || 0}</div>
                    <div style={{ fontSize: 10, color: S.text3 }}>{l}</div>
                  </div>
                ))}
              </div>

              {pending.length > 0 && <Card title={`En attente (${pending.length})`} style={{ marginBottom: 12 }}>{pending.map(d => (
                <div key={d.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${S.border}15`, fontSize: 12 }}>
                  <span><Badge c={S.orange}>{d.type}</Badge> {fmtS(d.dateDebut)} → {fmtS(d.dateFin)}</span>
                  <span style={{ color: S.orange }}>{d.nbJours}j — En attente</span>
                </div>
              ))}</Card>}

              {upcoming.length > 0 && <Card title={`À venir (${upcoming.length})`} style={{ marginBottom: 12 }}>{upcoming.map(d => (
                <div key={d.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${S.border}15`, fontSize: 12 }}>
                  <span><Badge c={S.green}>{d.type}</Badge> {fmtS(d.dateDebut)} → {fmtS(d.dateFin)}</span>
                  <span style={{ color: S.green }}>{d.nbJours}j</span>
                </div>
              ))}</Card>}

              <Card title={`Historique (${past.length})`}>{past.length > 0 ? past.map(d => (
                <div key={d.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${S.border}15`, fontSize: 12, color: S.text3 }}>
                  <span><Badge c={S.text3}>{d.type}</Badge> {fmtS(d.dateDebut)} → {fmtS(d.dateFin)}</span>
                  <span>{d.nbJours}j</span>
                </div>
              )) : <div style={{ color: S.text3, fontSize: 12 }}>Aucun congé passé</div>}</Card>
            </div>
          )}

          {empTab === "compte" && (
            <Card title="Mon compte">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div><div style={{ fontSize: 10, color: S.text3, fontWeight: 700 }}>NOM</div><div style={{ fontSize: 14 }}>{user.nom}</div></div>
                <div><div style={{ fontSize: 10, color: S.text3, fontWeight: 700 }}>PRÉNOM</div><div style={{ fontSize: 14 }}>{user.prenom}</div></div>
                <div><div style={{ fontSize: 10, color: S.text3, fontWeight: 700 }}>POSTE</div><div style={{ fontSize: 14 }}>{user.poste || "—"}</div></div>
                <div><div style={{ fontSize: 10, color: S.text3, fontWeight: 700 }}>EMAIL</div><div style={{ fontSize: 14 }}>{user.email || "—"}</div></div>
                <div><div style={{ fontSize: 10, color: S.text3, fontWeight: 700 }}>SOLDE CP</div><div style={{ fontSize: 22, fontWeight: 800, color: S.blue }}>{user.soldeCP || 0} jours</div></div>
                <div><div style={{ fontSize: 10, color: S.text3, fontWeight: 700 }}>SOLDE RTT</div><div style={{ fontSize: 22, fontWeight: 800, color: S.purple }}>{user.soldeRTT || 0} jours</div></div>
              </div>
            </Card>
          )}
        </div>
        {toast && <div style={{ position: "fixed", bottom: 20, right: 20, padding: "10px 16px", background: S.card, border: `1px solid ${toast.t === "ok" ? `${S.green}30` : `${S.red}30`}`, borderRadius: 8, fontSize: 12, zIndex: 200 }}>{toast.t === "ok" ? "✅" : "❌"} {toast.m}</div>}
      </div>
    );
  }

  // ═══ SUPERVISOR DASHBOARD ═══
  if (screen === "supervisor") {
    const pendingD = demandes.filter(d => d.statut === "en_attente");
    return (
      <div style={{ background: S.bg, minHeight: "100vh", fontFamily: "system-ui", color: S.text }}>
        <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
        <header style={{ background: `linear-gradient(135deg, ${S.purple}, ${S.blue})`, padding: "0 20px", height: 54, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontWeight: 700, fontSize: 15, color: "#fff" }}>Superviseur — TAF CP/RTT</span>
          <div style={{ display: "flex", gap: 6 }}>
            {pendingD.length > 0 && <Badge c="#fff">{pendingD.length} en attente</Badge>}
            <Btn onClick={() => { setUser(null); setScreen("home"); }} bg="rgba(255,255,255,.15)" style={{ color: "#fff", padding: "4px 10px", fontSize: 11 }}>Sortir</Btn>
          </div>
        </header>

        <div style={{ display: "flex", gap: 4, padding: "12px 20px 0", borderBottom: `1px solid ${S.border}` }}>
          {[["validation", `Validation (${pendingD.length})`], ["historique", "Historique complet"], ["equipe", "Équipe & Soldes"], ["vacations", "Vacations"], ["calendrier", "Calendrier"], ["config", "Configuration"]].map(([k, l]) => (
            <button key={k} onClick={() => setSupTab(k)} style={{ padding: "8px 16px", borderRadius: "8px 8px 0 0", border: `1px solid ${supTab === k ? S.border : "transparent"}`, borderBottom: supTab === k ? `1px solid ${S.bg}` : "none", background: supTab === k ? S.card : "transparent", color: supTab === k ? S.text : S.text3, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", position: "relative", bottom: -1 }}>{l}</button>
          ))}
        </div>

        <div style={{ padding: 20 }}>
          {supTab === "validation" && (
            <div>
              {pendingD.length === 0 && <div style={{ textAlign: "center", padding: 40, color: S.text3 }}>Aucune demande en attente</div>}
              {pendingD.map(d => {
                const c = collabs.find(x => x.id === d.collaborateurId);
                return (
                  <Card key={d.id} style={{ marginBottom: 12, borderLeft: `4px solid ${c?.color || S.blue}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: 700 }}>{c?.prenom} {c?.nom}</div>
                        <div style={{ fontSize: 12, color: S.text2, marginTop: 2 }}>{d.type} — {fmt(d.dateDebut)} au {fmt(d.dateFin)} — {d.nbJours} jour(s)</div>
                        {d.motif && <div style={{ fontSize: 11, color: S.text3, marginTop: 4 }}>Motif : {d.motif}</div>}
                        <div style={{ fontSize: 10, color: S.text3, marginTop: 4 }}>Demandé le {fmt(d.dateDemande)}</div>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <div style={{ display: "flex", gap: 4 }}>
                          <Btn onClick={() => handleValidation(d.id, "valider", false)} bg={S.green} style={{ fontSize: 11 }}>Valider</Btn>
                          <Btn onClick={() => handleValidation(d.id, "valider", true)} bg={S.teal} style={{ fontSize: 11 }}>+ CC Seb&JB</Btn>
                        </div>
                        <Btn onClick={() => handleValidation(d.id, "refuser")} bg={S.red} style={{ fontSize: 11 }}>Refuser</Btn>
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          )}

          {supTab === "historique" && (
            <div>
              <div style={{ marginBottom: 16 }}>
                <span style={{ fontSize: 16, fontWeight: 700 }}>Toutes les demandes</span>
              </div>
              
              {collabs.map(collab => {
                const collabDemandes = demandes.filter(d => d.collaborateurId === collab.id).sort((a, b) => (b.dateDemande || "").localeCompare(a.dateDemande || ""));
                if (collabDemandes.length === 0) return null;
                
                return (
                  <Card key={collab.id} title={`${collab.prenom} ${collab.nom} — ${collabDemandes.length} demande(s)`} style={{ marginBottom: 14, borderLeft: `4px solid ${collab.color || S.blue}` }}>
                    <div style={{ fontSize: 11, color: S.text3, marginBottom: 10 }}>
                      Soldes actuels : CP {collab.soldeCP}j · RTT {collab.soldeRTT}j
                    </div>
                    
                    {collabDemandes.map(d => (
                      <div key={d.id} style={{ padding: "10px 0", borderBottom: `1px solid ${S.border}15` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ display: "flex", gap: 6, marginBottom: 4 }}>
                              <Badge c={d.statut === "validee" ? S.green : d.statut === "refusee" ? S.red : d.statut === "annulee" ? S.text3 : S.orange}>
                                {d.statut === "validee" ? "✓ Validé" : d.statut === "refusee" ? "✗ Refusé" : d.statut === "annulee" ? "Annulé" : "En attente"}
                              </Badge>
                              <Badge c={S.blue}>{d.type}</Badge>
                            </div>
                            <div style={{ fontSize: 12, color: S.text2 }}>
                              {fmt(d.dateDebut)} → {fmt(d.dateFin)} ({d.nbJours}j)
                            </div>
                            {d.motif && <div style={{ fontSize: 11, color: S.text3, marginTop: 2 }}>Motif : {d.motif}</div>}
                            <div style={{ fontSize: 10, color: S.text3, marginTop: 2 }}>
                              Demandé le {fmt(d.dateDemande)}
                              {d.dateValidation && ` · Validé le ${fmt(d.dateValidation)}`}
                              {d.dateAnnulation && ` · Annulé le ${fmt(d.dateAnnulation)}`}
                              {d.dateModification && ` · Modifié le ${fmt(d.dateModification)}`}
                            </div>
                          </div>
                          
                          {d.statut === "validee" && (
                            <div style={{ display: "flex", gap: 4 }}>
                              <Btn onClick={() => setEditDemande({ ...d })} bg={S.orange} style={{ fontSize: 10, padding: "4px 8px" }}>Modifier</Btn>
                              <Btn onClick={() => setConfirmAction({ type: "cancel", id: d.id })} bg={S.red} style={{ fontSize: 10, padding: "4px 8px" }}>Annuler</Btn>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </Card>
                );
              })}
            </div>
          )}

          {supTab === "equipe" && (
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <span style={{ fontSize: 16, fontWeight: 700 }}>Gestion de l'équipe</span>
                <div style={{ display: "flex", gap: 6 }}>
                  <Btn onClick={() => setNewCollab({ nom: "", prenom: "", poste: "", email: "", pin: "", soldeCP: 25, soldeRTT: 10, color: COLORS[collabs.length % COLORS.length] })} bg={S.green} style={{ fontSize: 11 }}>+ Ajouter un profil</Btn>
                  <Btn onClick={async () => {
                    const team = await fbGet("team");
                    if (!team) { show("Aucune donnée TAF TEAM", "err"); return; }
                    const existing = collabs.map(c => c.id);
                    const newC = [...collabs];
                    let added = 0;
                    Object.entries(team).forEach(([id, m]) => {
                      if (!existing.includes(id)) {
                        newC.push({ id, nom: m.nom || m.name || "", prenom: m.prenom || m.firstName || "", poste: m.poste || m.role || "", email: m.email || "", pin: "", color: COLORS[newC.length % COLORS.length], soldeCP: 25, soldeRTT: 10, actif: true });
                        added++;
                      }
                    });
                    if (added > 0) { await saveCollabs(newC); show(`${added} profil(s) importé(s) depuis TAF TEAM`); }
                    else show("Tous les profils sont déjà synchronisés");
                  }} bg={S.teal} style={{ fontSize: 11 }}>Sync depuis TAF TEAM</Btn>
                </div>
              </div>

              {/* Formulaire nouveau profil */}
              {newCollab && (
                <Card title="Nouveau profil" style={{ marginBottom: 12, borderLeft: `4px solid ${S.green}` }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    <Inp label="Prénom *" value={newCollab.prenom} onChange={e => setNewCollab(p => ({ ...p, prenom: e.target.value }))} placeholder="Jean" />
                    <Inp label="Nom *" value={newCollab.nom} onChange={e => setNewCollab(p => ({ ...p, nom: e.target.value }))} placeholder="DUPONT" />
                    <Inp label="Poste" value={newCollab.poste} onChange={e => setNewCollab(p => ({ ...p, poste: e.target.value }))} placeholder="Import" />
                    <Inp label="Email" value={newCollab.email} onChange={e => setNewCollab(p => ({ ...p, email: e.target.value }))} placeholder="email@taftrans.fr" />
                    <Inp label="PIN (optionnel)" value={newCollab.pin} onChange={e => setNewCollab(p => ({ ...p, pin: e.target.value }))} placeholder="1234" maxLength="6" />
                    <div />
                    <Inp label="Solde CP" type="number" value={newCollab.soldeCP} onChange={e => setNewCollab(p => ({ ...p, soldeCP: +e.target.value }))} />
                    <Inp label="Solde RTT" type="number" value={newCollab.soldeRTT} onChange={e => setNewCollab(p => ({ ...p, soldeRTT: +e.target.value }))} />
                    <div><label style={{ fontSize: 10, color: S.text2, fontWeight: 700 }}>COULEUR</label><div style={{ display: "flex", gap: 4, marginTop: 4 }}>{COLORS.map(col => <div key={col} onClick={() => setNewCollab(p => ({ ...p, color: col }))} style={{ width: 24, height: 24, borderRadius: "50%", background: col, cursor: "pointer", border: newCollab.color === col ? "2px solid #fff" : "2px solid transparent" }} />)}</div></div>
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                    <Btn onClick={handleAddProfile} bg={S.green} style={{ fontSize: 11 }}>Créer le profil</Btn>
                    <Btn onClick={() => setNewCollab(null)} bg={S.bg3} style={{ color: S.text2, fontSize: 11 }}>Annuler</Btn>
                  </div>
                </Card>
              )}

              {collabs.filter(c => c.actif !== false).map(c => (
                <Card key={c.id} style={{ marginBottom: 10, borderLeft: `4px solid ${c.color || S.blue}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>{c.prenom} {c.nom}</div>
                      <div style={{ fontSize: 11, color: S.text3 }}>{c.poste} · {c.email || "pas d'email"}</div>
                      <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
                        <Badge c={S.blue}>CP: {c.soldeCP}</Badge>
                        <Badge c={S.purple}>RTT: {c.soldeRTT}</Badge>
                        <Badge c={c.pin ? S.green : S.red}>PIN: {c.pin ? "••••" : "Non défini"}</Badge>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 4 }}>
                      <Btn onClick={() => setEditCollab(c)} bg={S.bg3} style={{ color: S.text2, fontSize: 11 }}>Modifier</Btn>
                      <Btn onClick={async () => {
                        const newPin = prompt(`Nouveau PIN pour ${c.prenom} :`, c.pin || "");
                        if (newPin !== null) {
                          const newC = collabs.map(x => x.id === c.id ? { ...x, pin: newPin } : x);
                          await saveCollabs(newC);
                          show(`PIN ${newPin ? "défini" : "effacé"} pour ${c.prenom}`);
                        }
                      }} bg={S.orange} style={{ fontSize: 11 }}>PIN</Btn>
                      <Btn onClick={() => setConfirmAction({ type: "delete_profile", id: c.id })} bg={S.red} style={{ fontSize: 11 }}>Supprimer</Btn>
                    </div>
                  </div>
                  {editCollab?.id === c.id && (
                    <div style={{ marginTop: 12, padding: 12, background: S.bg3, borderRadius: 8 }}>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                        <Inp label="Prénom" value={editCollab.prenom} onChange={e => setEditCollab(p => ({ ...p, prenom: e.target.value }))} />
                        <Inp label="Nom" value={editCollab.nom} onChange={e => setEditCollab(p => ({ ...p, nom: e.target.value }))} />
                        <Inp label="Poste" value={editCollab.poste} onChange={e => setEditCollab(p => ({ ...p, poste: e.target.value }))} />
                        <Inp label="Email" value={editCollab.email} onChange={e => setEditCollab(p => ({ ...p, email: e.target.value }))} />
                        <Inp label="Solde CP" type="number" value={editCollab.soldeCP} onChange={e => setEditCollab(p => ({ ...p, soldeCP: +e.target.value }))} />
                        <Inp label="Solde RTT" type="number" value={editCollab.soldeRTT} onChange={e => setEditCollab(p => ({ ...p, soldeRTT: +e.target.value }))} />
                        <div><label style={{ fontSize: 10, color: S.text2, fontWeight: 700 }}>COULEUR</label><div style={{ display: "flex", gap: 4, marginTop: 4 }}>{COLORS.map(col => <div key={col} onClick={() => setEditCollab(p => ({ ...p, color: col }))} style={{ width: 24, height: 24, borderRadius: "50%", background: col, cursor: "pointer", border: editCollab.color === col ? "2px solid #fff" : "2px solid transparent" }} />)}</div></div>
                      </div>
                      <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                        <Btn onClick={async () => { const newC = collabs.map(x => x.id === editCollab.id ? editCollab : x); await saveCollabs(newC); setEditCollab(null); show("Profil mis à jour"); }} bg={S.green} style={{ fontSize: 11 }}>Sauvegarder</Btn>
                        <Btn onClick={() => setEditCollab(null)} bg={S.bg3} style={{ color: S.text2, fontSize: 11 }}>Annuler</Btn>
                      </div>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          )}

          {supTab === "vacations" && renderVacations()}

          {supTab === "calendrier" && renderCalendar()}

          {supTab === "config" && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <Card title="Webhooks & Notifications">
                <Inp label="Webhook Make (emails)" placeholder="https://hook.eu2.make.com/..." value={cfg.webhookMake} onChange={e => setCfg(p => ({ ...p, webhookMake: e.target.value }))} />
                <Inp label="Webhook Slack" placeholder="https://hooks.slack.com/..." value={cfg.webhookSlack} onChange={e => setCfg(p => ({ ...p, webhookSlack: e.target.value }))} />
                <Inp label="Email admin (from)" value={cfg.emailAdmin} onChange={e => setCfg(p => ({ ...p, emailAdmin: e.target.value }))} />
                <Inp label="CC validation (S. + J.B.)" value={cfg.emailCC} onChange={e => setCfg(p => ({ ...p, emailCC: e.target.value }))} />
                <Btn onClick={() => saveCfg(cfg)}>Sauvegarder</Btn>
              </Card>
              <Card title="Sécurité">
                <Inp label="PIN superviseur" value={cfg.supervisorPin} onChange={e => setCfg(p => ({ ...p, supervisorPin: e.target.value }))} />
                <Btn onClick={() => saveCfg(cfg)}>Sauvegarder</Btn>
              </Card>
            </div>
          )}
        </div>
        
        {/* Modal confirmation annulation */}
        {confirmAction && confirmAction.type === "cancel" && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
            <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: 24, width: 400 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Confirmer l'annulation</div>
              <div style={{ fontSize: 13, color: S.text2, marginBottom: 16 }}>
                Êtes-vous sûr de vouloir annuler cette demande ? Le solde sera restauré et le collaborateur sera notifié.
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                <Btn onClick={() => setConfirmAction(null)} bg={S.bg3} style={{ color: S.text2 }}>Annuler</Btn>
                <Btn onClick={() => handleCancelDemande(confirmAction.id)} bg={S.red}>Confirmer l'annulation</Btn>
              </div>
            </div>
          </div>
        )}

        {/* Modal confirmation suppression profil */}
        {confirmAction && confirmAction.type === "delete_profile" && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
            <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: 24, width: 400 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Supprimer ce profil ?</div>
              <div style={{ fontSize: 13, color: S.text2, marginBottom: 16 }}>
                Le profil sera désactivé (pas définitivement supprimé). Il n'apparaîtra plus sur la page d'accueil mais l'historique sera conservé.
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                <Btn onClick={() => setConfirmAction(null)} bg={S.bg3} style={{ color: S.text2 }}>Annuler</Btn>
                <Btn onClick={() => handleDeleteProfile(confirmAction.id)} bg={S.red}>Confirmer</Btn>
              </div>
            </div>
          </div>
        )}

        {/* Modal modification demande */}
        {editDemande && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
            <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: 24, width: 500 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Modifier la demande</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                <Inp label="Date début" type="date" value={editDemande.dateDebut} onChange={e => setEditDemande(p => ({ ...p, dateDebut: e.target.value }))} />
                <Inp label="Date fin" type="date" value={editDemande.dateFin} onChange={e => setEditDemande(p => ({ ...p, dateFin: e.target.value }))} />
              </div>
              <Inp label="Motif" value={editDemande.motif || ""} onChange={e => setEditDemande(p => ({ ...p, motif: e.target.value }))} />
              <div style={{ padding: 10, borderRadius: 8, marginBottom: 12, background: `${S.blue}10`, border: `1px solid ${S.blue}30`, fontSize: 12, color: S.blue }}>
                Nouvelle durée : {diffDays(editDemande.dateDebut, editDemande.dateFin)} jour(s)
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                <Btn onClick={() => setEditDemande(null)} bg={S.bg3} style={{ color: S.text2 }}>Annuler</Btn>
                <Btn onClick={handleModifyDemande} bg={S.orange}>Enregistrer</Btn>
              </div>
            </div>
          </div>
        )}

        {toast && <div style={{ position: "fixed", bottom: 20, right: 20, padding: "10px 16px", background: S.card, border: `1px solid ${toast.t === "ok" ? `${S.green}30` : `${S.red}30`}`, borderRadius: 8, fontSize: 12, zIndex: 200 }}>{toast.t === "ok" ? "✅" : "❌"} {toast.m}</div>}
      </div>
    );
  }


  if (screen === "calendar") return (
    <div style={{ background: "#06090f", minHeight: "100vh", fontFamily: "system-ui", color: "#e1e5f0", padding: 20 }}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontSize: 20, fontWeight: 800 }}>Calendrier partagé</span>
        <button onClick={() => setScreen("home")} style={{ border: "none", cursor: "pointer", borderRadius: 8, fontWeight: 600, padding: "8px 16px", fontSize: 12, color: "#8aa8c4", background: "#141b28", fontFamily: "inherit" }}>Retour</button>
      </div>
      {renderCalendar()}
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
