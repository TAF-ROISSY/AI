<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAF CP/RTT v4.2 — Gestion des Congés</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const VER = "4.2.2";
const FB = "https://taf-ops-default-rtdb.europe-west1.firebasedatabase.app";
const COLORS = ["#3b82f6","#8b5cf6","#ef4444","#f59e0b","#10b981","#ec4899","#06b6d4","#f97316","#6366f1","#84cc16"];

const fbGet = async (p) => { try { const r = await fetch(`${FB}/${p}.json`); return r.ok ? await r.json() : null; } catch { return null; } };
const fbSet = async (p, d) => { try { const r = await fetch(`${FB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); return r.ok; } catch { return false; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const fmt = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }) : "—";
const fmtS = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) : "—";
const diffDays = (a, b) => Math.max(1, Math.ceil((new Date(b) - new Date(a)) / 86400000) + 1);

const defaultCfg = () => ({
  supervisorPin: "2709",
  webhookMake: "https://hook.eu2.make.com/4th5kwceaitf63o1dt5xfac85vkceiwq",
  webhookSlack: "",
  emailAdmin: "christophe@taftrans.fr",
  emailCC: "sebastien@taftrans.fr,jeanbaptiste@taftrans.fr",
  driveProxy: "",
  driveFolder: ""
});

// ═══ PROFESSIONAL EMAIL TEMPLATES ═══
const EMAILS = {
  demandeReçue: (collab, dem) => ({
    subject: `Demande de ${dem.type} — ${collab.prenom} ${collab.nom}`,
    body: `Bonjour,\n\nUne nouvelle demande de congé a été soumise et nécessite votre validation.\n\nCollaborateur : ${collab.prenom} ${collab.nom}\nType : ${dem.type}\nDu : ${fmt(dem.dateDebut)}\nAu : ${fmt(dem.dateFin)}\nDurée : ${dem.nbJours} jour(s)\nMotif : ${dem.motif || "Non précisé"}\n\nMerci de traiter cette demande dans les meilleurs délais.\n\nCordialement,\nSystème TAF CP/RTT`
  }),
  validee: (collab, dem) => ({
    subject: `Congé validé — ${collab.prenom} ${collab.nom} — ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)}`,
    body: `Bonjour ${collab.prenom},\n\nNous avons le plaisir de vous informer que votre demande de ${dem.type} a été acceptée.\n\nDétails :\n— Type : ${dem.type}\n— Du : ${fmt(dem.dateDebut)}\n— Au : ${fmt(dem.dateFin)}\n— Durée : ${dem.nbJours} jour(s)\n\nVotre solde mis à jour est disponible dans votre espace personnel.\n\nBon repos !\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`
  }),
  refusee: (collab, dem) => ({
    subject: `Demande de congé non retenue — ${collab.prenom} ${collab.nom}`,
    body: `Bonjour ${collab.prenom},\n\nAprès examen, nous ne sommes malheureusement pas en mesure d'accepter votre demande de ${dem.type} du ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)}.\n\nN'hésitez pas à proposer d'autres dates ou à en discuter directement.\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`
  }),
  modification: (collab, dem) => ({
    subject: `Modification de congé — ${collab.prenom} ${collab.nom}`,
    body: `Bonjour,\n\nUne modification de congé a été effectuée.\n\nCollaborateur : ${collab.prenom} ${collab.nom}\nType : ${dem.type}\nNouvelles dates : ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)}\nDurée : ${dem.nbJours} jour(s)\n\nCordialement,\nSystème TAF CP/RTT`
  }),
  confirmationRH: (collab, dem) => ({
    subject: `[CONFIRMATION] Congé validé — ${collab.prenom} ${collab.nom} — ${fmt(dem.dateDebut)}/${fmt(dem.dateFin)}`,
    body: `Bonjour,\n\nPour information, le congé suivant a été validé :\n\nCollaborateur : ${collab.prenom} ${collab.nom}\nPoste : ${collab.poste || "—"}\nType : ${dem.type}\nDu : ${fmt(dem.dateDebut)}\nAu : ${fmt(dem.dateFin)}\nDurée : ${dem.nbJours} jour(s)\nSolde restant CP : ${collab.soldeCP} j / RTT : ${collab.soldeRTT} j\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`
  })
};

function App() {
  const [collabs, setCollabs] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [cfg, setCfg] = useState(defaultCfg());
  const [screen, setScreen] = useState("home");
  const [user, setUser] = useState(null);
  const [pin, setPin] = useState("");
  const [pinTarget, setPinTarget] = useState(null);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [calMonth, setCalMonth] = useState(new Date().getMonth());
  const [calYear, setCalYear] = useState(new Date().getFullYear());
  const [formData, setFormData] = useState({ type: "CP", dateDebut: "", dateFin: "", motif: "" });
  const [editCollab, setEditCollab] = useState(null);
  const [empTab, setEmpTab] = useState("demande");
  const [supTab, setSupTab] = useState("validation");
  const [editDemande, setEditDemande] = useState(null);
  const [editSolde, setEditSolde] = useState(null);
  const [confirmAction, setConfirmAction] = useState(null);

  const show = (m, t = "ok") => { setToast({ m, t }); setTimeout(() => setToast(null), 3000); };

  // ═══ LOAD FROM FIREBASE ═══
  useEffect(() => {
    (async () => {
      const [c, d, cf] = await Promise.all([
        fbGet("taf_cprtt/collaborateurs"),
        fbGet("taf_cprtt/demandes"),
        fbGet("taf_cprtt/config")
      ]);
      if (c) setCollabs(Array.isArray(c) ? c : Object.values(c));
      if (d) setDemandes(Array.isArray(d) ? d : Object.values(d));
      if (cf) setCfg(prev => ({ ...prev, ...cf }));
      // Import from TAF TEAM if no collabs exist
      if (!c || (Array.isArray(c) && c.length === 0)) {
        const team = await fbGet("team");
        if (team) {
          const imported = Object.entries(team).map(([id, m], i) => ({
            id, nom: m.nom || m.name || "", prenom: m.prenom || m.firstName || "",
            poste: m.poste || m.role || "", email: m.email || "",
            pin: "", color: COLORS[i % COLORS.length],
            soldeCP: 25, soldeRTT: 10, actif: true
          }));
          if (imported.length > 0) {
            setCollabs(imported);
            await fbSet("taf_cprtt/collaborateurs", imported);
            show(`${imported.length} profils importés depuis TAF TEAM`);
          }
        }
      }
      setLoading(false);
    })();
  }, []);

  // ═══ SAVE ═══
  const saveCollabs = async (newC) => { setCollabs(newC); await fbSet("taf_cprtt/collaborateurs", newC); syncResume(newC, demandes); };
  const saveDemandes = async (newD) => { setDemandes(newD); await fbSet("taf_cprtt/demandes", newD); syncResume(collabs, newD); };
  const saveCfg = async (newCfg) => { setCfg(newCfg); await fbSet("taf_cprtt/config", newCfg); show("Config sauvegardée"); };

  // ═══ CROSS-SYNC RESUME FOR TAF TEAM ═══
  const syncResume = async (c, d) => {
    const approved = (d || []).filter(x => x.statut === "validee");
    const td = today();
    const absents = approved.filter(x => x.dateDebut <= td && x.dateFin >= td);
    await fbSet("taf_cprtt/resume", {
      lastSync: new Date().toISOString(), totalCollabs: (c || []).length,
      demandesEnAttente: (d || []).filter(x => x.statut === "en_attente").length,
      demandesApprouvees: approved.length, nbAbsents: absents.length,
      absentsAujourdhui: absents.map(x => { const col = (c || []).find(cc => cc.id === x.collaborateurId); return col ? `${col.prenom} ${col.nom}` : "?"; }),
      prochaines: approved.filter(x => x.dateDebut > td).sort((a, b) => a.dateDebut.localeCompare(b.dateDebut)).slice(0, 5).map(x => { const col = (c || []).find(cc => cc.id === x.collaborateurId); return { qui: col ? `${col.prenom}` : "?", type: x.type, du: x.dateDebut, au: x.dateFin, jours: x.nbJours }; })
    });
  };

  // ═══ WEBHOOK NOTIFICATIONS ═══
  const notify = async (type, collab, demande, sendCC = false) => {
    const tpl = EMAILS[type]?.(collab, demande);
    if (!tpl) return;
    // Email via Make
    if (cfg.webhookMake) {
      const payload = { 
        from: cfg.emailAdmin, 
        to: type === "demandeReçue" || type === "modification" ? cfg.emailAdmin : collab.email, 
        cc: sendCC && (type === "validee" || type === "refusee") ? "sebastien@taftrans.fr,jeanbaptiste@taftrans.fr" : "", 
        subject: tpl.subject, 
        body: tpl.body, 
        type: "cp_rtt_" + type 
      };
      try { await fetch(cfg.webhookMake, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); } catch {}
      // Confirmation RH on validation ONLY if sendCC
      if (type === "validee" && sendCC) {
        const rh = EMAILS.confirmationRH(collab, demande);
        try { await fetch(cfg.webhookMake, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: cfg.emailAdmin, to: "sebastien@taftrans.fr,jeanbaptiste@taftrans.fr", subject: rh.subject, body: rh.body, type: "cp_rtt_confirmation_rh" }) }); } catch {}
      }
    }
    // Slack
    if (cfg.webhookSlack) {
      const icon = type === "validee" ? "✅" : type === "refusee" ? "❌" : "📋";
      try { await fetch(cfg.webhookSlack, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: `${icon} *${tpl.subject}*\n${collab.prenom} ${collab.nom} — ${demande.type} du ${fmtS(demande.dateDebut)} au ${fmtS(demande.dateFin)} (${demande.nbJours}j)` }) }); } catch {}
    }
  };

  // ═══ CHECK AVAILABILITY ═══
  const isSlotAvailable = (dateDebut, dateFin, excludeId = null) => {
    const approved = demandes.filter(d => d.statut === "validee" && d.id !== excludeId);
    const conflicts = approved.filter(d => d.dateDebut <= dateFin && d.dateFin >= dateDebut);
    // Max 2 absents simultanés (sur 5 personnes)
    if (conflicts.length >= 2) return { ok: false, msg: `Créneau complet — ${conflicts.length} personne(s) déjà absente(s)`, conflicts };
    return { ok: true, conflicts };
  };

  // ═══ SUBMIT REQUEST ═══
  const submitRequest = async () => {
    if (!formData.dateDebut || !formData.dateFin) { show("Dates requises", "err"); return; }
    if (formData.dateDebut > formData.dateFin) { show("Date début > date fin", "err"); return; }
    const avail = isSlotAvailable(formData.dateDebut, formData.dateFin);
    if (!avail.ok) { show(avail.msg, "err"); return; }
    const nbJours = diffDays(formData.dateDebut, formData.dateFin);
    const dem = { id: uid(), collaborateurId: user.id, type: formData.type, dateDebut: formData.dateDebut, dateFin: formData.dateFin, nbJours, motif: formData.motif, statut: "en_attente", dateDemande: new Date().toISOString() };
    const newD = [...demandes, dem];
    await saveDemandes(newD);
    await notify("demandeReçue", user, dem);
    setFormData({ type: "CP", dateDebut: "", dateFin: "", motif: "" });
    show("Demande envoyée — notification envoyée au superviseur");
  };

  // ═══ VALIDATE / REFUSE ═══
  const handleValidation = async (demId, action, sendCC = false) => {
    const dem = demandes.find(d => d.id === demId);
    if (!dem) return;
    const collab = collabs.find(c => c.id === dem.collaborateurId);
    if (!collab) return;
    const newStatut = action === "valider" ? "validee" : "refusee";
    const newD = demandes.map(d => d.id === demId ? { ...d, statut: newStatut, dateValidation: new Date().toISOString(), validePar: "Christophe Hermann" } : d);
    // Décompter les jours si validé
    if (action === "valider") {
      const field = dem.type === "RTT" ? "soldeRTT" : "soldeCP";
      const newC = collabs.map(c => c.id === collab.id ? { ...c, [field]: Math.max(0, (c[field] || 0) - dem.nbJours) } : c);
      await saveCollabs(newC);
    }
    await saveDemandes(newD);
    await notify(newStatut === "validee" ? "validee" : "refusee", collab, dem, sendCC);
    show(action === "valider" ? `Congé validé${sendCC ? " — notifications envoyées (+ CC Seb & JB)" : " — notification envoyée"}` : "Demande refusée — salarié notifié");
  };

  // ═══ CANCEL VALIDATED REQUEST ═══
  const handleCancelDemande = async (demId) => {
    const dem = demandes.find(d => d.id === demId);
    if (!dem) return;
    const collab = collabs.find(c => c.id === dem.collaborateurId);
    if (!collab) return;
    
    // Restore solde if it was validated
    if (dem.statut === "validee") {
      const field = dem.type === "RTT" ? "soldeRTT" : "soldeCP";
      const newC = collabs.map(c => c.id === collab.id ? { ...c, [field]: (c[field] || 0) + dem.nbJours } : c);
      await saveCollabs(newC);
    }
    
    // Mark as cancelled
    const newD = demandes.map(d => d.id === demId ? { ...d, statut: "annulee", dateAnnulation: new Date().toISOString(), annulePar: "Christophe Hermann" } : d);
    await saveDemandes(newD);
    
    // Notify
    const emailData = {
      from: cfg.emailAdmin,
      to: collab.email,
      cc: "",
      subject: `Congé annulé — ${collab.prenom} ${collab.nom}`,
      body: `Bonjour ${collab.prenom},\n\nVotre congé du ${fmt(dem.dateDebut)} au ${fmt(dem.dateFin)} (${dem.type}) a été annulé.\n\nSi besoin, n'hésitez pas à soumettre une nouvelle demande.\n\nCordialement,\nChristophe Hermann\nTrans Air Freight CDG`,
      type: "cp_rtt_annulation"
    };
    if (cfg.webhookMake) {
      try { await fetch(cfg.webhookMake, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(emailData) }); } catch {}
    }
    
    show("Demande annulée — solde restauré et salarié notifié");
    setConfirmAction(null);
  };

  // ═══ MODIFY REQUEST ═══
  const handleModifyDemande = async () => {
    if (!editDemande) return;
    const dem = demandes.find(d => d.id === editDemande.id);
    if (!dem) return;
    const collab = collabs.find(c => c.id === dem.collaborateurId);
    if (!collab) return;

    // Calculate difference in days
    const oldNbJours = dem.nbJours;
    const newNbJours = diffDays(editDemande.dateDebut, editDemande.dateFin);
    const diff = newNbJours - oldNbJours;

    // Adjust solde if validated
    if (dem.statut === "validee" && diff !== 0) {
      const field = dem.type === "RTT" ? "soldeRTT" : "soldeCP";
      const newC = collabs.map(c => c.id === collab.id ? { ...c, [field]: Math.max(0, (c[field] || 0) - diff) } : c);
      await saveCollabs(newC);
    }

    // Update demande
    const newD = demandes.map(d => d.id === editDemande.id ? { 
      ...d, 
      dateDebut: editDemande.dateDebut, 
      dateFin: editDemande.dateFin, 
      nbJours: newNbJours,
      motif: editDemande.motif,
      dateModification: new Date().toISOString(),
      modifiePar: "Christophe Hermann"
    } : d);
    await saveDemandes(newD);

    // Notify
    await notify("modification", collab, { ...dem, dateDebut: editDemande.dateDebut, dateFin: editDemande.dateFin, nbJours: newNbJours, motif: editDemande.motif });
    
    show("Demande modifiée — salarié notifié");
    setEditDemande(null);
  };

  // ═══ ADJUST SOLDE ═══
  const handleAdjustSolde = async () => {
    if (!editSolde) return;
    const newC = collabs.map(c => c.id === editSolde.id ? editSolde : c);
    await saveCollabs(newC);
    show("Soldes mis à jour");
    setEditSolde(null);
  };

  // ═══ STYLES ═══
  const S = {
    bg: "#06090f", bg2: "#0c1220", bg3: "#141b28", card: "#0e1828",
    border: "#1c2e4a", gold: "#f5a623", teal: "#22d3ee", blue: "#3b82f6",
    red: "#ef4444", green: "#22c55e", purple: "#8b5cf6", orange: "#f59e0b",
    text: "#e1e5f0", text2: "#8aa8c4", text3: "#4a6580"
  };
  const Btn = ({ children, onClick, c = S.blue, bg: b, style: st = {} }) => <button onClick={onClick} style={{ border: "none", cursor: "pointer", borderRadius: 8, fontWeight: 600, padding: "8px 16px", fontSize: 12, color: "#fff", background: b || c, fontFamily: "inherit", transition: "all .15s", ...st }}>{children}</button>;
  const Card = ({ title, tr, children, style: st = {} }) => <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 14, overflow: "hidden", ...st }}>{title && <div style={{ padding: "12px 16px", borderBottom: `1px solid ${S.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}><span style={{ fontWeight: 700, fontSize: 14 }}>{title}</span>{tr}</div>}<div style={{ padding: "16px" }}>{children}</div></div>;
  const Inp = ({ label, ...p }) => <div style={{ marginBottom: 12 }}>{label && <label style={{ display: "block", fontSize: 10, fontWeight: 700, color: S.text2, marginBottom: 4, textTransform: "uppercase" }}>{label}</label>}<input {...p} style={{ width: "100%", background: S.bg3, border: `1px solid ${S.border}`, borderRadius: 7, padding: "8px 12px", color: S.text, fontSize: 13, outline: "none", fontFamily: "inherit", ...p.style }} /></div>;
  const Sel = ({ label, children, ...p }) => <div style={{ marginBottom: 12 }}>{label && <label style={{ display: "block", fontSize: 10, fontWeight: 700, color: S.text2, marginBottom: 4, textTransform: "uppercase" }}>{label}</label>}<select {...p} style={{ width: "100%", background: S.bg3, border: `1px solid ${S.border}`, borderRadius: 7, padding: "8px 12px", color: S.text, fontSize: 13, outline: "none", fontFamily: "inherit", ...p.style }}>{children}</select></div>;
  const Badge = ({ children, c = S.blue }) => <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 12, background: `${c}20`, color: c, border: `1px solid ${c}30` }}>{children}</span>;

  // ═══ HOME SCREEN ═══
  if (loading) return <div style={{ background: S.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: S.text, fontFamily: "system-ui" }}>Chargement...</div>;

  if (screen === "home") return (
    <div style={{ background: S.bg, minHeight: "100vh", fontFamily: '"Segoe UI", system-ui, sans-serif', color: S.text, padding: "40px 20px" }}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
      <div style={{ maxWidth: 600, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 4 }}>TAF CP / RTT</div>
        <div style={{ fontSize: 12, color: S.text3, marginBottom: 30 }}>v{VER} — Gestion des congés et RTT</div>

        {/* Calendrier public */}
        <div onClick={() => setScreen("calendar")} style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 14, padding: "20px", marginBottom: 14, cursor: "pointer", transition: "all .15s" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📅</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: S.teal }}>Calendrier partagé</div>
          <div style={{ fontSize: 11, color: S.text3 }}>Voir les congés, RTT et vacations de l'équipe</div>
        </div>

        {/* Formulaire de demande */}
        <div onClick={() => window.open("TAF_Formulaire_CP_RTT.html", "_blank")} style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 14, padding: "20px", marginBottom: 24, cursor: "pointer", transition: "all .15s" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📝</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: S.orange }}>Formulaire de demande</div>
          <div style={{ fontSize: 11, color: S.text3 }}>Remplir et imprimer un formulaire d'absence</div>
        </div>

        {/* Profils salariés */}
        <div style={{ fontSize: 13, fontWeight: 700, color: S.text2, marginBottom: 12, textAlign: "left" }}>Choisir un profil</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
          {collabs.filter(c => c.actif !== false).map(c => (
            <div key={c.id} onClick={() => { setPinTarget(c); setScreen("pin"); setPin(""); }} style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: "16px", cursor: "pointer", textAlign: "center", transition: "all .15s", borderLeft: `4px solid ${c.color || S.blue}` }}>
              <div style={{ width: 40, height: 40, borderRadius: "50%", background: c.color || S.blue, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 8px", fontSize: 16, fontWeight: 800, color: "#fff" }}>{(c.prenom || "?")[0]}</div>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{c.prenom} {c.nom}</div>
              <div style={{ fontSize: 10, color: S.text3 }}>{c.poste || "—"}</div>
            </div>
          ))}
        </div>

        {/* Superviseur */}
        <div onClick={() => { setPinTarget({ role: "supervisor" }); setScreen("pin"); setPin(""); }} style={{ background: `linear-gradient(135deg, ${S.purple}, ${S.blue})`, borderRadius: 12, padding: "16px", cursor: "pointer", textAlign: "center" }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#fff" }}>Espace Superviseur</div>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,.7)" }}>Validation, gestion, supervision</div>
        </div>
      </div>

    const past = myDem.filter(d => d.statut === "validee" && d.dateFin < today());
    const pending = myDem.filter(d => d.statut === "en_attente");
    const cpPris = past.filter(d => d.type === "CP").reduce((a, d) => a + d.nbJours, 0) + upcoming.filter(d => d.type === "CP").reduce((a, d) => a + d.nbJours, 0);
    const rttPris = past.filter(d => d.type === "RTT").reduce((a, d) => a + d.nbJours, 0) + upcoming.filter(d => d.type === "RTT").reduce((a, d) => a + d.nbJours, 0);

                <Inp label="Date fin" type="date" value={formData.dateFin} onChange={e => setFormData(p => ({ ...p, dateFin: e.target.value }))} />

            <button key={k} onClick={() => setSupTab(k)} style={{ padding: "8px 16px", borderRadius: "8px 8px 0 0", border: `1px solid ${supTab === k ? S.border : "transparent"}`, borderBottom: supTab === k ? `1px solid ${S.bg}` : "none", background: supTab === k ? S.card : "transparent", color: supTab === k ? S.text : S.text3, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", position: "relative", bottom: -1 }}>{l}</button>

                const c = collabs.find(x => x.id === d.collaborateurId);

                  <Card key={d.id} style={{ marginBottom: 12, borderLeft: `4px solid ${c?.color || S.blue}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: 700 }}>{c?.prenom} {c?.nom}</div>
                        <div style={{ fontSize: 12, color: S.text2, marginTop: 2 }}>{d.type} — {fmt(d.dateDebut)} au {fmt(d.dateFin)} — {d.nbJours} jour(s)</div>
                        {d.motif && <div style={{ fontSize: 11, color: S.text3, marginTop: 4 }}>Motif : {d.motif}</div>}
                        <div style={{ fontSize: 10, color: S.text3, marginTop: 4 }}>Demandé le {fmt(d.dateDemande)}</div>

                      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <div style={{ display: "flex", gap: 4 }}>
                          <Btn onClick={() => handleValidation(d.id, "valider", false)} bg={S.green} style={{ fontSize: 11 }}>Valider</Btn>
                          <Btn onClick={() => handleValidation(d.id, "valider", true)} bg={S.teal} style={{ fontSize: 11 }}>+ CC Seb&JB</Btn>
                        </div>
                        <Btn onClick={() => handleValidation(d.id, "refuser")} bg={S.red} style={{ fontSize: 11 }}>Refuser</Btn>
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          )}

          {supTab === "historique" && (
            <div>
              <div style={{ marginBottom: 16 }}>
                <span style={{ fontSize: 16, fontWeight: 700 }}>Toutes les demandes</span>
              </div>
              
              {collabs.map(collab => {
                const collabDemandes = demandes.filter(d => d.collaborateurId === collab.id).sort((a, b) => (b.dateDemande || "").localeCompare(a.dateDemande || ""));
                if (collabDemandes.length === 0) return null;
                
                return (
                  <Card key={collab.id} title={`${collab.prenom} ${collab.nom} — ${collabDemandes.length} demande(s)`} style={{ marginBottom: 14, borderLeft: `4px solid ${collab.color || S.blue}` }}>
                    <div style={{ fontSize: 11, color: S.text3, marginBottom: 10 }}>
                      Soldes actuels : CP {collab.soldeCP}j · RTT {collab.soldeRTT}j
                    </div>
                    
                    {collabDemandes.map(d => (
                      <div key={d.id} style={{ padding: "10px 0", borderBottom: `1px solid ${S.border}15` }}>

                          <div style={{ flex: 1 }}>
                            <div style={{ display: "flex", gap: 6, marginBottom: 4 }}>
                              <Badge c={d.statut === "validee" ? S.green : d.statut === "refusee" ? S.red : d.statut === "annulee" ? S.text3 : S.orange}>

                              </Badge>
                              <Badge c={S.blue}>{d.type}</Badge>
                            </div>
                            <div style={{ fontSize: 12, color: S.text2 }}>
                              {fmt(d.dateDebut)} → {fmt(d.dateFin)} ({d.nbJours}j)

                            {d.motif && <div style={{ fontSize: 11, color: S.text3, marginTop: 2 }}>Motif : {d.motif}</div>}
                            <div style={{ fontSize: 10, color: S.text3, marginTop: 2 }}>
                              Demandé le {fmt(d.dateDemande)}
                              {d.dateValidation && ` · Validé le ${fmt(d.dateValidation)}`}
                              {d.dateAnnulation && ` · Annulé le ${fmt(d.dateAnnulation)}`}
                              {d.dateModification && ` · Modifié le ${fmt(d.dateModification)}`}
                            </div>
                          </div>
                          
                          {d.statut === "validee" && (
                            <div style={{ display: "flex", gap: 4 }}>
                              <Btn onClick={() => setEditDemande({ ...d })} bg={S.orange} style={{ fontSize: 10, padding: "4px 8px" }}>Modifier</Btn>
                              <Btn onClick={() => setConfirmAction({ type: "cancel", id: d.id })} bg={S.red} style={{ fontSize: 10, padding: "4px 8px" }}>Annuler</Btn>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </Card>
                );
              })}
            </div>
          )}

                  if (!team) { show("Aucune donnée TAF TEAM", "err"); return; }
                  const existing = collabs.map(c => c.id);
                  const newC = [...collabs];
                  let added = 0;
                  Object.entries(team).forEach(([id, m]) => {
                    if (!existing.includes(id)) {
                      newC.push({ id, nom: m.nom || m.name || "", prenom: m.prenom || m.firstName || "", poste: m.poste || m.role || "", email: m.email || "", pin: "", color: COLORS[newC.length % COLORS.length], soldeCP: 25, soldeRTT: 10, actif: true });
                      added++;
                    }
                  });
                  if (added > 0) { await saveCollabs(newC); show(`${added} profil(s) importé(s) depuis TAF TEAM`); }

                      <div style={{ fontSize: 11, color: S.text3 }}>{c.poste} · {c.email || "pas d'email"}</div>

                          const newC = collabs.map(x => x.id === c.id ? { ...x, pin: newPin } : x);
                          await saveCollabs(newC);
                          show(`PIN ${newPin ? "défini" : "effacé"} pour ${c.prenom}`);
                        }
                      }} bg={S.orange} style={{ fontSize: 11 }}>PIN</Btn>
                    </div>
                  </div>

                        <Inp label="Solde CP" type="number" value={editCollab.soldeCP} onChange={e => setEditCollab(p => ({ ...p, soldeCP: +e.target.value }))} />
                        <Inp label="Solde RTT" type="number" value={editCollab.soldeRTT} onChange={e => setEditCollab(p => ({ ...p, soldeRTT: +e.target.value }))} />
                        <div><label style={{ fontSize: 10, color: S.text2, fontWeight: 700 }}>COULEUR</label><div style={{ display: "flex", gap: 4, marginTop: 4 }}>{COLORS.map(col => <div key={col} onClick={() => setEditCollab(p => ({ ...p, color: col }))} style={{ width: 24, height: 24, borderRadius: "50%", background: col, cursor: "pointer", border: editCollab.color === col ? "2px solid #fff" : "2px solid transparent" }} />)}</div></div>
                      </div>

                        <Btn onClick={() => setEditCollab(null)} bg={S.bg3} style={{ color: S.text2, fontSize: 11 }}>Annuler</Btn>
                      </div>
                    </div>
                  )}
                </Card>
              ))}
            </div>

                <Inp label="CC validation (S. + J.B.)" value={cfg.emailCC} onChange={e => setCfg(p => ({ ...p, emailCC: e.target.value }))} />

              </Card>

        {/* Modal confirmation annulation */}
        {confirmAction && confirmAction.type === "cancel" && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
            <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: 24, width: 400 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Confirmer l'annulation</div>
              <div style={{ fontSize: 13, color: S.text2, marginBottom: 16 }}>
                Êtes-vous sûr de vouloir annuler cette demande ? Le solde sera restauré et le collaborateur sera notifié.
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                <Btn onClick={() => setConfirmAction(null)} bg={S.bg3} style={{ color: S.text2 }}>Annuler</Btn>
                <Btn onClick={() => handleCancelDemande(confirmAction.id)} bg={S.red}>Confirmer l'annulation</Btn>
              </div>
            </div>
          </div>
        )}

        {/* Modal modification demande */}
        {editDemande && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300 }}>
            <div style={{ background: S.card, border: `1px solid ${S.border}`, borderRadius: 12, padding: 24, width: 500 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>Modifier la demande</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                <Inp label="Date début" type="date" value={editDemande.dateDebut} onChange={e => setEditDemande(p => ({ ...p, dateDebut: e.target.value }))} />
                <Inp label="Date fin" type="date" value={editDemande.dateFin} onChange={e => setEditDemande(p => ({ ...p, dateFin: e.target.value }))} />
              </div>
              <Inp label="Motif" value={editDemande.motif || ""} onChange={e => setEditDemande(p => ({ ...p, motif: e.target.value }))} />
              <div style={{ padding: 10, borderRadius: 8, marginBottom: 12, background: `${S.blue}10`, border: `1px solid ${S.blue}30`, fontSize: 12, color: S.blue }}>
                Nouvelle durée : {diffDays(editDemande.dateDebut, editDemande.dateFin)} jour(s)
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                <Btn onClick={() => setEditDemande(null)} bg={S.bg3} style={{ color: S.text2 }}>Annuler</Btn>
                <Btn onClick={handleModifyDemande} bg={S.orange}>Enregistrer</Btn>
              </div>
            </div>
          </div>
        )}

        {toast && <div style={{ position: "fixed", bottom: 20, right: 20, padding: "10px 16px", background: S.card, border: `1px solid ${toast.t === "ok" ? `${S.green}30` : `${S.red}30`}`, borderRadius: 8, fontSize: 12, zIndex: 200 }}>{toast.t === "ok" ? "✅" : "❌"} {toast.m}</div>}
      </div>
    );
  }

  // ═══ SHARED CALENDAR ═══
  const renderCalendar = () => {
    const year = calYear;
    const month = calMonth;
    const firstDay = new Date(year, month, 1).getDay() || 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 1; i < firstDay; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);

    const approved = demandes.filter(d => d.statut === "validee");
    const getAbsents = (day) => {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      return approved.filter(d => d.dateDebut <= dateStr && d.dateFin >= dateStr).map(d => {
        const c = collabs.find(x => x.id === d.collaborateurId);
        return { ...d, collab: c };
      });
    };

    const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
    const S = { bg: "#06090f", bg2: "#0c1220", bg3: "#141b28", card: "#0e1828", border: "#1c2e4a", gold: "#f5a623", teal: "#22d3ee", blue: "#3b82f6", red: "#ef4444", green: "#22c55e", purple: "#8b5cf6", orange: "#f59e0b", text: "#e1e5f0", text2: "#8aa8c4", text3: "#4a6580" };
    const Btn = ({ children, onClick, c = S.blue, bg: b, style: st = {} }) => <button onClick={onClick} style={{ border: "none", cursor: "pointer", borderRadius: 8, fontWeight: 600, padding: "8px 16px", fontSize: 12, color: "#fff", background: b || c, fontFamily: "inherit", transition: "all .15s", ...st }}>{children}</button>;

    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <Btn onClick={() => { if (month === 0) { setCalMonth(11); setCalYear(year - 1); } else setCalMonth(month - 1); }} bg={S.bg3} style={{ color: S.text2 }}>◀</Btn>
          <span style={{ fontSize: 18, fontWeight: 700 }}>{monthNames[month]} {year}</span>
          <Btn onClick={() => { if (month === 11) { setCalMonth(0); setCalYear(year + 1); } else setCalMonth(month + 1); }} bg={S.bg3} style={{ color: S.text2 }}>▶</Btn>
        </div>

        {/* Légende couleurs */}
        <div style={{ display: "flex", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
          {collabs.filter(c => c.actif !== false).map(c => (
            <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11 }}>
              <div style={{ width: 12, height: 12, borderRadius: "50%", background: c.color || S.blue }} />
              <span style={{ color: S.text2 }}>{c.prenom}</span>
            </div>
          ))}
        </div>

        {/* Grid */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
          {["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map(d => (
            <div key={d} style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: S.text3, padding: "6px 0" }}>{d}</div>
          ))}
          {cells.map((day, i) => {
            if (!day) return <div key={`e${i}`} style={{ padding: 6 }} />;
            const absents = getAbsents(day);
            const isToday = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}` === today();
            const isWeekend = (i % 7 >= 5);
            return (
              <div key={day} style={{ background: isToday ? `${S.blue}20` : isWeekend ? `${S.bg3}` : S.card, border: `1px solid ${isToday ? S.blue : S.border}`, borderRadius: 8, padding: "4px 6px", minHeight: 56 }}>
                <div style={{ fontSize: 11, fontWeight: isToday ? 800 : 400, color: isToday ? S.blue : isWeekend ? S.text3 : S.text, marginBottom: 2 }}>{day}</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 2 }}>
                  {absents.map((a, j) => (
                    <div key={j} style={{ width: "100%", padding: "1px 4px", borderRadius: 3, fontSize: 9, fontWeight: 600, background: `${a.collab?.color || S.blue}30`, color: a.collab?.color || S.blue, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {a.collab?.prenom || "?"} · {a.type}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  if (screen === "calendar") return (
    <div style={{ background: "#06090f", minHeight: "100vh", fontFamily: "system-ui", color: "#e1e5f0", padding: 20 }}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontSize: 20, fontWeight: 800 }}>Calendrier partagé</span>
        <button onClick={() => setScreen("home")} style={{ border: "none", cursor: "pointer", borderRadius: 8, fontWeight: 600, padding: "8px 16px", fontSize: 12, color: "#8aa8c4", background: "#141b28", fontFamily: "inherit" }}>Retour</button>
      </div>
      {renderCalendar()}
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
